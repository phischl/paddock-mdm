        total: { type: integer }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SecurityReviewProfile" }
    SecurityReviewProfile:
      type: object
      required: [profile, assignments]
      properties:
        profile: { $ref: "#/components/schemas/PermissionProfile" }
        assignments: { type: integer }
    SecurityReviewFiles:
      type: object
      description: Managed files of one tier, by path.
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ManagedFile" }
    OverviewDevices:
      type: object
      required: [total, active, pending, quarantined, retired, rejected, online, no_recent_contact, silent, silent_critical, presumed_lost, never_contacted]
      properties:
        total: { type: integer, description: "pending + active + quarantined" }
        active: { type: integer }
        pending: { type: integer }
        quarantined: { type: integer }
        retired: { type: integer }
        rejected: { type: integer }
        online: { type: integer, description: "Active devices with a check-in within the last 15 minutes (none of the buckets below)." }
        no_recent_contact: { type: integer, description: "Active devices without a check-in for more than 15 minutes and no open staleness alert (contact unseen)." }
        silent: { type: integer, description: "Active devices with an open stale_warning alert." }
        silent_critical: { type: integer, description: "Active devices with an open stale_critical alert." }
        presumed_lost: { type: integer }
        never_contacted: { type: integer }
    OverviewEncryption:
      type: object
      required: [encrypted, not_encrypted, partial, not_reported]
      properties:
        encrypted: { type: integer, description: "Active devices whose disk state is compliant." }
        not_encrypted: { type: integer }
        partial: { type: integer, description: "unmanaged, tpm_missing, tpm_pin_missing or escrow_pending." }
        not_reported: { type: integer }
    OverviewVulnerabilities:
      type: object
      required: [by_highest_severity, critical_high_cves, top]
      properties:
        by_highest_severity: { $ref: "#/components/schemas/OverviewSeverityBuckets" }
        critical_high_cves:
          type: integer
          description: "Distinct CVEs of critical or high severity, counted like GET /api/v1/vulnerabilities?severity=critical&severity=high."

        top:
          type: array
          maxItems: 5
          description: "The CVEs with the highest severity, then the most devices."
          items: { $ref: "#/components/schemas/OverviewTopCVE" }
    OverviewSeverityBuckets:
      type: object
      description: "Active or quarantined devices by the severity of their worst finding; none = no findings."
      required: [critical, high, medium, low, unknown, none]
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown: { type: integer }
        none: { type: integer }
    OverviewTopCVE:
      type: object
      required: [cve, severity, devices, packages]
      properties:
        cve: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        devices: { type: integer }
        packages:
          type: array
          maxItems: 3
          items: { type: string }
    OverviewUpdates:
      type: object
      required: [security_overdue, reboot_required, agent, os_releases]
      properties:
        security_overdue: { type: integer, description: "Active devices counted like GET /api/v1/devices?state=active&security_updates=overdue." }
        reboot_required: { type: integer }
        agent: { $ref: "#/components/schemas/OverviewAgent" }
        os_releases:
          type: array
          items: { $ref: "#/components/schemas/OverviewOSRelease" }
    OverviewAgent:
      type: object
      required: [current_version, on_current, outdated, ahead, unknown, latest_published, rollout]
      properties:
        current_version: { type: string, nullable: true, description: "The release of the most recently completed rollout." }
        on_current: { type: integer, description: "Active devices whose agent_version has the same semantic version precedence as current_version (build metadata ignored)." }
        outdated:
          type: integer
          description: |
            Active devices whose agent_version is older than current_version by SemVer precedence, or is no semantic
            version (the attention kind agent_outdated); 0 while current_version is null.
        ahead: { type: integer, description: "Active devices whose agent_version is newer than current_version." }
        unknown: { type: integer, description: "Active devices without agent_version." }
        latest_published: { type: string, nullable: true, description: "The newest release with status published, by SemVer precedence." }
        rollout:
          nullable: true
          type: object
          description: The rollout with status running, else null (at most one runs).
          required: [version, wave, waves, percent]
          properties:
            version: { type: string }
            wave: { type: integer, description: "1-based: current_wave_index + 1" }
            waves: { type: integer, description: "cardinality(waves)" }
            percent: { type: integer, description: "waves[current_wave_index]" }
    OverviewOSRelease:
      type: object
      required: [release, devices]
      properties:
        release: { type: string }
        devices: { type: integer }
    OverviewAttention:
      type: object
      required: [conditions, devices]
      properties:
        conditions: { type: integer }
        devices: { type: integer }
    RevocationAction:
      type: string
      enum: [lock, destroy, self_lock]
    RevocationStatus:
      type: string
      enum: [requested, approved, issued, delivered, confirmed, failed, rejected, cancelled, expired]
    RevocationCreate:
      type: object
      required: [confirm_hostname]
      additionalProperties: false
      properties:
        confirm_hostname: { type: string, maxLength: 253 }
        reason: { type: string, maxLength: 500, description: Why the device is revoked (shown to administrators). }
    RevocationConfirm:
      type: object
      required: [confirm_hostname]
      additionalProperties: false
      properties:
        confirm_hostname: { type: string, maxLength: 253 }
    RevocationApproval:
      type: object
      required: [role, admin_id, username, approved_at]
      properties:
        role: { type: string, enum: [requester, approver] }
        admin_id: { type: string, format: uuid }
        username: { type: string }
        approved_at: { type: string, format: date-time }
    RevocationRequest:
      type: object
      required: [id, device_id, hostname, action, status, requested_at, reason, approvals]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        action: { $ref: "#/components/schemas/RevocationAction" }
        status: { $ref: "#/components/schemas/RevocationStatus" }
        requested_by: { type: string, format: uuid, description: The requesting administrator; absent for a self-lock. }
        requested_by_username: { type: string }
        requested_at: { type: string, format: date-time }
        reason: { type: string }
        approved_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: The device refuses the token afterwards. }
        delivered_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, description: When the device confirmed the erasure. }
        finished_at: { type: string, format: date-time }
        rejection: { type: string, description: "Why the revocation-issuer rejected or failed it, e.g. limit_admin_hour." }
        uninstall_cancelled:
          type: string
          enum: [before_delivery, after_delivery]
          description: >-
            Only in the response of a Lock or Destroy request that cancelled an uninstall of the device.
            after_delivery: the device had already received the uninstall command and may already have removed the
            revocation module (paddock-revoke).
        result:
          type: object
          additionalProperties: true
          description: 'The device''s confirmation: erased (true only if every LUKS volume has no key-bearing keyslot left and unresolved is empty), slots_before and slots_after (sums of key-bearing keyslots over the reported volumes), volumes (one {device, slots_before, slots_after, other_slots_after, erased} per reported volume, failed ones included, the root volume last; other_slots_after is an optional integer, absent when 0: the key-less keyslots left on the volume, such as the reencrypt keyslot of an unfinished reencryption, which do not make the erasure incomplete) and unresolved (the crypttab entries the device could not erase with certainty; absent when there are none). Confirmations of devices before M4c.1 have no volumes, e.g. {"erased": true, "slots_before": 2, "slots_after": 0}.'
        approvals:
          type: array
          items: { $ref: "#/components/schemas/RevocationApproval" }
    RevocationRequestPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RevocationRequest" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DeviceCommandPage:
      type: object
