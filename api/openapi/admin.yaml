      operationId: confirmPermissionProfileRootGrant
      x-paddock-step-up: true
      tags: [privileges]
      description: |
        Roles: org_admin. Confirms an effectively Full profile that existed before the step-up rule covered it; needs
        a step-up within the last 300 s (403 step_up_required; API tokens cannot satisfy it). A profile that is not
        effectively Full: 409 invalid_state.
      x-paddock-audit: permission_profile.root_grant_confirmed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The confirmed profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionProfile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
