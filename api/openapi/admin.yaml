      type: string
      enum: [requested, uploaded, stored, failed, expired, purged]
    DiagnosticsRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 500, description: "Why the bundle is needed; shown to the device's user and recorded." }
    Diagnostics:
      type: object
      required: [id, device_id, hostname, requested_by, requested_at, reason, state, truncated_entries, download_count]
      properties:
