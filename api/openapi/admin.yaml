        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PermissionProfileSort"
        - $ref: "#/components/parameters/Search"
        - name: class
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/PrivilegeClass" }
      responses:
        "200":
          description: One page of permission profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionProfilePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPermissionProfile
      tags: [privileges]
      description: |
        Roles: org_admin, org_operator. A restricted profile lists absolute command paths with optional arguments;
        commands with ALL, "!", "#", the sudoers separators ,:=\ or the pattern characters ^$*?[] are refused with 422
        invalid_command; the detail names a refused pattern character. A profile that is effectively Full (class full,
        or restricted with a root-equivalent command) needs a step-up within the last 300 s (403 step_up_required);
        API tokens cannot satisfy it.
      x-paddock-audit: permission_profile.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionProfileCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/permission-profiles/root-equivalence:
    get:
      operationId: previewRootEquivalence
      tags: [privileges]
      description: |
        Roles: org_admin, org_operator, org_auditor. Read-only preview of what a profile with this class and these
        commands grants in effect, before it is saved (plan M8x decision 40): the effective class, the commands that
        hand out root and the witnesses ("ALL", "cmd:<command>", "pair:<writer>|<command>"). It reads no data and
        records no audit event; the server checks the same rules again when the profile is saved.
      parameters:
        - name: class
          in: query
          required: true
          schema: { $ref: "#/components/schemas/PrivilegeClass" }
        - name: command
          in: query
          description: Repeatable; at most 100 commands of at most 1024 characters each.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: The effective privilege of the class and commands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootEquivalence" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/permission-profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPermissionProfile
      tags: [privileges]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The permission profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePermissionProfile
      tags: [privileges]
      description: |
        Roles: org_admin, org_operator. Changing the class away from restricted drops the commands unless given.
        A change after which the profile is effectively Full needs a step-up within the last 300 s (403
        step_up_required) when the profile was not effectively Full before or its class or commands change; a rename
        or a change of require_password, timestamp_timeout_min or lecture does not. API tokens cannot satisfy it.
      x-paddock-audit: permission_profile.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionProfileUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePermissionProfile
      tags: [privileges]
      description: "Roles: org_admin, org_operator. A profile that is still assigned: 409 in_use."
      x-paddock-audit: permission_profile.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
