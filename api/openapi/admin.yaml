  /api/v1/settings/dms:
    get:
      operationId: getDMSSettings
      tags: [settings]
      description: "Roles: org_admin, org_operator, org_auditor. The dead man's switch; off with the defaults until changed."
      responses:
        "200":
          description: The dead man's switch settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DMSSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateDMSSettings
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the dead man's switch settings (plan M4c decision 15): period_days 7–365 (the portal
        warns below 30), distinct warn_days below the period. Turning the switch on, or changing it while on, needs a
        step-up within the last 300 s (403 step_up_required); 403 revocation_disabled while PADDOCK_REVOCATION_ENABLED
        is off. Every device is recompiled; while the switch is on every active device holds a self-lock token, and if
        Paddock is unreachable for longer than the period of uptime, every such device locks itself. Turning it off
        deletes the tokens and tells the devices to delete their copies.
      x-paddock-audit: settings.dms_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DMSSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DMSSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/managed-files:
    get:
      operationId: getManagedFileSettings
      tags: [settings]
      description: |
        Roles: org_admin, org_operator, org_auditor. The operator roots of the managed files (ADR 0034 amendment
        2026-10-16); empty until changed.
      responses:
        "200":
          description: The managed-file settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFileSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateManagedFileSettings
      x-paddock-step-up: true
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the operator roots: directories of the form /etc/<name>/, /usr/local/etc/<name>/
        or /opt/<name>/ (trailing slash), outside the denied and sensitive paths and the never-operator directories
        (422 path_not_allowed naming the root), at most 50. Below a root an operator manages files without a step-up,
        except executables, scripts, shared objects and .d directories; every other path needs org_admin and a
        step-up. Needs a step-up within the last 300 s (403 step_up_required); API tokens cannot satisfy it. Existing
        definitions are not changed; the security review lists files whose tier rose.
      x-paddock-audit: settings.managed_files_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedFileSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFileSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/updates:
    get:
      operationId: getUpdateSettings
      tags: [settings]
      description: "Roles: org_admin, org_operator, org_auditor. The update settings (plan M5b decisions 1 and 9); the defaults until changed."
      responses:
        "200":
          description: The update settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateUpdateSettings
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the update settings: security_daily_at (HH:MM, local device time),
        regular_schedule (a subset of systemd OnCalendar: optional comma-separated weekdays Mon…Sun, then HH:MM; anything
        else is 422 invalid_schedule), regular_updates_enabled, max_random_delay_min (0–720), staleness_warning_h (1–720)
        and staleness_critical_h (above the warning, at most 2160; 400 invalid_request otherwise). Every device is
        recompiled.
      x-paddock-audit: settings.updates_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/package-holds:
    get:
      operationId: listPackageHolds
      tags: [updates]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [package, created_at, updated_at]
        default_sort: package
        search: [package]
        filters: [device_group_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PackageHoldSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceGroupFilter"
      responses:
        "200":
          description: One page of package holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHoldPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPackageHold
      tags: [updates]
      description: |
        Roles: org_admin, org_operator. Holds a package for every device of the organization or of a device group:
        without a version the installed version is kept (apt-mark hold), with a version it is pinned (apt preferences,
        Pin-Priority 1001). Held packages are left out of security and regular updates, and install-now refuses them.
        A package held twice in one scope is 409 already_exists.
      x-paddock-audit: package_hold.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageHoldCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/package-holds/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPackageHold
      tags: [updates]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The package hold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePackageHold
      tags: [updates]
      description: "Roles: org_admin, org_operator. Replaces version and reason; the package and the scope are fixed."
      x-paddock-audit: package_hold.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageHoldUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePackageHold
      tags: [updates]
      description: "Roles: org_admin, org_operator. The devices release the hold with their next bundle."
      x-paddock-audit: package_hold.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      operationId: getOverview
      tags: [overview]
      description: "Roles: org_admin, org_operator, org_auditor. The numbers of the overview page, computed in one transaction; never cached."
      responses:
        "200":
          description: The overview of the organization's fleet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/security-review:
    get:
      operationId: getSecurityReview
      tags: [overview]
      description: |
        Roles: org_admin, org_operator, org_auditor. The review of existing data (ADR 0034 decision 7): effectively Full
        permission profiles and managed files on sensitive paths that no organization administrator has confirmed with
        a step-up yet, and managed files on denied paths, which are not shipped to devices. One review object, not a
        collection: every list holds at most 100 items ordered by name or path, and total counts all of them.
      responses:
        "200":
          description: The security review of the organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityReview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/attention/devices:
    get:
      operationId: listAttentionDevices
      tags: [devices]
      description: >-
        Roles: org_admin, org_operator, org_auditor. The attention list grouped by device: one item per device with an
        open condition, its conditions most severe first. A kind filter selects devices with at least one matching
        condition; all conditions of the device are listed.
      x-paddock-list:
        sort: [severity, hostname, since]
        default_sort: -severity
        search: [hostname]
        filters: [kind, device_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AttentionDeviceSort"
        - $ref: "#/components/parameters/Search"
        - name: device_id
          in: query
          description: Only this device (exact match; the device page reads its conditions with it).
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AttentionKind" }
      responses:
        "200":
          description: One page of devices with their open conditions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionDevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/attention:
    get:
      operationId: listAttention
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The conditions that need an administrator, one row per open
        condition of a device (plan M5b decision 11): staleness warning and critical (the organization's thresholds),
        presumed lost, quarantined (clone suspected), disk encryption not compliant, agent not the current release,
        the latest login or sudo configuration failed, a Lock or Destroy waiting, or expired within the last 30 days,
        an agent release whose rollback failed and is still pending on the device (ADR 0024), a device clock more than
        60 s off the server's, measured at check-in and cleared once it is back within 30 s (clock_drift, plan M8b
        decision 15), a hole in a device's event numbering still open after two further check-ins (event_gap, plan M8b
        decision 23). Read-only; the actions are the device's own (retire, release quarantine, lock).
      x-paddock-list:
        sort: [since, kind, hostname]
        default_sort: -since
        search: [hostname]
        filters: [kind]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AttentionSort"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AttentionKind" }
      responses:
        "200":
          description: One page of conditions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/install-now:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: installNowOnDevice
      tags: [updates]
      description: |
        Roles: org_admin, org_operator. Issues the command install_now (valid 24 hours) to an active device: the agent
        installs the packages, or upgrades installed ones, at its next check-in. A package held for the device is 409
        package_on_hold and no command is issued; another device state is 409 invalid_state.
      x-paddock-audit: device.install_now_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallNowRequest" }
      responses:
        "202":
          description: The issued command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCommand" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/device-groups/{id}/install-now:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: installNowOnDeviceGroup
      tags: [updates]
      description: |
        Roles: org_admin, org_operator. Issues install_now to every active device of the group, one command per device.
        More than 500 active devices is 422 too_many_devices; a package held for any of them is 409 package_on_hold;
        then no command is issued.
      x-paddock-audit: device.install_now_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallNowRequest" }
      responses:
        "202":
          description: The number of issued commands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstallNowGroupResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
