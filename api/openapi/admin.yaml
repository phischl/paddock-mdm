  /api/platform/v1/notification-destinations:
    get:
      operationId: listPlatformNotificationDestinations
      tags: [platform]
      description: |
        Roles: platform_admin. The platform's notification destinations: signed webhooks and e-mail address lists that
        receive platform events (rollouts, releases, OSV, IP allow list) (ADR 0031). Never shows a webhook URL or a signing secret;
        url_display has scheme, host and a masked path.
      x-paddock-list:
        sort: [name, type, created_at]
        default_sort: name
        search: [name]
        filters: [type, enabled]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/NotificationDestinationSort"
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/NotificationDestinationType" }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: One page of destinations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestinationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPlatformNotificationDestination
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Creates a destination. A webhook needs an https URL without user information on port 443
        or 1024–65535 whose host is a public address (400 invalid_request naming the rule); the URL and a new signing
        secret are stored encrypted and the secret is returned once in this response. An e-mail destination needs 1 to
        20 plain addresses and is 409 email_not_configured while the installation has no SMTP relay (see
        GET /api/v1/notification-capabilities). filter_mode custom takes 1 to 200 registered audit codes (400
        unknown_code for an unregistered one). heartbeat_interval_s is 0 or 60–3600, email_min_interval_s 60–3600. A
        duplicate name is 409 already_exists. A syslog destination needs syslog_host, a DNS name or public IP address
        (the webhook address rules apply), and takes syslog_port (default 6514), syslog_ca_pem (one or more PEM
        certificates, at most 16 KiB) and syslog_server_name (the TLS server name); it is delivered over TLS 1.2 or
        newer, one RFC 5424 message per event. checkpoints is allowed for webhook and syslog destinations (400 for
        e-mail). A new destination starts at the newest event; it never replays history. pseudonymize_users must be false: platform events carry no user names.
        Needs a step-up within the last 5 minutes (403 step_up_required; API tokens and MCP sessions cannot satisfy it).
      x-paddock-audit: notification.destination_created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationDestinationCreate" }
      responses:
        "201":
          description: Created; secret is shown only here (webhook).
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestinationCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/notification-destinations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPlatformNotificationDestination
      tags: [platform]
      description: "Roles: platform_admin. One destination with its delivery state; 404 not_found for another scope's."
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestination" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePlatformNotificationDestination
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Replaces every setting except the type (400 invalid_request when it differs) and the signing
        secret. url is optional: absent keeps the stored URL, present is validated like on creation and replaces it.
        syslog_ca_pem works alike: absent keeps the stored CA bundle, an empty string removes it.
        Enabling a disabled destination requires cursor: continue delivers the events since it was disabled, skip
        resumes at the newest event and never delivers the ones in between (400 invalid_request without cursor; cursor
        is refused otherwise). Enabling an e-mail destination is 409 email_not_configured without an SMTP relay;
        disabling or renaming one is not. Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: notification.destination_updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationDestinationUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestination" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePlatformNotificationDestination
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Deletes the destination with its delivery state and history. Needs a step-up within the last
        5 minutes (403 step_up_required).
      x-paddock-audit: notification.destination_deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/notification-destinations/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rotatePlatformNotificationDestinationSecret
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Replaces the signing secret of a webhook destination and returns the new one once; deliveries
        are signed with it from the notifier's next round. 409 invalid_state for an e-mail destination. Needs a step-up
        within the last 5 minutes (403 step_up_required).
      x-paddock-audit: notification.destination_secret_rotated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The new secret, shown only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestinationSecret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/notification-destinations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testPlatformNotificationDestination
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Requests a test delivery. The notifier, the only service that can decrypt the URL and the
        secret, delivers it in its next round with one attempt (webhook: the signed envelope of kind test; e-mail: one
        message) and records notification.test_sent with the result, which GET …/{id} shows in state.last_test.
        409 invalid_state while an earlier test of the destination is still pending. Needs a step-up within the last 5
        minutes (403 step_up_required).
      x-paddock-audit: notification.test_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestRequested" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup:
    get:
      operationId: getBackupOverview
      tags: [platform]
      description: |
        Roles: platform_admin. The backup overview (plan M15 decision 13): the key state, the schedule, every target
        with its mirror state per kind, the local repository and the newest run per kind. Never a key, a password or an
        access key. The repository sizes and the WAL time are null until the backup role reports them.
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupOverview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/schedule:
    get:
      operationId: getBackupSchedule
      tags: [platform]
      description: |
        Roles: platform_admin. The backup schedule and retention; without a stored schedule the defaults (full backup
        every 24 h, OpenBao every 6 h, Fleet every 24 h, escrow every hour, 14 full backups, 30 days of snapshots and
        dumps) with updated_by and updated_at null.
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putBackupSchedule
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Replaces the schedule; every field is required and checked against its range (400
        invalid_request naming the field). The backup role applies it in its next round. Needs a step-up within the
        last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_schedule_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupScheduleUpdate" }
      responses:
        "200":
          description: The new schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/targets:
    get:
      operationId: listBackupTargets
      tags: [platform]
      description: |
        Roles: platform_admin. The backup targets: local directories of the host, SMB and NFS shares the host mounts,
        S3-compatible buckets. Never a password, an access key or a secret key; has_credentials says whether some are
        stored. A deleted local, SMB or NFS target is no longer listed while it waits for the host to remove its volume.
      x-paddock-list:
        sort: [name, type, created_at]
        default_sort: name
        search: [name]
        filters: [type, enabled, host_state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/BackupTargetSort"
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/BackupTargetType" }
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: host_state
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/BackupTargetHostState" }
      responses:
        "200":
          description: One page of targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTargetPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createBackupTarget
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Adds a target. The object named by type (local, smb, nfs or s3) holds its settings and
        is required; the rules of every field are in plan M15 §6.1 (400 invalid_request naming the field). The SMB
        password and the S3 access and secret keys are stored encrypted and never returned. A local, SMB or NFS target
        starts with host_state pending_host and host_revision 1 and is used after ./paddock backup-target apply and
        ./paddock up on the host; an S3 target has host_state n/a. A duplicate name is 409 already_exists. Needs a
        step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_target_created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getBackupTarget
      tags: [platform]
      description: "Roles: platform_admin. One target with its last test and its mirror state per kind; 404 not_found for a missing or deleted one."
      responses:
        "200":
          description: The target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateBackupTarget
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Replaces the settings; the type cannot change (400 invalid_request). Without smb.password,
        or without both s3.access_key and s3.secret_key, the stored credentials stay, but only for the same destination:
        a change of smb.host, smb.share, smb.domain, smb.username or smb.options needs the password again, a change of
        s3.endpoint, s3.bucket, s3.region or s3.ca_pem needs both keys again, and the S3 keys are replaced together
        (400 invalid_request naming the fields). smb.path and s3.prefix change without credentials. A change of a local,
        SMB or NFS target's settings or credentials raises host_revision and resets host_state to pending_host until the
        host step ran again. Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_target_updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteBackupTarget
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Deletes the target; the backup sets already on it stay. An S3 target is removed at once;
        a local, SMB or NFS target is disabled and removed by the next ./paddock backup-target apply, which unmounts
        its volume (its name stays taken until then). Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_target_deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/targets/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testBackupTarget
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Requests a connection test. The backup role, the only service that can decrypt the
        credentials, runs it in its next round (S3: the bucket, a write and a delete under the prefix; a mounted target:
        a write and a delete in the volume) and stores last_test_at, last_test_ok and last_test_error (an error class:
        dns, dial, tls, auth, forbidden, not_mounted, read_only, io); test_requested_at is set until then. Needs a
        step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_target_tested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/targets/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: enableBackupTarget
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Enables a disabled target; 409 invalid_state when it is enabled. Needs a step-up within
        the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_target_updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/targets/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: disableBackupTarget
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Disables an enabled target: the backup role no longer writes to it. 409 invalid_state
        when it is disabled. Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.backup_target_updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/run:
    post:
      operationId: requestBackupRun
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Backs up now: one run in state requested per kind (kinds absent, null or empty: every
        kind), which the backup role runs in its next round. 409 invalid_state while no backup key is confirmed; 400
        invalid_request for an unknown kind or a label of more than 64 characters. Needs a step-up within the last 5
        minutes (403 step_up_required).
      x-paddock-audit: platform.backup_run_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRunRequest" }
      responses:
        "202":
          description: The requested runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupRun" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/runs:
    get:
      operationId: listBackupRuns
      tags: [platform]
      description: |
        Roles: platform_admin. The backup runs, one per kind and attempt, with the mirror result per target. Requested
        runs have no started_at yet and come first in the default order.
      x-paddock-list:
        sort: [started_at, kind, outcome]
        default_sort: -started_at
        search: [kind, label]
        filters: [kind, outcome, target_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/BackupRunSort"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/BackupKind" }
        - name: outcome
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [succeeded, failed] }
        - name: target_id
          in: query
          description: Runs that mirrored to this target.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRunPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/restore-plans:
    get:
      operationId: listBackupRestorePlans
      tags: [platform]
      description: |
        Roles: platform_admin. The restore plans: approved in the portal, executed on the host with host_command,
        and the restores the host ran without a plan (kind fresh_install). An approved plan reads as expired 24 hours
        after its approval.
      x-paddock-list:
        sort: [created_at, state]
        default_sort: -created_at
        search: [created_by, kind]
        filters: [state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/BackupRestorePlanSort"
        - $ref: "#/components/parameters/Search"
        - name: state
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/BackupRestorePlanState" }
      responses:
        "200":
          description: One page of restore plans.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestorePlanPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createBackupRestorePlan
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Approves a restore plan, which the host executes within 24 hours with
        ./paddock restore --plan <id> (host_command). confirmation must be the typed word restore (400
        invalid_request otherwise); 400 invalid_request also for a point_in_time plan without at, a point in the
        future, an unknown component or a source_target_id that names no target. 409 invalid_state while another
        plan is approved or running, or when the source (the local backup repository without source_target_id) has
        no successful backup of a chosen component at or before at; the detail names the missing kind. Needs a
        step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.restore_planned
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRestorePlanInput" }
      responses:
        "201":
          description: The approved plan.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestorePlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/restore-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getBackupRestorePlan
      tags: [platform]
      description: "Roles: platform_admin. One restore plan."
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestorePlan" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/restore-plans/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelBackupRestorePlan
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Cancels an approved plan: it is expired and the host refuses it. 409 invalid_state for
        a plan that is not approved. Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: platform.restore_cancelled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestorePlan" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/platform/v1/backup/restore-plans/{id}/abandon:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: abandonBackupRestorePlan
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Marks a running plan as abandoned when the host never reported its end (the host
        crashed, or the database was unreachable when the restore stopped): the plan no longer blocks a new one, its
        outcome_detail names the administrator, and the host's later report for it is refused (409).
        confirmation must be the typed word abandon (400 invalid_request otherwise). 409 invalid_state for a plan that
        is not running; cancel an approved plan instead. Needs a step-up within the last 5 minutes (403
        step_up_required).
      x-paddock-audit: platform.restore_abandoned
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRestorePlanAbandonInput" }
      responses:
        "200":
          description: Abandoned; the plan's state is abandoned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupRestorePlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/platform/v1/notification-destinations/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: replayPlatformNotificationDestination
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin. Asks the notifier to send the destination's stored batches and checkpoints again from
        from_forward_seq on, with their original delivery IDs and forward sequence numbers, before it continues at the
        cursor; the receiver sees the same numbers again and must deduplicate. An event the index retention purged
        meanwhile is sent as {forward_seq, event_id, missing: true}. Each re-sent delivery is recorded as
        notification.replayed. 400 invalid_request when from_forward_seq is below 1 or above state.forward_seq; 409
        invalid_state while a batch is being retried, a replay is still running (state.replay_from is set) or a skip
        request from enabling with cursor skip awaits the next delivery round. Needs a step-up within the last 5
        minutes (403 step_up_required).
      x-paddock-audit: notification.replay_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReplayRequest" }
      responses:
        "202":
          description: Requested; state.replay_from shows it until the replay is complete.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: paddock_session
    bearer:
      type: http
      scheme: bearer
      description: |
        An API token secret (pdk_ and 43 characters), plan M6c decision 9, or the access token of an MCP session
        (ADR 0044). An MCP client sends its name in the optional header X-Paddock-MCP-Client (parameter McpClient);
        the server keeps at most 64 printable ASCII characters and records them as actor.client of the audit events
        of the session.
  parameters:
    McpClient:
      name: X-Paddock-MCP-Client
      in: header
      required: false
      description: |
        Name and version of the MCP client (for example claude-code/2.1), sent by paddockctl mcp. Characters outside
        printable ASCII (0x20 to 0x7E) are dropped and the value is cut to 64 characters; an empty result is ignored.
      schema: { type: string }
    AccessReviewFrom:
      name: from
      in: query
      description: RFC 3339; the start of the period, default 90 days before to.
      schema: { type: string, format: date-time }
    AccessReviewTo:
      name: to
      in: query
      description: RFC 3339; the end of the period, default now.
      schema: { type: string, format: date-time }
    AccessReviewFormat:
      name: format
      in: query
      required: true
      schema: { type: string, enum: [json, csv] }
    BackupTargetSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, type, -type, created_at, -created_at]
        default: name
    BackupRunSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [started_at, -started_at, kind, -kind, outcome, -outcome]
        default: -started_at
    BackupRestorePlanSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [created_at, -created_at, state, -state]
        default: -created_at
    NotificationDestinationSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, type, -type, created_at, -created_at]
        default: name
    FindingListSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [last_seen_at, -last_seen_at, opened_at, -opened_at, status, -status, hostname, -hostname, code, -code]
        default: -last_seen_at
    AccountSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [username, -username, display_name, -display_name, role, -role]
        default: username
    RolloutUrgent:
      name: urgent
      in: query
      description: |
        Opt out of a staged rollout (plan M11 decision 26): every device receives the change at once. Needs reason, a
        step-up within the last 5 minutes (403 step_up_required; an API token never has one) and enabled rollouts
        (400 invalid_request otherwise). The change set's rollout is urgent and the reason is audited as urgent_reason.
      schema: { type: boolean, default: false }
    RolloutReason:
      name: reason
      in: query
      description: Why the change skips the staged rollout (2 to 500 characters); required with urgent.
      schema: { type: string, minLength: 2, maxLength: 500 }
    Csrf:
      name: X-Paddock-CSRF
      in: header
      required: true
      schema: { type: string, enum: ["1"] }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BackupKeyId:
      name: id
      in: path
      required: true
      description: The key ID (bk-<YYYYMMDD>-<8 hex> or legacy).
      schema: { type: string, maxLength: 32 }
    Page:
      name: page
      in: query
      description: Page number. page × page_size may not exceed 10000 (400 page_out_of_range).
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
    Search:
      name: q
      in: query
      description: Case-insensitive substring search over the fields listed in x-paddock-list.search.
      schema: { type: string, minLength: 2, maxLength: 100 }
    DeviceGroupSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
        default: name
    AuditEventSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The event_id is the tie-breaker.
      schema:
        type: string
        enum: [occurred_at, -occurred_at, code, -code, outcome, -outcome]
        default: -occurred_at
    AuditVerificationRunSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [started_at, -started_at, from_day, -from_day, ok, -ok]
        default: -started_at
    AuditManifestSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The day is the primary key.
      schema:
        type: string
        enum: [day, -day]
        default: -day
    AuditExportSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [requested_at, -requested_at, status, -status, from_day, -from_day, to_day, -to_day]
        default: -requested_at
    IpAllowlistSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [cidr, -cidr, label, -label, created_at, -created_at]
        default: cidr
    Confirm:
      name: confirm
      in: query
      description: |
        Acknowledges the consequence a previous attempt answered with 409: lockout (lockout_confirmation_required) or
        disable (disable_confirmation_required). A value that does not match the computed consequence is ignored.
      schema:
        type: string
        enum: [lockout, disable]
    AgentReleaseSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. version sorts by SemVer precedence (0.2.0 before 0.10.0, a pre-release before its release). The version is the tie-breaker.
      schema:
        type: string
        enum: [version, -version, created_at, -created_at, status, -status]
        default: -created_at
    Version:
      name: version
      in: path
      required: true
      description: Semantic version of an agent release.
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$', maxLength: 64 }
    OrganizationSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [slug, -slug, name, -name, created_at, -created_at, status, -status]
        default: slug
    DeviceSoftwareSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Name, version and source are the tie-breakers.
      schema:
        type: string
        enum: [name, -name, version, -version]
        default: name
    FindingSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Findings without score or severity sort last in both directions. CVE, package name and version are the tie-breakers.
      schema:
        type: string
        enum: [cvss_score, -cvss_score, severity, -severity, cve, -cve]
        default: -cve
    SoftwareSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Name and version are the tie-breakers.
      schema:
        type: string
        enum: [name, -name, version, -version, device_count, -device_count]
        default: name
    VulnerabilitySort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. CVEs without score or severity sort last in both directions. The CVE is the tie-breaker.
      schema:
        type: string
        enum: [cvss_score, -cvss_score, severity, -severity, cve, -cve, device_count, -device_count]
        default: -cve
    VulnerableDeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Device ID, package name and version are the tie-breakers.
      schema:
        type: string
        enum: [hostname, -hostname]
        default: hostname
    SeverityFilter:
      name: severity
      in: query
      description: Repeatable. unknown selects findings without severity (no Ubuntu priority and no score).
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/Severity" }
    DeviceResourceStatusSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The resource ID is the tie-breaker.
      schema:
        type: string
        enum: [resource_id, -resource_id, status, -status, occurred_at, -occurred_at]
        default: resource_id
    DeviceBundleSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The version is the tie-breaker.
      schema:
        type: string
        enum: [version, -version, created_at, -created_at]
        default: -version
    ConfigStatusSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The resource ID is the tie-breaker.
      schema:
        type: string
        enum: [resource_id, -resource_id, failed, -failed, pending, -pending, applied, -applied]
        default: -failed
    ResourceStateFilter:
      name: status
      in: query
      description: Repeatable. Keeps resources with a device in one of these statuses.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/ResourceState" }
    DeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Devices without contact sort last. The id is the tie-breaker.
      schema:
        type: string
        enum: [hostname, -hostname, last_contact_at, -last_contact_at, enrolled_at, -enrolled_at, state, -state]
        default: hostname
    DeviceLoginSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [at, -at, username, -username]
        default: -at
    OwnedDeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Devices without contact sort last. The id is the tie-breaker.
      schema:
        type: string
        enum: [hostname, -hostname, last_contact_at, -last_contact_at]
        default: hostname
    EnrollmentTokenSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, created_at, -created_at, expires_at, -expires_at]
        default: -created_at
    ConfigRolloutSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [started_at, -started_at, status, -status]
        default: -started_at
    ConfigRolloutDeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The hostname, then the device id is the tie-breaker.
      schema:
        type: string
        enum: [hostname, -hostname, in_wave, -in_wave, report_outcome, -report_outcome]
        default: hostname
    ChangeSetSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [applied_at, -applied_at]
        default: -applied_at
    ApiTokenSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Tokens never used sort last. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, created_at, -created_at, expires_at, -expires_at, last_used_at, -last_used_at]
        default: name
    ManagedFileSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [path, -path, created_at, -created_at, updated_at, -updated_at]
        default: path
    ManagedUnitSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [unit, -unit, created_at, -created_at, updated_at, -updated_at]
        default: unit
    DeviceCommandSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [issued_at, -issued_at, expires_at, -expires_at, type, -type, status, -status]
        default: -issued_at
    DeviceDiagnosticsSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [requested_at, -requested_at, state, -state]
        default: -requested_at
    DiagnosticsSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [requested_at, -requested_at, hostname, -hostname, state, -state]
        default: -requested_at
    DiagnosticsStateFilter:
      name: state
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/DiagnosticsState" }
    RevocationRequestSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [requested_at, -requested_at, status, -status, action, -action, hostname, -hostname]
        default: -requested_at
    DeviceStateFilter:
      name: state
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/DeviceState" }
    PackageHoldSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [package, -package, created_at, -created_at, updated_at, -updated_at]
        default: package
    SoftwareSourceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
        default: name
    SoftwareRequestSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [requested_at, -requested_at, username, -username, state, -state, expires_at, -expires_at]
        default: -requested_at
    SoftwareCatalogSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, category, -category, created_at, -created_at, updated_at, -updated_at]
        default: name
    CompileWarningSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [created_at, -created_at, hostname, -hostname, code, -code]
        default: -created_at
    SoftwareAssignmentSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [created_at, -created_at, updated_at, -updated_at, intent, -intent]
        default: -created_at
    SoftwareCategoryFilter:
      name: category
      in: query
      description: Only entries of this category.
      schema: { type: string, maxLength: 64 }
    SoftwareSourceFilter:
      name: source_id
      in: query
      description: Only entries that use this package source.
      schema: { type: string, format: uuid }
    SoftwareEntryFilter:
      name: catalog_entry_id
      in: query
      description: Only assignments of this catalog entry.
      schema: { type: string, format: uuid }
    SoftwareUserFilter:
      name: user_id
      in: query
      description: Only assignments that target this user directly.
      schema: { type: string, format: uuid }
    SoftwareUserGroupFilter:
      name: user_group_id
      in: query
      description: Only assignments that target this user group.
      schema: { type: string, format: uuid }
    SoftwareTargetFilter:
      name: target
      in: query
      description: Only assignments with this kind of target.
      schema: { $ref: "#/components/schemas/SoftwareTarget" }
    UserSoftwareSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The assignment id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, intent, -intent]
        default: name
    SoftwareIntentFilter:
      name: intent
      in: query
      description: Only assignments with this intent.
      schema: { $ref: "#/components/schemas/SoftwareIntent" }
    DeviceManagedSoftwareSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The name, then the entry id, are the tie-breakers.
      schema:
        type: string
        enum: [name, -name, state, -state, reported_at, -reported_at]
        default: name
    SoftwareCatalogDeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The hostname, then the device id, are the tie-breakers.
      schema:
        type: string
        enum: [hostname, -hostname, state, -state, reported_at, -reported_at]
        default: hostname
    DeviceManagedSoftwareIntentFilter:
      name: intent
      in: query
      description: Only entries with this intent, reported or assigned.
      schema: { $ref: "#/components/schemas/SoftwareIntent" }
    DeviceSoftwareStateFilter:
      name: state
      in: query
      description: Only entries in this state, reported or derived.
      schema: { $ref: "#/components/schemas/DeviceSoftwareState" }
    DeviceSoftwareScopeFilter:
      name: scope
      in: query
      description: Only rows of this scope, reported or derived.
      schema: { $ref: "#/components/schemas/SoftwareScope" }
    AttentionSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The row id is the tie-breaker.
      schema:
        type: string
        enum: [since, -since, kind, -kind, hostname, -hostname]
        default: -since
    AttentionDeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. severity is the rank of the most severe condition; hostname, then device_id, are the tie-breakers.
      schema:
        type: string
        enum: [severity, -severity, hostname, -hostname, since, -since]
        default: -severity
    DeviceGroupFilter:
      name: device_group_id
      in: query
      description: Only definitions scoped to this device group.
      schema: { type: string, format: uuid }
    UserSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [username, -username, display_name, -display_name, created_at, -created_at]
        default: username
    UserGroupSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, slug, -slug, created_at, -created_at]
        default: name
    UpstreamGroupSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending (case-insensitive). The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name]
        default: name
    PermissionProfileSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, class, -class, created_at, -created_at, updated_at, -updated_at]
        default: name
    ProfileAssignmentSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [created_at, -created_at, subject_type, -subject_type]
        default: created_at
    UserSourceFilter:
      name: source
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/IdentitySource" }
  responses:
    Device:
      description: The device after the transition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Device" }
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, instance]
      properties:
        type: { type: string, description: "urn:paddock:problem:<code>" }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string, description: Request ID }
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url: { type: string }
    MeOrganization:
      type: object
      required: [id, slug, name, domains]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        domains:
          type: array
          description: DNS domains of the organization's users; the first is the primary domain of the device login.
          items: { type: string }
    Me:
      type: object
      required: [id, username, display_name, role, organization, locale, theme, revocation_enabled, client_ip,
        step_up_valid_until, server_version, alternate_role, channel, mcp_write_enabled, mcp_write_enabled_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [org_admin, org_operator, org_auditor, platform_admin] }
        organization:
          allOf:
            - $ref: "#/components/schemas/MeOrganization"
          nullable: true
        locale: { type: string, enum: [en, de] }
        theme:
          type: string
          enum: [system, light, dark]
          description: Portal theme preference; system follows prefers-color-scheme. An API token answers system.
        revocation_enabled:
          type: boolean
          description: |
            PADDOCK_REVOCATION_ENABLED of this installation (plan M4c decision 1). While false, Lock, Destroy and the
            dead man's switch answer 403 revocation_disabled.
        client_ip:
          type: string
          description: |
            The client address the server resolved for this request (plan M7a decision 15): the peer, or the address
            Caddy forwarded in X-Paddock-Client-IP when the peer is a trusted proxy. The IP allow list is checked
            against it.
        step_up_valid_until:
          type: string
          format: date-time
          nullable: true
          description: |
            Until when the session's last step-up satisfies privileged actions (plan M8x decision 35); null without a
            step-up or once it has expired. The portal shows it in the user menu.
        server_version:
          type: string
          description: |
            Build version of the paddock-server answering the request: the release tag without the leading v (e.g.
            0.1.0-alpha.5), edge-<date>-<commit> for edge builds and 0.0.0-dev for local builds. The portal shows it at
            the bottom of the navigation.
        step_up:
          $ref: "#/components/schemas/MeStepUp"
        api_token:
          $ref: "#/components/schemas/MeApiToken"
        alternate_role:
          allOf: [ { $ref: "#/components/schemas/MeAlternateRole" } ]
          nullable: true
          description: The role this identity may switch to (ADR 0045); null for a single-role identity, API tokens and MCP sessions.
        role_fallback:
          type: string
          enum: [organization_inactive]
          description: |
            Set when a plain sign-in of an identity with the platform role and an organization role entered the
            platform role because the organization is unknown or not active (ADR 0045 amendment 2026-10-29); absent
            otherwise. The portal shows a notice while it is set.
        channel:
          type: string
          enum: [portal, api, mcp]
          description: |
            How this request authenticated (ADR 0044): portal for a portal session, api for an API token, mcp for an
            MCP session opened with paddockctl mcp login.
        mcp_write_enabled:
          type: boolean
          description: |
            Whether the account opted in to MCP write access (ADR 0044 amendment 2026-10-25); false for API tokens.
        mcp_write_enabled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Since when the account's MCP write access is enabled (plan M14 §6.6 amendment 2026-10-29); null while it is
            disabled and for API tokens. The portal shows it in the account menu's MCP dialog.
    MeAlternateRole:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [org_admin, org_operator, org_auditor, platform_admin] }
        organization_slug: { type: string, description: Set when role is an organization role. }
    McpLoginConfig:
      type: object
      required: [issuer, client_id, scopes, device_authorization_endpoint, token_endpoint, revocation_endpoint]
      properties:
        issuer: { type: string }
        client_id: { type: string }
        scopes: { type: array, items: { type: string } }
        device_authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
    McpSessionInput:
      type: object
      required: [id_token, access_token]
      properties:
        id_token: { type: string }
        access_token: { type: string }
        role:
          type: string
          enum: [platform, organization]
          description: The role of the session for an identity with both (ADR 0045); default organization.
    RoleSwitch:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [platform, organization] }
        return_to: { type: string, description: Relative path to return to after the switch; default /. }
    MeApiToken:
      type: object
      description: The API token the request authenticated with; absent for sessions.
      required: [id, name, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        expires_at: { type: string, format: date-time }
    MeStepUp:
      type: object
      description: >-
        Development only (PADDOCK_ENV=development; absent in production): the session's last step-up and the step-up
        timing the server applies, for the acceptance gates.
      required: [window_seconds, max_auth_age_seconds]
      properties:
        at:
          type: string
          format: date-time
          nullable: true
          description: Time of the session's last step-up (whole seconds), null without one.
        window_seconds: { type: integer, description: How long a step-up satisfies a privileged action. }
        max_auth_age_seconds: { type: integer, description: The oldest login a step-up callback accepts (max_age). }
        mfa_classes:
          type: array
          items: { type: string }
          description: >-
            Authenticator classes ("<app>.<model>") the session's last step-up validated (claim paddock_mfa_classes);
            absent without a step-up.
    MeUpdate:
      type: object
      description: A patch of the account settings; at least one field.
      minProperties: 1
      additionalProperties: false
      properties:
        locale: { type: string, enum: [en, de] }
        theme: { type: string, enum: [system, light, dark] }
    DeviceGroup:
      type: object
      required: [id, name, description, created_at, updated_at, staleness, agent_update_policy, disk_unlock_mode]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        staleness:
          description: The group's contact thresholds; null when the organization's apply (plan M8d decision 11).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeviceGroupStaleness"
        agent_update_policy:
          description: The group's agent update policy; null inherits the organization's (ADR 0037 decision 1).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUpdatePolicy"
        disk_unlock_mode:
          description: The group's disk unlock mode for new installations; null inherits the organization's (ADR 0038).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskUnlockMode"
    DeviceGroupStaleness:
      type: object
      description: >-
        Contact thresholds in hours: warning after warning_h (1–720), critical (presumed lost) after critical_h (above
        warning_h, at most 2160). A device in several groups takes the most lenient values.
      required: [warning_h, critical_h]
      additionalProperties: false
      properties:
        warning_h: { type: integer }
        critical_h: { type: integer }
    AgentUpdatePolicy:
      type: string
      enum: [automatic, manual]
      description: automatic follows the platform's rollout waves; manual installs only on an administrator's request per device.
    DiskUnlockMode:
      type: string
      enum: [tpm_pin, tpm_only]
      description: TPM2 + boot PIN, or TPM2 alone while Secure Boot is unchanged (ADR 0038).
    DeviceGroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        staleness:
          description: The contact thresholds of the members in hours (plan M8d decision 11); null or absent inherits the organization's.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeviceGroupStaleness"
        agent_update_policy:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AgentUpdatePolicy"
        disk_unlock_mode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DiskUnlockMode"
    DeviceGroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        staleness:
          description: >-
            The contact thresholds of the members in hours (plan M8d decision 11); null clears the override (the
            organization's thresholds apply), absent keeps it.
          nullable: true
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          allOf:
            - $ref: "#/components/schemas/DeviceGroupStaleness"
        agent_update_policy:
          description: null inherits the organization's agent update policy, absent keeps the value.
          nullable: true
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          allOf:
            - $ref: "#/components/schemas/AgentUpdatePolicy"
        disk_unlock_mode:
          description: null inherits the organization's disk unlock mode, absent keeps the value.
          nullable: true
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          allOf:
            - $ref: "#/components/schemas/DiskUnlockMode"
    DeviceGroupPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceGroup" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AgentReleaseStatus:
      type: string
      enum: [draft, published]
    AgentRolloutStatus:
      type: string
      enum: [running, halted, completed]
    AgentReleaseCreate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 64 }
    AgentReleaseImport:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 64, description: "The version without the leading v, e.g. 0.1.0-alpha.6." }
    AgentReleaseSource:
      type: object
      required: [enabled, repository, url]
      properties:
        enabled: { type: boolean }
        repository: { type: string, nullable: true, description: "<owner>/<repo>; null while switched off." }
        url: { type: string, nullable: true, description: The API base of the source; null while switched off. }
    AgentReleaseCheck:
      type: object
      required: [latest, published_at, newest_stored, importable, reason]
      properties:
        latest: { type: string, nullable: true, description: The newest release on the source; null when none matches. }
        published_at: { type: string, format: date-time, nullable: true }
        newest_stored: { type: string, nullable: true, description: The newest published release on this installation. }
        importable: { type: boolean }
        reason:
          type: string
          enum: [none_found, not_newer]
          nullable: true
          description: Why latest cannot be imported; null when importable.
    AgentRelease:
      type: object
      required: [version, status, created_by, created_at, artifact_count]
      properties:
        version: { type: string }
        status: { $ref: "#/components/schemas/AgentReleaseStatus" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        artifact_count: { type: integer }
        rollout_status: { $ref: "#/components/schemas/AgentRolloutStatus" }
    IpAllowlistEntry:
      type: object
      required: [id, cidr, label, created_by, created_at, updated_at, covers_caller]
      properties:
        id: { type: string, format: uuid }
        cidr: { type: string, description: "Canonical CIDR: a.b.c.d/n or <ipv6>/n." }
        label: { type: string }
        created_by: { type: string, description: "Display name of the platform administrator, or paddock-server admin." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        covers_caller: { type: boolean, description: "The range contains the caller's own client address (client_ip of GET /api/v1/me)." }
    IpAllowlistEntryCreate:
      type: object
      required: [cidr, label]
      properties:
        cidr:
          type: string
          description: |
            IPv4 or IPv6 range with a prefix of at least 1 and the host bits zero; a single address is /32 or /128.
            IPv4-mapped IPv6 is refused. The detail of a 400 names the canonical form.
        label: { type: string, minLength: 1, maxLength: 64 }
    IpAllowlistEntryUpdate:
      type: object
      description: At least one field.
      properties:
        cidr: { type: string }
        label: { type: string, minLength: 1, maxLength: 64 }
    IpAllowlistEntryPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IpAllowlistEntry" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AgentReleasePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentRelease" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AgentArtifact:
      type: object
      required: [arch, sha256, size, created_at]
      properties:
        arch: { type: string, enum: [amd64, arm64] }
        sha256: { type: string, description: Hex SHA-256 of the binary. }
        size: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    AgentPackage:
      type: object
      required: [name, arch, sha256, size, url_path, created_at]
      properties:
        name: { type: string, enum: [paddock-agent, paddock-supervisor, paddock-revoke, fleet-osquery] }
        package_version: { type: string, description: The fleetd version of fleet-osquery; absent for Paddock's packages. }
        arch: { type: string, enum: [amd64, arm64] }
        sha256: { type: string, description: Hex SHA-256 of the package. }
        size: { type: integer, format: int64 }
        url_path: { type: string, description: "Path of the package below the public bundles host, e.g. /packages/1.2.0/paddock-agent_1.2.0_amd64.deb." }
        created_at: { type: string, format: date-time }
    AgentRolloutStart:
      type: object
      additionalProperties: false
      properties:
        waves:
          type: array
          description: Percentages of devices per wave, strictly increasing, ending with 100. Default [1, 10, 50, 100].
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 100 }
        min_wave_minutes: { type: integer, minimum: 1, description: "Default 1440; at least 60 outside development." }
        failure_threshold_percent: { type: integer, minimum: 0, maximum: 100, description: Default 2. }
        failure_threshold_min: { type: integer, minimum: 0, description: Default 3. }
    SessionsEnded:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          format: int64
          description: The new session generation; every session of an older generation is invalid.
    AutoUnsealEnable:
      type: object
      required: [disclaimer_version, acknowledgement]
      properties:
        disclaimer_version: { type: string, maxLength: 16 }
        acknowledgement: { type: string, maxLength: 128 }
    AutoUnsealStatus:
      type: object
      required: [state, disclaimer_version, acknowledgement_version, acknowledgement, acknowledged_by,
                 acknowledged_at, disabled_by, disabled_at, unsealer, seal]
      properties:
        state: { type: string, enum: [disabled, enabled] }
        disclaimer_version: { type: string, description: The current version of the disclaimer text. }
        acknowledgement_version: { type: string, nullable: true, description: The version that was acknowledged. }
        acknowledgement: { type: string, nullable: true }
        acknowledged_by: { type: string, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        disabled_by: { type: string, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        unsealer: { $ref: "#/components/schemas/UnsealerReport" }
        seal: { $ref: "#/components/schemas/SealStatus" }
    UnsealerReport:
      type: object
      required: [running, seen_at, shares_present, unseal_count, last_unseal_at, failure_count, last_failure_at,
                 last_failure_reason]
      properties:
        running: { type: boolean, description: The unsealer reported within the last 60 s. }
        seen_at: { type: string, format: date-time, nullable: true }
        shares_present: { type: boolean, description: Three shares are on the host; only the report of a running unsealer counts. }
        unseal_count: { type: integer, format: int64 }
        last_unseal_at: { type: string, format: date-time, nullable: true }
        failure_count: { type: integer, format: int64 }
        last_failure_at: { type: string, format: date-time, nullable: true }
        last_failure_reason: { type: string, nullable: true, enum: [unreachable, invalid_share, still_sealed, null] }
    SealStatus:
      type: object
      required: [reachable, initialized, sealed, type, threshold, shares]
      properties:
        reachable: { type: boolean }
        initialized: { type: boolean }
        sealed: { type: boolean }
        type: { type: string }
        threshold: { type: integer }
        shares: { type: integer }
    AgentRollout:
      type: object
      required: [version, waves, current_wave_index, wave_started_at, min_wave_minutes, failure_threshold_percent,
                 failure_threshold_min, status, started_by, started_at]
      properties:
        version: { type: string }
        waves: { type: array, items: { type: integer } }
        current_wave_index: { type: integer }
        wave_started_at: { type: string, format: date-time }
        min_wave_minutes: { type: integer }
        failure_threshold_percent: { type: integer }
        failure_threshold_min: { type: integer }
        status: { $ref: "#/components/schemas/AgentRolloutStatus" }
        halted_reason: { type: string }
        started_by: { type: string }
        started_at: { type: string, format: date-time }
    AgentRolloutCounts:
      type: object
      required: [eligible, updated, failed]
      properties:
        eligible: { type: integer, format: int64, description: Active devices inside the current wave. }
        updated: { type: integer, format: int64, description: Devices that reported agent.updated for this version. }
        failed: { type: integer, format: int64, description: "Devices that reported agent.update_failed (also with outcome rollback_failed) or agent.rolled_back for this version, each once." }
    AgentReleaseDetail:
      type: object
      required: [release, artifacts, packages]
      properties:
        release: { $ref: "#/components/schemas/AgentRelease" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/AgentArtifact" }
        packages:
          type: array
          description: The Debian packages of the release (plan M4b decision 1).
          items: { $ref: "#/components/schemas/AgentPackage" }
        rollout: { $ref: "#/components/schemas/AgentRollout" }
        counts: { $ref: "#/components/schemas/AgentRolloutCounts" }
    Organization:
      type: object
      required: [id, slug, name, status, domains, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/OrganizationStatus" }
        domains:
          type: array
          description: The organization's domains; the first is the primary domain.
          items: { type: string }
        created_at: { type: string, format: date-time }
    OrganizationStatus:
      type: string
      enum: [provisioning, active, provisioning_failed, suspended]
    OrganizationCreate:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$" }
        name: { type: string, minLength: 1, maxLength: 200 }
    OrganizationPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AuditOutcome:
      type: string
      enum: [success, failure, denied, unknown]
    AuditActorType:
      type: string
      enum: [admin, platform_admin, system, anonymous, device, api_token]
    AuditActor:
      type: object
      required: [type, step_up]
      properties:
        type: { type: string }
        id: { type: string }
        display: { type: string }
        ip: { type: string }
        step_up: { type: boolean }
        client: { type: string, description: "The MCP client's name on events of an MCP session (source mcp, ADR 0044)." }
    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
        display: { type: string }
    AuditDeviceRef:
      type: object
      required: [id, hostname]
      properties:
        id: { type: string, format: uuid }
        hostname:
          type: string
          nullable: true
          description: Current hostname, resolved at read time; null when the organization has no such device.
    AuditEvent:
      type: object
      required: [event_id, occurred_at, recorded_at, code, outcome, source, actor, target, params, correlation_id, device]
      properties:
        device:
          allOf:
            - $ref: "#/components/schemas/AuditDeviceRef"
          nullable: true
          description: >-
            The device the event concerns (target of type device, else params.device_id); read-time enrichment, the
            stored event is unchanged.
        event_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        code: { type: string }
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        source: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        target:
          allOf:
            - $ref: "#/components/schemas/AuditTarget"
          nullable: true
        params:
          type: object
          additionalProperties: true
        error_code: { type: string }
        correlation_id: { type: string }
    AuditEventStored:
      type: object
      description: The stored audit event, without the read-time device enrichment of AuditEvent.
      required: [event_id, organization_id, occurred_at, recorded_at, code, outcome, source, actor, target, params, correlation_id]
      properties:
        event_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, description: The organization the event belongs to; always the caller's. }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        code: { type: string }
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        source: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        target:
          allOf:
            - $ref: "#/components/schemas/AuditTarget"
          nullable: true
        params:
          type: object
          additionalProperties: true
        error_code: { type: string }
        correlation_id: { type: string }
    AuditFeedEvent:
      type: object
      required: [commit_seq, event]
      properties:
        commit_seq: { type: integer, format: int64, description: "Position of the event in the organization's commit order." }
        event: { $ref: "#/components/schemas/AuditEventStored" }
    AuditFeedPage:
      type: object
      required: [schema, events, next_after, latest]
      properties:
        schema: { type: string, enum: ["paddock.audit.feed.v1"] }
        events:
          type: array
          items: { $ref: "#/components/schemas/AuditFeedEvent" }
        next_after: { type: integer, format: int64, description: "commit_seq of the last returned event, or after when the page is empty." }
        latest: { type: integer, format: int64, description: "Highest commit_seq of the organization; equal to next_after when caught up." }
    AuditEventPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AuditVerificationTrigger:
      type: string
      enum: [nightly, sample, cli]
    AuditVerificationRun:
      type: object
      required: [id, trigger, from_day, to_day, started_at, finished_at, days, objects, ok, problems, event_id]
      properties:
        id: { type: string, format: uuid }
        trigger: { $ref: "#/components/schemas/AuditVerificationTrigger" }
        from_day: { type: string, format: date }
        to_day: { type: string, format: date }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        days: { type: integer }
        objects: { type: integer }
        ok: { type: boolean }
        problems:
          type: array
          items: { type: string }
        event_id:
          type: string
          format: uuid
          description: The audit.chain_verified or audit.chain_verification_failed event of the run.
    AuditVerificationRunPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditVerificationRun" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AuditManifest:
      type: object
      required: [day, sha256, prev_sha256, key_version, object_key, last_verified_at, last_verified_ok]
      properties:
        day: { type: string, format: date }
        sha256: { type: string, description: "SHA-256 of the canonical manifest, hex." }
        prev_sha256: { type: string, nullable: true, description: "SHA-256 of the previous day's manifest, hex; null for the first day." }
        key_version: { type: integer, description: Version of the OpenBao signing key. }
        object_key: { type: string }
        last_verified_at:
          type: string
          format: date-time
          nullable: true
          description: End of the newest verification run covering the day; null when no run covered it.
        last_verified_ok:
          type: boolean
          nullable: true
          description: Result of the newest verification run covering the day; null when no run covered it.
    AuditManifestPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditManifest" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AuditExportStatus:
      type: string
      enum: [pending, running, ready, failed, expired]
    AuditExportCreate:
      type: object
      required: [from_day, to_day, purpose]
      properties:
        from_day: { type: string, format: date }
        to_day: { type: string, format: date }
        purpose: { type: string, minLength: 1, maxLength: 500 }
    AuditEvidenceKey:
      type: object
      required: [key_version, public_key, fingerprint, first_seen_at]
      properties:
        key_version: { type: integer }
        public_key: { type: string, format: byte, description: Base64 of the raw 32-byte ed25519 public key. }
        fingerprint: { type: string, description: Lowercase hex SHA-256 of the raw public key. }
        first_seen_at: { type: string, format: date-time }
    AuditEvidenceKeys:
      type: object
      required: [keys]
      properties:
        keys: { type: array, items: { $ref: "#/components/schemas/AuditEvidenceKey" } }
    AuditExport:
      type: object
      required: [id, status, from_day, to_day, purpose, requested_by, requested_at, ready_at, expires_at, event_count, object_count, size, package_sha256, verify_ok, verify_problems, key_version, error]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AuditExportStatus" }
        from_day: { type: string, format: date }
        to_day: { type: string, format: date }
        purpose: { type: string }
        requested_by:
          allOf:
            - $ref: "#/components/schemas/AuditActor"
          description: The requester; never carries the client address (ip).
        requested_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        event_count: { type: integer, format: int64, nullable: true }
        object_count: { type: integer, nullable: true }
        size: { type: integer, format: int64, nullable: true }
        package_sha256: { type: string, nullable: true, description: Lowercase hex. }
        verify_ok: { type: boolean, nullable: true }
        verify_problems:
          type: array
          items: { type: string }
        key_version: { type: integer, nullable: true }
        error: { type: string, nullable: true }
    AuditExportPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditExport" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AuditIntegrity:
      type: object
      required: [sealed_through, manifests, verification_window_days, last_run, last_success_at, last_failure_at]
      properties:
        sealed_through: { type: string, format: date, nullable: true, description: The last sealed day; null before the first seal. }
        manifests: { type: integer, description: Number of sealed days. }
        verification_window_days: { type: integer, description: Days the nightly run verifies (ending with the last sealable day). }
        last_run:
          allOf:
            - $ref: "#/components/schemas/AuditVerificationRun"
          nullable: true
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
    EnrollmentTokenStatus:
      type: string
      enum: [active, revoked, expired, exhausted]
    EnrollmentToken:
      type: object
      required: [id, name, device_group_id, auto_approve, max_uses, uses, expires_at, revoked_at, created_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        device_group_id: { type: string, format: uuid, nullable: true }
        auto_approve: { type: boolean }
        max_uses: { type: integer }
        uses: { type: integer }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EnrollmentTokenStatus" }
    EnrollmentTokenCreate:
      type: object
      required: [name, expires_at, max_uses, auto_approve]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: At most 30 days ahead. }
        max_uses: { type: integer, minimum: 1, maximum: 1000 }
        device_group_id: { type: string, format: uuid, description: Enrolled devices join this group. }
        auto_approve: { type: boolean, description: Enrolled devices become active without approval. }
    EnrollmentTokenCreated:
      type: object
      required: [token, secret, enrollment_config]
      properties:
        token: { $ref: "#/components/schemas/EnrollmentToken" }
        secret: { type: string, description: "Shown once; distribute it like a password." }
        enrollment_config: { $ref: "#/components/schemas/EnrollmentConfig" }
    EnrollmentConfig:
      type: object
      description: >-
        The document a device needs to enroll; it pins the bundle-signing keys as trust anchor and the
        revocation-signing keys as trust anchor of paddock-revoke. Configurations created before revocation existed
        have no revocation_keys.
      required: [server_url, organization_id, token, bundle_keys]
      properties:
        server_url: { type: string }
        organization_id: { type: string, format: uuid }
        token: { type: string }
        bundle_keys:
          type: array
          items: { $ref: "#/components/schemas/BundleKey" }
        revocation_keys:
          type: array
          description: 'The revocation-signing public keys, e.g. key_id "revocation-signing:v1".'
          items: { $ref: "#/components/schemas/BundleKey" }
    AutoinstallRequest:
      type: object
      required: [enrollment_config, release, hostname, locale, keyboard_layout, timezone]
      additionalProperties: false
      properties:
        enrollment_config: { $ref: "#/components/schemas/EnrollmentConfig" }
        release: { type: string, enum: ["24.04", "26.04"], description: Ubuntu release of the installation medium. }
        hostname: { type: string, maxLength: 63, description: "Host name label: lowercase letters, digits and hyphens." }
        locale: { type: string, maxLength: 32, description: "For example en_US.UTF-8." }
        keyboard_layout: { type: string, maxLength: 8, description: "XKB layout, for example us or de." }
        timezone: { type: string, maxLength: 64, description: "IANA time zone, for example Europe/Berlin." }
    BundleKey:
      type: object
      required: [key_id, public_key]
      properties:
        key_id: { type: string, description: 'e.g. "bundle-signing:v1"' }
        public_key: { type: string, description: Base64 Ed25519 public key. }
    EnrollmentTokenPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EnrollmentToken" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ConfigDocument:
      type: object
      description: >-
        A paddock.v1 document; its schema is api/schema/paddock.v1.json (JSON Schema draft 2020-12, also printed by
        paddockctl schema), which the server validates every document against.
      additionalProperties: true
    ConfigPlan:
      type: object
      required: [changes, created, updated, deleted]
      properties:
        changes:
          type: array
          description: In application order; deletions first.
          items: { $ref: "#/components/schemas/ConfigChange" }
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
        requires_step_up:
          type: array
          items: { type: string }
          description: >-
            Sections the plan changes whose change needs an organization administrator with a fresh step-up for the
            whole apply (plan M13c decision 2; today software_sources). Omitted when empty. An API token's apply of such
            a plan is refused with 403 step_up_required; its dry run shows the plan with this list instead.
    ConfigChange:
      type: object
      required: [section, key, action, fields]
      properties:
        section: { type: string, description: "A section of the document, settings as settings.login and settings.updates." }
        key: { type: string, description: "The natural key of the item; empty for settings." }
        action: { type: string, enum: [create, update, delete] }
        fields:
          type: array
          description: Changed fields; every field for creations and deletions. File content is shown as its SHA-256.
          items: { $ref: "#/components/schemas/ConfigFieldChange" }
    ConfigFieldChange:
      type: object
      required: [name, before, after]
      properties:
        name: { type: string }
        before: { nullable: true, description: Value before; null for creations. }
        after: { nullable: true, description: Value after; null for deletions. }
    ConfigApplyResult:
      type: object
      required: [dry_run, change_set_id, plan, plan_sha256]
      properties:
        dry_run: { type: boolean }
        plan_sha256:
          type: string
          description: Hex SHA-256 of the plan's canonical JSON; send it as expected_plan to apply exactly this plan.
        change_set_id: { type: string, format: uuid, nullable: true, description: Null for dry runs and empty plans. }
        plan: { $ref: "#/components/schemas/ConfigPlan" }
        rollout:
          allOf: [{ $ref: "#/components/schemas/ChangeSetRollout" }]
          nullable: true
          description: The rollout mode of the recorded change set; null for dry runs and empty plans.
        rollout_id: { type: string, format: uuid, nullable: true, description: The rollout a staged change set started. }
    ChangeSetSource:
      type: string
      enum: [session, api_token]
    ChangeSetRollout:
      type: string
      enum: [immediate, staged, urgent]
      description: "immediate: every device receives the change at once. staged: the change set started a rollout. urgent: it would have been staged and skipped the rollout with a reason."
    ChangeSetActor:
      type: object
      required: [type, display]
      properties:
        type: { type: string }
        id: { type: string }
        display: { type: string }
    ChangeSetSummary:
      type: object
      required: [created, updated, deleted, sections]
      properties:
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
        sections:
          type: array
          items: { type: string }
    ChangeSet:
      type: object
      required: [id, applied_at, actor, source, summary, plan, rollout, before_available]
      properties:
        id: { type: string, format: uuid }
        applied_at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/ChangeSetActor" }
        source: { $ref: "#/components/schemas/ChangeSetSource" }
        summary: { $ref: "#/components/schemas/ChangeSetSummary" }
        plan: { $ref: "#/components/schemas/ConfigPlan" }
        rollout: { $ref: "#/components/schemas/ChangeSetRollout" }
        urgent_reason: { type: string, nullable: true, description: Why the change skipped staging; null otherwise. }
        reverts_change_set_id: { type: string, format: uuid, nullable: true, description: The change set this one reverts. }
        reverted_by: { type: string, format: uuid, nullable: true, description: The newest change set that reverts this one. }
        before_available:
          type: boolean
          description: Whether the before-states are stored. False for change sets recorded before they were stored and after they were purged.
        rollout_id: { type: string, format: uuid, nullable: true, description: The rollout this change set started; null unless staged. }
    ChangeSetPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChangeSet" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ConfigRolloutStatus:
      type: string
      enum: [running, halted, completed, reverted]
    ConfigRolloutCounts:
      type: object
      required: [eligible, applied, failed, pending, waiting, awaiting_retry]
      properties:
        eligible: { type: integer, description: Active devices inside the wave the rollout reached. }
        applied: { type: integer, description: Eligible devices whose newest report on a bundle of the rollout applied every staged resource. }
        failed: { type: integer, description: Eligible devices the failure threshold counts (since the start or the last resume). }
        pending: { type: integer, description: "The other eligible devices, those waiting for their maintenance window included." }
        waiting: { type: integer, description: "Pending eligible devices whose staged software change waits for their maintenance window (A10-16)." }
        awaiting_retry:
          type: integer
          description: |
            Eligible devices that hold the rollout until they apply successfully (A10-19): a failure the last resume
            discarded (counted in pending) and, after a resume, a failure since (counted in failed). While it is above
            zero no wave advances and the rollout does not complete by itself.
    ConfigRollout:
      type: object
      required: [id, change_set_id, waves, current_wave_index, wave_started_at, min_wave_minutes, failure_threshold_percent,
        failure_threshold_min, canary_device_group_id, status, halted_reason, started_by, started_at, ended_at, ended_reason, counts]
      properties:
        id: { type: string, format: uuid }
        change_set_id: { type: string, format: uuid }
        waves:
          type: array
          items: { type: integer }
        current_wave_index: { type: integer }
        wave_started_at: { type: string, format: date-time }
        min_wave_minutes: { type: integer }
        failure_threshold_percent: { type: integer }
        failure_threshold_min: { type: integer }
        canary_device_group_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/ConfigRolloutStatus" }
        halted_reason: { type: string, nullable: true }
        started_by: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        ended_reason: { type: string, nullable: true }
        wave_success_threshold_percent: { type: integer, description: The wave success threshold the rollout started with (A10-16). }
        stall_warning_hours: { type: integer, description: The stall warning hours the rollout started with (A10-16). }
        wave_first_applied_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the worker first saw a device that joined in the current wave applied; min_wave_minutes counts from
            here, not from wave_started_at (A10-16). Null while none has; a wave no device joined counts from its start.
        stalled_since:
          type: string
          format: date-time
          nullable: true
          description: "Set while the current wave is stalled and was warned about (config_rollout.stalled): the last time more of its devices applied, or its start or last resume."
        counts:
          description: The counts of the rollout. After a wave action they are all zero when they could not be read once the action had been applied.
          allOf:
            - $ref: "#/components/schemas/ConfigRolloutCounts"
    ConfigRolloutPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigRollout" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ConfigRolloutDetail:
      type: object
      required: [rollout, change_set, staged_resource_ids]
      properties:
        rollout: { $ref: "#/components/schemas/ConfigRollout" }
        change_set: { $ref: "#/components/schemas/ChangeSet" }
        staged_resource_ids:
          type: array
          description: The bundle resource IDs whose failure counts against the rollout (file:<path>, unit:<name>, updates).
          items: { type: string }
    ConfigRolloutDevice:
      type: object
      required: [device_id, hostname, in_wave, bundle_version, carries_rollout, report_outcome, failed_resource_ids, waiting_for_window,
        awaiting_retry]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        in_wave: { type: boolean, description: The device is inside the wave the rollout reached (every device once it completed). }
        bundle_version: { type: integer, format: int64, nullable: true, description: The device's newest bundle; null before its first. }
        carries_rollout: { type: boolean, description: The newest bundle contains the rollout's staged change. }
        report_outcome:
          type: string
          description: |
            The device's newest report on a bundle of the rollout, the one the counts read: applied, rejected,
            report_only (an apply of a report-only device; its plan errors are listed in failed_resource_ids but never
            count) or none (no report on a bundle of the rollout, or a failure received before the rollout's last
            resume, which no longer counts: the device is pending).
        failed_resource_ids:
          type: array
          description: |
            The staged resources that failed in that report and count against the rollout, and the plan errors of a
            report-only device. Failures received before the rollout's last resume no longer count and are not listed;
            the device is pending until it reports again.
          items: { type: string }
        waiting_for_window:
          type: boolean
          description: |
            The device applied the bundle (report_outcome applied) but a staged software change still waits for its
            maintenance window (pending/outside_window). It counts as pending, never as failed, and holds the wave
            while the wave's applied share is below wave_success_threshold_percent (A10-16).
        awaiting_retry:
          type: boolean
          description: |
            The device is inside the wave and holds the rollout until it applies successfully (A10-19): its failure was
            received before the rollout's last resume and it has not reported since (report_outcome none), or the
            rollout was resumed and its newest report is a failure. No wave advances and the rollout does not complete
            by itself while such a device exists.
    ConfigRolloutDevicePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConfigRolloutDevice" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ConfigRolloutHalt:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 500, description: Why the rollout is halted. }
    ApiTokenRole:
      type: string
      enum: [org_admin, org_operator, org_auditor]
    ApiTokenStatus:
      type: string
      enum: [active, expired, revoked]
    ApiToken:
      type: object
      required: [id, name, prefix, role, status, created_by, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: The first 12 characters of the secret (pdk_ and 8). }
        role: { $ref: "#/components/schemas/ApiTokenRole" }
        status: { $ref: "#/components/schemas/ApiTokenStatus" }
        created_by: { $ref: "#/components/schemas/ApiTokenCreator" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Last request made with the token, updated at most once per minute.
        revoked_at: { type: string, format: date-time, nullable: true }
    ApiTokenCreator:
      type: object
      required: [id, display]
      properties:
        id: { type: string, format: uuid }
        display: { type: string }
    ApiTokenCreate:
      type: object
      required: [name, role, expires_at]
      additionalProperties: false
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$' }
        role: { $ref: "#/components/schemas/ApiTokenRole" }
        expires_at: { type: string, format: date-time, description: Between 1 hour and 365 days ahead. }
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret: { type: string, description: "Shown once; keep it like a password." }
    ApiTokenPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DeviceContact:
      type: string
      enum: [never, ok, unseen, stale_warning, stale_critical, presumed_lost]
      description: >-
        Derived like the attention conditions stale_warning, stale_critical and presumed_lost; never = no check-in yet;
        unseen = no check-in for more than 15 minutes, below the staleness warning threshold; ok otherwise (a check-in
        within the last 15 minutes). Devices that are not active report ok or never.
    DeviceState:
      type: string
      enum: [pending, active, rejected, quarantined, retired]
    Device:
      type: object
      required: [id, hostname, name, name_state, state, hardware_uuid, machine_id, os_release, enrollment_token_id,
                 enrolled_at, state_changed_at, bundle_version, last_contact_at, applied_bundle_version, agent_version,
                 contact, owners, hardware, components, components_outdated, enrollment_method, config_mode,
                 config_mode_changed_at]
      properties:
        id: { type: string, format: uuid }
        hostname:
          type: string
          description: The hostname the device reported at its last check-in (at enrollment until then).
        name:
          type: string
          nullable: true
          description: The managed name the device applies as its hostname (ADR 0041); null when not managed.
        name_state:
          type: string
          enum: [unmanaged, pending, applied]
          description: unmanaged when name is null, applied when the reported hostname equals name, pending otherwise.
        state: { $ref: "#/components/schemas/DeviceState" }
        contact: { $ref: "#/components/schemas/DeviceContact" }
        hardware_uuid: { type: string, nullable: true }
        machine_id: { type: string, nullable: true }
        os_release:
          type: object
          additionalProperties: { type: string }
        enrollment_token_id: { type: string, format: uuid, nullable: true }
        enrolled_at: { type: string, format: date-time }
        state_changed_at: { type: string, format: date-time }
        bundle_version: { type: integer, format: int64, description: Latest compiled bundle version (0 = none). }
        last_contact_at: { type: string, format: date-time, nullable: true }
        applied_bundle_version: { type: integer, format: int64, nullable: true }
        agent_version: { type: string, nullable: true }
        disk_state: { $ref: "#/components/schemas/DiskState" }
        owners:
          type: array
          description: The users responsible for the device, sorted by username (plan M8d decision 2). No login or sudo rights.
          items: { $ref: "#/components/schemas/UserRef" }
        agent_update_requested_version:
          type: string
          nullable: true
          description: The release an administrator asked the device to install now (plan M8d decision 26); null without an open request.
        agent_update_requested_at: { type: string, format: date-time, nullable: true }
        hardware:
          description: The hardware facts of the inventory (plan M8d decision 8); null while the inventory has no row for the device.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeviceHardware"
        uninstall:
          description: >-
            The uninstall of the device (plan M8d decision 42): set from the request until it is cancelled, also after
            the device reported the removal; null without one. Filled on the device detail and the responses of device
            actions; null in lists.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeviceUninstall"
        disk_conversion:
          description: >-
            The latest in-place encryption of the device (plan M8e decision 10); null without one. Filled on the device
            detail and the responses of device actions; null in lists.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeviceDiskConversion"
        retired_reason:
          type: string
          nullable: true
          description: Why the device was retired, when not by an administrator; uninstalled after its removal report.
        components:
          type: array
          description: >-
            The components of the device with the installed and expected version (plan M8d decision 55), in the order
            paddockd, paddock_supervisor, paddock_revoke, himmelblau, fleetd. Filled on the device detail and the
            responses of device actions; empty in lists.
          items: { $ref: "#/components/schemas/DeviceComponent" }
        components_outdated:
          type: array
          description: The components older than their target at the last heartbeat (the list column and filter).
          items: { type: string }
        enrollment_method: { $ref: "#/components/schemas/EnrollmentMethod" }
        config_mode: { $ref: "#/components/schemas/ConfigMode" }
        config_mode_changed_at:
          type: string
          format: date-time
          nullable: true
          description: When enforcement was enabled; null while the mode is the one the device enrolled with.
    EnrollmentMethod:
      type: string
      enum: [autoinstall, adopted, unknown]
      description: |
        How the device was enrolled, as the agent asserted it (plan M11 decision 40): autoinstall by the Paddock
        autoinstall, adopted by enrolling an installed system, unknown when the agent sent none.
    ConfigMode:
      type: string
      enum: [enforce, report_only]
      description: |
        enforce applies the configuration; report_only (an adopted device until an administrator enables enforcement)
        only reports what it would change.
    DeviceEnforce:
      type: object
      required: [hostname]
      additionalProperties: false
      properties:
        hostname:
          type: string
          maxLength: 253
          description: The device's hostname, typed by the administrator as confirmation.
    DeviceComponent:
      type: object
      required: [name, installed, expected, status]
      properties:
        name: { type: string, enum: [paddockd, paddock_supervisor, paddock_revoke, himmelblau, fleetd] }
        installed: { type: string, description: The installed version; empty when not installed or not reported. }
        expected: { type: string, nullable: true, description: The target version; null without a target. }
        status:
          type: string
          enum: [ok, outdated, missing, unknown]
          description: unknown when the agent reported no components (agents before this release).
    ComponentTarget:
      type: object
      required: [component, version, source, updated_at]
      properties:
        component: { type: string, enum: [paddockd, paddock_supervisor, paddock_revoke, himmelblau, fleetd] }
        version: { type: string }
        source: { type: string, description: "agent_release (the current release) or PADDOCK_HIMMELBLAU_VERSION (the compiler's setting)." }
        updated_at: { type: string, format: date-time }
    UpgradeCheck:
      type: object
      required: [generated_at, target_version, window, items, agents_outside]
      properties:
        generated_at: { type: string, format: date-time }
        target_version: { type: string }
        window:
          type: array
          description: The releases whose agents target_version supports, oldest first (its own and the two previous).
          items: { type: string }
        items:
          type: array
          description: "In this order: migrations, agents, backups, openbao, pending, sessions."
          items: { $ref: "#/components/schemas/UpgradeCheckItem" }
        agents_outside:
          type: array
          description: The active devices whose agent is outside the window, at most 100; the agents item counts all.
          items: { $ref: "#/components/schemas/UpgradeCheckAgent" }
    UpgradeCheckItem:
      type: object
      required: [name, status, detail]
      properties:
        name: { type: string, enum: [migrations, agents, backups, openbao, pending, sessions] }
        status: { type: string, enum: [PASS, WARN, FAIL, INFO] }
        detail: { type: string }
    UpgradeCheckAgent:
      type: object
      required: [device_id, hostname, agent_version]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        agent_version: { type: string }
    DeviceUninstall:
      type: object
      required: [mode, requested_at, command_id, command_status, uninstalled_at, local_admin, tpm, report_overdue, refused_reason]
      properties:
        mode: { type: string, enum: [leave, reset] }
        requested_at: { type: string, format: date-time }
        command_id: { type: string, format: uuid }
        report_overdue:
          type: boolean
          description: >-
            The device received the command more than 24 hours ago and no removal report arrived; the request can be
            cancelled or made again.
        command_status: { type: string, description: "The status of the command uninstall: pending, delivered, succeeded, failed or expired." }
        uninstalled_at: { type: string, format: date-time, nullable: true, description: When the device reported the removal. }
        local_admin: { type: string, nullable: true, description: "From the removal report: removed, kept or kept_last_admin." }
        tpm: { type: string, nullable: true, description: "From the removal report: cleared, requested_at_next_boot, skipped_in_use, not_requested or failed." }
        refused_reason:
          type: string
          nullable: true
          description: >-
            Why the device refused the command (command_status failed): conversion_pending or revocation_pending, which
            clear up, so the request stays open until an administrator cancels it or requests it again. A refusal with
            invalid_params ends the request. Null when the device did not refuse.
    DeviceUninstallRequest:
      type: object
      additionalProperties: false
      required: [mode, confirm_hostname, reason]
      properties:
        mode: { type: string, enum: [leave, reset] }
        confirm_hostname: { type: string, description: Must equal the device's hostname. }
        reason: { type: string, minLength: 2, maxLength: 500 }
        clear_tpm: { type: boolean, default: false, description: Mode reset only. }
        keep_local_admin: { type: boolean, default: false, description: Mode reset only. }
    DeviceDiskConversion:
      type: object
      description: >-
        An in-place encryption of the device's root volume (ADR 0039, plan M8e decision 10). done_bytes, eta_s and
        progress_at come from the last check-in while the phase is encrypting and are null otherwise. paused_reason and
        paused_since, cleanup_error and the initrd issue come from the last check-in where the phase has them (plan M8e
        amendment 2026-10-21, items 17 to 19) and are absent otherwise.
      required: [id, phase, requested_at, reason, command_id, command_status, layout, luks_uuid, data_bytes, done_bytes,
                 eta_s, paused_reason, progress_at, failure_stage, failure_reason, finished_at, abort_command_id,
                 abort_command_status, abort_refused_reason, active]
      properties:
        id: { type: string, format: uuid }
        phase:
          type: string
          enum: [requested, prepared, encrypting, completed, failed, cancelled]
          description: >-
            requested: the command is issued; prepared: the recovery key is escrowed and the device waits for a restart;
            encrypting: the device converted at the restart and encrypts the rest in the background; cancelled: the
            command was withdrawn before delivery or the device aborted before its restart.
        requested_at: { type: string, format: date-time }
        reason: { type: string }
        command_id: { type: string, format: uuid }
        command_status: { type: string, description: "The status of the command encrypt_disk: pending, delivered, succeeded, failed, expired or cancelled." }
        layout: { type: string, nullable: true, enum: [lvm, plain] }
        luks_uuid: { type: string, format: uuid, nullable: true, description: The LUKS UUID of the root volume's header. }
        data_bytes: { type: integer, format: int64, nullable: true, description: Bytes to encrypt. }
        done_bytes: { type: integer, format: int64, nullable: true }
        eta_s: { type: integer, format: int64, nullable: true }
        paused_reason:
          type: string
          nullable: true
          description: >-
            Why the device waits: on_battery or helper_not_running while encrypting; packages_busy while the phase is
            requested and the device prepares (a package run holds dpkg's locks).
        paused_since: { type: string, format: date-time, description: "When the wait began; packages_busy only." }
        progress_at: { type: string, format: date-time, nullable: true, description: When the device measured the progress. }
        cleanup_error:
          type: string
          description: >-
            Why the device's last attempt to clean up after a failure or a cancel did not finish, while the cleanup is
            pending (phases failed and cancelled). Diagnostic text, not a code and not localized: the first line of the
            device's error without control characters, at most 200 characters.
        initrd_issue:
          type: string
          description: >-
            Why the device's initrd work for the conversion cannot go on: boot_space_low, no_bootable_kernel,
            kernel_not_buildable, orphan_initrd_removed, key_material_hardlinked or key_material_shared_bootable.
        initrd_issue_kernel: { type: string, description: "The kernel version of kernel_not_buildable or key_material_shared_bootable." }
        boot_space_needed: { type: integer, format: int64, description: "Bytes needed in /boot; boot_space_low only." }
        boot_space_free: { type: integer, format: int64, description: "Bytes free in /boot; boot_space_low only." }
        failure_stage: { type: string, nullable: true, description: "preflight, prepare, init or resume." }
        failure_reason: { type: string, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        abort_command_id: { type: string, format: uuid, nullable: true, description: The command encrypt_disk_abort of a cancel after delivery. }
        abort_command_status: { type: string, nullable: true }
        abort_refused_reason:
          type: string
          nullable: true
          description: "The device refused the abort: invalid_params, unknown_conversion or not_abortable."
        active:
          type: boolean
          description: >-
            The device's in-place encryption is active (plan M8e §14.5 decision 36, amendment 2026-10-21): this
            conversion is requested, prepared or encrypting; the last health reports the disk encrypting; the last
            health reports key_on_boot (the conversion key is still in the initrd), whatever the conversions say; or,
            fail safe, a conversion completed less than 30 days ago and the last health carries no conversion
            report and is not compliant. Paddock cannot be removed while it is active.
    DeviceEncryptRequest:
      type: object
      additionalProperties: false
      required: [confirm_hostname, reason, backup_confirmed]
      properties:
        confirm_hostname: { type: string, description: Must equal the device's hostname. }
        reason: { type: string, minLength: 2, maxLength: 500 }
        backup_confirmed: { type: boolean, description: The administrator confirms that the device's data is backed up; must be true. }
    DeviceEncryptCancelRequest:
      type: object
      additionalProperties: false
      required: [confirm_hostname]
      properties:
        confirm_hostname: { type: string, description: Must equal the device's hostname. }
    DiskConversionHealth:
      type: object
      description: >-
        The in-place encryption as the device's last check-in reports it (health.disk.conversion, plan M8e decisions
        3, 34 and 52): the eligibility of an unencrypted disk and, from the preparation on, the phase and the progress.
      required: [eligible]
      properties:
        eligible: { type: boolean }
        reasons:
          type: array
          description: Why the disk cannot be encrypted in place, sorted (e.g. no_separate_boot, root_not_ext4, cleanup_pending).
          items: { type: string }
        release: { type: string, description: VERSION_ID of /etc/os-release. }
        layout: { type: string, description: lvm or plain. }
        phase: { type: string, description: "prepared, encrypting, completed or failed." }
        data_bytes: { type: integer, format: int64 }
        done_bytes: { type: integer, format: int64 }
        eta_s: { type: integer, format: int64 }
        paused_reason: { type: string, description: "on_battery or helper_not_running." }
        failure_stage: { type: string }
        failure_reason: { type: string }
        updated_at: { type: string, format: date-time }
        initramfs: { type: string, enum: [dracut, initramfs-tools], description: The installed initramfs generator. }
        initramfs_removes:
          type: array
          description: The packages the switch to dracut would remove, sorted; only while initramfs is initramfs-tools.
          items: { type: string }
        key_on_boot:
          type: boolean
          description: The conversion key lies in the initrd on the unencrypted /boot until the user chose the boot PIN.
        enrollment_deferred:
          type: string
          enum: [reencrypt, reencrypt_after_completed]
          description: >-
            reencrypt while encrypting: the header is marked for the reencryption and no TPM keyslot exists, so the boot
            PIN or the TPM unlock is set up at the first start after the completion (plan M8e amendment 2026-10-22,
            item 22). reencrypt_after_completed: the header is still marked after the completion, so the enrollment
            cannot run (stop condition S15; see the device's log).
    DeviceHardware:
      type: object
      description: >-
        Asset facts the inventory reports (ADR 0037 decision 7); empty strings and zeros where it reports none. Free disk
        space, uptime and network addresses stay in Fleet.
      required: [vendor, model, serial, cpu_brand, cpu_cores, memory_bytes, disk_total_bytes]
      properties:
        vendor: { type: string }
        model: { type: string }
        serial: { type: string }
        cpu_brand: { type: string }
        cpu_cores: { type: integer, description: Physical cores. }
        memory_bytes: { type: integer, format: int64 }
        disk_total_bytes: { type: integer, format: int64 }
    DeviceGroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    DeviceIdentityKey:
      type: object
      required: [key_id, key_protection, status, created_at]
      properties:
        key_id: { type: string, description: Hex SHA-256 of the public key. }
        key_protection: { type: string, enum: [tpm, file] }
        status: { type: string, enum: [active, revoked] }
        created_at: { type: string, format: date-time }
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          required: [groups, identity_keys, logins_suspended, login_assignment, schema_versions, login_management, login_status, sudo_flavor, presumed_self_locked_at, presumed_lost_at, config_status]
          properties:
            groups:
              type: array
              items: { $ref: "#/components/schemas/DeviceGroupRef" }
            identity_keys:
              type: array
              items: { $ref: "#/components/schemas/DeviceIdentityKey" }
            logins_suspended: { type: boolean }
            login_assignment: { $ref: "#/components/schemas/DeviceLoginAssignment" }
            schema_versions:
              type: array
              description: Bundle schema versions the agent reported in its last check-in.
              items: { type: integer }
            login_management:
              type: boolean
              description: The agent supports bundle schema 2 (login and sudo); false means "agent too old for login management".
            login_status: { $ref: "#/components/schemas/DeviceLoginStatus" }
            sudo_flavor:
              type: string
              enum: [classic, sudo-rs]
              nullable: true
              description: The device's sudo implementation as its agent reported it last; null until reported. sudo-rs ignores the custom lecture text.
            presumed_self_locked_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Since when the device is presumed to have locked itself: it has been silent for longer than the
                organization's dead man's switch period while the switch is on (plan M4c decision 17); null otherwise.
            config_status: { $ref: "#/components/schemas/DeviceConfigStatusCounts" }
            presumed_lost_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Since when the device is presumed lost: it has been silent for longer than the organization's critical
                staleness threshold (plan M5b decision 10); null otherwise, cleared by its next contact.
    ResourceState:
      type: string
      enum: [applied, failed, pending, drift_corrected]
      description: |
        The apply status of one resource on one device: applied; failed (the message says why); pending (a report-only
        apply would change it, changes lists what); drift_corrected (the agent corrected a local change).
    DeviceResourceStatus:
      type: object
      required: [resource_id, type, status, message, changes, bundle_version, occurred_at, report_mode]
      properties:
        resource_id: { type: string, description: "Resource ID such as file:/etc/foo.conf, unit:foo.service or time." }
        type: { type: string, description: "The part of the ID before the colon (file, unit), else the whole ID." }
        status: { $ref: "#/components/schemas/ResourceState" }
        message: { type: string, description: The reason of a failure; empty otherwise. }
        changes:
          type: array
          description: What a report-only apply would change (status pending); empty otherwise.
          items: { type: string }
        bundle_version: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time, description: When the agent reported it. }
        report_mode:
          allOf: [ { $ref: "#/components/schemas/ConfigMode" } ]
          description: |
            The mode of the report that wrote the row (plan M11 amendment R6.15); enforce when no report of that version
            is stored. A failed row of a report_only report is a plan error, never a failed apply (R6.6), also after
            enforcement until an enforced report replaces it.
    DeviceResourceStatusPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceResourceStatus" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DeviceBundleReport:
      type: object
      required: [outcome, mode, changed, error_count, reason, occurred_at]
      properties:
        outcome: { type: string, enum: [applied, rejected] }
        mode:
          type: string
          enum: [enforce, report_only]
          description: >-
            Mode of the apply. A rejection carries no mode: it shows the mode of the device's applied report of the
            highest lower version, enforce when there is none.
        changed: { type: integer, description: Resources the apply changed. }
        error_count: { type: integer, description: Errors the apply reported. }
        reason: { type: string, nullable: true, description: Why the device rejected the bundle. }
        occurred_at: { type: string, format: date-time }
    DeviceBundle:
      type: object
      required: [version, created_at, schema_version, config_rollout_id, report]
      properties:
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        schema_version: { type: integer }
        config_rollout_id: { type: string, format: uuid, nullable: true, description: The configuration rollout whose staged change the version carries; null otherwise. }
        report:
          nullable: true
          description: What the device reported about the version; null until it reported.
          allOf:
            - $ref: "#/components/schemas/DeviceBundleReport"
    DeviceBundlePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceBundle" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ResourceStatus:
      type: object
      required: [resource_id, type, applied, failed, pending, drift_corrected, last_failure_at]
      description: |
        One resource ID with the number of active devices per status. A failed resource written by a report-only
        report is a plan error, not a failed apply (plan M11 amendments R6.6, R6.15): it is counted in no status here,
        the status filter failed does not select it, and the device's apply status shows it (report_mode).
      properties:
        resource_id: { type: string }
        type: { type: string }
        applied: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        drift_corrected: { type: integer }
        last_failure_at: { type: string, format: date-time, nullable: true }
    ResourceStatusPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResourceStatus" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DeviceConfigStatusCounts:
      type: object
      description: >-
        The device's resources per apply status; zeros until the agent reported. failed counts failed applies only,
        plan_errors the failed resources of report-only reports (plan M11 amendment R6.15).
      required: [applied, failed, pending, drift_corrected, plan_errors]
      properties:
        applied: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        drift_corrected: { type: integer }
        plan_errors: { type: integer }
    DeviceLoginStatus:
      type: object
      description: The latest login.* and sudo.* report of the device's agent (plan M3b decision 17).
      required: [login, sudo]
      properties:
        login:
          description: Latest login.applied or login.apply_failed; null until the agent reported one.
          allOf:
            - $ref: "#/components/schemas/DeviceReport"
          nullable: true
        sudo:
          description: Latest sudo.apply_failed or sudo.user_unresolved; null until the agent reported one.
          allOf:
            - $ref: "#/components/schemas/DeviceReport"
          nullable: true
    DeviceReport:
      type: object
      required: [type, occurred_at, params]
      properties:
        type: { type: string, description: "Device event type, e.g. login.apply_failed." }
        occurred_at: { type: string, format: date-time }
        params:
          type: object
          additionalProperties: true
          description: The parameters of the event as recorded in the audit log (device.<type>).
    LocalAdmin:
      type: object
      required: [username, active_generation, pending_generation, last_rotated_at, next_rotation_at, last_rotation_error]
      properties:
        username: { type: string }
        active_generation: { type: integer, nullable: true }
        pending_generation: { type: integer, nullable: true, description: "Stored by the server, not yet applied by the device." }
        last_rotated_at: { type: string, format: date-time, nullable: true }
        next_rotation_at:
          type: string
          format: date-time
          nullable: true
          description: When the device rotates next; earlier means overdue (the device rotates only while it reaches the server).
        last_rotation_error:
          type: object
          nullable: true
          required: [reason, generation, at]
          properties:
            reason: { type: string, enum: [escrow_failed, escrow_timeout, apply_failed] }
            generation: { type: integer }
            at: { type: string, format: date-time }
    DiskState:
      type: string
      description: |
        Disk encryption of a device (plan M4b decision 8): not_encrypted (root not on LUKS), encrypting (an in-place
        encryption is unfinished, plan M8e), unmanaged (not installed with the Paddock autoinstall), tpm_missing, tpm_pin_missing (boot PIN skipped), unlock_mode_mismatch (enrolled
        for the other unlock mode than the device's policy, plan M8d decision 48), escrow_pending (recovery key, a
        header or keyslot set not yet as required), compliant (the TPM keyslot of the unlock mode and the recovery key
        only, escrowed with the current header of every LUKS volume, PDK-009).
      enum: [not_encrypted, encrypting, unmanaged, tpm_missing, tpm_pin_missing, unlock_mode_mismatch, escrow_pending,
             compliant]
    DiskEscrow:
      type: object
      required: [generation, status, created_at]
      properties:
        generation: { type: integer }
        status: { type: string, enum: [pending, stored, failed] }
        size: { type: integer, format: int64, description: "Headers: bytes of the sealed object." }
        volume:
          type: string
          format: uuid
          description: "Headers: the LUKS UUID of the volume (PDK-009). Absent on a root volume header escrowed before PDK-009 until the device reports its root volume's UUID."
        created_at: { type: string, format: date-time }
    DiskVolume:
      type: object
      required: [device, root, keyslots, tokens, escrowed]
      description: A LUKS volume of the device as its last check-in reports it (PDK-009 decision 4).
      properties:
        uuid: { type: string, description: LUKS UUID; absent when the device could not read it. }
        device: { type: string, description: "The device or detached header file, e.g. /dev/sdb1." }
        root: { type: boolean }
        luks_version: { type: integer }
        tokens: { type: array, items: { type: string }, description: "Kind of every keyslot, sorted." }
        keyslots: { type: integer }
        escrowed: { type: boolean, description: A header of the current keyslots is stored. }
        header_generation: { type: integer, description: The newest stored header generation of the volume. }
        shared_uuid: { type: boolean, description: "Another volume or the root volume has the same LUKS UUID (a cloned header): not escrowed; a Destroy erases it, a Lock does not." }
        refused: { type: boolean, description: "The server refused the header: the device escrows the most volumes a revocation token carries (32)." }
    DiskEncryption:
      type: object
      required: [state, tokens, keyslots, recovery_keys, headers, volumes, unresolved]
      properties:
        state:
          allOf: [{ $ref: "#/components/schemas/DiskState" }]
          nullable: true
          description: Null until the device reports its disk.
        luks_version: { type: integer }
        tokens:
          type: array
          description: Kind of every keyslot, sorted (tpm2+pin, tpm2, recovery, password, or another token type).
          items: { type: string }
        keyslots: { type: integer }
        unlock_mode:
          description: The unlock mode the agent applied (plan M8d decision 48); absent from agents before it.
          allOf:
            - $ref: "#/components/schemas/DiskUnlockMode"
        boot_separate:
          type: boolean
          description: In state not_encrypted only, whether /boot is a file system of its own (ADR 0038).
        conversion:
          description: The in-place encryption the last check-in reports (plan M8e decision 3); absent from older agents.
          allOf:
            - $ref: "#/components/schemas/DiskConversionHealth"
        disk_conversion:
          description: The latest in-place encryption of the device, as on the device (plan M8e decision 10); null without one.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeviceDiskConversion"
        reported_at: { type: string, format: date-time, description: Check-in the state is from. }
        recovery_keys:
          type: array
          items: { $ref: "#/components/schemas/DiskEscrow" }
        headers:
          type: array
          description: Header generations of every volume, newest first; volume tells them apart.
          items: { $ref: "#/components/schemas/DiskEscrow" }
        volumes:
          type: array
          description: Every LUKS volume of the device, the root volume first (empty until the device reports them).
          items: { $ref: "#/components/schemas/DiskVolume" }
        unresolved:
          type: array
          description: /etc/crypttab entries the device could not classify; they are not escrowed.
          items: { type: string }
        last_keyslot_change:
          type: object
          required: [at, before, after]
          properties:
            at: { type: string, format: date-time }
            before: { type: array, items: { type: string } }
            after: { type: array, items: { type: string } }
    DiskRecoveryKey:
      type: object
      required: [generation, recovery_key]
      properties:
        generation: { type: integer }
        recovery_key: { type: string }
    DiskHeaderRequest:
      type: object
      required: [confirm_hostname]
      additionalProperties: false
      properties:
        confirm_hostname: { type: string, maxLength: 253 }
        generation: { type: integer, minimum: 1, description: Header generation; the newest stored one if absent. }
        volume: { type: string, format: uuid, description: "LUKS UUID of the volume (PDK-009); the root volume if absent." }
    LocalAdminRevealRequest:
      type: object
      required: [confirm_hostname]
      additionalProperties: false
      properties:
        confirm_hostname: { type: string, maxLength: 253 }
    LocalAdminRevealed:
      type: object
      required: [passwords]
      properties:
        passwords:
          type: array
          items:
            type: object
            required: [generation, state, password]
            properties:
              generation: { type: integer }
              state: { type: string, enum: [active, pending] }
              password: { type: string }
    DeviceCommandStatus:
      type: string
      enum: [pending, delivered, succeeded, failed, expired, cancelled]
    DeviceCommandType:
      type: string
      enum: [rotate_admin_password, delete_self_lock, install_now, uninstall, encrypt_disk, encrypt_disk_abort, collect_status]
    DeviceCommand:
      type: object
      required: [id, device_id, type, status, issued_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DeviceCommandType" }
        status: { $ref: "#/components/schemas/DeviceCommandStatus" }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        not_before: { type: string, format: date-time, description: Delivered to the device only from then on. }
        delivered_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        params:
          type: object
          additionalProperties: true
          description: >-
            The params the signed command carries, e.g. the conversion_id of encrypt_disk and encrypt_disk_abort (plan
            M8e gate A1). Command params never carry secrets: a command that needs one references it (for example an
            escrow generation) and never embeds it.
        result:
          type: object
          additionalProperties: true
          description: Outcome details reported by the device.
    DMSSettingsUpdate:
      type: object
      required: [enabled, period_days, warn_days]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        period_days:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            Days of uptime without a time ticket after which a device locks itself: at least 7 (400 invalid_request
            below), at least 1 in development installations (hardware acceptance protocol, plan M4c §7).
        warn_days:
          type: array
          maxItems: 5
          items: { type: integer, minimum: 1 }
    McpSettings:
      type: object
      required: [enabled, write_enabled, mode, allowed_operations, updated_at, updated_by]
      properties:
        enabled: { type: boolean, description: Whether MCP sessions of this scope may call any tool. }
        write_enabled: { type: boolean, description: Whether MCP sessions of this scope may change data. }
        mode:
          type: string
          enum: [all, selected]
          description: all allows every exposed tool of the scope; selected only the tools in allowed_operations.
        allowed_operations:
          type: array
          items: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
    McpSettingsInput:
      type: object
      required: [enabled, write_enabled, mode, allowed_operations]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        write_enabled: { type: boolean }
        mode: { type: string, enum: [all, selected] }
        allowed_operations:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, maxLength: 100 }
    McpCatalog:
      type: object
      required: [version, tools]
      properties:
        version: { type: string, description: SHA-256 of the generated catalog; changes with every contract change. }
        tools:
          type: array
          items: { $ref: "#/components/schemas/McpTool" }
    McpTool:
      type: object
      required: [operation_id, method, path, tag, scope, class, step_up, destructive, exposed, summary]
      properties:
        operation_id: { type: string }
        method: { type: string }
        path: { type: string }
        tag: { type: string }
        scope: { type: string, enum: [organization, platform, any] }
        class: { type: string, enum: [read, write] }
        step_up: { type: boolean }
        destructive: { type: boolean }
        exposed: { type: boolean, description: Whether the MCP offers the operation as a tool at all. }
        summary: { type: string }
    McpAccess:
      type: object
      required: [scope, channel, enabled, write_enabled, write_opted_in, write_effective, allowed_operations, catalog_version]
      properties:
        scope: { type: string, enum: [organization, platform] }
        channel: { type: string, enum: [portal, api, mcp] }
        enabled: { type: boolean }
        write_enabled: { type: boolean }
        write_opted_in: { type: boolean, description: Whether the caller's account opted in to MCP write access. }
        write_effective: { type: boolean, description: enabled and write_enabled and write_opted_in. }
        allowed_operations:
          type: array
          items: { type: string }
        catalog_version: { type: string }
    ManagedFileSettings:
      type: object
      required: [operator_roots]
      properties:
        operator_roots:
          type: array
          items: { type: string }
        updated_at: { type: string, format: date-time }
    ManagedFileSettingsUpdate:
      type: object
      required: [operator_roots]
      additionalProperties: false
      properties:
        operator_roots:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 1024 }
    WatchedUnits:
      type: object
      required: [units, updated_at]
      properties:
        units:
          type: array
          items: { type: string }
        updated_at: { type: string, format: date-time, nullable: true }
    WatchedUnitsUpdate:
      type: object
      required: [units]
      additionalProperties: false
      properties:
        units:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 255 }
    DMSSettings:
      type: object
      required: [enabled, period_days, warn_days]
      properties:
        enabled: { type: boolean }
        period_days: { type: integer }
        warn_days:
          type: array
          items: { type: integer }
        updated_at: { type: string, format: date-time }
    UpdateSettingsUpdate:
      type: object
      required: [security_daily_at, regular_schedule, regular_updates_enabled, max_random_delay_min, staleness_warning_h, staleness_critical_h]
      additionalProperties: false
      properties:
        security_daily_at: { type: string, maxLength: 5, description: "HH:MM, local device time." }
        regular_schedule: { type: string, maxLength: 64, description: "e.g. \"Sat 04:00\", \"Mon,Thu 12:30\", \"02:00\" (every day)." }
        regular_updates_enabled: { type: boolean }
        max_random_delay_min: { type: integer }
        staleness_warning_h: { type: integer }
        staleness_critical_h: { type: integer }
        agent_update_policy:
          description: Agent update policy (ADR 0037 decision 1); absent keeps the stored policy. Device groups can override it.
          allOf:
            - $ref: "#/components/schemas/AgentUpdatePolicy"
    RolloutSettings:
      type: object
      required: [enabled, waves, min_wave_minutes, failure_threshold_percent, failure_threshold_min, canary_device_group_id]
      properties:
        enabled: { type: boolean, description: Staged configuration rollouts are off by default. }
        waves:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 100 }
        min_wave_minutes: { type: integer, minimum: 1 }
        failure_threshold_percent: { type: integer, minimum: 0, maximum: 100 }
        failure_threshold_min: { type: integer, minimum: 0 }
        canary_device_group_id: { type: string, format: uuid, nullable: true, description: Devices of this group always go first; null = none. }
        wave_success_threshold_percent:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Default 90 (architect decision A10-16). A wave advances only once min_wave_minutes passed since the first
            device that joined in the wave applied, and once this share of those devices applied (with success or
            failure) or none of them still waits for its maintenance window.
        stall_warning_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: Default 24. A wave whose devices apply nothing for this long is warned about once (audit event config_rollout.stalled); the warning forces nothing.
        updated_at: { type: string, format: date-time }
    RolloutSettingsUpdate:
      type: object
      required: [enabled, waves, min_wave_minutes, failure_threshold_percent, failure_threshold_min]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        waves:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 100 }
          description: Strictly increasing, ending with 100.
        min_wave_minutes: { type: integer, description: "At least 15 (1 in a development stack)." }
        failure_threshold_percent: { type: integer, minimum: 0, maximum: 100 }
        failure_threshold_min: { type: integer, minimum: 0 }
        canary_device_group_id: { type: string, format: uuid, nullable: true, description: Omit or null for none. }
        wave_success_threshold_percent: { type: integer, minimum: 1, maximum: 100, description: "1 to 100; absent keeps the stored value (default 90)." }
        stall_warning_hours: { type: integer, minimum: 1, maximum: 720, description: "1 to 720; absent keeps the stored value (default 24)." }
    PrivacySettings:
      type: object
      required: [retired_inventory_days, audit_search_recorded, inventory_view_recorded, updated_at]
      properties:
        retired_inventory_days: { type: integer, minimum: 1, maximum: 365 }
        audit_search_recorded: { type: boolean }
        inventory_view_recorded: { type: boolean }
        updated_at: { type: string, format: date-time }
    PrivacySettingsUpdate:
      type: object
      required: [retired_inventory_days, audit_search_recorded, inventory_view_recorded]
      properties:
        retired_inventory_days: { type: integer, minimum: 1, maximum: 365 }
        audit_search_recorded: { type: boolean }
        inventory_view_recorded: { type: boolean }
    UpdateSettings:
      type: object
      required: [security_daily_at, regular_schedule, regular_updates_enabled, max_random_delay_min, staleness_warning_h, staleness_critical_h,
                 agent_update_policy]
      properties:
        security_daily_at: { type: string }
        regular_schedule: { type: string }
        regular_updates_enabled: { type: boolean }
        max_random_delay_min: { type: integer }
        staleness_warning_h: { type: integer }
        staleness_critical_h: { type: integer }
        agent_update_policy: { $ref: "#/components/schemas/AgentUpdatePolicy" }
        updated_at: { type: string, format: date-time }
    PackageHold:
      type: object
      required: [id, device_group_id, package, version, reason, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        device_group_id: { type: string, format: uuid, nullable: true, description: null = every device. }
        package: { type: string }
        version: { type: string, nullable: true, description: null = the installed version is kept. }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PackageHoldCreate:
      type: object
      required: [package]
      additionalProperties: false
      properties:
        device_group_id: { type: string, format: uuid, description: Omit for every device of the organization. }
        package: { type: string, maxLength: 128, description: "^[a-z0-9][a-z0-9+.-]+$" }
        version: { type: string, maxLength: 128, nullable: true, description: "^[A-Za-z0-9.+:~-]+$; omit or null to keep the installed version." }
        reason: { type: string, maxLength: 500 }
    PackageHoldUpdate:
      type: object
      required: [version, reason]
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 128, nullable: true, description: null keeps the installed version. }
        reason: { type: string, maxLength: 500 }
    PackageHoldPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PackageHold" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    SoftwareArchitecture:
      type: string
      enum: [amd64, arm64]
    SoftwareSourceKind:
      type: string
      enum: [apt, flatpak]
      description: "apt: an APT repository; flatpak: a Flatpak remote with exactly one URI and no suites, components or architectures. Immutable."
    SoftwareSourceSummary:
      type: object
      required: [id, kind, slug, name, uris, suites, components, architectures, fingerprint, weak_key, entry_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SoftwareSourceKind" }
        slug: { type: string, description: Immutable; names the source file and keyring on the devices. }
        name: { type: string }
        uris: { type: array, items: { type: string } }
        suites: { type: array, items: { type: string } }
        components: { type: array, items: { type: string } }
        architectures: { type: array, items: { $ref: "#/components/schemas/SoftwareArchitecture" }, description: Empty = every architecture. }
        fingerprint: { type: string, description: "The signing key's v4 fingerprint, 40 uppercase hexadecimal characters." }
        weak_key: { type: boolean, description: "The key or a subkey is RSA of 2048 to 3071 bits: accepted, acceptable until 2030." }
        entry_count: { type: integer, minimum: 0, description: The number of catalog entries that use this source. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SoftwareSource:
      allOf:
        - $ref: "#/components/schemas/SoftwareSourceSummary"
        - type: object
          required: [signing_key]
          properties:
            signing_key: { type: string, description: "The ASCII-armored OpenPGP public key as stored, re-armored without armor headers." }
    SoftwareSourceCreate:
      type: object
      required: [slug, name, uris, signing_key, fingerprint]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/SoftwareSourceKind" }
        slug: { type: string, description: "^[a-z0-9][a-z0-9-]{1,40}$; for a Flatpak remote the device names the remote paddock-<slug>." }
        name: { type: string, description: 1 to 100 characters after trimming. }
        uris: { type: array, minItems: 1, maxItems: 4, items: { type: string, maxLength: 512 }, description: "https only, no query, fragment or user information." }
        suites: { type: array, maxItems: 8, items: { type: string }, description: "^[A-Za-z0-9./_-]{1,64}$; a flat repository's suite ends in /. An APT repository needs 1 to 8, a Flatpak remote none." }
        components: { type: array, maxItems: 8, items: { type: string }, description: "^[a-z0-9-]{1,32}$; none for a flat repository, at least one otherwise." }
        architectures: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/SoftwareArchitecture" } }
        signing_key: { type: string, maxLength: 65536, description: "One ASCII-armored OpenPGP v4 public key. It is stored re-armored with 64-character lines and no armor headers, and that form must also fit 65536 bytes (400 invalid_request otherwise)." }
        fingerprint: { type: string, description: The key's fingerprint as published by the vendor; spaces and case are ignored. }
    SoftwareSourceUpdate:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/SoftwareSourceKind" }
        slug: { type: string, description: Immutable; any value is refused with 400 invalid_request. }
        name: { type: string }
        uris: { type: array, minItems: 1, maxItems: 4, items: { type: string, maxLength: 512 } }
