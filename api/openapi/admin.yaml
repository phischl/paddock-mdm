      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionProfileUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionProfile" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePermissionProfile
      tags: [privileges]
      description: "Roles: org_admin, org_operator. A profile that is still assigned: 409 in_use."
      x-paddock-audit: permission_profile.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/profile-assignments:
    get:
      operationId: listProfileAssignments
      tags: [privileges]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [created_at, subject_type]
        default_sort: created_at
        search: [profile_name]
        filters: [profile_id, subject_type, subject_id, device_group_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ProfileAssignmentSort"
        - $ref: "#/components/parameters/Search"
        - name: profile_id
          in: query
          schema: { type: string, format: uuid }
        - name: subject_type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/SubjectType" }
        - name: subject_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DeviceGroupFilter"
      responses:
