  /api/v1/permission-profiles:
    get:
      operationId: listPermissionProfiles
      tags: [privileges]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [name, class, created_at, updated_at]
        default_sort: name
        search: [name]
        filters: [class]
