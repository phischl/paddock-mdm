openapi: 3.0.3
info:
  title: Paddock Admin API
  version: 0.1.0
  description: |
    Admin API of the Paddock portal (plan M0 §6.6). Source of truth for the generated Go server interfaces and the
    portal's TypeScript types. Written in the OpenAPI 3.0.3 subset because oapi-codegen does not process 3.1.

    - All errors are RFC 9457 problem details (`application/problem+json`) with `code` and `instance` (request ID).
    - Mutating requests require the header `X-Paddock-CSRF: 1` (otherwise 403 `csrf_missing`).
    - Requests authenticate with the portal session cookie or with an API token (`Authorization: Bearer pdk_…`,
      plan M6c decision 9). A token acts in its organization with the role it carries; API token requests send
      `X-Paddock-CSRF: 1` on mutating requests, too.
    - A session cookie is valid only while its server-side record exists (plan M8s decision 14): every session
      request answers 503 `session_store_unavailable` while the session store is unreachable, and 401
      `unauthenticated` once the session was signed out or ended. API tokens are not affected.
    - The organization is never part of a path: it comes from the session only. Resources of other organizations
      answer 404 `not_found`, exactly like missing resources.
    - Operations that are privileged actions carry `x-paddock-audit: <code>`; each attempt produces exactly one
      audit event with that code.
    - Operations that always require a step-up within the last 5 minutes carry `x-paddock-step-up: true` (ADR 0044
      decision 4); the contract test keeps the flag equal to the server's route table in both directions.
    - The MCP tool catalog (`pkg/mcpcatalog`, generated by `make gen`) has one tool per operation outside the tag
      `auth`, named by its `operationId`. `x-paddock-mcp: { expose: false }` keeps an operation from being offered as
      a tool; `x-paddock-mcp: { bootstrap: true }` lets an MCP session call it without consulting the MCP policy.
      Step-up operations, non-JSON request bodies and success responses without JSON content are never exposed.
      Any operation may refuse a request of an MCP session before its use case runs: 403 `mcp_disabled`,
      `mcp_tool_not_allowed` or `mcp_write_not_enabled`, or 429 `rate_limited` with `Retry-After` (120 reads and 30
      writes per account and minute); a refused audited operation records one denied event.
    - Every operation, and every `/api/auth/*` route, may answer 429 `rate_limited` with `Retry-After` (seconds)
      from the application rate limiter (ADR 0051 decision 3): `/api/auth/*` per client address (default 20 per
      minute), reads per session or API token (600), writes per session or API token (120), agent artifact and
      package uploads per session or API token (10); the limits are `PADDOCK_RATELIMIT_*`. A refusal happens before
      the use case runs and records no audit event.
    - Every collection `GET` implements the list contract (ADR 0018): `page`, `page_size` (10, 25, 50, 100),
      `sort` (allow list, `-` prefix = descending, the primary key is appended as tie-breaker), `q`
      (case-insensitive substring search, 2–100 characters) and the documented filters; enum filters are
      repeatable. The response is `{items, page, page_size, total, total_capped, sort}`. `page × page_size` may not
      exceed 10000 (400 `page_out_of_range`); `total` is counted up to 10000, above that `total = 10000` and
      `total_capped = true`. The extension `x-paddock-list` documents sort fields, default sort, search fields and
      filters of each list.
servers:
  - url: https://admin.paddock.localhost:8443
security:
  - session: []
  - bearer: []
tags:
  - name: auth
  - name: me
  - name: overview
  - name: device-groups
  - name: enrollment-tokens
  - name: api-tokens
  - name: config
  - name: devices
  - name: managed-config
  - name: users
  - name: privileges
  - name: settings
  - name: revocation
  - name: inventory
  - name: updates
  - name: audit
  - name: platform
  - name: mcp
  - name: findings
  - name: notifications
  - name: software
paths:
  /api/auth/login:
    get:
      operationId: login
      tags: [auth]
      security: []
      summary: Start the OIDC login (authorization code + PKCE)
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to after login; must start with "/" and not with "//".
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Authentik authorization endpoint.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/auth/callback:
    get:
      operationId: callback
      tags: [auth]
      security: []
      summary: OIDC redirect URI
      x-paddock-audit: admin.login
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: |
            Redirect to return_to (default /) on success, or to /login-denied?reason=<code>. An identity with the
            platform role and one organization role signs in to the organization role (ADR 0045). The callback of a
            role switch (POST /api/auth/switch) opens a new session in the chosen role, ends the previous session and
            records admin.login with previous_role; a role the fresh groups claim no longer grants is refused with
            reason role_not_granted and leaves the previous session untouched.
          headers:
            Location: { schema: { type: string } }
  /api/auth/stepup:
    get:
      operationId: stepUp
      tags: [auth]
      summary: Start a step-up authentication (plan M4a decision 6)
      description: |
        Requires a valid session. Redirects to the authorization endpoint of the OIDC application
        paddock-portal-stepup with prompt=login, max_age=20 and the session's username as login_hint; Authentik runs
        the flow paddock-stepup (password and MFA). Actions that need a step-up answer 403 step_up_required when the
        session has none within the last 300 s.
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to; must start with "/" and not with "//".
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Authentik authorization endpoint.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/auth/stepup/callback:
    get:
      operationId: stepUpCallback
      tags: [auth]
      security: []
      summary: OIDC redirect URI of the step-up
      description: |
        Accepts an ID token of the session's own user (same sub) with auth_time at most 60 s old and MFA (amr mfa),
        then issues the session again with the step-up time. Any other answer leaves the session unchanged.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect to return_to, with the query parameter stepup=failed if the step-up was refused.
          headers:
            Location: { schema: { type: string } }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: >-
            Session ended. The client navigates to end_session_url, Authentik's brand invalidation flow on the issuer's
            origin, to end the Authentik session (the portal's address when the issuer is unknown).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Logout" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/auth/switch:
    post:
      operationId: switchRole
      tags: [auth]
      summary: Start the switch to the session's alternate role (ADR 0045).
      parameters: [ { $ref: "#/components/parameters/Csrf" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleSwitch" }
      responses:
        "200":
          description: Navigate the browser to authorize_url; the callback opens the new session and ends this one.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties: { authorize_url: { type: string, format: uri } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/auth/mcp/config:
    get:
      operationId: getMcpLoginConfig
      tags: [auth]
      security: []
      summary: Login configuration of paddockctl mcp (ADR 0044 amendment 2026-10-25)
      description: |
        The Authentik provider paddock-mcp and its endpoints, copied from the discovered provider metadata, so that
        paddockctl needs only the portal URL for the device authorization grant. 404 not_found when the MCP login is
        not configured (PADDOCK_OIDC_MCP_ISSUER empty); 502 upstream_unavailable while the provider is not discovered.
      responses:
        "200":
          description: The login configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpLoginConfig" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/auth/mcp/session:
    post:
      operationId: openMcpSession
      tags: [auth]
      security: []
      summary: Open or renew the MCP session of an Authentik token pair
      x-paddock-audit: admin.login
      description: |
        Verifies the ID token and the access token of the provider paddock-mcp (signature, issuer, audience
        paddock-mcp, expiry, the same sub), resolves the role from the ID token's groups like the portal login and
        opens the MCP session of the access token for its remaining life (at most 35 minutes, otherwise 400). The
        access token then authenticates admin API requests as a bearer with channel mcp.

        An ID token with amr is a login: it must name the second factor (amr mfa; otherwise 401 with detail
        mfa_required) and, for an identity with a role, a validated WebAuthn authenticator in paddock_mfa_classes
        (scope paddock_mfa; otherwise, also without the claim, 401 with detail passkey_required), and its sub and
        auth_time are bound for 8 hours, the refresh token's life. An ID token without amr (a refreshed one) is a
        renewal: it is accepted only for a live binding of its sub and auth_time whose login validated the passkey,
        otherwise 401 mcp_login_required (ADR 0044 amendment 2026-10-28, PDK-531), and is recorded as admin.login with
        renewal true.
        Every attempt with verifiable tokens records one admin.login event with channel mcp; a refused role answers
        403 forbidden with the denial reason as detail (no_role, multiple_organizations, role_not_granted, …).
      parameters:
        - $ref: "#/components/parameters/McpClient"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpSessionInput" }
      responses:
        "204": { description: The MCP session is open. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/auth/mcp/logout:
    post:
      operationId: closeMcpSession
      tags: [auth]
      security: [ { bearer: [] } ]
      summary: End the MCP session of the bearer's access token
      description: |
        Deletes the session of the access token, the login binding of its renewals and the sessions of every other
        access token of the same refresh chain, also after the binding expired; a token without a session is already
        signed out (204). The refresh token is revoked by paddockctl at Authentik's revocation endpoint.
      responses:
        "204": { description: The MCP session is ended. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/me:
    get:
      operationId: getMe
      x-paddock-mcp: { bootstrap: true }
      tags: [me]
      responses:
        "200":
          description: The signed-in administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: The client address is outside the IP allow list (ip_not_allowed, plan M7a decision 17).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: The api has not loaded the IP allow list yet and refuses every request (ip_allowlist_unavailable, fail closed).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: updateMe
      x-paddock-mcp: { expose: false }
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/me/mcp-write/enable:
    post:
      operationId: enableMcpWrite
      x-paddock-step-up: true
      x-paddock-mcp: { expose: false }
      tags: [mcp]
      description: |
        Roles: org_admin, org_operator, platform_admin. Enables MCP write access for the caller's own account (ADR 0044
        amendment 2026-10-25): their MCP sessions may change data where the scope's MCP policy allows it. Needs a
        step-up within the last 5 minutes (403 step_up_required); 403 forbidden for org_auditor, for API tokens and
        for MCP sessions. Every attempt is audited.
      x-paddock-audit: admin.mcp_write_enabled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The administrator with mcp_write_enabled true.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/me/mcp-write/disable:
    post:
      operationId: disableMcpWrite
      x-paddock-mcp: { expose: false }
      tags: [mcp]
      description: |
        Roles: org_admin, org_operator, platform_admin. Disables MCP write access for the caller's own account; no
        step-up is needed. 403 forbidden for org_auditor, for API tokens and for MCP sessions. Every attempt is
        audited.
      x-paddock-audit: admin.mcp_write_disabled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The administrator with mcp_write_enabled false.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/mcp/catalog:
    get:
      operationId: getMcpCatalog
      x-paddock-mcp: { bootstrap: true, expose: false }
      tags: [mcp]
      description: |
        Roles: every administrator. The MCP tool catalog shared by paddockctl mcp and the server's MCP guard: one
        entry per admin API operation outside the tag auth, with its class, scope and whether the MCP offers it at all
        (ADR 0044 decision 5). An MCP session may call it whatever its scope's MCP policy says.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpCatalog" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/mcp/access:
    get:
      operationId: getMcpAccess
      x-paddock-mcp: { bootstrap: true, expose: false }
      tags: [mcp]
      description: |
        Roles: every administrator. What the caller's MCP sessions may do under the MCP policy of its scope (the
        organization's, or the platform's for a platform administrator): allowed_operations lists the exposed tools
        without a step-up of that scope the policy allows, write tools only while write_effective (policy enabled and
        write_enabled, and the account opted in) and the caller's role may perform them. Without a saved policy enabled
        is false and allowed_operations empty. An MCP session may call it whatever the policy says.
      responses:
        "200":
          description: The caller's MCP access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpAccess" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /api/v1/device-groups:
    get:
      operationId: listDeviceGroups
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [name, created_at, updated_at]
        default_sort: name
        search: [name, description]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceGroupSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of device groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroupPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator."
      x-paddock-audit: device_group.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/device-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The device group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator. While a configuration rollout is open, renaming a group that scopes one of its staged items or is its canary group is refused with 409 rollout_conflict (plan M11 amendment R6.13)."
      x-paddock-audit: device_group.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin. While a configuration rollout is open, a group that scopes one of its staged items or is its canary group is refused with 409 rollout_conflict; the items of a deleted group are removed from every device at once (plan M11 amendment R6.13)."
      x-paddock-audit: device_group.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/device-groups/{id}/maintenance-window:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceGroupMaintenanceWindow
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor. 404 not_found when the group has no window, is unknown or is another organization's."
      responses:
        "200":
          description: The device group's maintenance window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setDeviceGroupMaintenanceWindow
      tags: [device-groups]
      description: |
        Roles: org_admin, org_operator. Sets or replaces the group's maintenance window (plan M13c decision 4): the
        group's devices install and remove the software of their policy only inside the union of the windows of their
        groups; urgent assignments, the users' own self-service operations and source files do not wait. A value out
        of range or a timezone the server does not know is 400 invalid_request; an unknown group or another
        organization's is 404 not_found.
      x-paddock-audit: device_group.maintenance_window_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceWindowInput" }
      responses:
        "200":
          description: The window as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceWindow" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDeviceGroupMaintenanceWindow
      tags: [device-groups]
      description: "Roles: org_admin, org_operator. Removes the group's window: its devices apply their software policy at the next pass unless another group of theirs has a window. 404 not_found when the group has none."
      x-paddock-audit: device_group.maintenance_window_removed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      description: "Roles: org_admin, org_auditor."
      x-paddock-list:
        sort: [occurred_at, code, outcome]
        default_sort: -occurred_at
        search: [code, actor.display, target.display]
        filters: [from, to, code, outcome, actor_type, target_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditEventSort"
        - $ref: "#/components/parameters/Search"
        - name: target_id
          in: query
          description: Exact target id (for example a device id).
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: RFC 3339; default to - 7 days.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: RFC 3339; default now. The range may span at most 92 days (400 range_too_large).
          schema: { type: string, format: date-time }
        - name: code
          in: query
          description: Exact event code; repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: outcome
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditOutcome" }
        - name: actor_type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditActorType" }
      responses:
        "200":
          description: One page of audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit-events/feed:
    get:
      operationId: feedAuditEvents
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor (sessions and API tokens). Commit-ordered cursor feed of the organization's audit
        events for a SIEM pull (ADR 0031): repeat with after = next_after to read every event exactly once. An after
        below the oldest retained commit_seq returns the oldest retained events (catch-up is bounded by the index
        retention).
      x-paddock-feed: { cursor: after, limit: { default: 100, max: 1000 } }
      x-paddock-mcp: { expose: false }
      parameters:
        - name: after
          in: query
          description: Commit sequence of the last event already read; 0 starts at the beginning.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Maximum number of events in the page.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Events after the cursor in ascending commit_seq.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditFeedPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/integrity:
    get:
      operationId: getAuditIntegrity
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor. The integrity of the organization's audit evidence (plan M8b decision 30): the
        last sealed day, the number of sealed days, the newest chain verification run and the times of the last
        successful and the last failed run.
      responses:
        "200":
          description: The evidence integrity summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditIntegrity" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/verification-runs:
    get:
      operationId: listAuditVerificationRuns
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor. The chain verification runs of the organization (nightly window, random sample
        day, paddock-server audit verify). q matches the problems of a run.
      x-paddock-list:
        sort: [started_at, from_day, ok]
        default_sort: -started_at
        search: [problems]
        filters: [ok, trigger]
