  /api/platform/v1/ip-allowlist:
    get:
      operationId: listIpAllowlist
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin. The IP allow list of the administrative surfaces (plan M7a decision 16): while it has
        entries, the portal and the admin API answer 403 ip_not_allowed to every client address outside it, sessions
        and API tokens alike. Sessions only: platform tokens do not exist.
      x-paddock-list:
        sort: [cidr, label, created_at]
        default_sort: cidr
        search: [label, cidr]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IpAllowlistSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIpAllowlistEntry
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin; requires a step-up within the step-up window (403 step_up_required). Adds a range.
        409 lockout_confirmation_required when the list would no longer cover the caller's own address (repeat with
        confirm=lockout); 409 already_exists for a duplicate CIDR. Every attempt is audited.
      x-paddock-audit: platform.ip_allowlist_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpAllowlistEntryCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/ip-allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getIpAllowlistEntry
      tags: [platform]
      security:
        - session: []
      description: "Roles: platform_admin. One entry."
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateIpAllowlistEntry
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin; requires a step-up (403 step_up_required). Changes the range and/or the label (at least
        one). 409 lockout_confirmation_required when the caller's own address would no longer be covered (repeat with
        confirm=lockout); 409 already_exists for a duplicate CIDR.
      x-paddock-audit: platform.ip_allowlist_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpAllowlistEntryUpdate" }
      responses:
        "200":
          description: The changed entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteIpAllowlistEntry
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin; requires a step-up (403 step_up_required). Removes the entry. 409
        lockout_confirmation_required when the caller's own address would no longer be covered (repeat with
        confirm=lockout); 409 disable_confirmation_required when it is the last entry, which switches the allow list
        off for everyone (repeat with confirm=disable).
      x-paddock-audit: platform.ip_allowlist_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Confirm"
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
