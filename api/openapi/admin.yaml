    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: lockUser
      tags: [users]
      description: |
        Roles: org_admin. Locks the user: the affected devices get the lock in their next bundle (priority lane), and in
        Authentik the user joins paddock.<slug>.locked and loses its refresh tokens, access tokens and sessions. When
        Authentik fails, the user stays locked for the devices with lock_incomplete true; locking again retries the
        Authentik part.
      x-paddock-audit: user.locked
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Locked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
