        id: { type: string, format: uuid }
        device_group_id: { type: string, format: uuid, nullable: true, description: null = every device. }
        unit: { type: string }
        enabled: { type: boolean }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ManagedUnitCreate:
