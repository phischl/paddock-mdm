  /api/v1/config:
    get:
      operationId: getConfig
      tags: [config]
      description: |
        Roles: org_admin, org_operator, org_auditor. The organization's declarative configuration as a paddock.v1
        document (api/schema/paddock.v1.json) with every section present, in the key order of the schema.
      responses:
        "200":
          description: The configuration document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigDocument" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: applyConfig
      tags: [config]
      description: |
        Roles: org_admin, org_operator. Applies a paddock.v1 document (at most 1 MiB) in one transaction: a present
        section is authoritative (items not listed are deleted), absent sections are untouched. The rules of the
        per-resource endpoints apply unchanged and abort the whole apply with their problem code, the document path
        in the detail: deleting device groups and changing settings need org_admin (403 forbidden), assigning a full
        profile or changing a profile to full needs a step-up (403 step_up_required; an API token never has one).
        A schema violation is 422 invalid_document listing up to 20 "path: message" pairs. With dry_run=true the
        plan is computed and checked the same way but nothing is applied and nothing is audited. An apply with
        changes records a change set; one without changes records the event with zeros and no change set.
        expected_plan (plan M6c amendment 2026-10-08) is the plan_sha256 of a dry run the client confirmed: when the
        plan computed now differs, the apply is refused with 412 plan_changed (audited as failure) and nothing is
        applied. Staged rollouts (plan M11 decisions 25-29): with rollouts enabled, an apply that changes managed
        files, managed units, package holds or the update settings starts a rollout (rollout staged, rollout_id) unless
        urgent is set. While a rollout is open, a change of a key it stages is refused with 409 rollout_conflict (urgent
        too), any other change of a section it stages with 409 rollout_running (package holds and update settings are
        one section; a mixed apply is refused as a whole), and a change of only other sections is immediate. The same
        rules apply to every per-resource write and to reverts (ADR 0033 amendment 2026-11-01).
        Software (plan M13c decisions 1-3): the sections software_sources, software_catalog and software_assignments
        follow the rules of their endpoints. A plan that changes software_sources needs an organization administrator
        with a fresh step-up for the whole apply (ADR 0034 decision 3): an API token's apply is refused with 403
        step_up_required and nothing is applied, its dry run lists the section in plan.requires_step_up. A
        software_sources item whose fingerprint differs from its signing key is 422 fingerprint_mismatch. A change of
        software_assignments is rollout-able like managed files (ADR 0033 amendment 2026-11-05); sources and catalog
        entries are always immediate.
      x-paddock-audit: config.applied
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RolloutUrgent"
        - $ref: "#/components/parameters/RolloutReason"
        - name: dry_run
          in: query
          description: Compute and check the plan without applying it.
          schema: { type: boolean, default: false }
        - name: expected_plan
          in: query
          description: plan_sha256 of the confirmed dry run; a different plan is refused with 412 plan_changed.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigDocument" }
      responses:
        "200":
          description: The plan, applied unless dry_run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/change-sets:
    get:
      operationId: listChangeSets
      tags: [config]
      description: "Roles: org_admin, org_operator, org_auditor. Every configuration write that changed something: an apply of PUT /api/v1/config and every change of a single resource."
      x-paddock-list:
        sort: [applied_at]
