openapi: 3.0.3
info:
  title: Paddock Admin API
  version: 0.1.0
  description: |
    Admin API of the Paddock portal (plan M0 §6.6). Source of truth for the generated Go server interfaces and the
    portal's TypeScript types. Written in the OpenAPI 3.0.3 subset because oapi-codegen does not process 3.1.

    - All errors are RFC 9457 problem details (`application/problem+json`) with `code` and `instance` (request ID).
    - Mutating requests require the header `X-Paddock-CSRF: 1` (otherwise 403 `csrf_missing`).
    - The organization is never part of a path: it comes from the session only. Resources of other organizations
      answer 404 `not_found`, exactly like missing resources.
    - Operations that are privileged actions carry `x-paddock-audit: <code>`; each attempt produces exactly one
      audit event with that code.
    - Every collection `GET` implements the list contract (ADR 0018): `page`, `page_size` (10, 25, 50, 100),
      `sort` (allow list, `-` prefix = descending, the primary key is appended as tie-breaker), `q`
      (case-insensitive substring search, 2–100 characters) and the documented filters; enum filters are
      repeatable. The response is `{items, page, page_size, total, total_capped, sort}`. `page × page_size` may not
      exceed 10000 (400 `page_out_of_range`); `total` is counted up to 10000, above that `total = 10000` and
      `total_capped = true`. The extension `x-paddock-list` documents sort fields, default sort, search fields and
      filters of each list.
servers:
  - url: https://admin.paddock.localhost:8443
security:
  - session: []
tags:
  - name: auth
  - name: me
  - name: device-groups
  - name: enrollment-tokens
  - name: devices
  - name: managed-config
  - name: users
  - name: privileges
  - name: settings
  - name: revocation
  - name: audit
  - name: platform
paths:
  /api/auth/login:
    get:
      operationId: login
      tags: [auth]
      security: []
      summary: Start the OIDC login (authorization code + PKCE)
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to after login; must start with "/" and not with "//".
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Authentik authorization endpoint.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/auth/callback:
    get:
      operationId: callback
      tags: [auth]
      security: []
      summary: OIDC redirect URI
      x-paddock-audit: admin.login
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect to return_to (default /) on success, or to /login-denied?reason=<code>.
          headers:
            Location: { schema: { type: string } }
  /api/auth/stepup:
    get:
      operationId: stepUp
      tags: [auth]
      summary: Start a step-up authentication (plan M4a decision 6)
      description: |
        Requires a valid session. Redirects to the authorization endpoint of the OIDC application
        paddock-portal-stepup with prompt=login, max_age=60 and the session's username as login_hint; Authentik runs
        the flow paddock-stepup (password and MFA). Actions that need a step-up answer 403 step_up_required when the
        session has none within the last 300 s.
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to; must start with "/" and not with "//".
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Authentik authorization endpoint.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/auth/stepup/callback:
    get:
      operationId: stepUpCallback
      tags: [auth]
      security: []
      summary: OIDC redirect URI of the step-up
      description: |
        Accepts an ID token of the session's own user (same sub) with auth_time at most 60 s old and MFA (amr mfa),
        then issues the session again with the step-up time. Any other answer leaves the session unchanged.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect to return_to, with the query parameter stepup=failed if the step-up was refused.
          headers:
            Location: { schema: { type: string } }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Session ended. The client navigates to end_session_url to end the Authentik session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Logout" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The signed-in administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/device-groups:
    get:
      operationId: listDeviceGroups
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [name, created_at, updated_at]
        default_sort: name
        search: [name, description]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceGroupSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of device groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroupPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator."
      x-paddock-audit: device_group.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/device-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The device group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator."
      x-paddock-audit: device_group.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin."
      x-paddock-audit: device_group.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      description: "Roles: org_admin, org_auditor."
      x-paddock-list:
        sort: [occurred_at, code, outcome]
        default_sort: -occurred_at
        search: [code, actor.display, target.display]
        filters: [from, to, code, outcome, actor_type]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditEventSort"
        - $ref: "#/components/parameters/Search"
        - name: from
          in: query
          description: RFC 3339; default to - 7 days.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: RFC 3339; default now. The range may span at most 92 days (400 range_too_large).
          schema: { type: string, format: date-time }
        - name: code
          in: query
          description: Exact event code; repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: outcome
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditOutcome" }
        - name: actor_type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditActorType" }
      responses:
        "200":
          description: One page of audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/device-groups/{id}/devices:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceGroupDevices
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor. The members of a device group."
      x-paddock-list:
        sort: [hostname, last_contact_at, enrolled_at, state]
        default_sort: hostname
        search: [hostname, hardware_uuid]
        filters: [state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceStateFilter"
      responses:
        "200":
          description: One page of member devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/enrollment-tokens:
    get:
      operationId: listEnrollmentTokens
      tags: [enrollment-tokens]
      description: "Roles: org_admin, org_operator."
      x-paddock-list:
        sort: [name, created_at, expires_at]
        default_sort: -created_at
        search: [name]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EnrollmentTokenSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of enrollment tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createEnrollmentToken
      tags: [enrollment-tokens]
      description: |
        Roles: org_admin. The response carries the token secret and the enrollment configuration exactly once; only
        a hash of the secret is stored.
      x-paddock-audit: enrollment_token.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTokenCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/enrollment-tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getEnrollmentToken
      tags: [enrollment-tokens]
      description: "Roles: org_admin, org_operator."
      responses:
        "200":
          description: The enrollment token (without secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/enrollment-tokens/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: revokeEnrollmentToken
      tags: [enrollment-tokens]
      description: "Roles: org_admin. Idempotent: revoking a revoked token keeps the first revocation time."
      x-paddock-audit: enrollment_token.revoked
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/autoinstall:
    post:
      operationId: generateAutoinstall
      tags: [enrollment-tokens]
      description: |
        Roles: org_admin, org_operator. Generates the Ubuntu autoinstall user-data that installs one device with
        Paddock (plan M4b decisions 2–4): LVM inside LUKS2 under a random temporary passphrase, the Debian packages of
        the newest published agent release that has both (pinned by SHA-256; 409 invalid_state if there is none), the
        enrollment configuration, and the first-boot disk setup with the organization's boot_pin_min_length. The
        enrollment configuration must be one of this organization (404 not_found otherwise, also for another
        organization's) whose token can still enroll a device (422 token_revoked, token_expired or token_exhausted).
        Nothing is stored; the response contains the passphrase and the token and is never cached.
      x-paddock-audit: autoinstall.generated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoinstallRequest" }
      responses:
        "200":
          description: The user-data (cloud-config with the autoinstall section).
          content:
            text/yaml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [hostname, last_contact_at, enrolled_at, state]
        default_sort: hostname
        search: [hostname, hardware_uuid]
        filters: [state, device_group_id, disk_state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceStateFilter"
        - name: device_group_id
          in: query
          description: Only members of this device group.
          schema: { type: string, format: uuid }
        - name: disk_state
          in: query
          description: Repeatable. Disk encryption state of the last check-in (plan M4b decision 14).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DiskState" }
      responses:
        "200":
          description: One page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDevice
      tags: [devices]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The device with groups and identity keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveDevice
      tags: [devices]
      description: "Roles: org_admin, org_operator. pending → active."
      x-paddock-audit: device.approved
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectDevice
      tags: [devices]
      description: "Roles: org_admin. pending → rejected; the identity keys are revoked."
      x-paddock-audit: device.rejected
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/release-quarantine:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: releaseDeviceQuarantine
      tags: [devices]
      description: "Roles: org_admin, org_operator. quarantined → active."
      x-paddock-audit: device.quarantine_released
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: retireDevice
      tags: [devices]
      description: "Roles: org_admin. active or quarantined → retired; the identity keys are revoked."
      x-paddock-audit: device.retired
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/groups:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setDeviceGroups
      tags: [devices]
      description: "Roles: org_admin, org_operator. Replaces the device group memberships."
      x-paddock-audit: device.groups_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupsUpdate" }
      responses:
        "200":
          description: The device with its new memberships.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/effective-config:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceEffectiveConfig
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The resources the compiler renders for this device and the
        definitions they come from; conflicts between device groups are listed, never merged.
      responses:
        "200":
          description: Effective configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveConfig" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/managed-files:
    get:
      operationId: listManagedFiles
      tags: [managed-config]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [path, created_at, updated_at]
        default_sort: path
        search: [path]
        filters: [device_group_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ManagedFileSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceGroupFilter"
      responses:
        "200":
