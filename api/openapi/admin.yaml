        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,40}[a-z0-9]$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        upstream_group_id: { type: string, maxLength: 64, description: Import this upstream Authentik group. }
    UserGroupUpdate:
      type: object
