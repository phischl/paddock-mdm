      type: object
      required: [commands]
      properties:
        commands: { type: integer, description: "Commands issued, one per active device of the group." }
    DeviceUpdateHold:
      type: object
      required: [package, version, device_group_id]
      properties:
        package: { type: string }
        version: { type: string, nullable: true }
        device_group_id: { type: string, format: uuid, nullable: true, description: null = organization-wide. }
    DeviceUpdateConflict:
