        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createProfileAssignment
      tags: [privileges]
      description: |
        Roles: org_admin, org_operator. Assigns a profile globally, to a group or to a user, optionally only on the
        devices of one device group. Assigning a full profile needs a step-up within the last 300 s (403
        step_up_required).
      x-paddock-audit: profile_assignment.created
