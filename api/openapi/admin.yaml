        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    UserGroupMemberAdd:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
    UpstreamGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: Authentik pk. }
        name: { type: string }
    UpstreamGroupPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UpstreamGroup" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    SessionAction:
      type: string
      enum: [lock_screen, terminate]
    LoginSettingsUpdate:
      type: object
      required: [hello_enabled, hello_pin_min_length, user_lock_session_action, break_glass_accounts,
                 sudoers_d_allowlist, sudo_lecture_text, local_admin_username, local_admin_rotation_days,
                 notice_text, boot_pin_min_length]
      additionalProperties: false
      properties:
        hello_enabled: { type: boolean }
        hello_pin_min_length: { type: integer, minimum: 6, maximum: 32 }
        user_lock_session_action: { $ref: "#/components/schemas/SessionAction" }
        break_glass_accounts:
          type: array
          maxItems: 50
          description: Local accounts never touched by the privileged group policy or the deny list.
          items: { type: string, maxLength: 32 }
        sudoers_d_allowlist:
          type: array
          maxItems: 50
          description: Files in /etc/sudoers.d/ the agent leaves alone.
          items: { type: string, maxLength: 64 }
        sudo_lecture_text: { type: string, minLength: 1, maxLength: 2000 }
        local_admin_username:
          type: string
          pattern: "^[a-z_][a-z0-9_-]{0,31}$"
          description: |
            Managed local administrator account of every device (plan M4a decision 13). It cannot change once a device
            has an active password for it (409 setting_locked).
        local_admin_rotation_days: { type: integer, minimum: 1, maximum: 365 }
        rotate_after_reveal_hours:
          type: integer
          minimum: 1
          maximum: 168
          nullable: true
          description: Hours after a reveal until the device rotates the password; absent or null means no rotation.
        notice_text:
          type: string
          maxLength: 2000
          description: |
            Login notice of every device (plan M4a decision 19): plain text with line breaks, shown at the login
            screen (GDM banner), on text consoles (/etc/issue.d) and before SSH logins. Empty removes it.
        boot_pin_min_length:
          type: integer
          minimum: 6
          maximum: 32
          description: |
            Shortest boot PIN (TPM2+PIN disk unlock) the first-boot disk setup of a device installed with the Paddock
            autoinstall accepts (plan M4b decision 4). It is embedded in autoinstalls generated afterwards; installed
            devices keep the value they were installed with.
        login_history_enabled:
          type: boolean
          description: |
            Record every session start of directory users per device (ADR 0037 decision 6); absent keeps the value.
            Switching it off deletes every recorded login of the organization (param login_history_deleted).
        login_history_days:
          type: integer
          minimum: 7
          maximum: 365
          description: How long a recorded login is kept; absent keeps the value.
        disk_unlock_mode:
          description: |
            Disk unlock mode of devices installed with the Paddock autoinstall from now on (ADR 0038 decision 1);
            device groups override it. Absent keeps the value. Installed devices keep their mode.
          allOf:
            - $ref: "#/components/schemas/DiskUnlockMode"
    LoginSettings:
      type: object
      required: [hello_enabled, hello_pin_min_length, user_lock_session_action, break_glass_accounts,
                 sudoers_d_allowlist, sudo_lecture_text, local_admin_username, local_admin_rotation_days,
                 rotate_after_reveal_hours, notice_text, boot_pin_min_length, login_history_enabled, login_history_days,
                 disk_unlock_mode, updated_at]
      properties:
        hello_enabled: { type: boolean }
        hello_pin_min_length: { type: integer }
        user_lock_session_action: { $ref: "#/components/schemas/SessionAction" }
        break_glass_accounts:
          type: array
          items: { type: string }
        sudoers_d_allowlist:
          type: array
          items: { type: string }
        sudo_lecture_text: { type: string }
        local_admin_username: { type: string }
        local_admin_rotation_days: { type: integer }
        rotate_after_reveal_hours: { type: integer, nullable: true }
        notice_text: { type: string }
        boot_pin_min_length: { type: integer }
        login_history_enabled:
          type: boolean
          description: Every session start of directory users is stored per device (ADR 0037 decision 6); off by default.
        login_history_days: { type: integer, description: How long the login history is kept (7–365 days). }
        disk_unlock_mode: { $ref: "#/components/schemas/DiskUnlockMode" }
        updated_at: { type: string, format: date-time }
    LoginAssignmentUpdate:
      type: object
      required: [users, groups]
      additionalProperties: false
      properties:
        users:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        groups:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
    DeviceLoginAssignment:
      type: object
      required: [users, groups]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/UserRef" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/UserGroupRef" }
    PrivilegeClass:
      type: string
      enum: [none, restricted, full]
    RootEquivalence:
      type: object
      required: [effective_class, root_equivalent_commands, witnesses]
      properties:
        effective_class: { $ref: "#/components/schemas/PrivilegeClass" }
        root_equivalent_commands:
          type: array
          description: The normalized commands that hand out root, alone or together with another command; sorted.
          items: { type: string }
        witnesses:
          type: array
          description: 'Why the profile hands out root: "ALL", "cmd:<command>" or "pair:<writer>|<command>"; sorted.'
          items: { type: string }
    Lecture:
      type: string
      enum: [always, once, never]
    SubjectType:
      type: string
      enum: [global, group, user]
    PermissionProfile:
      type: object
      required: [id, name, class, commands, require_password, timestamp_timeout_min, lecture, root_equivalent,
                 effective_class, root_equivalent_commands, invalid_commands, root_grant_confirmed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        class: { $ref: "#/components/schemas/PrivilegeClass" }
        commands:
          type: array
          items: { type: string }
        require_password: { type: boolean }
        timestamp_timeout_min: { type: integer }
        lecture: { $ref: "#/components/schemas/Lecture" }
        root_equivalent: { type: boolean, description: A command hands out root on its own or in combination. }
        effective_class: { $ref: "#/components/schemas/PrivilegeClass" }
        root_grant_confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: When an organization administrator confirmed this effectively Full profile with a step-up; null otherwise.
        root_equivalent_commands:
          type: array
          items: { type: string }
        invalid_commands:
          type: array
          items: { type: string }
          description: |
            Commands stored before the command check was tightened that it now refuses. A profile with invalid commands
            is invalid: the sudo entries it contributes to are omitted from bundles (audit device.bundle_entry_omitted)
            until the commands are changed.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PermissionProfileCreate:
      type: object
      description: |
        A profile that is effectively Full (class full, or restricted with a root-equivalent command), or a change that
        gives a user root through the combination of several profiles, needs org_admin (403 forbidden otherwise) and a
        step-up (403 step_up_required); API tokens cannot satisfy it.
      required: [name, class]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        class: { $ref: "#/components/schemas/PrivilegeClass" }
        commands:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 1024 }
        require_password: { type: boolean, default: true }
        timestamp_timeout_min: { type: integer, minimum: 0, maximum: 60, default: 5 }
        lecture: { $ref: "#/components/schemas/Lecture" }
    PermissionProfileUpdate:
      type: object
      description: |
        A profile that is effectively Full (class full, or restricted with a root-equivalent command), or a change that
        gives a user root through the combination of several profiles, needs org_admin (403 forbidden otherwise) and a
        step-up (403 step_up_required); API tokens cannot satisfy it.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        class: { $ref: "#/components/schemas/PrivilegeClass" }
        commands:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 1024 }
        require_password: { type: boolean }
        timestamp_timeout_min: { type: integer, minimum: 0, maximum: 60 }
        lecture: { $ref: "#/components/schemas/Lecture" }
    PermissionProfilePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PermissionProfile" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ProfileAssignment:
      type: object
      required: [id, profile_id, subject_type, subject_id, device_group_id, created_at]
      properties:
        id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        subject_type: { $ref: "#/components/schemas/SubjectType" }
        subject_id: { type: string, format: uuid, nullable: true, description: User or group; null for global. }
        device_group_id: { type: string, format: uuid, nullable: true, description: Only on devices of this group; null = every device. }
        created_at: { type: string, format: date-time }
    ProfileAssignmentCreate:
      type: object
      description: |
        A profile that is effectively Full (class full, or restricted with a root-equivalent command), or a change that
        gives a user root through the combination of several profiles, needs org_admin (403 forbidden otherwise) and a
        step-up (403 step_up_required); API tokens cannot satisfy it.
      required: [profile_id, subject_type]
      additionalProperties: false
      properties:
        profile_id: { type: string, format: uuid }
        subject_type: { $ref: "#/components/schemas/SubjectType" }
        subject_id: { type: string, format: uuid }
        device_group_id: { type: string, format: uuid }
    ProfileAssignmentUpdate:
      type: object
      description: |
        A profile that is effectively Full (class full, or restricted with a root-equivalent command), or a change that
        gives a user root through the combination of several profiles, needs org_admin (403 forbidden otherwise) and a
        step-up (403 step_up_required); API tokens cannot satisfy it.
      required: [device_group_id]
      additionalProperties: false
      properties:
        device_group_id: { type: string, format: uuid, nullable: true }
    ProfileAssignmentPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProfileAssignment" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DerivationSubject:
      type: object
      required: [type, id]
      properties:
        type: { $ref: "#/components/schemas/SubjectType" }
        id: { type: string, format: uuid, nullable: true }
    Derivation:
      type: object
      required: [kind, item, value, assignment_id, profile_id, profile_name, subject]
      properties:
        kind: { type: string, enum: [class, command, scalar] }
        item: { type: string, description: '"class", the command, or the scalar name.' }
        value: { type: string }
        assignment_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_name: { type: string }
        subject: { $ref: "#/components/schemas/DerivationSubject" }
    EffectiveProfile:
      type: object
      required: [class, reported_class, root_equivalent, root_equivalent_commands, catalog_version, commands,
                 require_password, timestamp_timeout_min, lecture]
      properties:
        class: { $ref: "#/components/schemas/PrivilegeClass" }
        reported_class:
          allOf:
            - $ref: "#/components/schemas/PrivilegeClass"
          description: full for a root-equivalent restricted profile (detection and warnings).
        root_equivalent: { type: boolean }
        root_equivalent_commands:
          type: array
          items: { type: string }
        catalog_version: { type: integer, description: Version of the root-equivalence rules. }
        commands:
          type: array
          items: { type: string }
        require_password: { type: boolean }
        timestamp_timeout_min: { type: integer }
        lecture: { $ref: "#/components/schemas/Lecture" }
    UserEffectiveProfile:
      allOf:
        - $ref: "#/components/schemas/EffectiveProfile"
        - type: object
          required: [user, device_id, derivation]
          properties:
            user: { $ref: "#/components/schemas/UserRef" }
            device_id: { type: string, format: uuid, nullable: true }
            derivation:
              type: array
              items: { $ref: "#/components/schemas/Derivation" }
    EffectiveSudoEntry:
      allOf:
        - $ref: "#/components/schemas/EffectiveProfile"
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/UserRef" }
    EffectiveSudo:
      type: object
      required: [device_id, entries]
      properties:
        device_id: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: "#/components/schemas/EffectiveSudoEntry" }
