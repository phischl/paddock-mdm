      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        at: { type: string, format: date-time, description: Start of the session as the device reported it. }
    DeviceLoginEventPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceLoginEvent" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_capped: { type: boolean }
        sort: { type: string }
    DeviceOwnersUpdate:
      type: object
      required: [user_ids]
      additionalProperties: false
      properties:
        user_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    DeviceNameUpdate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          maxLength: 63
          description: The managed name; null clears it (the device keeps its current hostname).
    DeviceGroupsUpdate:
      type: object
      required: [device_group_ids]
      additionalProperties: false
      properties:
        device_group_ids:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
    BundleResource:
      type: object
      required: [id, type, spec]
      properties:
        id: { type: string, description: '"time", "file:<path>" or "unit:<name>"' }
        type: { type: string, enum: [time, file, systemd_unit] }
        spec:
          type: object
          additionalProperties: true
    ConfigConflict:
      type: object
      required: [resource, winner_id, loser_ids]
      properties:
        resource: { type: string }
        winner_id: { type: string, format: uuid, description: The definition that applies (smallest ID). }
        loser_ids:
          type: array
          items: { type: string, format: uuid }
    EffectiveConfig:
      type: object
      required: [resources, files, units, conflicts]
      properties:
        resources:
          type: array
          description: Bundle resources, sorted by id, exactly as the compiler renders them.
          items: { $ref: "#/components/schemas/BundleResource" }
        files:
          type: array
          items: { $ref: "#/components/schemas/ManagedFile" }
        units:
          type: array
          items: { $ref: "#/components/schemas/ManagedUnit" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ConfigConflict" }
    ManagedFileTier:
      type: string
      enum: [ordinary, sensitive, denied]
      description: |
        Tier of the path (ADR 0034 decision 2 and amendment 2026-10-16): ordinary (below an operator root of the
        organization; org_admin or org_operator), sensitive (every other allowed path; org_admin with a step-up),
        denied (refused; an existing definition is not shipped to devices).
    ManagedFile:
      type: object
      required: [id, device_group_id, path, mode, owner, group, content, tier, sensitive_confirmed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        device_group_id: { type: string, format: uuid, nullable: true, description: null = every device. }
        path: { type: string }
        mode: { type: string }
        owner: { type: string }
        group: { type: string }
        content: { type: string }
        tier: { $ref: "#/components/schemas/ManagedFileTier" }
        sensitive_confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: When an organization administrator confirmed this file on a sensitive path with a step-up; null otherwise.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ManagedFileCreate:
      type: object
      required: [path, content]
      additionalProperties: false
      properties:
        device_group_id: { type: string, format: uuid, description: Omit for every device of the organization. }
        path:
          type: string
          maxLength: 1024
          description: |
            Below /etc/, /usr/local/etc/ or /opt/. The path falls into one of three tiers: denied paths (the protected
            areas, the loader, boot, kernel and identity configuration, the units of Paddock and its components) are
            refused with 422 path_not_allowed; a path below an operator root of the organization (GET
            /api/v1/settings/managed-files) is ordinary unless it has an execute bit, a script or shared-object suffix
            or a .d directory component; every other path is sensitive and needs the org_admin role (403 forbidden
            otherwise) and a step-up (403 step_up_required; API tokens cannot satisfy it).
        mode: { type: string, pattern: "^0[0-7]{3}$", default: "0644" }
        owner: { type: string, default: root }
        group: { type: string, default: root }
        content: { type: string, description: "UTF-8 text, at most 64 KiB." }
    ManagedFileUpdate:
      type: object
      additionalProperties: false
      properties:
        path: { type: string, maxLength: 1024 }
        mode: { type: string, pattern: "^0[0-7]{3}$" }
        owner: { type: string }
        group: { type: string }
        content: { type: string }
    ManagedFilePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedFile" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    ManagedUnit:
      type: object
      required: [id, device_group_id, unit, enabled, active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        device_group_id: { type: string, format: uuid, nullable: true, description: null = every device. }
        unit: { type: string }
        enabled: { type: boolean }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ManagedUnitCreate:
      type: object
      required: [unit]
      additionalProperties: false
      properties:
        device_group_id: { type: string, format: uuid, description: Omit for every device of the organization. }
        unit: { type: string, maxLength: 255, description: "*.service, *.timer, *.socket or *.path; reserved units answer 422 unit_not_allowed." }
        enabled: { type: boolean, default: true }
        active: { type: boolean, default: true }
    ManagedUnitUpdate:
      type: object
      additionalProperties: false
      properties:
        unit: { type: string, maxLength: 255 }
        enabled: { type: boolean }
        active: { type: boolean }
    ManagedUnitPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedUnit" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    OrganizationDomainsUpdate:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains:
          type: array
          maxItems: 20
          description: Lowercase DNS names; the first one is the primary domain of device logins.
          items: { type: string, maxLength: 253 }
    IdentitySource:
      type: string
      enum: [local, synced]
    User:
      type: object
      required: [id, username, display_name, email, source, locked, lock_incomplete, locked_at, created_at, updated_at,
        domain_match]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, description: "UPN, lowercase, e.g. dave@acme.test." }
        domain_match:
          type: boolean
          description: |
            The part of the username after its last @ is one of the organization's domains (plan M8x decision 46). A
            user without it cannot sign in on devices: the login component accepts name@domain only.
        display_name: { type: string }
        email: { type: string }
        source: { $ref: "#/components/schemas/IdentitySource" }
        locked: { type: boolean }
        lock_incomplete:
          type: boolean
          description: "The user is locked for the devices, but Authentik has not confirmed the group membership and the token revocation; locking again retries."
        locked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserRef:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [groups]
          properties:
            groups:
              type: array
              items: { $ref: "#/components/schemas/UserGroupRef" }
    UserCreate:
      type: object
      required: [username, display_name]
