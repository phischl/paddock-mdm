        reason: { type: string, maxLength: 500, description: Optional; trimmed. }
    SoftwareRequestDenial:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: "Required: the user sees it. Trimmed; must not be empty." }
    SoftwareCatalogEntryPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SoftwareCatalogEntry" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    SoftwareAssignmentCreate:
      type: object
      required: [catalog_entry_id, intent]
      additionalProperties: false
      properties:
        catalog_entry_id: { type: string, format: uuid }
        device_group_id: { type: string, format: uuid, nullable: true, description: "Omit or null, together with user_id and user_group_id, for every device of the organization." }
        user_id: { type: string, format: uuid, nullable: true, description: The user the assignment targets. }
        user_group_id: { type: string, format: uuid, nullable: true, description: The user group the assignment targets. }
        intent: { $ref: "#/components/schemas/SoftwareIntent" }
