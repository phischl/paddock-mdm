        items:
          type: array
          items: { $ref: "#/components/schemas/CompileWarning" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    SoftwareAssignmentPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SoftwareAssignment" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DeviceSoftwareState:
      type: string
      enum: [installed, held, absent, pending, failed, not_applicable, unknown]
      description: |
        installed, held, absent, pending and failed are what the device reported; not_applicable (no package for the
        device's os-release and architecture) and unknown (applicable, not reported yet) are derived on read.
    DeviceManagedSoftware:
      type: object
      required: [catalog_entry_id, name, package, intent, state, version, reason, error, scope, reported_at]
      properties:
        catalog_entry_id: { type: string, format: uuid }
        name: { type: string, description: The catalog entry's name. }
        package: { type: string, description: "The package on the device; empty for not_applicable." }
        intent: { $ref: "#/components/schemas/SoftwareIntent" }
        state: { $ref: "#/components/schemas/DeviceSoftwareState" }
        version: { type: string }
        reason: { type: string, description: "pending: dpkg_locked, deferred_offline, outside_window or not_yet_applied; failed: the reason of software.apply_failed." }
        error: { type: string, description: At most 200 characters; may name paths. }
        scope: { $ref: "#/components/schemas/SoftwareScope" }
        reported_at: { type: string, format: date-time, nullable: true, description: null for a derived state. }
    DeviceManagedSoftwarePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort, truncated]
      properties:
        truncated: { type: boolean, description: "The device's last report left items out to keep the check-in small; an entry without a reported row may be managed all the same." }
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceManagedSoftware" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
