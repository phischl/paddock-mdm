          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ChangeSetSource" }
        - name: rollout
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ChangeSetRollout" }
      responses:
        "200":
          description: One page of change sets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSetPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/change-sets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getChangeSet
      tags: [config]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The change set with its plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeSet" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/change-sets/{id}/revert:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: revertChangeSet
      tags: [config]
      description: |
        Roles: org_admin, org_operator. Applies the inverse of a change set in one transaction (plan M11 decision 21):
        an item it created is deleted, an item it updated or deleted is restored from its stored before-state; items
        created since are kept, and an item whose deleted key was created again since is set back to the before-state.
        The rules of the per-resource endpoints apply unchanged, as for PUT /api/v1/config (organization
        administrators only for device group deletions and settings, a step-up for full profiles, the managed-file
        operator roots and the watched units). With dry_run=true the plan is computed and checked but nothing is
        applied and nothing is audited. Otherwise expected_plan is required (400 invalid_request without it) and a
        different plan is refused with 412 plan_changed. The revert is recorded as a new change set whose
        reverts_change_set_id is the original. 409 invalid_state when the change set has no before-state (recorded
        before before-states were stored, or purged after 90 days) or was already reverted. 404 not_found for an
        unknown change set or one of another organization. The revert of the change set of the open rollout ends that
        rollout (status reverted) and reaches every device at once; any other revert follows the staging and conflict
        rules of PUT /api/v1/config, with urgent and reason as the opt-out.
      x-paddock-audit: config.reverted
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: dry_run
          in: query
          description: Compute and check the inverse plan without applying it.
          schema: { type: boolean, default: false }
        - name: expected_plan
          in: query
          description: plan_sha256 of the confirmed dry run; required unless dry_run. A different plan is refused with 412 plan_changed.
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - name: urgent
          in: query
          description: Opt out of a staged rollout; needs reason, a step-up and enabled rollouts, as RolloutUrgent.
          schema: { type: boolean, default: false }
        - name: reason
          in: query
          description: Why the change set is reverted (2 to 500 characters); with urgent also the urgent reason.
          schema: { type: string, minLength: 2, maxLength: 500 }
      responses:
        "200":
          description: The inverse plan, applied unless dry_run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }

  /api/v1/config-rollouts:
    get:
      operationId: listConfigRollouts
      tags: [config]
      description: |
        Roles: org_admin, org_operator, org_auditor. The staged configuration rollouts of the organization (plan M11
        decision 34), each with its counts, which are also what the worker evaluates: eligible are the active devices
        inside the wave the rollout reached (every device once it completed). Of each device the newest report on a
        bundle of the rollout is read: failed when, received by the server since the rollout's start or last resume, it
        is a rejection or an enforced apply with a failed staged resource; applied when it is an enforced apply without
        a failed staged resource; pending otherwise, also a report-only apply. The failed resources of a report-only
        device are plan errors and never count; its rejection does.
      x-paddock-list:
        sort: [started_at, status]
        default_sort: -started_at
        search: [started_by]
        filters: [status]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ConfigRolloutSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ConfigRolloutStatus" }
      responses:
        "200":
          description: One page of rollouts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRolloutPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/config-rollouts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getConfigRollout
      tags: [config]
      description: "Roles: org_admin, org_operator, org_auditor. A rollout with its counts, its change set and the bundle resource IDs it stages; 404 not_found for an unknown rollout or one of another organization."
      responses:
        "200":
          description: The rollout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRolloutDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/config-rollouts/{id}/devices:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listConfigRolloutDevices
      tags: [config]
      description: |
        Roles: org_admin, org_operator, org_auditor. The active devices of the organization as the rollout sees them:
        whether each is inside the wave the rollout reached, its newest bundle and whether that bundle carries the
        rollout, and the newest report on a bundle of the rollout, the one the counts read, with its failed staged
        resources, and whether the device holds the rollout until it applies successfully (awaiting_retry). Equal sort
        keys are ordered by hostname. 404 not_found for an unknown rollout or one of another organization.
      x-paddock-list:
        sort: [hostname, in_wave, report_outcome]
        default_sort: hostname
        search: [hostname]
        filters: [in_wave, report_outcome, awaiting_retry]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/ConfigRolloutDeviceSort"
        - $ref: "#/components/parameters/Search"
        - name: in_wave
          in: query
          schema: { type: boolean }
        - name: report_outcome
          in: query
          description: |
            Repeatable; applied, rejected, report_only or none (400 invalid_request otherwise). The values are not an
            OpenAPI enum, as for the outcome filter of the device's bundles.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: awaiting_retry
          in: query
          description: Only the devices whose awaiting_retry is this value.
          schema: { type: boolean }
      responses:
        "200":
          description: One page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRolloutDevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/config-rollouts/{id}/halt:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: haltConfigRollout
      tags: [config]
      description: |
        Roles: org_admin, org_operator. running → halted with a reason of 2 to 500 characters (400 invalid_request
        otherwise). Devices keep the state of the wave the rollout reached; the rollout stays open, so its staged keys
        stay blocked until it is resumed and completed, completed, or its change set reverted. 409 invalid_state when
        the rollout is not running; 404 not_found for an unknown rollout or one of another organization.
      x-paddock-audit: config_rollout.halted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigRolloutHalt" }
      responses:
        "200":
          description: Halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/config-rollouts/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resumeConfigRollout
      tags: [config]
      description: |
        Roles: org_admin, org_operator. halted → running in the wave where it stopped; failures reported before the
        resume no longer count, and the wave's minimum duration starts again. 409 invalid_state when the rollout is not halted; 404 not_found for an unknown rollout
        or one of another organization.
      x-paddock-audit: config_rollout.resumed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/config-rollouts/{id}/advance:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: advanceConfigRollout
      tags: [config]
      description: |
        Roles: org_admin, org_operator. Moves a running rollout to its next wave now; its devices receive the staged
        change at their next check-in. 409 invalid_state when the rollout is halted, ended or in its last wave
        (complete it instead); 404 not_found for an unknown rollout or one of another organization.
      x-paddock-audit: config_rollout.advanced
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Advanced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/config-rollouts/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: completeConfigRollout
      tags: [config]
      description: |
        Roles: org_admin, org_operator. Ends a running or halted rollout: every device receives the staged change at
        its next check-in. It works also after rollouts were switched off in the settings: an open rollout keeps its
        rules until it is completed or its change set reverted. 409 invalid_state when the rollout already completed
        or was reverted; 404 not_found for an unknown rollout or one of another organization.
      x-paddock-audit: config_rollout.completed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/autoinstall:
    post:
      operationId: generateAutoinstall
      tags: [enrollment-tokens]
      description: |
        Roles: org_admin, org_operator. Generates the Ubuntu autoinstall user-data that installs one device with
        Paddock (plan M4b decisions 2–4): LVM inside LUKS2 under a random temporary passphrase, the Debian packages of
        the newest published agent release that has both (pinned by SHA-256; 409 invalid_state if there is none), the
        enrollment configuration, and the first-boot disk setup with the organization's boot_pin_min_length. The
        enrollment configuration must be one of this organization (404 not_found otherwise, also for another
        organization's) whose token can still enroll a device (422 token_revoked, token_expired or token_exhausted).
        Nothing is stored; the response contains the passphrase and the token and is never cached.
      x-paddock-audit: autoinstall.generated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoinstallRequest" }
      responses:
        "200":
          description: The user-data (cloud-config with the autoinstall section).
          content:
            text/yaml:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
