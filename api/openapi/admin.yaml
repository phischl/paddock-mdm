              schema: { $ref: "#/components/schemas/DiskEncryption" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/disk/recovery-key:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: revealDeviceRecoveryKey
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Returns the newest stored
        recovery key of the device; confirm_hostname must equal the device's hostname. 409 invalid_state when none is
        stored, 404 not_found once a Destroy of the device was issued. Type it at the boot PIN prompt once the PIN attempts are used up (docs/operations/disk-recovery.md).
        Responses are never cached.
      x-paddock-audit: disk.recovery_key_revealed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalAdminRevealRequest" }
      responses:
        "200":
          description: The recovery key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiskRecoveryKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/disk/header:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: downloadDeviceHeader
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Returns a stored LUKS header
        backup of a LUKS volume of the device (the root volume unless volume is given), decrypted (the newest
        generation unless generation is given), as the file <hostname>-luks-header-<volume>-<generation>.img
        (<hostname>-luks-header-<generation>.img for a root header without a volume) for cryptsetup
        luksHeaderRestore; confirm_hostname must equal the
        device's hostname. 409 invalid_state when no such generation is stored, 404 not_found once a Destroy of the
        device was issued.
      x-paddock-audit: disk.header_downloaded
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiskHeaderRequest" }
      responses:
        "200":
          description: The header backup.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/diagnostics:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: requestDeviceDiagnostics
      tags: [devices]
      description: |
        Roles: org_admin, org_operator (ADR 0048 decision 4). Asks an active device for a diagnostics bundle: Paddock's
        own logs and configuration of the closed content list, sealed to escrow-wrap. The device tells its user before
        it collects. reason (2 to 500 characters) is shown to the user and recorded. 409 invalid_state when the device
        is not active or a collection of it is pending.
      x-paddock-audit: device.diagnostics_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiagnosticsRequest" }
      responses:
        "202":
          description: The bundle in state requested; its ID is the collect_status command's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDeviceDiagnostics
      tags: [devices]
      description: "Roles: org_admin, org_operator. The diagnostics bundles of the device (ADR 0048 decision 4); org_auditor: 403."
      x-paddock-list:
        sort: [requested_at, state]
        default_sort: -requested_at
        search: [requested_by, reason]
        filters: [state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceDiagnosticsSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DiagnosticsStateFilter"
      responses:
        "200":
          description: One page of bundles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticsPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics:
    get:
      operationId: listDiagnostics
      tags: [devices]
      description: "Roles: org_admin, org_operator. Every diagnostics bundle of the organization (ADR 0048 decision 4); org_auditor: 403."
      x-paddock-list:
        sort: [requested_at, hostname, state]
        default_sort: -requested_at
        search: [hostname, requested_by]
        filters: [state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DiagnosticsSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DiagnosticsStateFilter"
      responses:
        "200":
          description: One page of bundles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticsPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDiagnostics
      tags: [devices]
      description: "Roles: org_admin, org_operator. One diagnostics bundle; org_auditor: 403."
      responses:
        "200":
          description: The bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/{id}/download:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: downloadDiagnostics
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, with a step-up within the last 300 s (403 step_up_required); every download
        needs its own step-up, because the archive may name the device's users. The escrow-reader unwraps the bundle's
        key for purpose diagnostics; the response is the decrypted archive
        (paddock-diagnostics-<hostname>-<id>.tar.gz). Before anything is decrypted the whole sealed object is read and
        its size and SHA-256 are checked against the bundle: an object that does not match (replaced after it was
        stored) or is missing is refused with 409 invalid_state, nothing is served and the download is recorded as a
        failure. 409 invalid_state as well unless the bundle is stored. HEAD is refused with 405 (Allow: GET).
      x-paddock-audit: device.diagnostics_downloaded
      responses:
        "200":
          description: The diagnostics archive.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/diagnostics/{id}/purge:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: purgeDiagnostics
      tags: [devices]
      description: |
        Roles: org_admin. Deletes the stored bundle's object (every version) and its key material at once (ADR 0048
        decision 5); the metadata (who, when, hash, downloads) stays. 409 invalid_state unless the bundle is stored.
      x-paddock-audit: device.diagnostics_purged
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The purged bundle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/effective-sudo:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceEffectiveSudo
      tags: [privileges]
      description: |
        Roles: org_admin, org_operator, org_auditor. The effective sudo profiles of the users allowed on the device
        whose class is not none, sorted by username (the content of the device's sudo resource).
      responses:
        "200":
          description: The effective sudo profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveSudo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/software:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceSoftware
      tags: [inventory]
      description: |
        Roles: org_admin, org_operator, org_auditor. The packages installed on the device as the inventory system
        reported them at the last sync (plan M5a decision 9).
      x-paddock-list:
        sort: [name, version]
        default_sort: name
        search: [name]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceSoftwareSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of installed packages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstalledSoftwarePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/managed-software:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceManagedSoftware
      tags: [software]
      description: |
        Roles: org_admin, org_operator, org_auditor. The catalog applications the device manages (plan M13a §3.4): what
        the device reported for each, and for an application assigned to it that it has not reported on the derived state
        not_applicable (the entry names no package for the device's os-release and architecture) or unknown (a package
        applies, no report yet). An application the device reports in system and in user scope is listed once per scope
        (plan M13b decision 17). The state, intent and scope filters apply to derived entries too; derived entries have
        no reported_at. 404 not_found for another organization's device.
      x-paddock-list:
        sort: [name, state, reported_at]
        default_sort: name
        search: [name]
        filters: [state, intent, scope]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceManagedSoftwareSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceSoftwareStateFilter"
        - $ref: "#/components/parameters/DeviceManagedSoftwareIntentFilter"
        - $ref: "#/components/parameters/DeviceSoftwareScopeFilter"
      responses:
        "200":
          description: One page of managed software.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceManagedSoftwarePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/vulnerabilities:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceVulnerabilities
      tags: [inventory]
      description: |
        Roles: org_admin, org_operator, org_auditor. The CVEs matched to the device's packages, with Ubuntu's priority,
        fixed version and CVSS vector for the device's release (ADR 0020). Fleet free reports no CVSS score: a finding
        Ubuntu has no priority for has severity unknown.
      x-paddock-list:
        sort: [cvss_score, severity, cve]
        default_sort: -cve
        search: [cve, software_name]
        filters: [severity]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/FindingSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SeverityFilter"
      responses:
        "200":
          description: One page of vulnerability findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnerabilityFindingPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
