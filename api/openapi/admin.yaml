    SoftwareUpdateRule:
      type: string
      enum: [latest, pinned]
    PackageRef:
      type: object
      required: [distribution, release, architecture]
      additionalProperties: false
      description: Names either an APT package (package) or a Flatpak application (flatpak_ref, with scope); an entry of a Flatpak source names Flatpak applications only, every other entry APT packages only.
      properties:
        distribution: { type: string, maxLength: 32, description: "The ID of /etc/os-release, ^[a-z][a-z0-9-]{0,31}$, e.g. ubuntu or debian." }
        release: { type: string, maxLength: 32, description: "* or the VERSION_ID, ^[a-z0-9][a-z0-9.-]{0,31}$, e.g. 24.04." }
        architecture: { type: string, enum: ["*", amd64, arm64] }
        package: { type: string, maxLength: 128, description: "^[a-z0-9][a-z0-9+.-]+$" }
        flatpak_ref: { type: string, maxLength: 255, description: "A Flatpak application ID, ^[A-Za-z][A-Za-z0-9_-]*(\\.[A-Za-z][A-Za-z0-9_-]*){2,}$, e.g. org.gimp.GIMP." }
        scope: { $ref: "#/components/schemas/SoftwareScope" }
    SoftwareCatalogEntryCreate:
      type: object
