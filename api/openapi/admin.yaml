      operationId: listRevocationRequests
      tags: [revocation]
      description: |
        Roles: org_admin. The organization's Lock, Destroy and self-lock requests with their approvals (never the
        step-up tokens). An issued request that the device has not confirmed yet is pending; issued_at tells for how
        long.
      x-paddock-list:
        sort: [requested_at, status, action, hostname]
        default_sort: -requested_at
        search: [hostname, reason]
        filters: [status, action, device_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RevocationRequestSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/RevocationStatus" }
        - name: action
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/RevocationAction" }
        - name: device_id
          in: query
