        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentReleaseCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRelease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/import:
    post:
      operationId: importAgentRelease
      x-paddock-step-up: true
      tags: [platform]
      description: >-
        Roles: platform_admin, with a step-up within the last 300 s (403 step_up_required; API tokens cannot satisfy
        it). Imports the version from the configured release source (ADR 0043): the version must be newer than the
        newest published release, every file is verified with the release public key before anything is stored, and
        the release is published without a rollout; paddock-revoke is never imported. The whole import is bounded by
        90 s.
      x-paddock-audit: agent_release.imported
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentReleaseImport" }
      responses:
        "201":
          description: Imported and published.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleaseDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-release-source:
    get:
      operationId: getAgentReleaseSource
      tags: [platform]
      description: >-
        Roles: platform_admin. The configured agent release source (ADR 0043 decision 6); repository and url are null
        while the source is switched off. No outbound request.
      responses:
        "200":
          description: The release source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleaseSource" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-release-source/check:
    post:
      operationId: checkAgentReleaseSource
      x-paddock-mcp: { expose: false }
      tags: [platform]
      description: >-
        Roles: platform_admin. Lists the releases of the source and compares the latest with the newest published
        release (ADR 0043 decision 3); changes nothing and is not audited. 403 release_source_disabled while the source
        is switched off, 502 release_source_unavailable when the source does not answer.
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The latest release of the source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleaseCheck" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}:
    parameters:
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getAgentRelease
      tags: [platform]
      description: "Roles: platform_admin. The release with its artifacts and rollout, including device counts."
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleaseDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/artifacts/{arch}:
    parameters:
      - $ref: "#/components/parameters/Version"
      - name: arch
        in: path
        required: true
        schema: { type: string, enum: [amd64, arm64] }
    put:
      operationId: uploadAgentArtifact
      tags: [platform]
      description: |
        Roles: platform_admin. Uploads the paddockd binary of a draft release for one architecture (at most 128 MiB).
        The server verifies the minisign signature with the configured release public key before it accepts the
        binary (400 otherwise); the signed trusted comment must be `paddock-agent version=<version> arch=<arch>`
        for this release and architecture (422 release_signature_mismatch otherwise), so that the supervisor can bind
        the binary to its version. Uploading again replaces the artifact while the release is a draft.
      x-paddock-audit: agent_release.artifact_uploaded
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: X-Paddock-Minisig
          in: header
          required: true
          description: Standard base64 of the .minisig signature file of the binary.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The stored artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentArtifact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/packages/{name}/{arch}:
    parameters:
      - $ref: "#/components/parameters/Version"
      - name: name
        in: path
        required: true
        schema: { type: string, enum: [paddock-agent, paddock-supervisor, paddock-revoke, fleet-osquery] }
      - name: arch
        in: path
        required: true
        schema: { type: string, enum: [amd64, arm64] }
    put:
      operationId: uploadAgentPackage
      tags: [platform]
      description: |
        Roles: platform_admin. Uploads a Debian package of a draft release (at most 128 MiB), signed like the
        binary: the server verifies the minisign signature with the configured release public key, paddock-revoke with
        the revocation release public key (400 otherwise).
        Packages are stored below packages/ in the artifact bucket and served without authentication at
        https://bundles.<domain>/packages/<version>/<name>_<version>_<arch>.deb; the Paddock autoinstall pins their
        SHA-256 (plan M4b decision 1). fleet-osquery (fleetd, plan M5a decision 3) needs package_version, the fleetd
        version its file is named after (packages/<version>/fleet-osquery_<package_version>_<arch>.deb); the agent
        installs it, the autoinstall never. Uploading again replaces the package while the release is a draft.
        Audited as an artifact upload with kind deb.
      x-paddock-audit: agent_release.artifact_uploaded
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: package_version
          in: query
          required: false
          description: The fleetd version of fleet-osquery, e.g. 1.48.0; required for fleet-osquery and refused for every other package.
          schema: { type: string, pattern: '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$' }
        - name: X-Paddock-Minisig
          in: header
          required: true
          description: Standard base64 of the .minisig signature file of the package.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The stored package.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPackage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/publish:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: publishAgentRelease
      tags: [platform]
      description: "Roles: platform_admin. draft → published; requires at least one artifact. Published releases are immutable. Refused with invalid_state while a file of the release is being uploaded or when a stored file does not match its checksum (PDK-496); upstream_unavailable when the artifact store cannot be read."
      x-paddock-audit: agent_release.published
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRelease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/rollout:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: startAgentRollout
      tags: [platform]
      description: |
        Roles: platform_admin. Starts the staged rollout of a published release; only one rollout runs at a time
        (409). Devices whose rollout bucket is inside the current wave are offered the release at their next
        check-in; the worker advances waves after min_wave_minutes and halts the rollout when the failed devices
        reach max(failure_threshold_min, ceil(eligible × failure_threshold_percent / 100)); failures count from the
        start or the last resume. After the last wave the release is the current release (completed); it halts when
        the failed devices of the last 7 days (at most since the last resume) reach the same threshold over the
        devices that checked in within that time. min_wave_minutes below 60 is accepted only in development.
      x-paddock-audit: agent_rollout.started
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRolloutStart" }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/rollout/halt:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: haltAgentRollout
      tags: [platform]
      description: "Roles: platform_admin. running → halted; devices are no longer offered the release."
      x-paddock-audit: agent_rollout.halted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/sessions/end-all:
    post:
      operationId: endAllSessions
      x-paddock-step-up: true
      tags: [platform]
      description: >-
        Roles: platform_admin, with a step-up within the last 5 minutes (403 step_up_required). Ends every portal
        session and every identity-provider browser session of every portal user (platform administrators and
        organization role members); device logins and API tokens are not affected. The caller's own session ends with
        its next request; every administrator signs in again. 503 session_store_unavailable while the session store is
        unreachable; 502 upstream_unavailable when the identity provider's sessions could not be ended (the portal
        sessions are ended already; end all sessions again).
      x-paddock-audit: platform.sessions_ended
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Every session of an older generation is ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsEnded" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/access-review:
    get:
      operationId: getPlatformAccessReview
      x-paddock-mcp: { expose: false }
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin. The access review of the platform: platform role members, platform administrators, privileged platform events and the organizations created in the period. One report object, not a collection: every list holds at most 1000
        items and states its total. from and to are RFC 3339; to defaults to now and from to 90 days before to; the
        period spans at most 400 days (400 invalid_request beyond or when from is not before to). Role members are the
        worker's snapshot of the identity provider (at most one 5-minute round old). Every view is recorded as platform.access_review_viewed (platform reads are not under an organization's privacy switch).
      x-paddock-audit: platform.access_review_viewed
      parameters:
        - $ref: "#/components/parameters/AccessReviewFrom"
        - $ref: "#/components/parameters/AccessReviewTo"
      responses:
        "200":
          description: The access review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccessReviewReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/access-review/export:
    get:
      operationId: exportPlatformAccessReview
      x-paddock-mcp: { expose: false }
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin. The access review as a download: format json (the same object as the view) or csv (one file for
        every section, told apart by the section column; cells that a spreadsheet could run as a formula carry a
        leading apostrophe). Content-Disposition names the file paddock-access-review-platform-<from>-<to>.<json|csv>. Period as for the view.
        Every export is recorded as platform.access_review_exported, whatever the privacy settings.
      x-paddock-audit: platform.access_review_exported
      parameters:
        - $ref: "#/components/parameters/AccessReviewFrom"
        - $ref: "#/components/parameters/AccessReviewTo"
        - $ref: "#/components/parameters/AccessReviewFormat"
      responses:
        "200":
          description: The exported report.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccessReviewReport" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/openbao/auto-unseal:
    get:
      operationId: getAutoUnseal
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin. The automatic-unseal setting (ADR 0035): the acknowledged decision, the unsealer's
        report and OpenBao's seal status. Sessions only: platform tokens do not exist.
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoUnsealStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/openbao/auto-unseal/enable:
    post:
      operationId: enableAutoUnseal
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin, with a step-up within the last 5 minutes (403 step_up_required). Records the typed
        acknowledgement of the current disclaimer and enables the setting; the unsealer on the host acts only while it
        is enabled. 409 disclaimer_outdated when disclaimer_version is not the current version (the response of GET
        carries it); 400 invalid_request when acknowledgement is not the exact sentence of the disclaimer. Every
        attempt is audited.
      x-paddock-audit: platform.auto_unseal_enabled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoUnsealEnable" }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoUnsealStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/openbao/auto-unseal/disable:
    post:
      operationId: disableAutoUnseal
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin, with a step-up within the last 5 minutes (403 step_up_required). Disables the setting:
        the unsealer stops unsealing at once; the shares stay on the host until the operator runs
        ./paddock auto-unseal disable. Every attempt is audited.
      x-paddock-audit: platform.auto_unseal_disabled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoUnsealStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/key:
    get:
      operationId: getBackupKey
      tags: [platform]
      description: |
        Roles: platform_admin. The backup key state (plan M15 decision 7): the active key, the key waiting for its
        confirmation and the retired keys. Never the key text, its ciphertext or the challenge hash; the challenge
        positions only for the key waiting for its confirmation (amendment 2026-11-04).
      responses:
        "200":
          description: The key state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupKeyStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: generateBackupKey
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin, with a step-up within the last 5 minutes (403 step_up_required; API tokens never have
        one). Generates a new backup key (32 random bytes, standard base64) and returns its text exactly once, with
        six 1-based positions whose characters confirm it (POST /api/platform/v1/backup/key/{id}/confirm). The
        response is not cached; the key is never shown again. No backup runs until a key is confirmed; a key
        generated while one is active replaces it on confirmation. 409 invalid_state while another key waits for its
        confirmation. Every attempt is audited; the key text never is.
      x-paddock-audit: platform.backup_key_generated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: The new key, shown once.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupKeyGenerated" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/backup/key/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/BackupKeyId"
    post:
      operationId: confirmBackupKey
      x-paddock-step-up: true
      tags: [platform]
      description: |
        Roles: platform_admin, with a step-up within the last 5 minutes (403 step_up_required). Confirms a key with
        the characters of its text at the six positions of the generating response (or of pending.positions in GET
        /api/platform/v1/backup/key), in that order. The key becomes
        active; a previously active key is retired. 400 invalid_request when the answer is not six characters; 409
        backup_key_mismatch for wrong characters, with attempts_left=<n> in the detail; the third mismatch discards
        the key; 409 invalid_state for a key that is not unconfirmed; 404 not_found. Every attempt is audited; the
        answer never is.
      x-paddock-audit: platform.backup_key_confirmed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupKeyConfirm" }
      responses:
        "200":
          description: The confirmed key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupKey" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
