  /api/platform/v1/organizations:
    get:
      operationId: listOrganizations
      tags: [platform]
      description: "Roles: platform_admin."
      x-paddock-list:
        sort: [slug, name, created_at, status]
        default_sort: slug
        search: [slug, name]
        filters: [status]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/OrganizationSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/OrganizationStatus" }
      responses:
        "200":
          description: One page of organizations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrganization
      tags: [platform]
      description: |
        Roles: platform_admin. Creates the organization and its Authentik groups. Repeating the request for an
        organization in status provisioning_failed with the same slug re-provisions it (200).
      x-paddock-audit: organization.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "200":
          description: Re-provisioned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getOrganization
      tags: [platform]
      description: "Roles: platform_admin."
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateOrganization
      tags: [platform]
      description: |
        Roles: platform_admin. Replaces the domains of the organization (plan M3a decision 1): lowercase DNS names,
        each belonging to one organization only (409 domain_taken); the first is the primary domain of device logins
        and local usernames must use one of them.
      x-paddock-audit: organization.domains_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationDomainsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/platform/v1/agent-releases:
    get:
      operationId: listAgentReleases
      tags: [platform]
      description: "Roles: platform_admin. Agent releases with their rollout status (plan M2b decision 20)."
      x-paddock-list:
        sort: [version, created_at, status]
        default_sort: -created_at
        search: [version]
        filters: [status]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AgentReleaseSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AgentReleaseStatus" }
      responses:
        "200":
          description: One page of agent releases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleasePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgentRelease
      tags: [platform]
      description: "Roles: platform_admin. Creates a draft release."
      x-paddock-audit: agent_release.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentReleaseCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRelease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}:
    parameters:
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getAgentRelease
      tags: [platform]
      description: "Roles: platform_admin. The release with its artifacts and rollout, including device counts."
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleaseDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/artifacts/{arch}:
    parameters:
      - $ref: "#/components/parameters/Version"
      - name: arch
        in: path
        required: true
        schema: { type: string, enum: [amd64, arm64] }
    put:
      operationId: uploadAgentArtifact
      tags: [platform]
      description: |
        Roles: platform_admin. Uploads the paddockd binary of a draft release for one architecture (at most 128 MiB).
        The server verifies the minisign signature with the configured release public key before it accepts the
        binary (400 otherwise); the signed trusted comment must be `paddock-agent version=<version> arch=<arch>`
        for this release and architecture (422 release_signature_mismatch otherwise), so that the supervisor can bind
        the binary to its version. Uploading again replaces the artifact while the release is a draft.
      x-paddock-audit: agent_release.artifact_uploaded
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: X-Paddock-Minisig
          in: header
          required: true
          description: Standard base64 of the .minisig signature file of the binary.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The stored artifact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentArtifact" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/packages/{name}/{arch}:
    parameters:
      - $ref: "#/components/parameters/Version"
      - name: name
        in: path
        required: true
        schema: { type: string, enum: [paddock-agent, paddock-supervisor, paddock-revoke, fleet-osquery] }
      - name: arch
        in: path
        required: true
        schema: { type: string, enum: [amd64, arm64] }
    put:
      operationId: uploadAgentPackage
      tags: [platform]
      description: |
        Roles: platform_admin. Uploads a Debian package of a draft release (at most 128 MiB), signed like the
        binary: the server verifies the minisign signature with the configured release public key, paddock-revoke with
        the revocation release public key (400 otherwise).
        Packages are stored below packages/ in the artifact bucket and served without authentication at
        https://bundles.<domain>/packages/<version>/<name>_<version>_<arch>.deb; the Paddock autoinstall pins their
        SHA-256 (plan M4b decision 1). fleet-osquery (fleetd, plan M5a decision 3) needs package_version, the fleetd
        version its file is named after (packages/<version>/fleet-osquery_<package_version>_<arch>.deb); the agent
        installs it, the autoinstall never. Uploading again replaces the package while the release is a draft.
        Audited as an artifact upload with kind deb.
      x-paddock-audit: agent_release.artifact_uploaded
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - name: package_version
          in: query
          required: false
          description: The fleetd version of fleet-osquery, e.g. 1.48.0; required for fleet-osquery and refused for every other package.
          schema: { type: string, pattern: '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$' }
        - name: X-Paddock-Minisig
          in: header
          required: true
          description: Standard base64 of the .minisig signature file of the package.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The stored package.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPackage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/publish:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: publishAgentRelease
      tags: [platform]
      description: "Roles: platform_admin. draft → published; requires at least one artifact. Published releases are immutable."
      x-paddock-audit: agent_release.published
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRelease" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/rollout:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: startAgentRollout
      tags: [platform]
      description: |
        Roles: platform_admin. Starts the staged rollout of a published release; only one rollout runs at a time
        (409). Devices whose rollout bucket is inside the current wave are offered the release at their next
        check-in; the worker advances waves after min_wave_minutes and halts the rollout when the failed devices
        reach max(failure_threshold_min, ceil(eligible × failure_threshold_percent / 100)); failures count from the
        start or the last resume. After the last wave the release is the current release (completed); it halts when
        the failed devices of the last 7 days (at most since the last resume) reach the same threshold over the
        devices that checked in within that time. min_wave_minutes below 60 is accepted only in development.
      x-paddock-audit: agent_rollout.started
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRolloutStart" }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/rollout/halt:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: haltAgentRollout
      tags: [platform]
      description: "Roles: platform_admin. running → halted; devices are no longer offered the release."
      x-paddock-audit: agent_rollout.halted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Halted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases/{version}/rollout/resume:
    parameters:
      - $ref: "#/components/parameters/Version"
    post:
      operationId: resumeAgentRollout
      tags: [platform]
      description: "Roles: platform_admin. halted → running in the wave where it stopped; a rollout that had completed returns to completed (the current release); failures reported before the resume no longer count."
      x-paddock-audit: agent_rollout.resumed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: paddock_session
  parameters:
    Csrf:
      name: X-Paddock-CSRF
      in: header
      required: true
      schema: { type: string, enum: ["1"] }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Page number. page × page_size may not exceed 10000 (400 page_out_of_range).
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
    Search:
      name: q
      in: query
      description: Case-insensitive substring search over the fields listed in x-paddock-list.search.
      schema: { type: string, minLength: 2, maxLength: 100 }
    DeviceGroupSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
        default: name
    AuditEventSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The event_id is the tie-breaker.
      schema:
        type: string
        enum: [occurred_at, -occurred_at, code, -code, outcome, -outcome]
        default: -occurred_at
    AgentReleaseSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The version is the tie-breaker.
      schema:
        type: string
        enum: [version, -version, created_at, -created_at, status, -status]
        default: -created_at
    Version:
      name: version
      in: path
      required: true
      description: Semantic version of an agent release.
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$', maxLength: 64 }
    OrganizationSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [slug, -slug, name, -name, created_at, -created_at, status, -status]
        default: slug
    DeviceSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. Devices without contact sort last. The id is the tie-breaker.
      schema:
        type: string
        enum: [hostname, -hostname, last_contact_at, -last_contact_at, enrolled_at, -enrolled_at, state, -state]
        default: hostname
    EnrollmentTokenSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, created_at, -created_at, expires_at, -expires_at]
        default: -created_at
    ManagedFileSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [path, -path, created_at, -created_at, updated_at, -updated_at]
        default: path
    ManagedUnitSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [unit, -unit, created_at, -created_at, updated_at, -updated_at]
        default: unit
    DeviceCommandSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [issued_at, -issued_at, expires_at, -expires_at, type, -type, status, -status]
        default: -issued_at
    RevocationRequestSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [requested_at, -requested_at, status, -status, action, -action, hostname, -hostname]
        default: -requested_at
    DeviceStateFilter:
      name: state
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/DeviceState" }
    DeviceGroupFilter:
      name: device_group_id
      in: query
      description: Only definitions scoped to this device group.
      schema: { type: string, format: uuid }
    UserSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [username, -username, display_name, -display_name, created_at, -created_at]
        default: username
    UserGroupSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, slug, -slug, created_at, -created_at]
        default: name
    UpstreamGroupSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending (case-insensitive). The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name]
        default: name
    PermissionProfileSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [name, -name, class, -class, created_at, -created_at, updated_at, -updated_at]
        default: name
    ProfileAssignmentSort:
      name: sort
      in: query
      description: Sort field; "-" prefix sorts descending. The id is the tie-breaker.
      schema:
        type: string
        enum: [created_at, -created_at, subject_type, -subject_type]
        default: created_at
    UserSourceFilter:
      name: source
      in: query
      description: Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: "#/components/schemas/IdentitySource" }
  responses:
    Device:
      description: The device after the transition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Device" }
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, instance]
      properties:
        type: { type: string, description: "urn:paddock:problem:<code>" }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string, description: Request ID }
    Logout:
      type: object
      required: [end_session_url]
      properties:
        end_session_url: { type: string }
    MeOrganization:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
    Me:
      type: object
      required: [id, username, display_name, role, organization, locale, revocation_enabled]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [org_admin, org_operator, org_auditor, platform_admin] }
        organization:
          allOf:
            - $ref: "#/components/schemas/MeOrganization"
          nullable: true
        locale: { type: string, enum: [en] }
        revocation_enabled:
          type: boolean
          description: |
            PADDOCK_REVOCATION_ENABLED of this installation (plan M4c decision 1). While false, Lock, Destroy and the
            dead man's switch answer 403 revocation_disabled.
        step_up:
          $ref: "#/components/schemas/MeStepUp"
    MeStepUp:
      type: object
      description: >-
        Development only (PADDOCK_ENV=development; absent in production): the session's last step-up and the step-up
        timing the server applies, for the acceptance gates.
      required: [window_seconds, max_auth_age_seconds]
      properties:
        at:
          type: string
          format: date-time
          nullable: true
          description: Time of the session's last step-up (whole seconds), null without one.
        window_seconds: { type: integer, description: How long a step-up satisfies a privileged action. }
        max_auth_age_seconds: { type: integer, description: The oldest login a step-up callback accepts (max_age). }
    MeUpdate:
      type: object
      required: [locale]
      additionalProperties: false
      properties:
        locale: { type: string, enum: [en] }
    DeviceGroup:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceGroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
    DeviceGroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
    DeviceGroupPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceGroup" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AgentReleaseStatus:
      type: string
      enum: [draft, published]
    AgentRolloutStatus:
      type: string
      enum: [running, halted, completed]
    AgentReleaseCreate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 64 }
    AgentRelease:
      type: object
      required: [version, status, created_by, created_at, artifact_count]
      properties:
        version: { type: string }
        status: { $ref: "#/components/schemas/AgentReleaseStatus" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        artifact_count: { type: integer }
        rollout_status: { $ref: "#/components/schemas/AgentRolloutStatus" }
    AgentReleasePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgentRelease" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AgentArtifact:
      type: object
      required: [arch, sha256, size, created_at]
      properties:
        arch: { type: string, enum: [amd64, arm64] }
        sha256: { type: string, description: Hex SHA-256 of the binary. }
        size: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    AgentPackage:
      type: object
      required: [name, arch, sha256, size, url_path, created_at]
      properties:
        name: { type: string, enum: [paddock-agent, paddock-supervisor, paddock-revoke, fleet-osquery] }
        package_version: { type: string, description: The fleetd version of fleet-osquery; absent for Paddock's packages. }
        arch: { type: string, enum: [amd64, arm64] }
        sha256: { type: string, description: Hex SHA-256 of the package. }
        size: { type: integer, format: int64 }
        url_path: { type: string, description: "Path of the package below the public bundles host, e.g. /packages/1.2.0/paddock-agent_1.2.0_amd64.deb." }
        created_at: { type: string, format: date-time }
    AgentRolloutStart:
      type: object
      additionalProperties: false
      properties:
        waves:
          type: array
          description: Percentages of devices per wave, strictly increasing, ending with 100. Default [1, 10, 50, 100].
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 1, maximum: 100 }
        min_wave_minutes: { type: integer, minimum: 1, description: "Default 1440; at least 60 outside development." }
        failure_threshold_percent: { type: integer, minimum: 0, maximum: 100, description: Default 2. }
        failure_threshold_min: { type: integer, minimum: 0, description: Default 3. }
    AgentRollout:
      type: object
      required: [version, waves, current_wave_index, wave_started_at, min_wave_minutes, failure_threshold_percent,
                 failure_threshold_min, status, started_by, started_at]
      properties:
        version: { type: string }
        waves: { type: array, items: { type: integer } }
        current_wave_index: { type: integer }
        wave_started_at: { type: string, format: date-time }
        min_wave_minutes: { type: integer }
        failure_threshold_percent: { type: integer }
        failure_threshold_min: { type: integer }
        status: { $ref: "#/components/schemas/AgentRolloutStatus" }
        halted_reason: { type: string }
        started_by: { type: string }
        started_at: { type: string, format: date-time }
    AgentRolloutCounts:
      type: object
      required: [eligible, updated, failed]
      properties:
        eligible: { type: integer, format: int64, description: Active devices inside the current wave. }
        updated: { type: integer, format: int64, description: Devices that reported agent.updated for this version. }
        failed: { type: integer, format: int64, description: "Devices that reported agent.update_failed or agent.rolled_back for this version." }
    AgentReleaseDetail:
      type: object
      required: [release, artifacts, packages]
      properties:
        release: { $ref: "#/components/schemas/AgentRelease" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/AgentArtifact" }
        packages:
          type: array
          description: The Debian packages of the release (plan M4b decision 1).
          items: { $ref: "#/components/schemas/AgentPackage" }
        rollout: { $ref: "#/components/schemas/AgentRollout" }
        counts: { $ref: "#/components/schemas/AgentRolloutCounts" }
    Organization:
      type: object
      required: [id, slug, name, status, domains, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/OrganizationStatus" }
        domains:
          type: array
          description: The organization's domains; the first is the primary domain.
          items: { type: string }
        created_at: { type: string, format: date-time }
    OrganizationStatus:
      type: string
      enum: [provisioning, active, provisioning_failed, suspended]
    OrganizationCreate:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$" }
        name: { type: string, minLength: 1, maxLength: 200 }
    OrganizationPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    AuditOutcome:
      type: string
      enum: [success, failure, denied, unknown]
    AuditActorType:
      type: string
      enum: [admin, platform_admin, system, anonymous, device]
    AuditActor:
      type: object
      required: [type, step_up]
      properties:
        type: { type: string }
        id: { type: string }
        display: { type: string }
        ip: { type: string }
        step_up: { type: boolean }
    AuditTarget:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
        display: { type: string }
    AuditEvent:
      type: object
      required: [event_id, occurred_at, recorded_at, code, outcome, source, actor, target, params, correlation_id]
      properties:
        event_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        code: { type: string }
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        source: { type: string }
        actor: { $ref: "#/components/schemas/AuditActor" }
        target:
          allOf:
            - $ref: "#/components/schemas/AuditTarget"
          nullable: true
        params:
          type: object
          additionalProperties: true
        error_code: { type: string }
        correlation_id: { type: string }
    AuditEventPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    EnrollmentTokenStatus:
      type: string
      enum: [active, revoked, expired, exhausted]
    EnrollmentToken:
      type: object
      required: [id, name, device_group_id, auto_approve, max_uses, uses, expires_at, revoked_at, created_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        device_group_id: { type: string, format: uuid, nullable: true }
        auto_approve: { type: boolean }
        max_uses: { type: integer }
        uses: { type: integer }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/EnrollmentTokenStatus" }
    EnrollmentTokenCreate:
      type: object
      required: [name, expires_at, max_uses, auto_approve]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_at: { type: string, format: date-time, description: At most 30 days ahead. }
        max_uses: { type: integer, minimum: 1, maximum: 1000 }
        device_group_id: { type: string, format: uuid, description: Enrolled devices join this group. }
        auto_approve: { type: boolean, description: Enrolled devices become active without approval. }
    EnrollmentTokenCreated:
      type: object
      required: [token, secret, enrollment_config]
      properties:
        token: { $ref: "#/components/schemas/EnrollmentToken" }
        secret: { type: string, description: "Shown once; distribute it like a password." }
        enrollment_config: { $ref: "#/components/schemas/EnrollmentConfig" }
    EnrollmentConfig:
      type: object
      description: >-
        The document a device needs to enroll; it pins the bundle-signing keys as trust anchor and the
        revocation-signing keys as trust anchor of paddock-revoke. Configurations created before revocation existed
        have no revocation_keys.
      required: [server_url, organization_id, token, bundle_keys]
      properties:
        server_url: { type: string }
        organization_id: { type: string, format: uuid }
        token: { type: string }
        bundle_keys:
          type: array
          items: { $ref: "#/components/schemas/BundleKey" }
        revocation_keys:
          type: array
          description: 'The revocation-signing public keys, e.g. key_id "revocation-signing:v1".'
          items: { $ref: "#/components/schemas/BundleKey" }
    AutoinstallRequest:
      type: object
      required: [enrollment_config, release, hostname, locale, keyboard_layout, timezone]
      additionalProperties: false
      properties:
        enrollment_config: { $ref: "#/components/schemas/EnrollmentConfig" }
        release: { type: string, enum: ["24.04", "26.04"], description: Ubuntu release of the installation medium. }
        hostname: { type: string, maxLength: 63, description: "Host name label: lowercase letters, digits and hyphens." }
        locale: { type: string, maxLength: 32, description: "For example en_US.UTF-8." }
        keyboard_layout: { type: string, maxLength: 8, description: "XKB layout, for example us or de." }
        timezone: { type: string, maxLength: 64, description: "IANA time zone, for example Europe/Berlin." }
    BundleKey:
      type: object
      required: [key_id, public_key]
      properties:
        key_id: { type: string, description: 'e.g. "bundle-signing:v1"' }
        public_key: { type: string, description: Base64 Ed25519 public key. }
    EnrollmentTokenPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EnrollmentToken" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    DeviceState:
      type: string
      enum: [pending, active, rejected, quarantined, retired]
    Device:
      type: object
      required: [id, hostname, state, hardware_uuid, machine_id, os_release, enrollment_token_id, enrolled_at,
                 state_changed_at, bundle_version, last_contact_at, applied_bundle_version, agent_version]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        state: { $ref: "#/components/schemas/DeviceState" }
        hardware_uuid: { type: string, nullable: true }
        machine_id: { type: string, nullable: true }
        os_release:
          type: object
          additionalProperties: { type: string }
        enrollment_token_id: { type: string, format: uuid, nullable: true }
        enrolled_at: { type: string, format: date-time }
        state_changed_at: { type: string, format: date-time }
        bundle_version: { type: integer, format: int64, description: Latest compiled bundle version (0 = none). }
        last_contact_at: { type: string, format: date-time, nullable: true }
        applied_bundle_version: { type: integer, format: int64, nullable: true }
        agent_version: { type: string, nullable: true }
        disk_state: { $ref: "#/components/schemas/DiskState" }
    DeviceGroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    DeviceIdentityKey:
      type: object
      required: [key_id, key_protection, status, created_at]
      properties:
        key_id: { type: string, description: Hex SHA-256 of the public key. }
        key_protection: { type: string, enum: [tpm, file] }
        status: { type: string, enum: [active, revoked] }
        created_at: { type: string, format: date-time }
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          required: [groups, identity_keys, logins_suspended, login_assignment, schema_versions, login_management, login_status, sudo_flavor, presumed_self_locked_at]
          properties:
            groups:
              type: array
              items: { $ref: "#/components/schemas/DeviceGroupRef" }
            identity_keys:
              type: array
              items: { $ref: "#/components/schemas/DeviceIdentityKey" }
            logins_suspended: { type: boolean }
            login_assignment: { $ref: "#/components/schemas/DeviceLoginAssignment" }
            schema_versions:
              type: array
              description: Bundle schema versions the agent reported in its last check-in.
              items: { type: integer }
            login_management:
              type: boolean
              description: The agent supports bundle schema 2 (login and sudo); false means "agent too old for login management".
            login_status: { $ref: "#/components/schemas/DeviceLoginStatus" }
            sudo_flavor:
              type: string
              enum: [classic, sudo-rs]
              nullable: true
              description: The device's sudo implementation as its agent reported it last; null until reported. sudo-rs ignores the custom lecture text.
            presumed_self_locked_at:
              type: string
              format: date-time
              nullable: true
              description: |
                Since when the device is presumed to have locked itself: it has been silent for longer than the
                organization's dead man's switch period while the switch is on (plan M4c decision 17); null otherwise.
    DeviceLoginStatus:
      type: object
      description: The latest login.* and sudo.* report of the device's agent (plan M3b decision 17).
      required: [login, sudo]
      properties:
        login:
          description: Latest login.applied or login.apply_failed; null until the agent reported one.
          allOf:
            - $ref: "#/components/schemas/DeviceReport"
          nullable: true
        sudo:
          description: Latest sudo.apply_failed or sudo.user_unresolved; null until the agent reported one.
          allOf:
            - $ref: "#/components/schemas/DeviceReport"
          nullable: true
    DeviceReport:
      type: object
      required: [type, occurred_at, params]
      properties:
        type: { type: string, description: "Device event type, e.g. login.apply_failed." }
        occurred_at: { type: string, format: date-time }
        params:
          type: object
          additionalProperties: true
          description: The parameters of the event as recorded in the audit log (device.<type>).
    LocalAdmin:
      type: object
      required: [username, active_generation, pending_generation, last_rotated_at, next_rotation_at, last_rotation_error]
      properties:
        username: { type: string }
        active_generation: { type: integer, nullable: true }
        pending_generation: { type: integer, nullable: true, description: "Stored by the server, not yet applied by the device." }
        last_rotated_at: { type: string, format: date-time, nullable: true }
        next_rotation_at:
          type: string
          format: date-time
          nullable: true
          description: When the device rotates next; earlier means overdue (the device rotates only while it reaches the server).
        last_rotation_error:
          type: object
          nullable: true
          required: [reason, generation, at]
          properties:
            reason: { type: string, enum: [escrow_failed, escrow_timeout, apply_failed] }
            generation: { type: integer }
            at: { type: string, format: date-time }
    DiskState:
      type: string
      description: |
        Disk encryption of a device (plan M4b decision 8): not_encrypted (root not on LUKS), unmanaged (not installed
        with the Paddock autoinstall), tpm_missing, tpm_pin_missing (boot PIN skipped), escrow_pending (recovery key,
        header or keyslot set not yet as required), compliant (TPM2+PIN and recovery key only, both escrowed).
      enum: [not_encrypted, unmanaged, tpm_missing, tpm_pin_missing, escrow_pending, compliant]
    DiskEscrow:
      type: object
      required: [generation, status, created_at]
      properties:
        generation: { type: integer }
        status: { type: string, enum: [pending, stored, failed] }
        size: { type: integer, format: int64, description: "Headers: bytes of the sealed object." }
        created_at: { type: string, format: date-time }
    DiskEncryption:
      type: object
      required: [state, tokens, keyslots, recovery_keys, headers]
      properties:
        state:
          allOf: [{ $ref: "#/components/schemas/DiskState" }]
          nullable: true
          description: Null until the device reports its disk.
        luks_version: { type: integer }
        tokens:
          type: array
          description: Kind of every keyslot, sorted (tpm2+pin, tpm2, recovery, password, or another token type).
          items: { type: string }
        keyslots: { type: integer }
        reported_at: { type: string, format: date-time, description: Check-in the state is from. }
        recovery_keys:
          type: array
          items: { $ref: "#/components/schemas/DiskEscrow" }
        headers:
          type: array
          items: { $ref: "#/components/schemas/DiskEscrow" }
        last_keyslot_change:
          type: object
          required: [at, before, after]
          properties:
            at: { type: string, format: date-time }
            before: { type: array, items: { type: string } }
            after: { type: array, items: { type: string } }
    DiskRecoveryKey:
      type: object
      required: [generation, recovery_key]
      properties:
        generation: { type: integer }
        recovery_key: { type: string }
    DiskHeaderRequest:
      type: object
      required: [confirm_hostname]
      additionalProperties: false
      properties:
        confirm_hostname: { type: string, maxLength: 253 }
        generation: { type: integer, minimum: 1, description: Header generation; the newest stored one if absent. }
    LocalAdminRevealRequest:
      type: object
      required: [confirm_hostname]
      additionalProperties: false
      properties:
        confirm_hostname: { type: string, maxLength: 253 }
    LocalAdminRevealed:
      type: object
      required: [passwords]
      properties:
        passwords:
          type: array
          items:
            type: object
            required: [generation, state, password]
            properties:
              generation: { type: integer }
              state: { type: string, enum: [active, pending] }
              password: { type: string }
    DeviceCommandStatus:
      type: string
      enum: [pending, delivered, succeeded, failed, expired, cancelled]
    DeviceCommandType:
      type: string
      enum: [rotate_admin_password, delete_self_lock]
    DeviceCommand:
      type: object
      required: [id, device_id, type, status, issued_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
