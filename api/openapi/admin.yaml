      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          items: { type: integer, minimum: 1, maximum: 7 }
          description: ISO weekdays, 1 = Monday to 7 = Sunday, each at most once; stored sorted.
        start_minute: { type: integer, minimum: 0, maximum: 1439, description: Minutes after local midnight in the timezone. }
        duration_minutes: { type: integer, minimum: 30, maximum: 1440, description: "Elapsed minutes; the window may run past midnight into the next day." }
        timezone: { type: string, maxLength: 64, description: "An IANA timezone name such as Europe/Berlin." }
