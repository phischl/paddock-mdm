        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditVerificationRunSort"
        - $ref: "#/components/parameters/Search"
        - name: ok
          in: query
          description: Only runs that found the chain intact (true) or broken (false).
          schema: { type: boolean }
        - name: trigger
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditVerificationTrigger" }
      responses:
        "200":
          description: One page of verification runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerificationRunPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/manifests:
    get:
      operationId: listAuditManifests
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor. The sealed days of the organization with the result of the newest verification
        run covering each day. q matches the object key of the manifest.
      x-paddock-list:
        sort: [day]
        default_sort: -day
