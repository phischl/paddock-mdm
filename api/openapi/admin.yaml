    Severity:
      type: string
      enum: [critical, high, medium, low, unknown]
      description: |
        Ubuntu's priority for the release of the device (negligible counts as low; ADR 0020); without one, from the
        CVSS v3 base score (critical ≥ 9, high ≥ 7, medium ≥ 4, low > 0); unknown without either.
    InstalledSoftware:
      type: object
