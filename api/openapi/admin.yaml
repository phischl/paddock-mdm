      x-paddock-list:
        sort: [hostname, last_contact_at, enrolled_at, state]
        default_sort: hostname
        search: [hostname, name, hardware_uuid, owners.username, owners.display_name, hardware.serial]
        filters: [state, device_group_id, disk_state, contact, security_updates, owner_id, component_outdated, enrollment_method,
          config_mode]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceStateFilter"
        - name: device_group_id
          in: query
          description: Only members of this device group.
          schema: { type: string, format: uuid }
        - name: disk_state
          in: query
          description: Repeatable. Disk encryption state of the last check-in (plan M4b decision 14).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DiskState" }
        - name: contact
          in: query
          description: Repeatable. Contact state of the device (plan M7c §12 open point 1).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeviceContact" }
        - name: security_updates
          in: query
          description: >-
            overdue = devices that have contacted Paddock but report no successful security update run within the last
            48 hours (the overview's "Security updates overdue", plan M7c amendment 2026-10-10).
          schema: { type: string, enum: [overdue] }
        - name: owner_id
          in: query
          description: Only devices this user owns (plan M8d decision 3).
          schema: { type: string, format: uuid }
        - name: component_outdated
          in: query
          description: true lists the devices with a component older than its target at their last heartbeat, false the others (plan M8d decision 55).
          schema: { type: boolean }
        - name: enrollment_method
          in: query
          description: Repeatable. How the device was enrolled (plan M11 decision 43).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/EnrollmentMethod" }
        - name: config_mode
          in: query
          description: Repeatable. Whether the device's configuration is enforced or only reported (plan M11 decision 43).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/ConfigMode" }
      responses:
        "200":
          description: One page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}:
