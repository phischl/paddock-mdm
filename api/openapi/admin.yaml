        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpSettingsInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/updates:
    get:
      operationId: getUpdateSettings
      tags: [settings]
      description: "Roles: org_admin, org_operator, org_auditor. The update settings (plan M5b decisions 1 and 9); the defaults until changed."
      responses:
        "200":
          description: The update settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateUpdateSettings
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the update settings: security_daily_at (HH:MM, local device time),
        regular_schedule (a subset of systemd OnCalendar: optional comma-separated weekdays Mon…Sun, then HH:MM; anything
        else is 422 invalid_schedule), regular_updates_enabled, max_random_delay_min (0–720), staleness_warning_h (1–720)
        and staleness_critical_h (above the warning, at most 2160; 400 invalid_request otherwise). Every device is
        recompiled.
      x-paddock-audit: settings.updates_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RolloutUrgent"
        - $ref: "#/components/parameters/RolloutReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/rollout:
    get:
      operationId: getRolloutSettings
      tags: [settings]
      description: "Roles: org_admin, org_operator, org_auditor. The settings of staged configuration rollouts (plan M11 decision 24); the defaults (rollouts off) until changed."
      responses:
        "200":
          description: The rollout settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateRolloutSettings
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the rollout settings: enabled, waves (1 to 10 strictly increasing integers between 1
        and 100, ending with 100), min_wave_minutes (at least 15; 1 in a development stack), failure_threshold_percent
        (0–100), failure_threshold_min (at least 0), the optional canary device group, whose devices always go first,
        and the optional wave_success_threshold_percent (1–100) and stall_warning_hours (1–720), which keep their stored
        values when absent. An invalid value is 400 invalid_request; an unknown device group, or one of another organization, is 404
        not_found. A rollout that is already running keeps the values it started with.
      x-paddock-audit: settings.rollout_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RolloutSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolloutSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/privacy:
    get:
      operationId: getPrivacySettings
      tags: [settings]
      description: "Roles: org_admin, org_operator, org_auditor. The privacy settings (ADR 0032 §2); the defaults until changed."
      responses:
        "200":
          description: The privacy settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updatePrivacySettings
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the privacy settings: retired_inventory_days (1–365; the inventory of a retired
        device, in Paddock and in Fleet, is deleted that many days after retirement), audit_search_recorded (searches
        of the audit log are recorded as audit.searched, once per administrator, hour and set of filters) and
        inventory_view_recorded (views of a device's software and vulnerabilities are recorded as
        device.inventory_viewed, once per administrator, device and day). 400 invalid_request for a value out of range.
      x-paddock-audit: settings.privacy_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacySettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/package-holds:
    get:
      operationId: listPackageHolds
      tags: [updates]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [package, created_at, updated_at]
        default_sort: package
        search: [package]
        filters: [device_group_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PackageHoldSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceGroupFilter"
      responses:
        "200":
          description: One page of package holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHoldPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPackageHold
      tags: [updates]
      description: |
        Roles: org_admin, org_operator. Holds a package for every device of the organization or of a device group:
        without a version the installed version is kept (apt-mark hold), with a version it is pinned (apt preferences,
        Pin-Priority 1001). Held packages are left out of security and regular updates, and install-now refuses them.
        A package held twice in one scope is 409 already_exists.
      x-paddock-audit: package_hold.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RolloutUrgent"
        - $ref: "#/components/parameters/RolloutReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageHoldCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/package-holds/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPackageHold
      tags: [updates]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The package hold.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePackageHold
      tags: [updates]
      description: "Roles: org_admin, org_operator. Replaces version and reason; the package and the scope are fixed."
      x-paddock-audit: package_hold.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RolloutUrgent"
        - $ref: "#/components/parameters/RolloutReason"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageHoldUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageHold" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePackageHold
      tags: [updates]
      description: "Roles: org_admin, org_operator. The devices release the hold with their next bundle."
      x-paddock-audit: package_hold.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/RolloutUrgent"
        - $ref: "#/components/parameters/RolloutReason"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/software-sources:
    get:
      operationId: listSoftwareSources
      tags: [software]
      description: |
        Roles: org_admin, org_operator, org_auditor. The organization's APT package sources (plan M13a decision 1);
        the list never contains the signing key.
      x-paddock-list:
        sort: [name, created_at, updated_at]
        default_sort: name
        search: [name, slug]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SoftwareSourceSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of software sources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareSourcePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSoftwareSource
      x-paddock-step-up: true
      tags: [software]
      description: |
        Roles: org_admin. Adds a package source with its signing key: an APT repository (kind apt, the default) or a
        Flatpak remote (kind flatpak: exactly one URI, the remote's URL, and no suites, components or architectures,
        else 400 invalid_request; the signing key is the remote's GPG key). A source is root-equivalent: every package
        it signs is installed as root. URIs must use https (400 invalid_request "uris must use https"); they may name
        internal hosts, because only the devices fetch from them, never the server. Suites are either all flat
        (ending in "/", then no components) or none (then at least one component). The signing key is one
        ASCII-armored OpenPGP v4 public key: RSA of at least 2048 bits (2048 to 3071 bits are accepted with
        weak_key true), or Ed25519, Ed448 or NIST P-256/384/521; DSA, ElGamal, Brainpool and secp256k1 are refused
        (400 invalid_request). The typed fingerprint (spaces and case ignored) must equal the key's, else 422
        fingerprint_mismatch naming both. A duplicate slug or name is 409 already_exists. Needs a step-up within the
        last 5 minutes (403 step_up_required; API tokens and MCP sessions cannot satisfy it).
      x-paddock-audit: software_source.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareSourceCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareSource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/software-sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSoftwareSource
      tags: [software]
      description: "Roles: org_admin, org_operator, org_auditor. One source with its signing key (a public key); 404 not_found for another organization's."
      responses:
        "200":
          description: The software source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareSource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateSoftwareSource
      x-paddock-step-up: true
      tags: [software]
      description: |
        Roles: org_admin. Changes the given fields; absent fields keep their value. The slug is immutable (400
        invalid_request when given). signing_key and fingerprint come only together (400 otherwise). Every rule of
        the creation is checked on the resulting source. Needs a step-up within the last 5 minutes (403
        step_up_required).
      x-paddock-audit: software_source.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareSourceUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareSource" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSoftwareSource
      x-paddock-step-up: true
      tags: [software]
      description: |
        Roles: org_admin. Removes the source; the devices remove its source file and keyring with their next bundle.
        A source that a catalog entry still uses is 409 in_use. Needs a step-up within the last 5 minutes (403
        step_up_required).
      x-paddock-audit: software_source.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/software-catalog:
    get:
      operationId: listSoftwareCatalog
      tags: [software]
      description: |
        Roles: org_admin, org_operator, org_auditor. The applications of the organization's software catalog
        (plan M13a decision 7); the list never contains the icons, has_icon says whether there is one.
      x-paddock-list:
        sort: [name, category, created_at, updated_at]
        default_sort: name
        search: [name, description]
        filters: [category, source_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SoftwareCatalogSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SoftwareCategoryFilter"
        - $ref: "#/components/parameters/SoftwareSourceFilter"
      responses:
        "200":
          description: One page of catalog entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareCatalogEntryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSoftwareCatalogEntry
      tags: [software]
      description: |
        Roles: org_admin, org_operator. Adds an application with its package names per distribution, release and
        architecture (1 to 20 references; release and architecture may be "*"; the tuple is unique within the
        entry). source_id names one of the organization's package sources; without it the distribution's own
        repositories are used. A name already in use is 409 already_exists; a source_id of another organization or
        an unknown one is 404 not_found.
      x-paddock-audit: software_catalog_entry.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareCatalogEntryCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareCatalogEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/software-catalog/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSoftwareCatalogEntry
      tags: [software]
      description: "Roles: org_admin, org_operator, org_auditor. 404 not_found for another organization's entry."
      responses:
        "200":
          description: The catalog entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareCatalogEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateSoftwareCatalogEntry
      tags: [software]
      description: |
        Roles: org_admin, org_operator. Replaces the entry's name, description, category, source and package
        references with the submitted values (an absent description or category becomes empty, an absent or null
        source_id selects the distribution's own repositories); the icon is changed with its own operation. The
        same rules as on creation apply.
      x-paddock-audit: software_catalog_entry.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareCatalogEntryUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareCatalogEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSoftwareCatalogEntry
      tags: [software]
      description: |
        Roles: org_admin, org_operator. Removes an entry that has no assignments; it changes nothing on any device. An
        entry that still has assignments is 409 in_use, and the detail names them (target type and device group,
        username or user group slug): remove the assignments first, a removal that rolls out in waves like every
        other assignment change. While a rollout stages assignments of the entry, the deletion is 409 rollout_conflict.
      x-paddock-audit: software_catalog_entry.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/software-catalog/{id}/icon:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSoftwareCatalogIcon
      tags: [software]
      description: "Roles: org_admin, org_operator, org_auditor. The entry's icon as image/png (Cache-Control: private, max-age=300); 404 not_found without an icon or for another organization's entry."
      responses:
        "200":
          description: The icon.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: setSoftwareCatalogIcon
      tags: [software]
      description: |
        Roles: org_admin, org_operator. Sets or replaces the entry's icon. The body is one PNG (Content-Type
        image/png) of at most 65536 bytes and 512 by 512 pixels; anything else is 400 invalid_request. Not offered as
        an MCP tool (the body is not JSON).
      x-paddock-audit: software_catalog_entry.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Icon set. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/software-catalog/{id}/devices:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listSoftwareCatalogDevices
      tags: [software]
      description: |
        Roles: org_admin, org_operator, org_auditor. The active devices the entry is assigned to, through an assignment
        of the organization or of one of their groups, with what they reported or the derived state not_applicable or
        unknown (see the device's managed software). A device with a system and a user-scope row for the entry is
        listed once per scope (plan M13b decision 17). The search matches the hostname. 404 not_found for another
        organization's entry.
      x-paddock-list:
        sort: [hostname, state, reported_at]
        default_sort: hostname
        search: [hostname]
        filters: [state, device_group_id, scope]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SoftwareCatalogDeviceSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceSoftwareStateFilter"
        - $ref: "#/components/parameters/DeviceSoftwareScopeFilter"
        - name: device_group_id
          in: query
          description: Only members of this device group.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareCatalogDevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/software-assignments:
    get:
      operationId: listSoftwareAssignments
      tags: [software]
      description: "Roles: org_admin, org_operator, org_auditor. The assignments of catalog entries to the organization, device groups, users or user groups; the search matches the entry's name."
      x-paddock-list:
        sort: [created_at, updated_at, intent]
        default_sort: -created_at
        search: [app_name]
        filters: [catalog_entry_id, device_group_id, user_id, user_group_id, target, intent]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SoftwareAssignmentSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SoftwareEntryFilter"
        - $ref: "#/components/parameters/DeviceGroupFilter"
        - $ref: "#/components/parameters/SoftwareUserFilter"
        - $ref: "#/components/parameters/SoftwareUserGroupFilter"
        - $ref: "#/components/parameters/SoftwareTargetFilter"
        - $ref: "#/components/parameters/SoftwareIntentFilter"
      responses:
        "200":
          description: One page of software assignments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareAssignmentPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSoftwareAssignment
      tags: [software]
      description: |
        Roles: org_admin, org_operator. Assigns a catalog entry with an intent to one target: every device of the
        organization (no target ID), a device group (device_group_id), a user (user_id) or a user group
        (user_group_id); more than one target ID is 400 invalid_request. required keeps the application installed
        (update_rule latest without a version, or pinned with one; omitted, the rule is pinned for a required
        assignment with a version and latest otherwise); uninstall removes it; hold keeps the installed version (with
        a version it is pinned); forbid removes it and blocks it for apt; available offers it to the target's users
        to install themselves and loses against every other intent on the same device. uninstall, forbid and
        available take no version. Violations are 400 invalid_request. An entry, device group, user or user group of
        another organization or an unknown one is 404 not_found; a second assignment of the entry to the same target
        is 409 already_exists. urgent (plan M13c decision 7) makes the devices apply the assignment outside their
        maintenance windows: it needs a reason of 2 to 500 characters (400 invalid_request otherwise) and a step-up
        within the last 5 minutes (403 step_up_required otherwise; always for API tokens and MCP sessions).
      x-paddock-audit: software_assignment.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareAssignmentCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareAssignment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/software-assignments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSoftwareAssignment
      tags: [software]
      description: "Roles: org_admin, org_operator, org_auditor. 404 not_found for another organization's assignment."
      responses:
        "200":
          description: The software assignment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareAssignment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateSoftwareAssignment
      tags: [software]
      description: |
        Roles: org_admin, org_operator. Replaces intent, update_rule, version, reason and urgent with the submitted
        values (an absent version is none, an absent update_rule is derived as on creation, an absent reason is empty,
        an absent urgent is false); the same rules as on creation apply, so keeping or setting urgent needs a reason
        and a step-up again. The entry and the target are fixed: giving a catalog_entry_id,
        device_group_id, user_id or user_group_id is 400 invalid_request.
      x-paddock-audit: software_assignment.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareAssignmentUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareAssignment" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSoftwareAssignment
      tags: [software]
      description: "Roles: org_admin, org_operator. The devices stop enforcing the assignment with their next bundle; installed software stays."
      x-paddock-audit: software_assignment.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/software-requests:
    get:
      operationId: listSoftwareRequests
      tags: [software]
      description: |
        Roles: org_admin, org_operator, org_auditor. The users' requests for available applications whose catalog
        entry requires approval (plan M13c decision 10), with their state: requested (waiting for a decision),
        approved, denied, expired (30 days without a decision, or the entry no longer requires approval) or
        withdrawn. The user's justification is not stored.
      x-paddock-list:
        sort: [requested_at, username, state, expires_at]
        default_sort: -requested_at
        search: [username]
        filters: [state, catalog_entry_id, device_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SoftwareRequestSort"
        - $ref: "#/components/parameters/Search"
        - name: state
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/SoftwareRequestState" }
        - name: catalog_entry_id
          in: query
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of software requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareRequestPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/software-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSoftwareRequest
      tags: [software]
      description: "Roles: org_admin, org_operator, org_auditor. 404 not_found for another organization's request."
      responses:
        "200":
          description: The software request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/software-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveSoftwareRequest
      tags: [software]
      description: |
        Roles: org_admin. Approves an open request, optionally with a reason; no step-up of its own (the entry's source
        needed one). The device's next bundle lets the user install the application. 409 invalid_state unless the
        request is open, 404 not_found for another organization's request.
      x-paddock-audit: software_request.approved
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareRequestDecision" }
      responses:
        "200":
          description: The approved request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/software-requests/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: denySoftwareRequest
      tags: [software]
      description: |
        Roles: org_admin. Denies an open request with a reason, which the user sees; no step-up of its own. The user
        may ask again after 24 hours. 400 invalid_request without a reason, 409 invalid_state unless the request is
        open, 404 not_found for another organization's request.
      x-paddock-audit: software_request.denied
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwareRequestDenial" }
      responses:
        "200":
          description: The denied request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/compile-warnings:
    get:
      operationId: listCompileWarnings
      tags: [software]
      description: |
        Roles: org_admin, org_operator, org_auditor. What the compiler shortened or dropped from a device's bundle
        against what an administrator assigned (architect decisions A10-9 and A10-10), from the device's latest
        compile: each compile of a device replaces its warnings, and a device whose bundle was blocked keeps those of its
        current bundle. Codes are stable English identifiers the portal localizes: audience_truncated (the audience of
        an available package named more users than a bundle carries; params users, kept) and flatpak_forbidden (an
        entry forbids or uninstalls the flatpak package on the device, so its required or available Flatpak
        application is left out; params flatpak_ref) and flatpak_users_truncated (a user-scope Flatpak application
        targeted more users on the device than a bundle carries; params users, kept, flatpak_ref). A warning names the
        assignment and catalog entry it concerns.
        The search matches the hostname and the code. A device, assignment or entry of another organization matches
        nothing.
      x-paddock-list:
        sort: [created_at, hostname, code]
        default_sort: -created_at
        search: [hostname, code]
        filters: [device_id, assignment_id, catalog_entry_id, code]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/CompileWarningSort"
        - $ref: "#/components/parameters/Search"
        - name: device_id
          in: query
          description: Only warnings of this device.
          schema: { type: string, format: uuid }
        - name: assignment_id
          in: query
          description: Only warnings of this software assignment.
          schema: { type: string, format: uuid }
        - name: catalog_entry_id
          in: query
          description: Only warnings of this catalog entry.
          schema: { type: string, format: uuid }
        - name: code
          in: query
          description: Only warnings with this code.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: One page of compile warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompileWarningPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      operationId: getOverview
      tags: [overview]
      description: "Roles: org_admin, org_operator, org_auditor. The numbers of the overview page, computed in one transaction; never cached."
      responses:
        "200":
          description: The overview of the organization's fleet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/security-review:
    get:
      operationId: getSecurityReview
      tags: [overview]
      description: |
        Roles: org_admin, org_operator, org_auditor. The review of existing data (ADR 0034 decision 7): effectively Full
        permission profiles and managed files on sensitive paths that no organization administrator has confirmed with
        a step-up yet, and managed files on denied paths, which are not shipped to devices. One review object, not a
        collection: every list holds at most 100 items ordered by name or path, and total counts all of them.
      responses:
        "200":
          description: The security review of the organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityReview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/access-review:
    get:
      operationId: getAccessReview
      x-paddock-mcp: { expose: false }
      tags: [overview]
      description: |
        Roles: org_admin, org_auditor. The access review of the organization: role members, role changes, accounts, API tokens, reveals of secrets, step-ups, ended sessions and destructive actions in the period. One report object, not a collection: every list holds at most 1000
        items and states its total. from and to are RFC 3339; to defaults to now and from to 90 days before to; the
        period spans at most 400 days (400 invalid_request beyond or when from is not before to). Role members are the
        worker's snapshot of the identity provider (at most one 5-minute round old). The view is recorded as access_review.viewed once per actor and UTC day, only while the organization's audit_search_recorded privacy setting is on.
      parameters:
        - $ref: "#/components/parameters/AccessReviewFrom"
        - $ref: "#/components/parameters/AccessReviewTo"
      responses:
        "200":
          description: The access review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessReviewReport" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/access-review/export:
    get:
      operationId: exportAccessReview
      x-paddock-mcp: { expose: false }
      tags: [overview]
      description: |
        Roles: org_admin, org_auditor. The access review as a download: format json (the same object as the view) or csv (one file for
        every section, told apart by the section column; cells that a spreadsheet could run as a formula carry a
        leading apostrophe). Content-Disposition names the file paddock-access-review-<organization slug>-<from>-<to>.<json|csv>. Period as for the view.
        Every export is recorded as access_review.exported, whatever the privacy settings.
      x-paddock-audit: access_review.exported
      parameters:
        - $ref: "#/components/parameters/AccessReviewFrom"
        - $ref: "#/components/parameters/AccessReviewTo"
        - $ref: "#/components/parameters/AccessReviewFormat"
      responses:
        "200":
          description: The exported report.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessReviewReport" }
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/attention/devices:
    get:
      operationId: listAttentionDevices
      tags: [devices]
      description: >-
        Roles: org_admin, org_operator, org_auditor. The attention list grouped by device: one item per device with an
        open condition, its conditions most severe first. A kind filter selects devices with at least one matching
        condition; all conditions of the device are listed.
      x-paddock-list:
        sort: [severity, hostname, since]
        default_sort: -severity
        search: [hostname]
        filters: [kind, device_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AttentionDeviceSort"
        - $ref: "#/components/parameters/Search"
        - name: device_id
          in: query
          description: Only this device (exact match; the device page reads its conditions with it).
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AttentionKind" }
      responses:
        "200":
          description: One page of devices with their open conditions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionDevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/attention:
    get:
      operationId: listAttention
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The conditions that need an administrator, one row per open
        condition of a device (plan M5b decision 11): staleness warning and critical (the organization's thresholds),
        presumed lost, quarantined (clone suspected), disk encryption not compliant, agent not the current release,
        the latest login or sudo configuration failed, a Lock or Destroy waiting, or expired within the last 30 days,
        an agent release whose rollback failed and is still pending on the device (ADR 0024), a device clock more than
        60 s off the server's, measured at check-in and cleared once it is back within 30 s (clock_drift, plan M8b
        decision 15), a hole in a device's event numbering still open after two further check-ins (event_gap, plan M8b
        decision 23). Read-only; the actions are the device's own (retire, release quarantine, lock).
      x-paddock-list:
        sort: [since, kind, hostname]
        default_sort: -since
        search: [hostname]
        filters: [kind]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AttentionSort"
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AttentionKind" }
      responses:
        "200":
          description: One page of conditions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations:
    get:
      operationId: listNotificationDestinations
      tags: [notifications]
      description: |
        Roles: org_admin, org_auditor. The organization's notification destinations: signed webhooks and e-mail address lists that
        receive the organization's security events (ADR 0031). Never shows a webhook URL or a signing secret;
        url_display has scheme, host and a masked path.
      x-paddock-list:
        sort: [name, type, created_at]
        default_sort: name
        search: [name]
        filters: [type, enabled]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/NotificationDestinationSort"
        - $ref: "#/components/parameters/Search"
        - name: type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/NotificationDestinationType" }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: One page of destinations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestinationPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createNotificationDestination
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Creates a destination. A webhook needs an https URL without user information on port 443
        or 1024–65535 whose host is a public address (400 invalid_request naming the rule); the URL and a new signing
        secret are stored encrypted and the secret is returned once in this response. An e-mail destination needs 1 to
        20 plain addresses and is 409 email_not_configured while the installation has no SMTP relay (see
        GET /api/v1/notification-capabilities). filter_mode custom takes 1 to 200 registered audit codes (400
        unknown_code for an unregistered one). heartbeat_interval_s is 0 or 60–3600, email_min_interval_s 60–3600. A
        duplicate name is 409 already_exists. A syslog destination needs syslog_host, a DNS name or public IP address
        (the webhook address rules apply), and takes syslog_port (default 6514), syslog_ca_pem (one or more PEM
        certificates, at most 16 KiB) and syslog_server_name (the TLS server name); it is delivered over TLS 1.2 or
        newer, one RFC 5424 message per event. checkpoints is allowed for webhook and syslog destinations (400 for
        e-mail). A new destination starts at the newest event; it never replays history.
        Needs a step-up within the last 5 minutes (403 step_up_required; API tokens and MCP sessions cannot satisfy it).
      x-paddock-audit: notification.destination_created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationDestinationCreate" }
      responses:
        "201":
          description: Created; secret is shown only here (webhook).
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestinationCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getNotificationDestination
      tags: [notifications]
      description: "Roles: org_admin, org_auditor. One destination with its delivery state; 404 not_found for another organization's."
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestination" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateNotificationDestination
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Replaces every setting except the type (400 invalid_request when it differs) and the signing
        secret. url is optional: absent keeps the stored URL, present is validated like on creation and replaces it.
        syslog_ca_pem works alike: absent keeps the stored CA bundle, an empty string removes it.
        Enabling a disabled destination requires cursor: continue delivers the events since it was disabled, skip
        resumes at the newest event and never delivers the ones in between (400 invalid_request without cursor; cursor
        is refused otherwise). Enabling an e-mail destination is 409 email_not_configured without an SMTP relay;
        disabling or renaming one is not. Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: notification.destination_updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationDestinationUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestination" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteNotificationDestination
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Deletes the destination with its delivery state and history. Needs a step-up within the last
        5 minutes (403 step_up_required).
      x-paddock-audit: notification.destination_deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rotateNotificationDestinationSecret
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Replaces the signing secret of a webhook destination and returns the new one once; deliveries
        are signed with it from the notifier's next round. 409 invalid_state for an e-mail destination. Needs a step-up
        within the last 5 minutes (403 step_up_required).
      x-paddock-audit: notification.destination_secret_rotated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The new secret, shown only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestinationSecret" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testNotificationDestination
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Requests a test delivery. The notifier, the only service that can decrypt the URL and the
        secret, delivers it in its next round with one attempt (webhook: the signed envelope of kind test; e-mail: one
        message) and records notification.test_sent with the result, which GET …/{id} shows in state.last_test.
        409 invalid_state while an earlier test of the destination is still pending. Needs a step-up within the last 5
        minutes (403 step_up_required).
      x-paddock-audit: notification.test_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestRequested" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: replayNotificationDestination
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Asks the notifier to send the destination's stored batches and checkpoints again from
        from_forward_seq on, with their original delivery IDs and forward sequence numbers, before it continues at the
        cursor; the receiver sees the same numbers again and must deduplicate. An event the index retention purged
        meanwhile is sent as {forward_seq, event_id, missing: true}. Each re-sent delivery is recorded as
        notification.replayed. 400 invalid_request when from_forward_seq is below 1 or above state.forward_seq; 409
        invalid_state while a batch is being retried, a replay is still running (state.replay_from is set) or a skip
        request from enabling with cursor skip awaits the next delivery round. Needs a step-up within the last 5
        minutes (403 step_up_required).
      x-paddock-audit: notification.replay_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReplayRequest" }
      responses:
        "202":
          description: Requested; state.replay_from shows it until the replay is complete.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations/{id}/resolve-pseudonym:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resolveNotificationPseudonym
      x-paddock-step-up: true
      tags: [notifications]
      description: |
        Roles: org_admin. Asks which user name a pseudonym (u_ and 24 hexadecimal characters) of the organization's
        notifications stands for. The api never decrypts the pseudonym key: the notifier resolves the lookup in its next
        round; GET …/resolve-pseudonym/{lookup_id} returns the result once. 400 invalid_request for a malformed
        pseudonym (never recorded), 409 invalid_state while no destination pseudonymizes user names or while another
        lookup of the organization is pending. Needs a step-up within the last 5 minutes (403 step_up_required).
      x-paddock-audit: notification.pseudonym_resolved
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPseudonymResolve" }
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPseudonymRequested" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-destinations/{id}/resolve-pseudonym/{lookup_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: lookup_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getNotificationPseudonymLookup
      x-paddock-mcp: { expose: false }
      tags: [notifications]
      description: |
        Roles: org_admin. The result of a pseudonym lookup: resolved false until the notifier has resolved it; once
        resolved, username is the matching user name ("" when none matches) and the lookup is deleted with this read,
        so a second read is 404 not_found. Unread lookups are deleted after 10 minutes.
      responses:
        "200":
          description: The lookup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPseudonymLookup" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/notification-capabilities:
    get:
      operationId: getNotificationCapabilities
      tags: [notifications]
      description: |
        Roles: org_admin, org_auditor, platform_admin. The destination types this installation supports: email is true
        only with an SMTP relay (PADDOCK_SMTP_ENABLED).
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationCapabilities" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/findings:
    get:
      operationId: listFindings
      tags: [findings]
      description: |
        Roles: org_admin, org_operator, org_auditor. Findings: tamper events and attention conditions of devices with
        their status, assignee and reason (plan M9 decisions 30–34). A tamper finding counts the events of one device,
        code and subject while it is open; an attention finding follows its condition and is cleared (cleared_at) when
        the condition is gone. cleared=false (the default) lists the findings that are not cleared, cleared=true only
        the cleared ones.
      x-paddock-list:
        sort: [last_seen_at, opened_at, status, hostname, code]
        default_sort: -last_seen_at
        search: [hostname, code, subject]
        filters: [status, kind, device_id, assignee_id, cleared]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/FindingListSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/FindingStatus" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/FindingKind" }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: cleared
