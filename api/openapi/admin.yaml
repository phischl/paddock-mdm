        category: { type: string, maxLength: 64, description: May be empty. }
        source_id: { type: string, format: uuid, nullable: true, description: Omit or null for the distribution's own repositories. }
        packages: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/PackageRef" }, description: "Unique by distribution, release and architecture; the most specific reference wins on a device." }
        approval: { $ref: "#/components/schemas/SoftwareApproval" }
    SoftwareCatalogEntryUpdate:
