        hostname: { type: string }
        name: { type: string, description: "The device's display name; empty when none is set." }
        device_group_ids: { type: array, items: { type: string, format: uuid }, description: "The device groups the device belongs to; empty when none." }
        package: { type: string, description: "The package on the device; empty for not_applicable." }
        intent: { $ref: "#/components/schemas/SoftwareIntent" }
        state: { $ref: "#/components/schemas/DeviceSoftwareState" }
        version: { type: string }
        reason: { type: string }
        error: { type: string, description: At most 200 characters; may name paths. }
        scope: { $ref: "#/components/schemas/SoftwareScope" }
        reported_at: { type: string, format: date-time, nullable: true, description: null for a derived state. }
    SoftwareCatalogDevicePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SoftwareCatalogDevice" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    InstallNowRequest:
      type: object
      required: [packages]
      additionalProperties: false
      properties:
        packages:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 128 }
