        reboot_required: { type: integer }
        agent: { $ref: "#/components/schemas/OverviewAgent" }
        os_releases:
          type: array
          items: { $ref: "#/components/schemas/OverviewOSRelease" }
    OverviewAgent:
      type: object
      required: [current_version, on_current, outdated, ahead, unknown, latest_published, rollout]
      properties:
        current_version: { type: string, nullable: true, description: "The release of the most recently completed rollout." }
        on_current: { type: integer, description: "Active devices whose agent_version has the same semantic version precedence as current_version (build metadata ignored)." }
        outdated:
          type: integer
          description: |
            Active devices whose agent_version is older than current_version by SemVer precedence, or is no semantic
            version (the attention kind agent_outdated); 0 while current_version is null.
        ahead: { type: integer, description: "Active devices whose agent_version is newer than current_version." }
        unknown: { type: integer, description: "Active devices without agent_version." }
        latest_published: { type: string, nullable: true, description: "The newest release with status published, by SemVer precedence." }
        rollout:
          nullable: true
          type: object
          description: The rollout with status running, else null (at most one runs).
          required: [version, wave, waves, percent]
          properties:
            version: { type: string }
            wave: { type: integer, description: "1-based: current_wave_index + 1" }
            waves: { type: integer, description: "cardinality(waves)" }
            percent: { type: integer, description: "waves[current_wave_index]" }
