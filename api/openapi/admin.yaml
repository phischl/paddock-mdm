  /api/v1/findings/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: assignFinding
      tags: [findings]
      description: |
        Roles: org_admin, org_operator. Assigns an open, acknowledged or in-progress finding to an administrator or
        operator of the organization, or removes the assignee (assignee_id null); the finding is in progress
        afterwards. 404 not_found for any other account (an auditor, a disabled account, another organization's),
        409 invalid_state for a closed finding.
      x-paddock-audit: finding.assigned
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingAssign" }
      responses:
        "200":
          description: The assigned finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/findings/{id}/close:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: closeFinding
      tags: [findings]
      description: |
        Roles: org_admin, org_operator; accepted_risk only org_admin (403 forbidden otherwise, recorded as denied).
        Closes an open, acknowledged or in-progress finding with a resolution and a reason (1 to 1000 characters,
        400 invalid_request otherwise) and an optional external reference (at most 200 characters). 409
        invalid_state for a closed finding.
      x-paddock-audit: finding.closed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingClose" }
      responses:
        "200":
          description: The closed finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/findings/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: reopenFinding
      tags: [findings]
      description: |
        Roles: org_admin, org_operator. Reopens a closed finding with a reason (1 to 1000 characters, 400
