        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/dms:
    get:
      operationId: getDMSSettings
      tags: [settings]
      description: "Roles: org_admin, org_operator, org_auditor. The dead man's switch; off with the defaults until changed."
      responses:
        "200":
          description: The dead man's switch settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DMSSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateDMSSettings
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the dead man's switch settings (plan M4c decision 15): period_days 7–365 (the portal
        warns below 30), distinct warn_days below the period. Turning the switch on, or changing it while on, needs a
        step-up within the last 300 s (403 step_up_required); 403 revocation_disabled while PADDOCK_REVOCATION_ENABLED
        is off. Every device is recompiled; while the switch is on every active device holds a self-lock token, and if
        Paddock is unreachable for longer than the period of uptime, every such device locks itself. Turning it off
        deletes the tokens and tells the devices to delete their copies.
      x-paddock-audit: settings.dms_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DMSSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DMSSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/managed-files:
    get:
      operationId: getManagedFileSettings
      tags: [settings]
      description: |
        Roles: org_admin, org_operator, org_auditor. The operator roots of the managed files (ADR 0034 amendment
        2026-10-16); empty until changed.
      responses:
        "200":
          description: The managed-file settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFileSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateManagedFileSettings
      x-paddock-step-up: true
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the operator roots: directories of the form /etc/<name>/, /usr/local/etc/<name>/
        or /opt/<name>/ (trailing slash), outside the denied and sensitive paths and the never-operator directories
        (422 path_not_allowed naming the root), at most 50. Below a root an operator manages files without a step-up,
        except executables, scripts, shared objects and .d directories; every other path needs org_admin and a
        step-up. Needs a step-up within the last 300 s (403 step_up_required); API tokens cannot satisfy it. Existing
        definitions are not changed; the security review lists files whose tier rose.
      x-paddock-audit: settings.managed_files_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedFileSettingsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFileSettings" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/watched-units:
    get:
      operationId: getWatchedUnits
      tags: [settings]
      description: |
        Roles: org_admin, org_operator, org_auditor. The third-party systemd services of the presence policy: the
        agents report when one of them stops. Empty until changed; updated_at is null for an empty list.
      responses:
        "200":
          description: The watched units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchedUnits" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateWatchedUnits
      x-paddock-step-up: true
      tags: [settings]
      description: |
        Roles: org_admin. Replaces the watched units: at most 32 services (names ending in .service), a duplicate is
        400 invalid_request, a reserved unit (paddock, himmelblau, fleet, orbit, ssh, gdm, systemd- prefixes) or a
        name that is not a service is 422 unit_not_allowed naming it. Paddock only reports a stopped unit; it never
        installs, starts or restarts it. Every device is recompiled. Needs a step-up within the last 300 s (403
        step_up_required; API tokens cannot satisfy it).
      x-paddock-audit: settings.watched_units_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchedUnitsUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchedUnits" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/settings/mcp:
    get:
      operationId: getMcpSettings
      x-paddock-mcp: { expose: false }
      tags: [mcp]
      description: |
        Roles: org_admin, org_operator, org_auditor. The MCP policy of the organization (ADR 0044 decision 5). Without a saved policy the MCP is
        off: enabled false, write_enabled false, mode all, no allowed operations, updated_at and updated_by null.
      responses:
        "200":
          description: The MCP policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpSettings" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateMcpSettings
      x-paddock-step-up: true
      x-paddock-mcp: { expose: false }
      tags: [mcp]
      description: |
        Roles: org_admin. Replaces the MCP policy of the organization. mode all requires an empty allowed_operations;
        mode selected requires 1 to 500 distinct operation ids of exposed MCP tools that need no step-up (400
        invalid_request naming the offending id). Needs a step-up within the last 5 minutes (403 step_up_required);
        API tokens and MCP sessions cannot satisfy it. Every attempt is audited.
      x-paddock-audit: organization.mcp_policy_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
