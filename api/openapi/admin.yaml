      properties:
        package: { type: string }
        versions:
          type: array
          items: { type: string, nullable: true }
        chosen: { type: string, nullable: true }
    DeviceUpdates:
      type: object
      required: [last_security_run, last_regular_run, reboot_required, holds, conflicts]
      properties:
        last_security_run:
          description: Latest updates.run of kind security; null until reported.
          allOf:
            - $ref: "#/components/schemas/DeviceReport"
          nullable: true
        last_regular_run:
          description: Latest updates.run of kind regular; null until reported.
          allOf:
            - $ref: "#/components/schemas/DeviceReport"
          nullable: true
        reboot_required: { type: boolean, description: The last check-in reported a pending reboot; Paddock never reboots for updates. }
        holds:
          type: array
          items: { $ref: "#/components/schemas/DeviceUpdateHold" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/DeviceUpdateConflict" }
    AttentionKind:
      type: string
      enum: [stale_warning, stale_critical, presumed_lost, quarantined, disk_not_compliant, agent_outdated,
             login_apply_failed, sudo_apply_failed, revocation_pending, revocation_expired, agent_rollback_pending,
             agent_not_running, uninstall_pending, config_behind, disk_conversion_failed, clock_drift, event_gap, report_only,
             software_requests_open]
    Attention:
      type: object
      required: [id, kind, device_id, hostname, since, detail, finding]
      properties:
        finding:
          description: The live finding of the condition (plan M9 decision 34); null until the findings round created it.
          allOf:
            - $ref: "#/components/schemas/AttentionFinding"
          nullable: true
        id: { type: string, description: "Unique key of the row: the kind and its source (alert, device or revocation request)." }
        kind: { $ref: "#/components/schemas/AttentionKind" }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        since: { type: string, format: date-time, description: When the condition began (for disk and agent the last contact; for a pending rollback the first rollback_failed report; for agent_not_running when the stopped agent was reported; for config_behind when the newest bundle was compiled; for clock_drift when the drift was first measured; for event_gap when the gap was reported; for report_only when the device enrolled; for software_requests_open when the oldest open request was made). }
        detail:
          type: string
          description: "disk_not_compliant: the disk state; agent_outdated: the agent version; agent_rollback_pending: the agent version whose rollback failed; *_apply_failed: the stage; revocation_*: action:status; uninstall_pending: mode:command status; config_behind: the applied and the newest bundle version as \"<applied> < <newest>\"; disk_conversion_failed: stage:reason of the device's latest in-place encryption; clock_drift: the clock offset of the last check-in as \"<seconds> s\" (server time minus device time); event_gap: the missing event sequence numbers as \"<from>-<to>\"; report_only: the enrollment method; software_requests_open: the number of the device's open software requests; otherwise empty."
    FindingKind:
      type: string
      enum: [tamper, attention]
    FindingStatus:
      type: string
      enum: [open, acknowledged, in_progress, resolved, accepted_risk, false_positive]
    FindingResolution:
      type: string
      enum: [resolved, accepted_risk, false_positive]
    FindingAssignee:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    Finding:
      type: object
      required: [id, kind, key, code, subject, device_id, hostname, status, assignee, opened_at, last_seen_at, occurrences,
                 first_event_id, last_event_id, acknowledged_at, closed_at, closed_by, reason, external_ref, cleared_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/FindingKind" }
        key: { type: string, description: "tamper:<device_id>:<code>:<subject> or attention:<attention id>." }
        code: { type: string, description: The audit code of a tamper finding or the attention kind of an attention finding. }
        subject: { type: string, description: "What the finding is about: the file, group, unit, field or volume of a tamper event, the detail of an attention condition; may be empty." }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        status: { $ref: "#/components/schemas/FindingStatus" }
        assignee:
          allOf:
            - $ref: "#/components/schemas/FindingAssignee"
          nullable: true
        opened_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        occurrences: { type: integer, description: Tamper events counted by the finding while it was open. }
        first_event_id: { type: string, format: uuid, nullable: true, description: The audit event that opened a tamper finding. }
        last_event_id: { type: string, format: uuid, nullable: true, description: The latest audit event counted by a tamper finding. }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        closed_by: { type: string, nullable: true }
        reason: { type: string, nullable: true, description: The reason of the last close or reopen. }
        external_ref: { type: string, nullable: true }
        cleared_at: { type: string, format: date-time, nullable: true, description: When the condition of an attention finding was gone. }
    NotificationDestinationType:
      type: string
      enum: [webhook, email, syslog]
    NotificationFilterMode:
      type: string
      enum: [security, all, custom]
      description: security forwards the security preset of ADR 0031, all every event, custom the listed codes.
    NotificationDestination:
      type: object
      required: [id, type, name, enabled, filter_mode, codes, pseudonymize_users, include_params, url_display,
        heartbeat_interval_s, recipients, email_min_interval_s, syslog_host, syslog_port, syslog_server_name,
        syslog_ca_pem_set, checkpoints, created_by, created_at, updated_at, state]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationDestinationType" }
        name: { type: string }
        enabled: { type: boolean }
        filter_mode: { $ref: "#/components/schemas/NotificationFilterMode" }
        codes: { type: array, items: { type: string }, description: The codes of filter_mode custom; empty otherwise. }
        pseudonymize_users: { type: boolean }
        include_params: { type: boolean }
        url_display: { type: string, nullable: true, description: "Webhook: scheme, host and /… for any path; never the stored URL. null for e-mail and syslog." }
        heartbeat_interval_s: { type: integer }
        recipients: { type: array, items: { type: string } }
        email_min_interval_s: { type: integer }
        syslog_host: { type: string, nullable: true, description: Syslog only; null otherwise. }
        syslog_port: { type: integer, nullable: true, description: Syslog only; null otherwise. }
        syslog_server_name: { type: string, nullable: true, description: "Syslog only: the TLS server name when it differs from syslog_host." }
        syslog_ca_pem_set: { type: boolean, description: "Syslog: whether a CA bundle is stored; the bundle itself is never returned." }
        checkpoints: { type: boolean, description: Whether the destination receives the daily checkpoints of ADR 0031 (webhook and syslog). }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/NotificationDestinationState" }
    NotificationDestinationState:
      type: object
      required: [status, cursor_commit_seq, forward_seq, last_success_at, last_attempt_at, next_attempt_at, stalled_since,
        last_error, lag_seconds, last_test, last_checkpoint_day, replay_from]
      properties:
        status: { type: string, enum: [active, stalled] }
        cursor_commit_seq: { type: integer, format: int64, description: The commit sequence of the last delivered event position. }
        forward_seq: { type: integer, format: int64, description: The last forwarded sequence number. }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        stalled_since: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        lag_seconds: { type: integer, format: int64, description: Seconds since the first failure of the current series of failed deliveries; 0 while deliveries succeed. }
        last_test:
          type: object
          nullable: true
          required: [at, ok, error]
          properties:
            at: { type: string, format: date-time }
            ok: { type: boolean }
            error: { type: string, nullable: true }
        last_checkpoint_day: { type: string, format: date, nullable: true, description: The last sealed recording day whose checkpoint was delivered (checkpoints on). }
        replay_from: { type: integer, format: int64, nullable: true, description: The forward sequence number a requested replay continues at; null without a replay. }
    NotificationReplayRequest:
      type: object
      additionalProperties: false
      required: [from_forward_seq]
      properties:
        from_forward_seq: { type: integer, format: int64, minimum: 1, description: The first forward sequence number to send again. }
    NotificationDestinationCreate:
      type: object
      additionalProperties: false
      required: [type, name, enabled, filter_mode]
      properties:
        type: { $ref: "#/components/schemas/NotificationDestinationType" }
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$' }
        enabled: { type: boolean }
        filter_mode: { $ref: "#/components/schemas/NotificationFilterMode" }
        codes: { type: array, maxItems: 200, items: { type: string }, description: Registered audit codes; filter_mode custom only. }
        pseudonymize_users: { type: boolean, default: false }
        include_params: { type: boolean, default: false }
        url: { type: string, writeOnly: true, description: "Webhook only; required for a webhook. Stored encrypted, never returned." }
        heartbeat_interval_s: { type: integer, default: 0, description: Webhook and syslog; 0 (off) or 60–3600. }
        recipients: { type: array, maxItems: 20, items: { type: string }, description: E-mail only; 1–20 plain addresses. }
        email_min_interval_s: { type: integer, default: 300, description: E-mail only; 60–3600. }
        syslog_host: { type: string, maxLength: 253, description: "Syslog only; required for syslog. A DNS name or a public IP address." }
        syslog_port: { type: integer, minimum: 1, maximum: 65535, description: Syslog only; default 6514. }
        syslog_ca_pem: { type: string, writeOnly: true, maxLength: 16384, description: "Syslog only: PEM certificates of a private CA the receiver's certificate chains to; without it the system roots apply." }
        syslog_server_name: { type: string, maxLength: 253, description: "Syslog only: the TLS server name (SNI and verification) when it differs from syslog_host." }
        checkpoints: { type: boolean, default: false, description: Webhook and syslog only. }
    NotificationDestinationUpdate:
      type: object
      additionalProperties: false
      required: [name, enabled, filter_mode]
      properties:
        type: { $ref: "#/components/schemas/NotificationDestinationType" }
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$' }
        enabled: { type: boolean }
        filter_mode: { $ref: "#/components/schemas/NotificationFilterMode" }
        codes: { type: array, maxItems: 200, items: { type: string } }
        pseudonymize_users: { type: boolean, default: false }
        include_params: { type: boolean, default: false }
        url: { type: string, writeOnly: true, description: Webhook only; absent keeps the stored URL. }
        heartbeat_interval_s: { type: integer, default: 0 }
        recipients: { type: array, maxItems: 20, items: { type: string } }
        email_min_interval_s: { type: integer, default: 300 }
        syslog_host: { type: string, maxLength: 253, description: "Syslog only; required for syslog. A DNS name or a public IP address." }
        syslog_port: { type: integer, minimum: 1, maximum: 65535, description: Syslog only; default 6514. }
        syslog_ca_pem: { type: string, writeOnly: true, maxLength: 16384, description: "Syslog only: PEM certificates of a private CA the receiver's certificate chains to; without it the system roots apply. Absent keeps the stored bundle; an empty string removes it." }
        syslog_server_name: { type: string, maxLength: 253, description: "Syslog only: the TLS server name (SNI and verification) when it differs from syslog_host." }
        checkpoints: { type: boolean, default: false, description: Webhook and syslog only. }
        cursor: { type: string, enum: [continue, skip], description: Required when the update enables a disabled destination. }
    NotificationDestinationCreated:
      allOf:
        - $ref: "#/components/schemas/NotificationDestination"
        - type: object
          properties:
            secret: { type: string, description: "Webhook only: the signing secret, shown once; keep it like a password." }
    NotificationDestinationSecret:
      type: object
      required: [secret]
      properties:
        secret: { type: string, description: "The new signing secret, shown once." }
    NotificationTestRequested:
      type: object
      required: [delivery_id]
      properties:
        delivery_id: { type: string, format: uuid }
    NotificationPseudonymResolve:
      type: object
      additionalProperties: false
      required: [pseudonym]
      properties:
        pseudonym: { type: string, pattern: '^u_[0-9a-f]{24}$', maxLength: 26, description: "u_ and 24 lowercase hexadecimal characters." }
    NotificationPseudonymRequested:
      type: object
      required: [lookup_id]
      properties:
        lookup_id: { type: string, format: uuid }
    NotificationPseudonymLookup:
      type: object
      required: [pseudonym, username, resolved]
      properties:
        pseudonym: { type: string }
        username: { type: string, nullable: true, description: 'The user name once resolved; "" when no user matches.' }
        resolved: { type: boolean }
    NotificationCapabilities:
      type: object
      required: [email]
      properties:
        email: { type: boolean }
    BackupKind:
      type: string
      enum: [postgres, authentik, openbao, fleet, escrow]
    BackupTargetType:
      type: string
      enum: [local, smb, nfs, s3]
    BackupTargetHostState:
      type: string
      enum: [n/a, pending_host, mounted, unreachable]
      description: n/a for S3; pending_host until the host mounted the current revision; mounted; unreachable when a write into the mounted volume fails.
    BackupTargetInput:
      type: object
      additionalProperties: false
      required: [name, type, enabled]
      description: The object named by type is required; the others are ignored.
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$' }
        type: { $ref: "#/components/schemas/BackupTargetType" }
        enabled: { type: boolean }
        local: { $ref: "#/components/schemas/BackupTargetLocalInput" }
        smb: { $ref: "#/components/schemas/BackupTargetSmbInput" }
        nfs: { $ref: "#/components/schemas/BackupTargetNfsInput" }
        s3: { $ref: "#/components/schemas/BackupTargetS3Input" }
    BackupTargetSettings:
      type: object
      description: The settings of the target's type; never a credential.
      properties:
        local: { $ref: "#/components/schemas/BackupTargetLocalSettings" }
        smb: { $ref: "#/components/schemas/BackupTargetSmbSettings" }
        nfs: { $ref: "#/components/schemas/BackupTargetNfsSettings" }
        s3: { $ref: "#/components/schemas/BackupTargetS3Settings" }
    BackupTargetLocalInput:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          maxLength: 256
          description: >-
            A relative subpath of the host's local backup root (PADDOCK_BACKUP_LOCAL_ROOT, default
            /srv/paddock-backup) without "..", "." or empty elements (400 invalid_request local.path). The host step
            refuses a symlink component.
    BackupTargetLocalSettings:
      type: object
      required: [path]
      properties:
        path: { type: string }
    BackupTargetSmbInput:
      type: object
      additionalProperties: false
      required: [host, share, username]
      properties:
        host: { type: string, maxLength: 253, description: A DNS name or an IP address. }
        share: { type: string, maxLength: 80 }
        path: { type: string, maxLength: 256, description: Relative path below the share; optional. }
        username: { type: string, maxLength: 104 }
        password: { type: string, maxLength: 256, writeOnly: true, description: "No comma and no whitespace (they cannot be passed to the share's mount). Required on creation and when host, share, domain, username or options change; otherwise absent on an update keeps the stored one. Stored encrypted, never returned." }
        domain: { type: string, maxLength: 64 }
        options: { type: string, maxLength: 256, description: "Comma-separated: vers=3.0|3.1.1, seal, noperm, cache=none|strict, actimeo=N." }
    BackupTargetSmbSettings:
      type: object
      required: [host, share, path, username, domain, options]
      properties:
        host: { type: string }
        share: { type: string }
        path: { type: string }
        username: { type: string }
        domain: { type: string }
        options: { type: string }
    BackupTargetNfsInput:
      type: object
      additionalProperties: false
      required: [host, export]
      properties:
        host: { type: string, maxLength: 253 }
        export: { type: string, maxLength: 256, description: An absolute export path. }
        path: { type: string, maxLength: 256, description: Relative path below the export; optional. }
        options: { type: string, maxLength: 256, description: "Comma-separated: vers=4|4.1|4.2, hard, timeo=N, retrans=N, nconnect=N." }
    BackupTargetNfsSettings:
      type: object
      required: [host, export, path, options]
      properties:
        host: { type: string }
        export: { type: string }
        path: { type: string }
        options: { type: string }
    BackupTargetS3Input:
      type: object
      additionalProperties: false
      required: [endpoint, bucket]
      properties:
        endpoint: { type: string, description: "An https URL without user information, query or fragment; the host must be a public address." }
        bucket: { type: string, maxLength: 63 }
        region: { type: string, maxLength: 64, description: Default us-east-1. }
        prefix: { type: string, maxLength: 128, description: Optional; no leading "/". }
        access_key: { type: string, maxLength: 128, writeOnly: true, description: "Required on creation and when endpoint, bucket, region or ca_pem change; otherwise absent together with secret_key on an update keeps the stored keys. Stored encrypted, never returned." }
        secret_key: { type: string, maxLength: 256, writeOnly: true, description: "Required on creation; replaced together with access_key. Stored encrypted, never returned." }
        ca_pem: { type: string, maxLength: 16384, description: Optional PEM certificates of a private CA. }
    BackupTargetS3Settings:
      type: object
      required: [endpoint, bucket, region, prefix, ca_pem]
      properties:
        endpoint: { type: string }
        bucket: { type: string }
        region: { type: string }
        prefix: { type: string }
        ca_pem: { type: string }
    BackupTargetKindStatus:
      type: object
      required: [kind, last_success_at, last_error, bytes]
      properties:
        kind: { $ref: "#/components/schemas/BackupKind" }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true, description: An error class. }
        bytes: { type: integer, format: int64 }
    BackupTarget:
      type: object
      required: [id, name, type, enabled, host_state, host_revision, settings, has_credentials, test_requested_at,
        last_test_at, last_test_ok, last_test_error, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/BackupTargetType" }
        enabled: { type: boolean }
        host_state: { $ref: "#/components/schemas/BackupTargetHostState" }
        host_revision: { type: integer, description: Raised by every change the host must apply; 1 for S3. }
        settings: { $ref: "#/components/schemas/BackupTargetSettings" }
        has_credentials: { type: boolean, description: An SMB password or S3 keys are stored (never shown). }
        test_requested_at: { type: string, format: date-time, nullable: true, description: Set while a requested test waits for the backup role. }
        last_test_at: { type: string, format: date-time, nullable: true }
        last_test_ok: { type: boolean, nullable: true }
        last_test_error: { type: string, nullable: true, description: "An error class: dns, dial, tls, auth, forbidden, not_mounted, read_only, io." }
        status:
          type: array
          items: { $ref: "#/components/schemas/BackupTargetKindStatus" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BackupTargetPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BackupTarget" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    BackupSchedule:
      type: object
      required: [full_interval_hours, openbao_interval_hours, fleet_interval_hours, escrow_interval_hours,
        retention_full, openbao_keep_days, fleet_keep_days, updated_by, updated_at]
      properties:
        full_interval_hours: { type: integer }
        openbao_interval_hours: { type: integer }
        fleet_interval_hours: { type: integer }
        escrow_interval_hours: { type: integer }
        retention_full: { type: integer }
        openbao_keep_days: { type: integer }
        fleet_keep_days: { type: integer }
        updated_by: { type: string, nullable: true, description: null while the defaults apply. }
        updated_at: { type: string, format: date-time, nullable: true }
    BackupScheduleUpdate:
      type: object
      additionalProperties: false
      required: [full_interval_hours, openbao_interval_hours, fleet_interval_hours, escrow_interval_hours,
        retention_full, openbao_keep_days, fleet_keep_days]
      properties:
        full_interval_hours: { type: integer, description: "6–168, default 24." }
        openbao_interval_hours: { type: integer, description: "1–24, default 6." }
        fleet_interval_hours: { type: integer, description: "6–168, default 24." }
        escrow_interval_hours: { type: integer, description: "1–24, default 1." }
        retention_full: { type: integer, description: "Full backups kept, 2–60, default 14." }
        openbao_keep_days: { type: integer, description: "7–365, default 30." }
        fleet_keep_days: { type: integer, description: "7–365, default 30." }
    BackupRunRequest:
      type: object
      additionalProperties: false
      properties:
        kinds:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BackupKind" }
          description: Absent, null or empty for every kind.
        label: { type: string, maxLength: 64, default: "" }
    BackupRunTarget:
      type: object
      required: [target_id, ok, error_class]
      properties:
        target_id: { type: string, format: uuid }
        ok: { type: boolean }
        error_class: { type: string, nullable: true }
    BackupRun:
      type: object
      required: [id, kind, label, state, outcome, started_at, finished_at, bytes, error_class, targets, requested_by, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/BackupKind" }
        label: { type: string }
        state: { type: string, enum: [requested, running, finished] }
        outcome: { type: string, enum: [succeeded, failed], nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        bytes: { type: integer, format: int64 }
        error_class: { type: string, nullable: true }
        targets:
          type: array
          items: { $ref: "#/components/schemas/BackupRunTarget" }
        requested_by: { type: string, nullable: true, description: The administrator or operator who requested the run; null for a scheduled run. }
        created_at: { type: string, format: date-time }
    BackupRunPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BackupRun" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    BackupRestorePlanState:
      type: string
      enum: [approved, running, completed, failed, expired, abandoned]
    BackupRestorePlanInput:
      type: object
      additionalProperties: false
      required: [kind, components, confirmation]
      properties:
        kind: { type: string, enum: [point_in_time, components], description: "point_in_time needs at." }
        source_target_id: { type: string, format: uuid, nullable: true, description: The target to restore from; absent or null for the local backup repository. }
        at: { type: string, format: date-time, nullable: true, description: "The point in time; required for kind point_in_time, absent or null for kind components (the newest backups)." }
        components:
          type: array
          minItems: 1
          items: { type: string, enum: [postgres, openbao, fleet, escrow] }
        confirmation: { type: string, description: The typed word restore. }
    BackupRestorePlanAbandonInput:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation: { type: string, description: The typed word abandon. }
    BackupRestorePlan:
      type: object
      required: [id, kind, source, source_target_id, source_target_name, at, components, state, created_by, created_at, expires_at, started_at, finished_at, outcome_detail, host_command]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [point_in_time, components, fresh_install] }
        source: { type: string, enum: [repo, target, set], description: "repo: the local backup repository; target: source_target_id; set: a backup set the host was given." }
        source_target_id: { type: string, format: uuid, nullable: true }
        source_target_name: { type: string, nullable: true, description: Null when the target is gone or the source is not a target. }
        at: { type: string, format: date-time, nullable: true }
        components:
          type: array
          items: { type: string, enum: [postgres, openbao, fleet, escrow, backup-repo] }
        state: { $ref: "#/components/schemas/BackupRestorePlanState" }
        created_by: { type: string, description: "The administrator who approved the plan, or the host operator of a restore without a plan." }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: 24 hours after the approval; null for a restore without a plan. }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        outcome_detail: { type: string, nullable: true, description: "The failed step and what happened, as <step>: <text>; abandoned by <administrator> for a plan in state abandoned." }
        host_command: { type: string, description: "The command that executes the plan on the host: ./paddock restore --plan <id>." }
    BackupRestorePlanPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BackupRestorePlan" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    BackupKey:
      type: object
      required: [key_id, fingerprint, state, created_at, created_by, confirmed_at, confirmed_by, retired_at, attempts, legacy, positions]
      description: A backup key without its text, ciphertext or challenge hash.
      properties:
        key_id: { type: string }
        fingerprint: { type: string, description: The first 16 hexadecimal characters of the key's SHA-256. }
        state: { type: string, enum: [unconfirmed, confirmed, retired, discarded] }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        confirmed_at: { type: string, format: date-time, nullable: true }
        confirmed_by: { type: string, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }
        attempts: { type: integer }
        legacy: { type: boolean }
        positions:
          type: array
          nullable: true
          minItems: 6
          maxItems: 6
          description: |
            The six 1-based challenge positions in ascending order while the key is unconfirmed (also for the
            imported key legacy, whose administrator never saw a generating response); null in every other state.
            Indices only, never characters of the key.
          items: { type: integer }
    BackupKeyStatus:
      type: object
      required: [active, pending, retired]
      properties:
        active:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BackupKey" }]
        pending:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/BackupKey" }]
        retired:
          type: array
          items: { $ref: "#/components/schemas/BackupKey" }
    BackupKeyGenerated:
      type: object
      required: [key_id, key, fingerprint, positions, download_name]
      description: The only response that holds a backup key's text.
      properties:
        key_id: { type: string }
        key: { type: string, description: "The key: 32 bytes in standard base64 (44 characters)." }
        fingerprint: { type: string }
        positions:
          type: array
          minItems: 6
          maxItems: 6
          description: Six distinct 1-based positions of key in ascending order; their characters confirm the key.
          items: { type: integer }
        download_name: { type: string, description: The file name the portal offers the key text under. }
    BackupKeyConfirm:
      type: object
      required: [answer]
      additionalProperties: false
      properties:
        answer: { type: string, maxLength: 64, description: "The characters of the key at the six positions, in order." }
    BackupRepo:
      type: object
      required: [path, bytes_used, bytes_free, stanzas]
      properties:
        path: { type: string, nullable: true, description: The pgBackRest repository path of the active key; null without one. }
        bytes_used: { type: integer, format: int64, nullable: true }
        bytes_free: { type: integer, format: int64, nullable: true }
        stanzas:
          type: array
          items: { $ref: "#/components/schemas/BackupStanza" }
    BackupStanza:
      type: object
      required: [name, last_full_at, wal_archived_at]
      properties:
        name: { type: string }
        last_full_at: { type: string, format: date-time, nullable: true, description: The last successful full backup the runs recorded. }
        wal_archived_at: { type: string, format: date-time, nullable: true }
    BackupOverview:
      type: object
      required: [key, schedule, targets, repo, last_runs]
      properties:
        key: { $ref: "#/components/schemas/BackupKeyStatus" }
        schedule: { $ref: "#/components/schemas/BackupSchedule" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/BackupTarget" }
        repo: { $ref: "#/components/schemas/BackupRepo" }
        last_runs:
          type: array
          items: { $ref: "#/components/schemas/BackupRun" }
          description: The newest run per kind.
    NotificationDestinationPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationDestination" }
