      additionalProperties: false
      properties:
        device_group_id: { type: string, format: uuid, description: Omit for every device of the organization. }
        unit: { type: string, maxLength: 255, description: "*.service, *.timer, *.socket or *.path; reserved units answer 422 unit_not_allowed." }
        enabled: { type: boolean, default: true }
        active: { type: boolean, default: true }
    ManagedUnitUpdate:
      type: object
      additionalProperties: false
      properties:
        unit: { type: string, maxLength: 255 }
        enabled: { type: boolean }
        active: { type: boolean }
    ManagedUnitPage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ManagedUnit" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
        total_capped: { type: boolean, description: "More than 10000 items match; total is 10000." }
        sort: { type: string, description: Applied sort. }
    OrganizationDomainsUpdate:
      type: object
      required: [domains]
      additionalProperties: false
      properties:
        domains:
          type: array
          maxItems: 20
          description: Lowercase DNS names; the first one is the primary domain of device logins.
          items: { type: string, maxLength: 253 }
    IdentitySource:
      type: string
      enum: [local, synced]
    User:
      type: object
      required: [id, username, display_name, email, source, locked, lock_incomplete, locked_at, created_at, updated_at,
        domain_match]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, description: "UPN, lowercase, e.g. dave@acme.test." }
        domain_match:
          type: boolean
          description: |
            The part of the username after its last @ is one of the organization's domains (plan M8x decision 46). A
            user without it cannot sign in on devices: the login component accepts name@domain only.
        display_name: { type: string }
        email: { type: string }
        source: { $ref: "#/components/schemas/IdentitySource" }
        locked: { type: boolean }
        lock_incomplete:
          type: boolean
          description: "The user is locked for the devices, but Authentik has not confirmed the group membership and the token revocation; locking again retries."
        locked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserRef:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    UserDetail:
