        device_id: { type: string, format: uuid }
        hostname: { type: string }
        user_id: { type: string, format: uuid, nullable: true, description: Null when no directory user has the user name. }
        username: { type: string }
        state: { $ref: "#/components/schemas/SoftwareRequestState" }
        requested_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: When an open request expires without a decision. }
        decided_by: { type: string, nullable: true, description: The deciding administrator's display name. }
        decided_at: { type: string, format: date-time, nullable: true, description: When it was decided or expired. }
        decision_reason: { type: string, nullable: true }
    SoftwareRequestPage:
