        category: { type: string, maxLength: 64 }
        source_id: { type: string, format: uuid, nullable: true, description: Omit or null for the distribution's own repositories. }
        packages: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/PackageRef" } }
        approval:
          allOf:
            - $ref: "#/components/schemas/SoftwareApproval"
          description: Omit to keep the stored approval.
    SoftwareCatalogEntry:
      type: object
