        architectures: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/SoftwareArchitecture" } }
        signing_key: { type: string, maxLength: 65536, description: "Only together with fingerprint; the same rules as on creation." }
        fingerprint: { type: string, description: Only together with signing_key. }
    SoftwareSourcePage:
      type: object
      required: [items, page, page_size, total, total_capped, sort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SoftwareSourceSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: "Matching items, counted up to 10000." }
