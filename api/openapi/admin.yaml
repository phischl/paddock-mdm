  /api/platform/v1/ip-allowlist:
    get:
      operationId: listIpAllowlist
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin. The IP allow list of the administrative surfaces (plan M7a decision 16): while it has
        entries, the portal and the admin API answer 403 ip_not_allowed to every client address outside it, sessions
        and API tokens alike. Sessions only: platform tokens do not exist.
      x-paddock-list:
        sort: [cidr, label, created_at]
        default_sort: cidr
        search: [label, cidr]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/IpAllowlistSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntryPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createIpAllowlistEntry
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin; requires a step-up within the step-up window (403 step_up_required). Adds a range.
        409 lockout_confirmation_required when the list would no longer cover the caller's own address (repeat with
        confirm=lockout); 409 already_exists for a duplicate CIDR. Every attempt is audited.
      x-paddock-audit: platform.ip_allowlist_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpAllowlistEntryCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/ip-allowlist/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getIpAllowlistEntry
      tags: [platform]
      security:
        - session: []
      description: "Roles: platform_admin. One entry."
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateIpAllowlistEntry
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin; requires a step-up (403 step_up_required). Changes the range and/or the label (at least
        one). 409 lockout_confirmation_required when the caller's own address would no longer be covered (repeat with
        confirm=lockout); 409 already_exists for a duplicate CIDR.
      x-paddock-audit: platform.ip_allowlist_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Confirm"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpAllowlistEntryUpdate" }
      responses:
        "200":
          description: The changed entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteIpAllowlistEntry
      x-paddock-step-up: true
      tags: [platform]
      security:
        - session: []
      description: |
        Roles: platform_admin; requires a step-up (403 step_up_required). Removes the entry. 409
        lockout_confirmation_required when the caller's own address would no longer be covered (repeat with
        confirm=lockout); 409 disable_confirmation_required when it is the last entry, which switches the allow list
        off for everyone (repeat with confirm=disable).
      x-paddock-audit: platform.ip_allowlist_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Confirm"
      responses:
        "204":
          description: Removed.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/component-targets:
    get:
      operationId: listComponentTargets
      tags: [platform]
      description: |
        Roles: platform_admin. The versions devices are expected to run (plan M8d decision 55): paddockd, the
        supervisor and paddock-revoke from the current release, fleetd from the newest published release, Himmelblau
        from the compiler. At most five rows, no list contract.
      responses:
        "200":
          description: The component targets.
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items: { $ref: "#/components/schemas/ComponentTarget" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/upgrade-check:
    get:
      operationId: getUpgradeCheck
      tags: [platform]
      description: |
        Roles: platform_admin. The read-only report before an upgrade to target_version (ADR 0047 decision 2, plan
        M16 decision 4), the same as paddock-server admin upgrade-check: migrations (FAIL when the database is ahead
        of this release), agents (active devices whose agent is a release older than the target's support window:
        FAIL above 1 % of the active devices or 5, whichever is larger, WARN below), backups, openbao, pending
        (running agent rollout, halted configuration rollouts: WARN) and sessions. Changes nothing and is not
        audited. 400 invalid_request when target_version is missing or no release this server knows.
      parameters:
        - name: target_version
          in: query
          description: The release to upgrade to, without the leading v (e.g. 0.1.0-alpha.9). Required in effect, but checked after the role, so that other roles get 403 and not 400.
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeCheck" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/agent-releases:
    get:
      operationId: listAgentReleases
      tags: [platform]
      description: "Roles: platform_admin. Agent releases with their rollout status (plan M2b decision 20)."
      x-paddock-list:
        sort: [version, created_at, status]
        default_sort: -created_at
        search: [version]
        filters: [status]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AgentReleaseSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AgentReleaseStatus" }
      responses:
        "200":
          description: One page of agent releases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentReleasePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAgentRelease
