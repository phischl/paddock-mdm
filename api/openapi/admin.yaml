      operationId: getFinding
      tags: [findings]
      description: "Roles: org_admin, org_operator, org_auditor. One finding; 404 not_found for another organization's."
      responses:
        "200":
          description: The finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
