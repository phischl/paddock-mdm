openapi: 3.0.3
info:
  title: Paddock Admin API
  version: 0.1.0
  description: |
    Admin API of the Paddock portal (plan M0 §6.6). Source of truth for the generated Go server interfaces and the
    portal's TypeScript types. Written in the OpenAPI 3.0.3 subset because oapi-codegen does not process 3.1.

    - All errors are RFC 9457 problem details (`application/problem+json`) with `code` and `instance` (request ID).
    - Mutating requests require the header `X-Paddock-CSRF: 1` (otherwise 403 `csrf_missing`).
    - Requests authenticate with the portal session cookie or with an API token (`Authorization: Bearer pdk_…`,
      plan M6c decision 9). A token acts in its organization with the role it carries; API token requests send
      `X-Paddock-CSRF: 1` on mutating requests, too.
    - A session cookie is valid only while its server-side record exists (plan M8s decision 14): every session
      request answers 503 `session_store_unavailable` while the session store is unreachable, and 401
      `unauthenticated` once the session was signed out or ended. API tokens are not affected.
    - The organization is never part of a path: it comes from the session only. Resources of other organizations
      answer 404 `not_found`, exactly like missing resources.
    - Operations that are privileged actions carry `x-paddock-audit: <code>`; each attempt produces exactly one
      audit event with that code.
    - Operations that always require a step-up within the last 5 minutes carry `x-paddock-step-up: true` (ADR 0044
      decision 4); the contract test keeps the flag equal to the server's route table in both directions.
    - The MCP tool catalog (`pkg/mcpcatalog`, generated by `make gen`) has one tool per operation outside the tag
      `auth`, named by its `operationId`. `x-paddock-mcp: { expose: false }` keeps an operation from being offered as
      a tool; `x-paddock-mcp: { bootstrap: true }` lets an MCP session call it without consulting the MCP policy.
      Step-up operations, non-JSON request bodies and success responses without JSON content are never exposed.
    - Every collection `GET` implements the list contract (ADR 0018): `page`, `page_size` (10, 25, 50, 100),
      `sort` (allow list, `-` prefix = descending, the primary key is appended as tie-breaker), `q`
      (case-insensitive substring search, 2–100 characters) and the documented filters; enum filters are
      repeatable. The response is `{items, page, page_size, total, total_capped, sort}`. `page × page_size` may not
      exceed 10000 (400 `page_out_of_range`); `total` is counted up to 10000, above that `total = 10000` and
      `total_capped = true`. The extension `x-paddock-list` documents sort fields, default sort, search fields and
      filters of each list.
servers:
  - url: https://admin.paddock.localhost:8443
security:
  - session: []
  - bearer: []
tags:
  - name: auth
  - name: me
  - name: overview
  - name: device-groups
  - name: enrollment-tokens
  - name: api-tokens
  - name: config
  - name: devices
  - name: managed-config
  - name: users
  - name: privileges
  - name: settings
  - name: revocation
  - name: inventory
  - name: updates
  - name: audit
  - name: platform
paths:
  /api/auth/login:
    get:
      operationId: login
      tags: [auth]
      security: []
      summary: Start the OIDC login (authorization code + PKCE)
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to after login; must start with "/" and not with "//".
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Authentik authorization endpoint.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
  /api/auth/callback:
    get:
      operationId: callback
      tags: [auth]
      security: []
      summary: OIDC redirect URI
      x-paddock-audit: admin.login
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: |
            Redirect to return_to (default /) on success, or to /login-denied?reason=<code>. An identity with the
            platform role and one organization role signs in to the organization role (ADR 0045). The callback of a
            role switch (POST /api/auth/switch) opens a new session in the chosen role, ends the previous session and
            records admin.login with previous_role; a role the fresh groups claim no longer grants is refused with
            reason role_not_granted and leaves the previous session untouched.
          headers:
            Location: { schema: { type: string } }
  /api/auth/stepup:
    get:
      operationId: stepUp
      tags: [auth]
      summary: Start a step-up authentication (plan M4a decision 6)
      description: |
        Requires a valid session. Redirects to the authorization endpoint of the OIDC application
        paddock-portal-stepup with prompt=login, max_age=20 and the session's username as login_hint; Authentik runs
        the flow paddock-stepup (password and MFA). Actions that need a step-up answer 403 step_up_required when the
        session has none within the last 300 s.
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative path to return to; must start with "/" and not with "//".
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the Authentik authorization endpoint.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/auth/stepup/callback:
    get:
      operationId: stepUpCallback
      tags: [auth]
      security: []
      summary: OIDC redirect URI of the step-up
      description: |
        Accepts an ID token of the session's own user (same sub) with auth_time at most 60 s old and MFA (amr mfa),
        then issues the session again with the step-up time. Any other answer leaves the session unchanged.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect to return_to, with the query parameter stepup=failed if the step-up was refused.
          headers:
            Location: { schema: { type: string } }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: Session ended. The client navigates to end_session_url to end the Authentik session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Logout" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/auth/switch:
    post:
      operationId: switchRole
      tags: [auth]
      summary: Start the switch to the session's alternate role (ADR 0045).
      parameters: [ { $ref: "#/components/parameters/Csrf" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleSwitch" }
      responses:
        "200":
          description: Navigate the browser to authorize_url; the callback opens the new session and ends this one.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties: { authorize_url: { type: string, format: uri } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/auth/mcp/config:
    get:
      operationId: getMcpLoginConfig
      tags: [auth]
      security: []
      summary: Login configuration of paddockctl mcp (ADR 0044 amendment 2026-10-25)
      description: |
        The Authentik provider paddock-mcp and its endpoints, copied from the discovered provider metadata, so that
        paddockctl needs only the portal URL for the device authorization grant. 404 not_found when the MCP login is
        not configured (PADDOCK_OIDC_MCP_ISSUER empty); 502 upstream_unavailable while the provider is not discovered.
      responses:
        "200":
          description: The login configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpLoginConfig" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/auth/mcp/session:
    post:
      operationId: openMcpSession
      tags: [auth]
      security: []
      summary: Open or renew the MCP session of an Authentik token pair
      x-paddock-audit: admin.login
      description: |
        Verifies the ID token and the access token of the provider paddock-mcp (signature, issuer, audience
        paddock-mcp, expiry, the same sub), resolves the role from the ID token's groups like the portal login and
        opens the MCP session of the access token for its remaining life (at most 35 minutes, otherwise 400). The
        access token then authenticates admin API requests as a bearer with channel mcp.

        An ID token with amr is a login: it must name the second factor (amr mfa; otherwise 401 with detail
        mfa_required), and its sub and auth_time are bound for 8 hours, the refresh token's life. An ID token without
        amr (a refreshed one) is a renewal: it is accepted only for a live binding of its sub and auth_time, otherwise
        401 mcp_login_required (ADR 0044 amendment 2026-10-28), and is recorded as admin.login with renewal true.
        Every attempt with verifiable tokens records one admin.login event with channel mcp; a refused role answers
        403 forbidden with the denial reason as detail (no_role, multiple_organizations, role_not_granted, …).
      parameters:
        - $ref: "#/components/parameters/McpClient"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McpSessionInput" }
      responses:
        "204": { description: The MCP session is open. }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/auth/mcp/logout:
    post:
      operationId: closeMcpSession
      tags: [auth]
      security: [ { bearer: [] } ]
      summary: End the MCP session of the bearer's access token
      description: |
        Deletes the session of the access token and the login binding of its renewals; a token without a session is
        already signed out (204). The refresh token is revoked by paddockctl at Authentik's revocation endpoint.
      responses:
        "204": { description: The MCP session is ended. }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/v1/me:
    get:
      operationId: getMe
      x-paddock-mcp: { bootstrap: true }
      tags: [me]
      responses:
        "200":
          description: The signed-in administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: The client address is outside the IP allow list (ip_not_allowed, plan M7a decision 17).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: The api has not loaded the IP allow list yet and refuses every request (ip_allowlist_unavailable, fail closed).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: updateMe
      x-paddock-mcp: { expose: false }
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/device-groups:
    get:
      operationId: listDeviceGroups
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor."
      x-paddock-list:
        sort: [name, created_at, updated_at]
        default_sort: name
        search: [name, description]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceGroupSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of device groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroupPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator."
      x-paddock-audit: device_group.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/device-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor."
      responses:
        "200":
          description: The device group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin, org_operator."
      x-paddock-audit: device_group.updated
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroup" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDeviceGroup
      tags: [device-groups]
      description: "Roles: org_admin."
      x-paddock-audit: device_group.deleted
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      description: "Roles: org_admin, org_auditor."
      x-paddock-list:
        sort: [occurred_at, code, outcome]
        default_sort: -occurred_at
        search: [code, actor.display, target.display]
        filters: [from, to, code, outcome, actor_type, target_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditEventSort"
        - $ref: "#/components/parameters/Search"
        - name: target_id
          in: query
          description: Exact target id (for example a device id).
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: RFC 3339; default to - 7 days.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: RFC 3339; default now. The range may span at most 92 days (400 range_too_large).
          schema: { type: string, format: date-time }
        - name: code
          in: query
          description: Exact event code; repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: outcome
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditOutcome" }
        - name: actor_type
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditActorType" }
      responses:
        "200":
          description: One page of audit events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/integrity:
    get:
      operationId: getAuditIntegrity
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor. The integrity of the organization's audit evidence (plan M8b decision 30): the
        last sealed day, the number of sealed days, the newest chain verification run and the times of the last
        successful and the last failed run.
      responses:
        "200":
          description: The evidence integrity summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditIntegrity" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/verification-runs:
    get:
      operationId: listAuditVerificationRuns
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor. The chain verification runs of the organization (nightly window, random sample
        day, paddock-server audit verify). q matches the problems of a run.
      x-paddock-list:
        sort: [started_at, from_day, ok]
        default_sort: -started_at
        search: [problems]
        filters: [ok, trigger]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditVerificationRunSort"
        - $ref: "#/components/parameters/Search"
        - name: ok
          in: query
          description: Only runs that found the chain intact (true) or broken (false).
          schema: { type: boolean }
        - name: trigger
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/AuditVerificationTrigger" }
      responses:
        "200":
          description: One page of verification runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerificationRunPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/audit/manifests:
    get:
      operationId: listAuditManifests
      tags: [audit]
      description: >-
        Roles: org_admin, org_auditor. The sealed days of the organization with the result of the newest verification
        run covering each day. q matches the object key of the manifest.
      x-paddock-list:
        sort: [day]
        default_sort: -day
        search: [object_key]
        filters: [from, to, verified]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/AuditManifestSort"
        - $ref: "#/components/parameters/Search"
        - name: from
          in: query
          description: First day (inclusive).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last day (inclusive).
          schema: { type: string, format: date }
        - name: verified
          in: query
          description: Only days with (true) or without (false) at least one successful verification run covering them.
          schema: { type: boolean }
      responses:
        "200":
          description: One page of manifests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditManifestPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/device-groups/{id}/devices:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceGroupDevices
      tags: [device-groups]
      description: "Roles: org_admin, org_operator, org_auditor. The members of a device group. q matches the reported hostname, the managed name and the hardware UUID."
      x-paddock-list:
        sort: [hostname, last_contact_at, enrolled_at, state]
        default_sort: hostname
        search: [hostname, name, hardware_uuid]
        filters: [state]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DeviceStateFilter"
      responses:
        "200":
          description: One page of member devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/v1/enrollment-tokens:
    get:
      operationId: listEnrollmentTokens
      tags: [enrollment-tokens]
      description: "Roles: org_admin, org_operator."
      x-paddock-list:
        sort: [name, created_at, expires_at]
        default_sort: -created_at
        search: [name]
        filters: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EnrollmentTokenSort"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page of enrollment tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createEnrollmentToken
      tags: [enrollment-tokens]
      description: |
        Roles: org_admin. The response carries the token secret and the enrollment configuration exactly once; only
        a hash of the secret is stored. A token whose device group would give an enrolled device root grants needs a
        step-up within the last 300 s (403 step_up_required; API tokens cannot satisfy it).
      x-paddock-audit: enrollment_token.created
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTokenCreate" }
      responses:
        "201":
          description: Created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenCreated" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/enrollment-tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getEnrollmentToken
      tags: [enrollment-tokens]
      description: "Roles: org_admin, org_operator."
      responses:
        "200":
          description: The enrollment token (without secret).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentToken" }
