        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalAdminRevealRequest" }
      responses:
        "200":
          description: The passwords.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalAdminRevealed" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/local-admin/rotate:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rotateDeviceLocalAdmin
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Issues the command rotate_admin_password (valid 7 days) to an active device;
        another state is 409 invalid_state.
      x-paddock-audit: local_admin.rotation_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "202":
          description: The issued command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceCommand" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/disk:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceDisk
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The disk encryption of the device (plan M4b decision 14): the state,
        LUKS version and keyslot kinds of its last check-in, its escrowed recovery key and header generations (newest
        first) and its last keyslot change.
