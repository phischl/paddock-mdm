  /api/v1/devices/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: retireDevice
      tags: [devices]
      description: >-
        Roles: org_admin. active or quarantined → retired; the identity keys are revoked. An encrypt_disk command the
        device has not received is withdrawn and its conversion cancelled (plan M8e §14.5 decision 38); an in-place
        encryption never refuses the retirement.
      x-paddock-audit: device.retired
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/enforce:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: enforceDevice
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Ends the report-only mode of an adopted device (plan M11 decision 42): its next
        bundle quarantines foreign sudoers files, removes unexpected members of privileged groups (never the last
        administrator), installs the login component and applies every managed resource. The body repeats the device's
        hostname as the typed confirmation (400 invalid_request when it differs); a device that is not active and
        report-only: 409 invalid_state. Not offered to the assistant: the typed confirmation is the administrator's.
      x-paddock-audit: device.enforcement_enabled
      x-paddock-mcp: { expose: false }
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEnforce" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/update-agent:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: updateDeviceAgent
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Asks an active device to install the agent release the platform offers at its
        next check-in, outside its rollout wave and regardless of the update policy (plan M8d decision 26); the
        supervisor installs it with self-test, probation and rollback as usual. The request ends with the device's
        report for that version or after 24 hours. 409 invalid_state: the device is not active, no release is being
        offered (no rollout or a halted one), the device already runs the release, or the release has no artifact for
        the device's architecture.
      x-paddock-audit: device.agent_update_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/uninstall:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: uninstallDevice
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Issues the signed command
        uninstall (lifetime 7 days, plan M8d decision 37): the device removes Paddock at its next check-in and is
        retired by its report. Mode leave keeps everything else working; mode reset also removes Himmelblau, the
        unchanged managed files and the managed local administrator (unless it is the last local administrator or
        keep_local_admin is set) and, with clear_tpm, clears the TPM. User data and the disk encryption are never
        changed. confirm_hostname must equal the device's hostname. 422 invalid_request: unknown mode, a reason outside
        2–500 characters, a wrong confirm_hostname, or clear_tpm or keep_local_admin with mode leave. 409 invalid_state:
        the device is not active, an uninstall is already requested, an in-place encryption is active
        (disk_conversion.active, plan M8e §14.5 decision 36), or a Lock or Destroy is pending; 409
        tpm_in_use_by_disk: clear_tpm while the last health report lists a TPM keyslot on any volume.
      x-paddock-audit: device.uninstall_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUninstallRequest" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/uninstall/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelDeviceUninstall
      tags: [devices]
      description: |
        Roles: org_admin. Cancels an uninstall while its command is pending, failed or expired (plan M8d decision 38):
        the command becomes cancelled and the request is cleared. 409 invalid_state: no uninstall is requested, the
        device already received the command, or the uninstall completed.
      x-paddock-audit: device.uninstall_cancelled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/encrypt:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: encryptDevice
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Issues the signed command
        encrypt_disk (lifetime 7 days, ADR 0039, plan M8e decision 7): the device escrows a recovery key, prepares
        itself and encrypts its root volume in place after its next restart; disk_conversion follows the phases.
        confirm_hostname must equal the device's hostname and backup_confirmed must be true. 422 invalid_request: a
        reason outside 2–500 characters, a wrong confirm_hostname, or backup_confirmed false. 409 invalid_state: the
        device is not active; its last health does not report disk state not_encrypted with an eligible layout (the
        detail names the reasons); a conversion is already open; an uninstall is pending; or a Lock or Destroy is
        pending.
      x-paddock-audit: device.encrypt_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEncryptRequest" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/encrypt/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelDeviceEncryption
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Cancels the open in-place
        encryption before the device restarts (plan M8e decision 8): while the encrypt_disk command has not reached
        the device (pending, failed or expired) it is withdrawn and the conversion is cancelled at once; once the
        device received it, or while the conversion is prepared, the device is sent the signed command
        encrypt_disk_abort and the conversion keeps its phase until the device reports the abort (cancelled) or
        refuses it (abort_refused_reason). confirm_hostname must equal the device's hostname (422 invalid_request).
        409 invalid_state: no conversion is open or a cancellation is already on its way; 409
        conversion_not_cancellable: the device already started the encryption.
      x-paddock-audit: device.encrypt_cancelled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEncryptCancelRequest" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/groups:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setDeviceGroups
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Replaces the device group memberships. A change that gives a user root on a device they did not have before (also through the combination of several
        profiles) needs org_admin (403 forbidden otherwise) and a step-up (403 step_up_required; API tokens cannot
        satisfy it).
      x-paddock-audit: device.groups_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceGroupsUpdate" }
      responses:
        "200":
          description: The device with its new memberships.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/logins:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceLogins
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The login history of the device (plan M8d decision 18): every
        session start of a directory user while the organization's login history is on, for login_history_days. Empty
        while the history is off.
      x-paddock-list:
        sort: [at, username]
        default_sort: -at
        search: [username]
        filters: [username]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceLoginSort"
        - $ref: "#/components/parameters/Search"
        - name: username
          in: query
          description: Only this user (exact, lower case).
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: One page of logins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLoginEventPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/config-status:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceConfigStatus
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The apply status of the device's resources as its agent last
        reported them (plan M11 decision 14): one item per resource ID with its status, the message of a failure and,
        for a report-only apply, what would change (pending). A report that omits a resource removes its row; older
        agents without per-resource outcomes only produce failed rows.
      x-paddock-list:
        sort: [resource_id, status, occurred_at]
        default_sort: resource_id
        search: [resource_id]
        filters: [status]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceResourceStatusSort"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ResourceStateFilter"
      responses:
        "200":
          description: One page of resource statuses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceResourceStatusPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/bundles:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listDeviceBundles
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. Every configuration version compiled for the device, newest
        first, with what the device reported about it (ISO 27001 A.8.9): null until it reported. Outcome none lists
        the versions without a report. config_rollout_id names the configuration rollout whose wave the device was in.
      x-paddock-list:
        sort: [version, created_at]
        default_sort: -version
        search: [version]
        filters: [outcome]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/DeviceBundleSort"
        - $ref: "#/components/parameters/Search"
        - name: outcome
          in: query
          description: |
            Repeatable; applied, rejected or none (400 invalid_request otherwise). none selects versions the device has
            not reported. The values are not an OpenAPI enum: the generated constant None would take the name of the
            privilege class's.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: One page of bundle versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceBundlePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/owners:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setDeviceOwners
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Replaces the owners of the device: the users responsible for it (at most 20;
        duplicates are collapsed). Owners have no login or sudo rights through this setting and are not part of the
        bundle. An unknown or foreign user: 400 invalid_request.
      x-paddock-audit: device.owners_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceOwnersUpdate" }
      responses:
        "200":
          description: The device with its new owners.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/name:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setDeviceName
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Sets or clears the managed name of a device. The device applies it as its
        hostname (static, transient and pretty) at its next check-in; a name changed on the device is corrected at the
        next drift check. The name is one lowercase DNS label (1–63 characters, letters, digits, hyphens; not
