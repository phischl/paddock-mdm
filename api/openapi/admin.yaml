        retired device cannot be named (409 invalid_state).
      x-paddock-audit: device.name_changed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceNameUpdate" }
      responses:
        "200":
          description: The device with its new managed name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
