        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/lock:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: lockDevice
      x-paddock-step-up: true
      tags: [revocation]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required); each request and approval
        needs its own step-up. confirm_hostname must equal the device's hostname. 403 revocation_disabled while
        PADDOCK_REVOCATION_ENABLED is off, 403 revocation_frozen while the caller is frozen after an exceeded limit.
        Requests a Lock: every keyslot of every LUKS volume of the device is erased and the device reboots; its
        root volume stays restorable with the escrowed header and recovery key. The request is approved at once and handed to
        the revocation-issuer, which checks the step-up proof and the limits (3 per hour and 10 per 24 h per
        administrator, 20 per 24 h per organization) before it signs. 409 already_exists while the device has an
        open Lock, 409 invalid_state unless the device is active or quarantined. A Lock takes precedence over an
        uninstall: an uninstall of the device without a removal report is cancelled in the same transaction (recorded
        as uninstall_cancelled on revocation.requested) and uninstall_cancelled says so. It is never refused for an
        in-place encryption: an encrypt_disk command the device has not received is withdrawn and its conversion
        cancelled (conversion_cancelled on revocation.requested, plan M8e §14.5 decision 39).
      x-paddock-audit: revocation.requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationCreate" }
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/destroy:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: destroyDevice
      x-paddock-step-up: true
      tags: [revocation]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required); each request and approval
        needs its own step-up. confirm_hostname must equal the device's hostname. 403 revocation_disabled while
        PADDOCK_REVOCATION_ENABLED is off, 403 revocation_frozen while the caller is frozen after an exceeded limit.
        Requests a Destroy: a Lock whose escrowed header and recovery key are deleted before the token is issued, so
        the device's data is unrecoverable. It waits for a second administrator (another account and another identity)
        to approve it (two-person rule). Like a Lock, it cancels an uninstall of the device without a removal report
        (uninstall_cancelled) and withdraws an undelivered encrypt_disk command (conversion_cancelled).
      x-paddock-audit: revocation.requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationCreate" }
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/revocation-requests:
    get:
      operationId: listRevocationRequests
      tags: [revocation]
      description: |
        Roles: org_admin. The organization's Lock, Destroy and self-lock requests with their approvals (never the
        step-up tokens). An issued request that the device has not confirmed yet is pending; issued_at tells for how
        long.
      x-paddock-list:
        sort: [requested_at, status, action, hostname]
        default_sort: -requested_at
        search: [hostname, reason]
        filters: [status, action, device_id]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/RevocationRequestSort"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/RevocationStatus" }
        - name: action
          in: query
          description: Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/RevocationAction" }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of revocation requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationRequestPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/revocation-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveRevocationRequest
      x-paddock-step-up: true
      tags: [revocation]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required); each request and approval
        needs its own step-up. confirm_hostname must equal the device's hostname. 403 revocation_disabled while
        PADDOCK_REVOCATION_ENABLED is off, 403 revocation_frozen while the caller is frozen after an exceeded limit.
        The second approval of a Destroy; the caller must be another administrator than the requester, with another
        identity (403 forbidden otherwise). 409 invalid_state unless the request waits for its approval.
      x-paddock-audit: revocation.approved
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationConfirm" }
      responses:
        "200":
          description: The approved request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/revocation-requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectRevocationRequest
      x-paddock-step-up: true
      tags: [revocation]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required); each request and approval
        needs its own step-up. confirm_hostname must equal the device's hostname. 403 revocation_disabled while
        PADDOCK_REVOCATION_ENABLED is off, 403 revocation_frozen while the caller is frozen after an exceeded limit.
        Rejects a request that waits for its second approval. 409 invalid_state otherwise.
      x-paddock-audit: revocation.rejected
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationConfirm" }
      responses:
        "200":
          description: The rejected request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/revocation-requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelRevocationRequest
      x-paddock-step-up: true
      tags: [revocation]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required); each request and approval
        needs its own step-up. confirm_hostname must equal the device's hostname. 403 revocation_disabled while
        PADDOCK_REVOCATION_ENABLED is off, 403 revocation_frozen while the caller is frozen after an exceeded limit.
        The requester cancels a request before it is issued (403 forbidden for anyone else). 409 invalid_state once
        it was issued or closed.
      x-paddock-audit: revocation.cancelled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevocationConfirm" }
      responses:
        "200":
          description: The cancelled request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationRequest" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/local-admin:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDeviceLocalAdmin
      tags: [devices]
      description: |
        Roles: org_admin, org_operator, org_auditor. The managed local administrator of the device (plan M4a decision
        17): the active and a pending password generation (stored by the server, not yet confirmed by the device),
        the last rotation and the last failed one.
      responses:
        "200":
          description: The local administrator state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalAdmin" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/local-admin/reveal:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: revealDeviceLocalAdmin
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Returns the active password
        and a pending one; confirm_hostname must equal the device's hostname. If the organization rotates after a
