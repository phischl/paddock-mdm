        description: { type: string }
        category: { type: string }
        source_id: { type: string, format: uuid, nullable: true }
        source_slug: { type: string, description: Empty for the distribution's own repositories. }
        packages: { type: array, items: { $ref: "#/components/schemas/PackageRef" } }
        approval: { $ref: "#/components/schemas/SoftwareApproval" }
        has_icon: { type: boolean }
        assignment_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SoftwareRequestState:
      type: string
      enum: [requested, approved, denied, expired, withdrawn]
      # Explicit names: the bare values collide with other enums, which would rename every constant of the package.
      x-enum-varnames: [SoftwareRequestRequested, SoftwareRequestApproved, SoftwareRequestDenied, SoftwareRequestExpired,
        SoftwareRequestWithdrawn]
    SoftwareApproval:
      type: string
      enum: [none, required]
      x-enum-varnames: [SoftwareApprovalNone, SoftwareApprovalRequired]
      description: required makes the users of an available assignment ask an administrator before they install the application.
    SoftwareRequest:
      type: object
      required: [id, catalog_entry_id, entry_name, entry_approval, device_id, hostname, user_id, username, state, requested_at,
