                 sudoers_d_allowlist, sudo_lecture_text, local_admin_username, local_admin_rotation_days,
                 notice_text, boot_pin_min_length]
      additionalProperties: false
      properties:
        hello_enabled: { type: boolean }
        hello_pin_min_length: { type: integer, minimum: 6, maximum: 32 }
        user_lock_session_action: { $ref: "#/components/schemas/SessionAction" }
        break_glass_accounts:
          type: array
          maxItems: 50
          description: Local accounts never touched by the privileged group policy or the deny list.
          items: { type: string, maxLength: 32 }
        sudoers_d_allowlist:
          type: array
          maxItems: 50
          description: Files in /etc/sudoers.d/ the agent leaves alone.
          items: { type: string, maxLength: 64 }
        sudo_lecture_text: { type: string, minLength: 1, maxLength: 2000 }
        local_admin_username:
          type: string
          pattern: "^[a-z_][a-z0-9_-]{0,31}$"
          description: |
            Managed local administrator account of every device (plan M4a decision 13). It cannot change once a device
            has an active password for it (409 setting_locked).
        local_admin_rotation_days: { type: integer, minimum: 1, maximum: 365 }
        rotate_after_reveal_hours:
          type: integer
          minimum: 1
          maximum: 168
          nullable: true
          description: Hours after a reveal until the device rotates the password; absent or null means no rotation.
        notice_text:
          type: string
          maxLength: 2000
          description: |
            Login notice of every device (plan M4a decision 19): plain text with line breaks, shown at the login
            screen (GDM banner), on text consoles (/etc/issue.d) and before SSH logins. Empty removes it.
        boot_pin_min_length:
          type: integer
          minimum: 6
          maximum: 32
          description: |
            Shortest boot PIN (TPM2+PIN disk unlock) the first-boot disk setup of a device installed with the Paddock
            autoinstall accepts (plan M4b decision 4). It is embedded in autoinstalls generated afterwards; installed
            devices keep the value they were installed with.
