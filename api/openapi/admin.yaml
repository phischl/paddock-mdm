        step-up within the last 300 s (403 step_up_required; API tokens cannot satisfy it). A file on another tier:
        409 invalid_state.
      x-paddock-audit: managed_file.sensitive_confirmed
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: The confirmed managed file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedFile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: approveDevice
      tags: [devices]
      description: "Roles: org_admin, org_operator. pending → active."
      x-paddock-audit: device.approved
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: rejectDevice
      tags: [devices]
      description: "Roles: org_admin. pending → rejected; the identity keys are revoked."
      x-paddock-audit: device.rejected
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/release-quarantine:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: releaseDeviceQuarantine
      tags: [devices]
      description: "Roles: org_admin, org_operator. quarantined → active."
      x-paddock-audit: device.quarantine_released
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/retire:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: retireDevice
      tags: [devices]
      description: >-
        Roles: org_admin. active or quarantined → retired; the identity keys are revoked. An encrypt_disk command the
        device has not received is withdrawn and its conversion cancelled (plan M8e §14.5 decision 38); an in-place
        encryption never refuses the retirement.
      x-paddock-audit: device.retired
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/update-agent:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: updateDeviceAgent
      tags: [devices]
      description: |
        Roles: org_admin, org_operator. Asks an active device to install the agent release the platform offers at its
        next check-in, outside its rollout wave and regardless of the update policy (plan M8d decision 26); the
        supervisor installs it with self-test, probation and rollback as usual. The request ends with the device's
        report for that version or after 24 hours. 409 invalid_state: the device is not active, no release is being
        offered (no rollout or a halted one), the device already runs the release, or the release has no artifact for
        the device's architecture.
      x-paddock-audit: device.agent_update_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/uninstall:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: uninstallDevice
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Issues the signed command
        uninstall (lifetime 7 days, plan M8d decision 37): the device removes Paddock at its next check-in and is
        retired by its report. Mode leave keeps everything else working; mode reset also removes Himmelblau, the
        unchanged managed files and the managed local administrator (unless it is the last local administrator or
        keep_local_admin is set) and, with clear_tpm, clears the TPM. User data and the disk encryption are never
        changed. confirm_hostname must equal the device's hostname. 422 invalid_request: unknown mode, a reason outside
        2–500 characters, a wrong confirm_hostname, or clear_tpm or keep_local_admin with mode leave. 409 invalid_state:
        the device is not active, an uninstall is already requested, an in-place encryption is active
        (disk_conversion.active, plan M8e §14.5 decision 36), or a Lock or Destroy is pending; 409
        tpm_in_use_by_disk: clear_tpm while the last health report lists a TPM keyslot on any volume.
      x-paddock-audit: device.uninstall_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUninstallRequest" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/uninstall/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelDeviceUninstall
      tags: [devices]
      description: |
        Roles: org_admin. Cancels an uninstall while its command is pending, failed or expired (plan M8d decision 38):
        the command becomes cancelled and the request is cleared. 409 invalid_state: no uninstall is requested, the
        device already received the command, or the uninstall completed.
      x-paddock-audit: device.uninstall_cancelled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/encrypt:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: encryptDevice
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Issues the signed command
        encrypt_disk (lifetime 7 days, ADR 0039, plan M8e decision 7): the device escrows a recovery key, prepares
        itself and encrypts its root volume in place after its next restart; disk_conversion follows the phases.
        confirm_hostname must equal the device's hostname and backup_confirmed must be true. 422 invalid_request: a
        reason outside 2–500 characters, a wrong confirm_hostname, or backup_confirmed false. 409 invalid_state: the
        device is not active; its last health does not report disk state not_encrypted with an eligible layout (the
        detail names the reasons); a conversion is already open; an uninstall is pending; or a Lock or Destroy is
        pending.
      x-paddock-audit: device.encrypt_requested
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEncryptRequest" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/devices/{id}/encrypt/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelDeviceEncryption
      x-paddock-step-up: true
      tags: [devices]
      description: |
        Roles: org_admin, with a step-up within the last 300 s (403 step_up_required). Cancels the open in-place
        encryption before the device restarts (plan M8e decision 8): while the encrypt_disk command has not reached
        the device (pending, failed or expired) it is withdrawn and the conversion is cancelled at once; once the
        device received it, or while the conversion is prepared, the device is sent the signed command
        encrypt_disk_abort and the conversion keeps its phase until the device reports the abort (cancelled) or
        refuses it (abort_refused_reason). confirm_hostname must equal the device's hostname (422 invalid_request).
        409 invalid_state: no conversion is open or a cancellation is already on its way; 409
        conversion_not_cancellable: the device already started the encryption.
      x-paddock-audit: device.encrypt_cancelled
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEncryptCancelRequest" }
      responses:
        "200": { $ref: "#/components/responses/Device" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
