        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/platform/v1/settings/mcp:
    get:
      operationId: getPlatformMcpSettings
      x-paddock-mcp: { expose: false }
      tags: [mcp]
      description: |
        Roles: platform_admin. The MCP policy of the platform (platform administrators' MCP sessions) (ADR 0044 decision 5). Without a saved policy the MCP is
        off: enabled false, write_enabled false, mode all, no allowed operations, updated_at and updated_by null.
      responses:
