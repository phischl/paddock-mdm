openapi: 3.0.3
info:
  title: Paddock Device API
  version: 1.0.0
  description: |
    Device API of the gateway role (plan M2a §6.2, architecture §6). Served at https://device.<domain>. The request
    and response types are defined in pkg/protocol, which server and agent share; the gateway tests validate every
    request and response against this document.

    Every request is signed (architecture §6.3): headers Paddock-Device, Paddock-Key-Id, Paddock-Timestamp,
    Paddock-Nonce, Paddock-Content-SHA256, Paddock-Seq and Paddock-Signature over the canonical string

        paddock-v1\n<METHOD>\n<path incl. query>\n<device>\n<key id>\n<timestamp>\n<nonce>\n<content sha256>\n<seq>

    with ECDSA P-256 (ASN.1 DER signature, unpadded base64url). Enrollment requests are signed with the new key and
    carry Paddock-Device: enroll and Paddock-Key-Id: hex SHA-256 of the public key. The timestamp may differ from
    server time by at most 300 s; a nonce is accepted once within 600 s.

    Errors are RFC 9457 problem details with a code; 401 responses carry server_time so that a device can report
    clock drift. Rate limits: 30 requests per minute per key and 300 per minute per source address (429 with
    Retry-After).
servers:
  - url: https://device.paddock.localhost:8443
security:
  - signature: []
paths:
  /v1/enroll:
    post:
      operationId: enroll
      summary: Enrollment request, signed with the new device key
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "202":
          description: Accepted; poll GET /v1/enroll/{enrollment_id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollAccepted" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/enroll/{enrollment_id}:
    get:
      operationId: getEnrollment
      summary: Enrollment status, signed with the same key as the request
      parameters:
        - name: enrollment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          description: Status of the enrollment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/checkin:
    post:
      operationId: checkin
      summary: Heartbeat, bundle pointer and pending commands
      description: |
        The body is at most 96 KiB (the other device endpoints allow 64 KiB): since plan M13a the health may carry a
        software report of up to 200 items, and a report never makes the check-in fail.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinRequest" }
      responses:
        "200":
          description: |
            seq is the new sequence number the device sends back as Paddock-Seq. bundle is set only when a newer
            bundle than applied_bundle_version exists and the device is active (not quarantined). commands are the
            device's pending, unexpired commands (empty for a quarantined device).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckinResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/commands/{command_id}/result:
    post:
      operationId: postCommandResult
      summary: Result of a command (plan M4a decision 3)
      description: |
        Idempotent per command: the same status again is accepted (202), another status is refused with 409
        conflict. A command that is not pending for the signing device (unknown, of another device, expired or
        removed) is 404.
      parameters:
        - name: command_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandResult" }
      responses:
        "202":
          description: Accepted for processing.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/escrow:
    post:
      operationId: postEscrow
      summary: Upload an escrowed secret or a LUKS header (plan M4a decision 12, M4b decision 10)
      description: |
        A secret (admin_password, luks_recovery_key) is encrypted on the device with RSA-OAEP and SHA-256 to the
        escrow-wrap public key of the bundle (keys.escrow_wrap) and sent as ciphertext. The worker stores it; poll
        GET /v1/escrow/{escrow_id} until stored before relying on it. A generation that is not above the active
        administrator password, or not above the last stored generation of a LUKS kind, fails.

        A LUKS header (luks_header) is sealed on the device — gzip, AES-256-GCM with a random key and the escrow ID
        as additional data, the key RSA-OAEP-wrapped to escrow-wrap — and announced with wrapped_dek, nonce, sha256
        and size of the sealed object instead of a ciphertext. The answer carries upload_url, a presigned PUT of the
        object key the server chose (org/<org>/devices/<device>/luks-header/<volume>/<generation>.bin, without
        <volume>/ for a header without a volume, valid 10 minutes); header generations count across all volumes;
        the device uploads the object there, and the worker marks it stored once size and SHA-256 match.
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscrowRequest" }
      responses:
        "202":
          description: Accepted for storage.
          content:
            application/json:
              schema:
                type: object
                required: [escrow_id]
                properties:
                  escrow_id: { type: string, format: uuid }
                  upload_url: { type: string, description: "luks_header only: presigned PUT URL of the sealed header, valid 10 minutes." }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/escrow/{escrow_id}:
    get:
      operationId: getEscrow
      summary: Storage status of an escrow upload
      parameters:
        - name: escrow_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      responses:
        "200":
          description: pending until the worker processed the upload (also for unknown IDs), then stored or failed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [pending, stored, failed, refused]
                    description: "refused: a luks_header of a 33rd distinct volume of the device (PDK-009); not retried for 24 h."
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/diagnostics:
    post:
      operationId: postDiagnostics
      summary: Announce a sealed diagnostics bundle (ADR 0048 decision 3, plan M12 decision 2)
      description: |
        Answers a delivered collect_status command. The device collects Paddock's own diagnostics (the closed list of
        ADR 0048 decision 2), seals the archive — AES-256-GCM with a random key and the command ID as additional data,
        the key RSA-OAEP-wrapped to the escrow-wrap key of its bundle — and announces sha256 and size of the sealed
        object with nonce and wrapped_dek. The answer carries upload_url, a presigned PUT of the object key the server
        chose (org/<org>/devices/<device>/diagnostics/<command_id>.bin in the escrow bucket, valid 10 minutes, bound to
        the announced size); the device uploads the object there and then posts the command result
        {uploaded: true, files, bytes, truncated_entries, notified_sessions}. The worker marks the bundle stored once
        size and SHA-256 match. A command ID that is not a collect_status command held for this device is not found;
        each command is announced once (409 already_uploaded).
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiagnosticsRequest" }
      responses:
        "202":
          description: Accepted; upload the sealed bundle to upload_url.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticsResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/events:
    post:
      operationId: postEvents
      summary: Batch of device events (at most 500)
      parameters:
        - $ref: "#/components/parameters/Device"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Nonce"
        - $ref: "#/components/parameters/ContentSHA256"
        - $ref: "#/components/parameters/Seq"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventsRequest" }
      responses:
        "202":
          description: Accepted for processing; duplicates (same event_seq) are ignored.
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    signature:
      type: apiKey
      in: header
      name: Paddock-Signature
      description: ECDSA P-256 request signature (see the description of this document).
  parameters:
    Device:
      name: Paddock-Device
      in: header
      required: true
      description: Device ID, or "enroll" for enrollment requests.
      schema: { type: string }
    KeyId:
      name: Paddock-Key-Id
      in: header
      required: true
      description: Hex SHA-256 of the SubjectPublicKeyInfo of the signing key.
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Timestamp:
      name: Paddock-Timestamp
      in: header
      required: true
      schema: { type: string, pattern: "^[0-9]+$" }
    Nonce:
      name: Paddock-Nonce
      in: header
      required: true
      description: 16 random bytes, unpadded base64url.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
    ContentSHA256:
      name: Paddock-Content-SHA256
      in: header
      required: true
      description: Unpadded base64url SHA-256 of the body (of the empty string without body).
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    Seq:
      name: Paddock-Seq
      in: header
      required: true
      description: Last sequence number received from the server (0 before the first check-in).
      schema: { type: string, pattern: "^[0-9]+$" }
    Signature:
      name: Paddock-Signature
      in: header
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [invalid_request, invalid_signature, clock_skew, replay, invalid_token, identity_revoked,
                 unknown_event_type, not_found, rate_limited, backpressure, payload_too_large, conflict, already_uploaded,
                 internal]
        detail: { type: string }
        instance: { type: string }
        server_time: { type: string, format: date-time, description: Set on 401 responses. }
    EnrollRequest:
      type: object
      required: [token, public_key, key_protection, hostname, agent_version]
      properties:
        token: { type: string, description: Enrollment token secret from the enrollment configuration. }
        public_key: { type: string, description: Standard base64 SubjectPublicKeyInfo DER of the ECDSA P-256 key. }
        key_protection: { type: string, enum: [tpm, file] }
        hostname: { type: string, minLength: 1, maxLength: 253 }
        hardware_uuid: { type: string, maxLength: 128 }
        machine_id: { type: string, maxLength: 128 }
        os_release:
          type: object
          additionalProperties: { type: string }
        agent_version: { type: string, maxLength: 128 }
        enrollment_method:
          type: string
          enum: [autoinstall, adopted]
          description: |
            How the device was enrolled (plan M11 decision 10): `autoinstall` by the Paddock autoinstall, `adopted` by
            `paddockd enroll` on an installed system. Optional; agents of earlier releases leave it out.
    EnrollAccepted:
      type: object
      required: [enrollment_id]
      properties:
        enrollment_id: { type: string, format: uuid }
    EnrollStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [processing, pending, active, rejected] }
        device_id: { type: string, format: uuid }
        reason: { type: string, description: "Rejection reason, e.g. token_exhausted." }
    CheckinRequest:
      type: object
      required: [applied_bundle_version, agent_version, schema_versions, event_seq_high]
      properties:
        applied_bundle_version: { type: integer, format: int64, minimum: 0 }
        agent_version: { type: string, maxLength: 128 }
        schema_versions:
          type: array
          items: { type: integer }
        health:
          type: object
          additionalProperties: true
          description: |
            The agent's health report (agent/internal/health.Report). Since plan M8d: components maps paddockd,
            paddock_supervisor, paddock_revoke, himmelblau and fleetd to their installed versions ("" when not
            installed), and disk carries unlock_mode and, in state not_encrypted, boot_separate. Since plan M8h:
            hostname is the kernel hostname at the check-in (os.Hostname(), plan M8h decision 8); the server keeps it
            as the device's reported hostname. Agents before M8h do not send it. Since plan M8e: disk.state may be
            encrypting (an online reencryption of the root volume is unfinished), and disk.conversion carries, in state
            not_encrypted, the in-place encryption preflight: eligible, reasons (closed set, sorted), release, layout
            (lvm or plain), initramfs (dracut or initramfs-tools) and, under initramfs-tools, initramfs_removes (the
            packages installing dracut would remove); from the preparation on also phase, progress and key_on_boot;
            with reason cleanup_pending also cleanup_error (why the last cleanup attempt did not finish); while a
            preparation waits for a package run, paused_reason packages_busy and paused_since; initrd_issue
            (boot_space_low with boot_space_needed and boot_space_free, no_bootable_kernel, kernel_not_buildable with
            initrd_issue_kernel, orphan_initrd_removed, key_material_hardlinked, or key_material_shared_bootable with initrd_issue_kernel) while the initrd work cannot go on;
            enrollment_deferred (closed set) with the header marked for the reencryption and no TPM keyslot:
            reencrypt while encrypting, reencrypt_after_completed once completed (plan M8e amendment 2026-10-22,
            item 22, stop condition S15). Since plan M13a: software reports the managed applications, see below.
          properties:
            components:
              type: object
              additionalProperties: { type: string }
            software:
              type: object
              required: [digest]
              description: |
                The state of the catalog entries the agent manages (plan M13a §3.4). digest is the hex SHA-256 of the
                canonical JSON of items; items is present when the digest changed or every 24 hours and replaces what
                the server holds for the device. A heartbeat with a digest only keeps the stored items. The server
                stores at most 200 items, skips an item whose id is not an entry of the organization, whose state is
                not one of the listed values or whose package is empty, and cuts version, reason and error. Agents
                before M13a leave the object out.
              properties:
                digest: { type: string }
                truncated:
                  type: boolean
                  description: The agent left items out to keep the check-in small (applied items first, never a failed one).
                items:
                  type: array
                  description: |
                    Absent or null means no software report (the stored items stay); an empty list means no items and
                    the stored items are removed.
                  items:
                    type: object
                    required: [id, package, intent, state]
                    properties:
                      id: { type: string, description: The catalog entry (a UUID). }
                      package: { type: string }
                      intent: { type: string, description: "required, uninstall, hold or forbid" }
                      state: { type: string, description: "installed, held, absent, pending or failed" }
                      version: { type: string }
                      reason: { type: string, description: "pending: dpkg_locked, deferred_offline or not_yet_applied; failed: the reason of software.apply_failed." }
                      error: { type: string, description: At most 200 characters. }
        event_seq_high: { type: integer, format: int64, minimum: 0 }
        arch: { type: string, enum: [amd64, arm64], description: "Agent architecture; selects the artifact of an agent_update." }
        os_release:
          type: object
          additionalProperties: { type: string }
          description: |
            The `id` and `version_id` of the device's os-release, as at enrollment. The server updates the device
            record when they differ from the stored values and recompiles the device; values that are not plain
            identifiers (letters, digits, `.`, `_`, `-`, at most 64 characters) are ignored without failing the check-in.
            Optional; agents of earlier releases leave it out and the enrollment value stays.
    BundleRef:
      type: object
      required: [version, sha256, url]
      properties:
        version: { type: integer, format: int64 }
        sha256: { type: string, description: Hex SHA-256 of the DSSE envelope object. }
        url: { type: string, description: "Presigned GET URL on bundles.<domain>, valid for 120 s." }
      description: >-
        The signed bundle the URL serves may carry mode: report_only (plan M11); absent means enforce and any other
        value is rejected by the agent as a schema error.
    CheckinResponse:
      type: object
      required: [seq, server_time, bundle, next_checkin_s]
      properties:
        seq: { type: integer, format: int64 }
        server_time: { type: string, format: date-time }
        bundle:
          allOf:
            - $ref: "#/components/schemas/BundleRef"
          nullable: true
        next_checkin_s: { type: integer, description: "300 × random(0.8, 1.2)" }
        agent_update:
          description: |
            Set only when an agent rollout is running, the device is eligible in its current wave and reports another
            agent_version (plan M2b decision 21).
          allOf:
            - $ref: "#/components/schemas/AgentUpdate"
          nullable: true
        commands:
          type: array
          maxItems: 20
          description: |
            Pending commands of the device, oldest first, each a DSSE envelope with payload type
            application/vnd.paddock.command.v1+json signed by a command-signing key from the device's bundle
            (pkg/command), or a revocation token (application/vnd.paddock.revocation.v1+json, pkg/revocation) signed by
            a revocation-signing key, which the agent hands to paddock-revoke uninterpreted (plan M4c decision 11).
            Agents that do not know commands ignore the field.
          items: { $ref: "#/components/schemas/CommandEnvelope" }
        time_ticket:
          description: |
            The organization's newest time ticket of the dead man's switch: a DSSE envelope with payload type
            application/vnd.paddock.time-ticket.v1+json over {organization_id, issued_at}, signed by a time-ticket key
            from the device's bundle (pkg/timeticket, plan M4c decision 14). Absent until the first ticket.
          allOf:
            - $ref: "#/components/schemas/CommandEnvelope"
    CommandEnvelope:
      type: object
      required: [payloadType, payload, signatures]
      properties:
        payloadType:
          type: string
          enum: [application/vnd.paddock.command.v1+json, application/vnd.paddock.revocation.v1+json,
                 application/vnd.paddock.time-ticket.v1+json]
        payload:
          type: string
          description: |
            Standard base64 of the canonical JSON (RFC 8785): a command {command_id, device_id, organization_id, type,
            params, issued_at, expires_at}, a revocation token {command_id, device_id, organization_id, action,
            issued_at, expires_at, request_id, period_days} or a time ticket {organization_id, issued_at}.
        signatures:
          type: array
          minItems: 1
          items:
            type: object
            required: [keyid, sig]
            properties:
              keyid: { type: string, description: 'e.g. "command-signing:v1", "revocation-signing:v1", "time-ticket:v1"' }
              sig: { type: string, description: Standard base64 Ed25519 signature over the DSSE PAE. }
    EscrowRequest:
      type: object
      required: [escrow_id, kind, generation, key_version]
      properties:
        escrow_id: { type: string, format: uuid, description: Chosen by the device; idempotency key. }
        kind: { type: string, enum: [admin_password, luks_recovery_key, luks_header] }
        generation: { type: integer, minimum: 1 }
        key_version: { type: integer, minimum: 1, description: Version of escrow-wrap the secret or the header key is encrypted to. }
        ciphertext: { type: string, description: "Secrets only (required): standard base64 RSA-OAEP-SHA256 ciphertext, at most 4096 bytes." }
        wrapped_dek: { type: string, description: "luks_header only (required): standard base64 RSA-OAEP-SHA256 ciphertext of the 32-byte header key." }
        nonce: { type: string, description: "luks_header only (required): standard base64 of the 12-byte AES-GCM nonce." }
        sha256: { type: string, description: "luks_header only (required): hex SHA-256 of the sealed object." }
        size: { type: integer, format: int64, description: "luks_header only (required): bytes of the sealed object, at most 32 MiB." }
        volume: { type: string, format: uuid, description: "luks_header only (optional): lowercase LUKS UUID of the volume (PDK-009); without it the header is the root volume's." }
    DiagnosticsRequest:
      type: object
      required: [command_id, sha256, size, nonce, wrapped_dek]
      properties:
        command_id: { type: string, format: uuid, description: "The delivered collect_status command; the bundle's ID." }
        sha256: { type: string, description: "Hex SHA-256 (64 lowercase digits) of the sealed object." }
        size: { type: integer, format: int64, minimum: 1, maximum: 33554432, description: "Bytes of the sealed object, at most 32 MiB (413 beyond)." }
        nonce: { type: string, description: "Standard base64 of the 12-byte AES-GCM nonce." }
        wrapped_dek: { type: string, description: "Standard base64 RSA-OAEP-SHA256 ciphertext of the 32-byte data key, at most 4096 bytes." }
    DiagnosticsResponse:
      type: object
      required: [diagnostics_id, upload_url]
      properties:
        diagnostics_id: { type: string, format: uuid, description: "Equals command_id." }
        upload_url: { type: string, description: "Presigned PUT URL of the sealed bundle, valid 10 minutes, bound to the announced size." }
    CommandResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [succeeded, failed] }
        result:
          type: object
          additionalProperties: true
          description: Outcome details, at most 4 KiB; never secrets.
    AgentUpdate:
      type: object
      required: [version, url, sha256, size, minisig]
      properties:
        version: { type: string, description: Semantic version of the release. }
        url: { type: string, description: "Presigned GET URL of the paddockd binary on bundles.<domain>." }
        sha256: { type: string, description: Hex SHA-256 of the binary. }
        size: { type: integer, format: int64, description: Size of the binary in bytes. }
        minisig: { type: string, description: Standard base64 of the minisign signature file. }
        requested:
          type: boolean
          description: >-
            An administrator asked this device to install the release now (plan M8d decision 27): the offer ignores the
            rollout wave and the agent its update policy. Absent otherwise; older agents ignore it. A device that
            already runs the release gets its own version marked requested while the request is open: it never stages
            it, but may upgrade paddock-supervisor and fleetd under the manual policy.
        requested_at: { type: string, format: date-time, description: When the request was made; each request is handled once. }
    Event:
      type: object
      required: [event_seq, type, occurred_at]
      properties:
        event_seq: { type: integer, format: int64, minimum: 0 }
        type:
          type: string
          enum: [bundle.applied, bundle.rejected, config.drift_corrected, agent.updated, agent.update_failed,
                 agent.rolled_back, agent.events_dropped, session.login, login.applied, login.apply_failed,
                 user.lock_applied, logins.suspension_applied, sudo.apply_failed, sudo.user_unresolved,
                 tamper.sudo_group_member, tamper.sudoers_d_file, tamper.sudoers_changed,
                 tamper.protected_file_changed, local_admin.rotated, local_admin.rotation_failed, local_admin.login,
                 tamper.local_admin_changed, tamper.keyslot_changed, revocation.trust_pinned_tofu,
                 revocation.refused, tamper.service_stopped, updates.run, agent.supervisor_updated,
                 agent.uninstalled, disk.conversion_prepared, disk.conversion_started, disk.conversion_completed,
                 disk.conversion_failed, disk.conversion_aborted, disk.conversion_neutralize_failed,
                 disk.conversion_unlock_restore_failed, software.installed, software.reinstalled,
                 software.removed, software.apply_failed]
          description: |
            Since plan M13a the software reconciler: software.installed and software.reinstalled {package, version,
            intent, catalog_entry_id, reason (first_install or locally_removed)}, software.removed {package, version,
            intent, catalog_entry_id}, software.apply_failed {package or source, stage (source_update, keyring,
            simulate, install or remove), reason (fingerprint_mismatch, would_remove_dependents,
            protected_package_affected, no_candidate, source_unreachable, conflicting_source or apt_failed), error (at
            most 200 characters)}.
            Since plan M8e the phases of an in-place encryption, each with data.conversion_id:
            disk.conversion_prepared {layout (lvm|plain), volume (the LUKS UUID of the header to come), data_bytes},
            disk.conversion_started {volume, init_s, init_result (ok, <stage>:<reason> or unknown), after_cancel
            (true when the device adopts a conversion it had cancelled; absent otherwise)},
            disk.conversion_completed {volume, data_bytes, duration_s}, disk.conversion_failed {stage (preflight,
            prepare, init or resume), reason, volume}, disk.conversion_aborted {by (admin or operator)},
            disk.conversion_neutralize_failed {reason}: the abort could not make the prepared initrds boot unencrypted
            (plan M8e amendment 2026-10-30).
            disk.conversion_unlock_restore_failed {reason (kernel_not_buildable, no_bootable_kernel, boot_space_low or the
            error)}: the unlock path of a converted disk could not be reinstalled into its initrds; once per reason and
            agent start (plan M8e amendment 2026-10-30).
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          description: |
            bundle.applied data: version, changed, errors [{id, message}] and, since plan M11, the optional mode
            (enforce or report_only; absent from older agents) and resources [BundleAppliedResource], one entry per
            resource in apply order. A new agent against an older server stays valid: the server ignores the fields it
            does not know.
    BundleAppliedResource:
      type: object
      required: [id, status]
      properties:
        id: { type: string, description: "Resource ID, e.g. file:/etc/motd." }
        status: { type: string, enum: [applied, failed], description: "Outcome of the apply of this resource; pending follows with the report-only apply (PDK-161)." }
        message: { type: string, description: "Error message of a failed resource; for an applied resource an optional note, e.g. the package holds a software forbid or uninstall superseded." }
        changes: { type: array, items: { type: string }, description: What a report-only apply would change. }
    EventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Event" }
