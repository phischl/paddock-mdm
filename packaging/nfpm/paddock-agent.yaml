# nfpm configuration of the paddock-agent package (plan M2b decision 25); built by `make deb`. The package carries
# paddockd in /usr/lib/paddock; its postinst installs it into slot A only on a device without an agent. Later
# versions arrive as signed releases through paddock-supervisor, so a package upgrade never touches a slot.
# The pam-auth-update profile paddock-deny puts the deny list of locked users (pam_listfile) before every other
# primary auth and account module (plan M3b decisions 9 and 16). paddock-disk-setup.service asks for the boot PIN
# at the first boot of a device installed with the Paddock autoinstall (plan M4b decision 5).
name: paddock-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Paddock <paddock@paddock-mdm.invalid>
description: |-
  Paddock device agent
  Enrolls the device with the Paddock control plane, checks in, applies the
  signed device configuration and corrects drift. Run
  `paddockd enroll --config <file>` once after installation.
vendor: Paddock
homepage: https://github.com/phischl/paddock-mdm
license: MIT
depends:
  - paddock-supervisor
  - libpam-modules
  - sudo
  - cryptsetup
  - tpm2-tools
contents:
  - src: bin/deb/stage/paddockd
    dst: /usr/lib/paddock/paddockd
    file_info: { mode: 0755 }
  - src: /opt/paddock/agent/current/paddockd
    dst: /usr/bin/paddockd
    type: symlink
  - src: packaging/systemd/paddock-disk-setup.service
    dst: /usr/lib/systemd/system/paddock-disk-setup.service
    file_info: { mode: 0644 }
  - src: packaging/pam-configs/paddock-deny
    dst: /usr/share/pam-configs/paddock-deny
    file_info: { mode: 0644 }
  - src: packaging/debian/copyright
    dst: /usr/share/doc/paddock-agent/copyright
    file_info: { mode: 0644 }
  - src: bin/deb/stage/paddock-agent.changelog.gz
    dst: /usr/share/doc/paddock-agent/changelog.gz
    file_info: { mode: 0644 }
  - src: packaging/debian/paddock-agent.lintian-overrides
    dst: /usr/share/lintian/overrides/paddock-agent
    file_info: { mode: 0644 }
scripts:
  postinstall: packaging/scripts/agent-postinst.sh
  preremove: packaging/scripts/agent-prerm.sh
