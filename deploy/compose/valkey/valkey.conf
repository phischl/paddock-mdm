# Valkey configuration of the control plane (plan M2a decision 2). Core commands only, no modules.
# One ACL user per role (plan M12h §14, ADR 0051): the entrypoint renders /run/valkey/users.acl from users.acl.tmpl
# with the SHA-256 of each role's secret; the default user is off.
appendonly yes
appendfsync everysec
dir /data
aclfile /run/valkey/users.acl
