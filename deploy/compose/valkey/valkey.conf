# Valkey configuration of the control plane (plan M2a decision 2). Core commands only, no modules.
# One ACL user per role (plan M12h §14, ADR 0051): the entrypoint renders /run/valkey/users.acl from users.acl.tmpl
# with the SHA-256 of each role's secret; the default user is off.
appendonly yes
appendfsync everysec
dir /data
aclfile /run/valkey/users.acl
# A full Valkey refuses writes instead of evicting (plan M17 amendment s point 4.4, ADR 0051 amendment 2026-11-16): an
# evicted seq: or nonce: weakens replay protection, an evicted dk: or cmd: turns into 503s. The entrypoint sets
# maxmemory to 60 % of the container's memory limit.
maxmemory-policy noeviction
