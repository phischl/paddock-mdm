# Development overrides (plan M0 §6.8, decision 20). Never use this file in production.

# The production files carry no build sections, so that the operator bundle is a plain copy of them (plan M7b
# decision 10); the development stack builds the Paddock images from source here.
x-paddock-build: &paddock-build
  context: ../..
  dockerfile: deploy/compose/Dockerfile
  args:
    GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
    NODE_IMAGE: ${NODE_IMAGE}
    RUNTIME_IMAGE: ${RUNTIME_IMAGE}
    COMPILER_RUNTIME_IMAGE: ${COMPILER_RUNTIME_IMAGE}

services:
  openbao:
    command: ["bao", "server", "-config=/openbao/config/config.hcl", "-config=/openbao/config/dev.hcl"]
    volumes:
      - ./openbao/dev.hcl:/openbao/config/dev.hcl:ro
    ports:
      - "127.0.0.1:8200:8200"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  audit-postgres:
    ports:
      - "127.0.0.1:5433:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  valkey:
    ports:
      - "127.0.0.1:6379:6379"

  audit-rustfs:
    ports:
      - "127.0.0.1:9001:9000"

  authentik-server: &authentik-dev
    environment:
      PADDOCK_ENV: development
      DEV_PLATFORM_ADMIN_PASSWORD_FROMFILE: /run/secrets/dev_platform_admin_password
      DEV_ALICE_PASSWORD_FROMFILE: /run/secrets/dev_alice_password
      DEV_BOB_PASSWORD_FROMFILE: /run/secrets/dev_bob_password
      DEV_CAROL_PASSWORD_FROMFILE: /run/secrets/dev_carol_password
      DEV_DAVE_PASSWORD_FROMFILE: /run/secrets/dev_dave_password
      # In the development stack every test VM and every acceptance gate reaches Authentik from the same Docker gateway
      # address (plan M3b system gates).
      AUTHENTIK_THROTTLE__PROVIDERS__OAUTH2__DEVICE: ${PADDOCK_DEVICE_LOGIN_THROTTLE:-1000/hour}
    secrets:
      - dev_platform_admin_password
      - dev_alice_password
      - dev_bob_password
      - dev_carol_password
      - dev_dave_password
    volumes:
      - ./authentik/dev:/blueprints/paddock-dev:ro

  authentik-worker: *authentik-dev

  # Faster Fleet rounds so that the inventory gates (plan M5a F1–F4) do not wait an hour.
  fleet:
    environment:
      FLEET_OSQUERY_POLICY_UPDATE_INTERVAL: ${FLEET_OSQUERY_POLICY_UPDATE_INTERVAL:-30s}
      FLEET_OSQUERY_DETAIL_UPDATE_INTERVAL: ${FLEET_OSQUERY_DETAIL_UPDATE_INTERVAL:-2m}
      # Not shorter than 1h: with a CPE database URL set, every run downloads the 146 MB CPE database again; the gates
      # trigger the runs they need (ADR 0009 amendment 2026-10-12 (b)).
      FLEET_VULNERABILITIES_PERIODICITY: ${FLEET_VULNERABILITIES_PERIODICITY:-1h}
      # Direct URLs instead of Fleet's anonymous GitHub API lookup, whose hourly limit shared CI runners exhaust
      # (ADR 0009 amendment 2026-10-12); the pinned release is in the development section of versions.env.
      # Production keeps Fleet's lookup.
      FLEET_VULNERABILITIES_CPE_DATABASE_URL: ${FLEET_CPE_DATABASE_URL:?versions.env}
      FLEET_VULNERABILITIES_CPE_TRANSLATIONS_URL: ${FLEET_CPE_TRANSLATIONS_URL:?versions.env}
      FLEET_VULNERABILITIES_CVE_FEED_PREFIX_URL: https://github.com/fleetdm/vulnerabilities/releases/latest/download/
    ports:
      # Fleet's UI for platform operators on the development host only (docs/operations/fleet.md).
      - "127.0.0.1:8412:8080"

  # One Prometheus scrapes both domains of the single development host; the API is published for gate P-4 (plan M6a).
  prometheus:
    volumes:
      - ./prometheus/scrape/audit.yml:/etc/prometheus/scrape/audit.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  paddock-migrate:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development

  paddock-api:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development
      # Test hooks of the acceptance gate A3 (honoured only with PADDOCK_ENV=development); empty = off.
      PADDOCK_TEST_EXTERNAL_DELAY: ${PADDOCK_TEST_EXTERNAL_DELAY:-}
      # Shorter step-up timing so that the step-up gate does not wait 6 minutes (development only; refused in
      # production).
      PADDOCK_STEPUP_WINDOW: ${PADDOCK_STEPUP_WINDOW:-30s}
      PADDOCK_STEPUP_MAX_AUTH_AGE: ${PADDOCK_STEPUP_MAX_AUTH_AGE:-15s}
      # The development users step up with TOTP (the dev blueprint's stage at order 31); production requires WebAuthn
      # (development only; refused in production).
      PADDOCK_STEPUP_MFA_CLASS: ${PADDOCK_STEPUP_MFA_CLASS:-authentik_stages_authenticator_totp.totpdevice}
      # The development users sign in without an authenticator (the dev blueprint skips the MFA stages); production
      # refuses a portal sign-in without a second factor (development only; refused in production).
      PADDOCK_LOGIN_MFA_OPTIONAL: "true"
      PADDOCK_REVOCATION_ENABLED: ${PADDOCK_REVOCATION_ENABLED:-true}
      # Shorter denial window of the IP allow list so that gate A1 sees the summary event (plan M7a decision 20;
      # development only, refused in production).
      PADDOCK_TEST_IP_ALLOWLIST_WINDOW: ${PADDOCK_TEST_IP_ALLOWLIST_WINDOW:-20s}
      # Agent releases are imported from the GitHub fixture that gate TestAgentReleaseImport starts on the network cp,
      # never from GitHub (ADR 0043 decision 9); without the gate running, the check fails with
      # release_source_unavailable.
      PADDOCK_AGENT_RELEASE_SOURCE_URL: ${PADDOCK_AGENT_RELEASE_SOURCE_URL:-http://github-fixture:8080}

  # The revocation path is enabled in development and test stacks only (plan M4c decision 1); gate R5 runs with
  # PADDOCK_REVOCATION_ENABLED=false.
  paddock-revocation-issuer:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development
      PADDOCK_REVOCATION_ENABLED: ${PADDOCK_REVOCATION_ENABLED:-true}
      # The api's step-up window; the issuer applies it to auth_time before the approval.
      PADDOCK_STEPUP_WINDOW: ${PADDOCK_STEPUP_WINDOW:-30s}

  paddock-escrow-reader:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development
      # The api's step-up window (above); the escrow-reader applies it to auth_time.
      PADDOCK_STEPUP_WINDOW: ${PADDOCK_STEPUP_WINDOW:-30s}

  paddock-outbox-relay:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development
      PADDOCK_REAPER_THRESHOLD: ${PADDOCK_REAPER_THRESHOLD:-}

  paddock-worker:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development
      # Shorter identity rounds so that the acceptance gates do not wait 5 minutes for a sync round.
      PADDOCK_IDENTITY_SYNC_INTERVAL: ${PADDOCK_IDENTITY_SYNC_INTERVAL:-60s}
      # Inventory rounds of the gates F1–F4 (plan M5a).
      PADDOCK_INVENTORY_SYNC_INTERVAL: ${PADDOCK_INVENTORY_SYNC_INTERVAL:-60s}
      # Staleness thresholds count minutes, for gate U4 (plan M5b decision 9).
      PADDOCK_STALENESS_UNIT: ${PADDOCK_STALENESS_UNIT:-minute}
      # Retention periods count seconds, for the login history purge gate (plan M8d decision 19, M10 decision 14).
      PADDOCK_RETENTION_UNIT: ${PADDOCK_RETENTION_UNIT:-seconds}
      # Ubuntu's vulnerability data from the fixture server that gate O1 starts on the network cp, every 30 s, instead
      # of the real bulk file once a day (plan M5c); without the gate running, the downloads fail and the data stays.
      PADDOCK_OSV_UBUNTU_URL: ${PADDOCK_OSV_UBUNTU_URL:-http://osv-fixture:8080/Ubuntu/all.zip}
      PADDOCK_OSV_SYNC_INTERVAL: ${PADDOCK_OSV_SYNC_INTERVAL:-30s}

  paddock-gateway:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development

  paddock-compiler:
    build:
      <<: *paddock-build
      target: compiler
    environment:
      PADDOCK_ENV: development
      PADDOCK_REVOCATION_ENABLED: ${PADDOCK_REVOCATION_ENABLED:-true}

  paddock-audit-migrate:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development

  paddock-audit-writer:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development

  # The development unsealer (plan M8u decision 14) talks plain HTTP to the development OpenBao, which has no internal
  # CA; its shares are the first three of .secrets/openbao/init.txt (openbao-bootstrap.sh).
  paddock-unsealer:
    build: *paddock-build
    environment:
      PADDOCK_ENV: development
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      BAO_CACERT: !reset null
    secrets: !override [db_paddock_unsealer_url, openbao_auto_unseal_shares]

secrets:
  dev_platform_admin_password: { file: ./.secrets/dev_platform_admin_password }
  dev_alice_password: { file: ./.secrets/dev_alice_password }
  dev_bob_password: { file: ./.secrets/dev_bob_password }
  dev_carol_password: { file: ./.secrets/dev_carol_password }
  dev_dave_password: { file: ./.secrets/dev_dave_password }
