# Development overrides (plan M0 §6.8, decision 20). Never use this file in production.
services:
  openbao:
    command: ["bao", "server", "-config=/openbao/config/config.hcl", "-config=/openbao/config/dev.hcl"]
    volumes:
      - ./openbao/dev.hcl:/openbao/config/dev.hcl:ro
    ports:
      - "127.0.0.1:8200:8200"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  audit-postgres:
    ports:
      - "127.0.0.1:5433:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  valkey:
    ports:
      - "127.0.0.1:6379:6379"

  audit-rustfs:
    ports:
      - "127.0.0.1:9001:9000"

  authentik-server: &authentik-dev
    environment:
      PADDOCK_ENV: development
      DEV_PLATFORM_ADMIN_PASSWORD_FROMFILE: /run/secrets/dev_platform_admin_password
      DEV_ALICE_PASSWORD_FROMFILE: /run/secrets/dev_alice_password
      DEV_BOB_PASSWORD_FROMFILE: /run/secrets/dev_bob_password
      DEV_CAROL_PASSWORD_FROMFILE: /run/secrets/dev_carol_password
      # In the development stack every test VM and every acceptance gate reaches Authentik from the same Docker gateway
      # address (plan M3b system gates).
      AUTHENTIK_THROTTLE__PROVIDERS__OAUTH2__DEVICE: ${PADDOCK_DEVICE_LOGIN_THROTTLE:-1000/hour}
    secrets:
      - dev_platform_admin_password
      - dev_alice_password
      - dev_bob_password
      - dev_carol_password
    volumes:
      - ./authentik/dev:/blueprints/paddock-dev:ro

  authentik-worker: *authentik-dev

  paddock-migrate:
    environment:
      PADDOCK_ENV: development

  paddock-api:
    environment:
      PADDOCK_ENV: development
      # Test hooks of the acceptance gate A3 (honoured only with PADDOCK_ENV=development); empty = off.
      PADDOCK_TEST_EXTERNAL_DELAY: ${PADDOCK_TEST_EXTERNAL_DELAY:-}
      # Shorter step-up timing so that the step-up gate does not wait 6 minutes (development only; refused in
      # production).
      PADDOCK_STEPUP_WINDOW: ${PADDOCK_STEPUP_WINDOW:-30s}
      PADDOCK_STEPUP_MAX_AUTH_AGE: ${PADDOCK_STEPUP_MAX_AUTH_AGE:-15s}

  paddock-escrow-reader:
    environment:
      PADDOCK_ENV: development
      # The api's step-up window (above); the escrow-reader applies it to auth_time.
      PADDOCK_STEPUP_WINDOW: ${PADDOCK_STEPUP_WINDOW:-30s}

  paddock-outbox-relay:
    environment:
      PADDOCK_ENV: development
      PADDOCK_REAPER_THRESHOLD: ${PADDOCK_REAPER_THRESHOLD:-}

  paddock-worker:
    environment:
      PADDOCK_ENV: development
      # Shorter identity rounds so that the acceptance gates do not wait 5 minutes for a sync round.
      PADDOCK_IDENTITY_SYNC_INTERVAL: ${PADDOCK_IDENTITY_SYNC_INTERVAL:-60s}

  paddock-gateway:
    environment:
      PADDOCK_ENV: development

  paddock-compiler:
    environment:
      PADDOCK_ENV: development

  paddock-audit-migrate:
    environment:
      PADDOCK_ENV: development

  paddock-audit-writer:
    environment:
      PADDOCK_ENV: development

secrets:
  dev_platform_admin_password: { file: ./.secrets/dev_platform_admin_password }
  dev_alice_password: { file: ./.secrets/dev_alice_password }
  dev_bob_password: { file: ./.secrets/dev_bob_password }
  dev_carol_password: { file: ./.secrets/dev_carol_password }
