# Alert rules of the Compose profile observability (plan M6a decision 8, architecture §19, docs/operations/monitoring.md).
# Each host's Prometheus loads all rules; a rule whose series a host does not scrape stays silent there. Thresholds are
# the plan's; tests: prometheus/alerts_test.yml (`make lint-prometheus`).
groups:
  - name: paddock-roles
    rules:
      - alert: PaddockRoleDown
        expr: up{role!=""} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.role }} is down"
          description: "Prometheus cannot scrape {{ $labels.role }} ({{ $labels.instance }}) for 2 minutes."

  - name: paddock-rabbitmq
    rules:
      - alert: PaddockAuditDLQ
        expr: max by (queue) (rabbitmq_detailed_queue_messages{queue="dlq.audit.writer"}) > 0
        labels:
          severity: critical
        annotations:
          summary: "Audit events in the dead-letter queue"
          description: "{{ $value }} audit events were dead-lettered; they are not in the audit log until replayed."
      - alert: PaddockDLQ
        expr: max by (queue) (rabbitmq_detailed_queue_messages{queue=~"dlq\\..+", queue!="dlq.audit.writer"}) > 0
        labels:
          severity: warning
        annotations:
          summary: "Messages in {{ $labels.queue }}"
          description: "{{ $value }} messages were dead-lettered to {{ $labels.queue }}."
      # The writer drains audit.writer within seconds; a backlog that never emptied for 10 minutes is a lag of more than
      # 10 minutes. Observed on the control plane, so it also covers a writer on the audit host.
      - alert: PaddockAuditWriterLag
        expr: min_over_time(rabbitmq_detailed_queue_messages_ready{queue="audit.writer"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The audit writer lags more than 10 minutes"
          description: "audit.writer has held at least {{ $value }} ready messages for 10 minutes."
      - alert: PaddockAuditWriterNotConsuming
        expr: max(rabbitmq_detailed_queue_consumers{queue="audit.writer"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No audit writer consumes audit.writer"
          description: "audit.writer has had no consumer for 5 minutes; audit events wait in RabbitMQ."

  - name: paddock-audit
    rules:
      # A healthy writer transaction takes milliseconds; the stalls of PDK-028 took 5-20 s while messages sat unacked.
      # paddock_audit_worm_put_seconds attributes a slow transaction to the WORM store or the database.
      - alert: PaddockAuditWriterTransactionSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(paddock_audit_writer_transaction_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit writer transaction p95 above 5 s"
          description: "The 95th percentile of the audit writer's transactions is {{ $value | humanizeDuration }}; compare paddock_audit_worm_put_seconds to tell the WORM store from the database."
      # The nightly verification at 00:45 UTC (plan M8b decision 27) sets the gauge after every cycle; a missing
      # seal shows up as "no manifest" and fires this until the day is sealed and verified again.
      - alert: PaddockAuditChainBroken
        expr: paddock_audit_verify_failed_organizations > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The audit hash chain failed its nightly verification"
          description: "{{ $value }} organization(s) have a broken or unreadable audit chain; see the evidence integrity page and paddock-server audit verify."
      # 36 h leave one missed night of slack; the writer seeds the gauge at start, so a fresh writer does not fire,
      # but leaves it unset (0, fires) while the audit index is unreadable (plan M8b amendment 2026-10-25). A replica
      # that loses the audit-verify lock takes the gauge from the recorded run, so the rule stays per instance
      # (amendment 2026-10-29, PDK-421).
      - alert: PaddockAuditVerifyStale
        expr: time() - paddock_audit_verify_last_run_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The audit chain was not verified for 36 hours"
          description: "The audit writer's last nightly chain verification finished {{ $value | humanizeDuration }} ago; check the audit writer's log for the 00:45 UTC cycle."

  - name: paddock-control-plane
    rules:
      - alert: PaddockCompileLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(paddock_compiler_latency_seconds_bucket[10m]))) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Bundle compilation p95 above 30 s"
          description: "The 95th percentile from state change to published bundle is {{ $value | humanizeDuration }}."
      - alert: PaddockGateway5xx
        expr: |
          sum(rate(paddock_gateway_requests_total{code=~"5.."}[5m]))
            / sum(rate(paddock_gateway_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Device API answers more than 5 % with 5xx"
          description: "{{ $value | humanizePercentage }} of the device API's responses are server errors."
      - alert: PaddockOpenBaoSealed
        expr: max(paddock_openbao_sealed) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao is sealed"
          description: "Bundles, commands and the audit seal stop until three custodians unseal OpenBao (docs/operations/openbao.md)."
      # Automatic unseal (ADR 0035, plan M8u decision 25), from the worker's observation of the unsealer's report.
      - alert: PaddockAutoUnsealWithdrawn
        expr: max(paddock_auto_unseal_enabled) == 0 and max(paddock_auto_unseal_shares_present) == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Automatic unseal was disabled in the portal, but the shares are still on the host"
          description: "Run ./paddock auto-unseal disable on the control-plane host (docs/operations/openbao.md section 6)."
      - alert: PaddockAutoUnsealerDown
        expr: max(paddock_auto_unseal_enabled) == 1 and max(paddock_auto_unseal_unsealer_up) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Automatic unseal is enabled, but the unsealer does not report"
          description: "OpenBao will stay sealed after the next restart until the unsealer runs or three custodians unseal it."
      - alert: PaddockOpenBaoUnreachable
        expr: min(paddock_openbao_reachable) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao is unreachable"
          description: "The worker cannot reach OpenBao's health endpoint."
      - alert: PaddockOSVStale
        expr: max(paddock_osv_stale) == 1
        labels:
          severity: warning
        annotations:
          summary: "Ubuntu's vulnerability data is stale"
          description: "The OSV data has not been updated for 3 days (docs/operations/vulnerability-data.md)."
      # ADR 0032: deletion that stops running keeps personal data beyond its retention period (GDPR Art. 5(1)(e)).
      - alert: PaddockRetentionPurgeStale
        expr: time() - max by (store) (paddock_retention_last_success_timestamp_seconds) > 48 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "The retention purge of {{ $labels.store }} has not succeeded for 48 hours"
          description: "The worker's retention round has not purged {{ $labels.store }} in every organization for 48 hours; check its log for the failing organization (docs/operations/monitoring.md)."
      - alert: PaddockIPAllowlistBypassed
        expr: max(paddock_ip_allowlist_bypass) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "IP allow list bypassed on the api"
          description: "paddock-api runs with PADDOCK_IP_ALLOWLIST_BYPASS=true (break-glass): the application IP allow list is not enforced. Remove the variable once access is restored (docs/operations/ip-allowlist.md)."
      # The admin-accounts round runs every 5 minutes; the 6-minute window sees each refused round with a minute of
      # slack, so the expression stays true only while every round is refused. A refusal in every round for 15 minutes
      # fires it; two refusals five minutes apart keep it true for about 10 minutes and do not (PDK-424). The counter
      # has no organization label: the worker log names the organizations.
      - alert: PaddockRoleDirectoryRefused
        expr: sum(increase(paddock_identity_directory_refusals_total[6m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Role changes of one or more organizations are not recorded"
          description: "The admin-accounts round has refused one or more organizations in every round for 15 minutes: every role group listing is empty and the directory probe does not show that the Authentik service token sees the directory. Role changes are not recorded and administrator accounts are not followed until the paddock-service role can read users and groups again; the worker log names the organizations (docs/operations/monitoring.md)."
      - alert: PaddockBackupStale
        expr: time() - max by (kind) (paddock_backup_last_success_timestamp_seconds) > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "No {{ $labels.kind }} backup for more than 26 hours"
          description: "The newest {{ $labels.kind }} backup in the backup bucket is older than 26 hours (docs/operations/restore.md)."
      # The RPO of the continuous WAL archive is minutes (archive_timeout 60 s, pushed every 2 s); the daily backup
      # alert above would notice a stalled archive only after a day.
      - alert: PaddockWALArchiveLag
        expr: time() - max by (stanza) (paddock_backup_wal_last_archived_timestamp_seconds) > 15 * 60
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The WAL archive of {{ $labels.stanza }} lags by more than 15 minutes"
          description: "No WAL segment of the {{ $labels.stanza }} database has reached the backup bucket for 15 minutes; check the pgbackrest container and its spool volume (docs/operations/restore.md)."
      - alert: PaddockCertificateExpiry
        expr: min by (host) (paddock_tls_certificate_expiry_timestamp_seconds) - time() < 14 * 86400
        labels:
          severity: warning
        annotations:
          summary: "The certificate of {{ $labels.host }} expires within 14 days"
          description: "Caddy has not renewed it; check its ACME logs and that port 80 is reachable."
      # "Never set" companions: a series that never appears (listing the bucket, the health request or the probe fails
      # from the start) would keep the alerts above silent.
      - alert: PaddockBackupAgeMissing
        expr: max(paddock_backup_kinds) > (count(paddock_backup_last_success_timestamp_seconds) or vector(0))
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "The age of some backups is unknown"
          description: "The worker exports the age of fewer backup kinds than configured; check its log and its backup bucket credential."
      - alert: PaddockRetentionPurgeMissing
        expr: max(paddock_retention_stores) > (count(paddock_retention_last_success_timestamp_seconds) or vector(0))
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The retention purge of some stores never succeeded"
          description: "The worker exports the last retention success of fewer stores than it purges; check its log."
      - alert: PaddockWALArchiveLagMissing
        expr: max(paddock_backup_wal_stanzas) > (count(paddock_backup_wal_last_archived_timestamp_seconds) or vector(0))
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The WAL archive lag of some databases is unknown"
          description: "The worker exports the WAL archive age of fewer stanzas than configured; check its log and its backup bucket credential."
      - alert: PaddockOpenBaoHealthMissing
        expr: absent(paddock_openbao_reachable) and on() max(up{role="paddock-worker"}) == 1
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "OpenBao's seal status is unknown"
          description: "The worker runs but exports no OpenBao health."
      - alert: PaddockCertificateExpiryMissing
        expr: max(paddock_tls_probe_hosts) > (count(paddock_tls_certificate_expiry_timestamp_seconds) or vector(0))
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The expiry of some public certificates is unknown"
          description: "The worker probes more hostnames than it exports a certificate expiry for."
      - alert: PaddockCertificateProbeFailing
        expr: max by (host) (paddock_tls_probe_success) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The certificate of {{ $labels.host }} cannot be read or does not verify"
          description: "The worker's TLS handshake with Caddy for {{ $labels.host }} fails, or the certificate is expired, untrusted or issued for another name."
