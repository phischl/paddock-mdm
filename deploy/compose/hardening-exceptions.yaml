      reason: pending PDK-910
  paddock-escrow-reader:
    mem_limit:
      reason: pending PDK-910
  paddock-revocation-issuer:
    mem_limit:
      reason: pending PDK-910
  paddock-outbox-relay:
    mem_limit:
      reason: pending PDK-910
  paddock-notifier:
    mem_limit:
      reason: pending PDK-910
  paddock-unsealer:
    mem_limit:
      reason: pending PDK-910
  paddock-migrate:
    mem_limit:
      reason: pending PDK-910
  paddock-audit-migrate:
    mem_limit:
