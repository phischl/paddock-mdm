# Production overrides of the control-plane host (plan M6a decision 1): `docker compose -f compose.yaml -f
# compose.prod.yaml`. The audit domain runs on its own host with compose.audit.yaml and compose.audit.prod.yaml.
# Never combine this file with compose.dev.yaml; `make prod-check` refuses that. Install: docs/operations/install.md.
#
# Public TLS from an ACME CA, nothing published except 80/443 and, on the private interconnect address only, the two
# TLS endpoints the audit host needs: amqps (5671) and OpenBao (8200). Every link between the hosts uses TLS with the
# internal CAs generated by `make prod-secrets` (plan M6a amendment 2026-10-08).

# Values of .env that `make prod-check` needs; Compose keeps x- extensions in `docker compose config`.
x-paddock-prod:
  interconnect_addr: ${PADDOCK_INTERCONNECT_ADDR:?set PADDOCK_INTERCONNECT_ADDR in .env}
  revocation_accepted: ${PADDOCK_REVOCATION_ACCEPTED:-no}

services:
  caddy:
    ports: !override
      # 80 serves the ACME HTTP-01 challenge and redirects to HTTPS.
      - "80:80"
      - "443:443"
    environment:
      PADDOCK_ACME_EMAIL: ${PADDOCK_ACME_EMAIL:?set PADDOCK_ACME_EMAIL in .env}
      PADDOCK_ADMIN_ALLOWED_CIDRS: ${PADDOCK_ADMIN_ALLOWED_CIDRS:-0.0.0.0/0 ::/0}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]

  # Caddy's internal CA does not exist in production; the roles trust the public CAs of the image instead.
  caddy-ca-export:
    command: ["true"]
    volumes: !reset []

  openbao:
    command: ["bao", "server", "-config=/openbao/config/prod.hcl"]
    volumes:
      - ./openbao/prod.hcl:/openbao/config/prod.hcl:ro
    secrets: [openbao_tls_crt, openbao_tls_key, internal_ca_bundle]
    ports:
      # The audit writer signs the daily manifests (audit-chain) from the audit host.
      - "${PADDOCK_INTERCONNECT_ADDR}:8200:8200"
    healthcheck:
      # bao status: exit 0 unsealed, 2 sealed; both mean the server answers (sealed is handled by the unseal runbook).
      test: ["CMD-SHELL", "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/run/secrets/internal_ca_bundle bao status >/dev/null; test $$? -ne 1"]

  rabbitmq:
    volumes:
      - ./rabbitmq/tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
    secrets: [rabbitmq_tls_crt, rabbitmq_tls_key, internal_ca_bundle]
    ports:
      # amqps for the audit writer on the audit host; plaintext 5672 stays on the internal network.
      - "${PADDOCK_INTERCONNECT_ADDR}:5671:5671"

  authentik-server: &authentik-prod
    environment:
      PADDOCK_ENV: production
      PADDOCK_PUBLIC_ADMIN_URL: https://admin.${PADDOCK_DOMAIN}

  authentik-worker: *authentik-prod

  paddock-migrate:
    environment:
      PADDOCK_ENV: production

  paddock-api:
    environment:
      PADDOCK_ENV: production
      PADDOCK_PUBLIC_ADMIN_URL: https://admin.${PADDOCK_DOMAIN}
      PADDOCK_PUBLIC_DEVICE_URL: https://device.${PADDOCK_DOMAIN}
      PADDOCK_BUNDLES_PUBLIC_URL: https://bundles.${PADDOCK_DOMAIN}
      PADDOCK_OIDC_ISSUER: https://auth.${PADDOCK_DOMAIN}/application/o/paddock-portal/
      PADDOCK_OIDC_STEPUP_ISSUER: https://auth.${PADDOCK_DOMAIN}/application/o/paddock-portal-stepup/
      PADDOCK_AUTHENTIK_URL: https://auth.${PADDOCK_DOMAIN}
      PADDOCK_OPENBAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/secrets/internal_ca_bundle
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    secrets: !override
      - valkey_password
      - release_public_key
      - revoke_release_public_key
      - rustfs_artifacts_api_access_key
      - rustfs_artifacts_api_secret_key
      - rustfs_escrow_api_access_key
      - rustfs_escrow_api_secret_key
      - db_paddock_api_url
      - db_paddock_platform_url
      # postgres://…@<audit host>:5432/paddock_audit?sslmode=verify-full&sslrootcert=/run/secrets/internal_ca_bundle
      - db_paddock_audit_reader_url
      - approle_api_role_id
      - approle_api_secret_id
      - escrow_reader_token
      - oidc_client_secret
      - authentik_service_token
      - internal_ca_bundle

  paddock-escrow-reader:
    environment:
      PADDOCK_ENV: production
      PADDOCK_OIDC_STEPUP_ISSUER: https://auth.${PADDOCK_DOMAIN}/application/o/paddock-portal-stepup/
      PADDOCK_OPENBAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/secrets/internal_ca_bundle
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    secrets: !override
      - escrow_reader_token
      - db_paddock_escrow_reader_url
      - approle_escrow_reader_role_id
      - approle_escrow_reader_secret_id
      - valkey_password
      - internal_ca_bundle

  paddock-revocation-issuer:
    environment:
      PADDOCK_ENV: production
      PADDOCK_OIDC_STEPUP_ISSUER: https://auth.${PADDOCK_DOMAIN}/application/o/paddock-portal-stepup/
      PADDOCK_OPENBAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/secrets/internal_ca_bundle
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    secrets: !override
      - db_paddock_revocation_url
      - rabbitmq_revocation_issuer_password
      - approle_revocation_issuer_role_id
      - approle_revocation_issuer_secret_id
      - valkey_password
      - rustfs_escrow_revocation_access_key
      - rustfs_escrow_revocation_secret_key
      - internal_ca_bundle

  paddock-outbox-relay:
    environment:
      PADDOCK_ENV: production

  paddock-gateway:
    environment:
      PADDOCK_ENV: production
      PADDOCK_BUNDLES_PUBLIC_URL: https://bundles.${PADDOCK_DOMAIN}

  paddock-compiler:
    environment:
      PADDOCK_ENV: production
      PADDOCK_AUTHENTIK_URL: https://auth.${PADDOCK_DOMAIN}
      PADDOCK_FLEET_PUBLIC_URL: https://fleet.${PADDOCK_DOMAIN}
      PADDOCK_OPENBAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/secrets/internal_ca_bundle
    secrets: [internal_ca_bundle]

  paddock-worker:
    environment:
      PADDOCK_ENV: production
      # Expiry of the public certificates (alert PaddockCertificateExpiry), read from Caddy on the internal network.
      PADDOCK_TLS_PROBE_HOSTS: admin.${PADDOCK_DOMAIN},auth.${PADDOCK_DOMAIN},device.${PADDOCK_DOMAIN},bundles.${PADDOCK_DOMAIN},fleet.${PADDOCK_DOMAIN}
      PADDOCK_AUTHENTIK_URL: https://auth.${PADDOCK_DOMAIN}
      PADDOCK_FLEET_PUBLIC_URL: https://fleet.${PADDOCK_DOMAIN}
      PADDOCK_OPENBAO_ADDR: https://openbao:8200
      BAO_CACERT: /run/secrets/internal_ca_bundle
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    secrets: !override
      - fleet_api_token
      - rustfs_escrow_worker_access_key
      - rustfs_escrow_worker_secret_key
      - db_paddock_worker_url
      - db_paddock_platform_url
      - rabbitmq_worker_password
      - valkey_password
      - approle_worker_role_id
      - approle_worker_secret_id
      - authentik_service_token
      - internal_ca_bundle

secrets:
  # Production release keys live apart from the development keys of `make dev-release-key` (.secrets/release/), so
  # that `make prod-check` can tell them apart; their secret keys never reach this host (docs/operations/agent-releases.md).
  release_public_key: { file: ./.secrets/release-production/minisign.pub }
  revoke_release_public_key: { file: ./.secrets/release-production/revoke-minisign.pub }
  internal_ca_bundle: { file: ./.secrets/internal-ca/bundle.crt }
  openbao_tls_crt: { file: ./.secrets/tls/openbao.crt }
  openbao_tls_key: { file: ./.secrets/tls/openbao.key }
  rabbitmq_tls_crt: { file: ./.secrets/tls/rabbitmq.crt }
  rabbitmq_tls_key: { file: ./.secrets/tls/rabbitmq.key }
