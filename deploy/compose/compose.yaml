# Paddock control plane (plan M0 §6.8). Always used together with compose.audit.yaml; compose.dev.yaml adds the
# development overrides. Image references come from versions.env (tag + digest).
name: paddock

x-paddock: &paddock
  image: ${PADDOCK_IMAGE:-paddock-server:dev}
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
    args:
      GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
      NODE_IMAGE: ${NODE_IMAGE}
      RUNTIME_IMAGE: ${RUNTIME_IMAGE}
      COMPILER_RUNTIME_IMAGE: ${COMPILER_RUNTIME_IMAGE}
  profiles: [paddock]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/paddock-server", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

x-paddock-env: &paddock-env
  PADDOCK_ENV: ${PADDOCK_ENV:-production}
  PADDOCK_LOG_LEVEL: ${PADDOCK_LOG_LEVEL:-info}
  PADDOCK_OPS_ADDR: ":9090"

services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "${PADDOCK_HTTPS_PORT:-8443}:${PADDOCK_HTTPS_PORT:-8443}"
    environment:
      PADDOCK_DOMAIN: ${PADDOCK_DOMAIN:-paddock.localhost}
      PADDOCK_HTTPS_PORT: ${PADDOCK_HTTPS_PORT:-8443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      cp:
        aliases:
          - admin.${PADDOCK_DOMAIN:-paddock.localhost}
          - auth.${PADDOCK_DOMAIN:-paddock.localhost}
          - bundles.${PADDOCK_DOMAIN:-paddock.localhost}
          - device.${PADDOCK_DOMAIN:-paddock.localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null && test -s /data/caddy/pki/authorities/local/root.crt"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Exports the root certificate of Caddy's internal CA so that containers trust the public URLs.
  caddy-ca-export:
    image: ${CADDY_IMAGE}
    restart: "no"
    command: ["sh", "-c", "cat /data/caddy/pki/authorities/local/root.crt > /export/caddy-root.crt"]
    volumes:
      - caddy-data:/data:ro
      - ./.secrets/caddy-root.crt:/export/caddy-root.crt
    network_mode: none
    depends_on:
      caddy:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: paddock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      PADDOCK_OWNER_PASSWORD_FILE: /run/secrets/db_paddock_owner_password
      PADDOCK_API_PASSWORD_FILE: /run/secrets/db_paddock_api_password
      PADDOCK_PLATFORM_PASSWORD_FILE: /run/secrets/db_paddock_platform_password
      PADDOCK_RELAY_PASSWORD_FILE: /run/secrets/db_paddock_relay_password
      PADDOCK_WORKER_PASSWORD_FILE: /run/secrets/db_paddock_worker_password
      PADDOCK_COMPILER_PASSWORD_FILE: /run/secrets/db_paddock_compiler_password
      PADDOCK_ESCROW_READER_PASSWORD_FILE: /run/secrets/db_paddock_escrow_reader_password
      PADDOCK_REVOCATION_PASSWORD_FILE: /run/secrets/db_paddock_revocation_password
    secrets:
      - postgres_superuser_password
      - db_paddock_owner_password
      - db_paddock_api_password
      - db_paddock_platform_password
      - db_paddock_relay_password
      - db_paddock_worker_password
      - db_paddock_compiler_password
      - db_paddock_escrow_reader_password
      - db_paddock_revocation_password
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    networks: [cp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paddock"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    restart: unless-stopped
    hostname: rabbitmq
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    secrets:
      - source: rabbitmq_definitions
        target: /etc/rabbitmq/definitions.json
    networks: [cp]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Cache and coordination store of the device control plane; never a source of truth (architecture §8.3).
  valkey:
    image: ${VALKEY_IMAGE}
    restart: unless-stopped
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    secrets: [valkey_auth_conf, valkey_password]
    networks: [cp]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Control-plane object store: bucket paddock-bundles (plan M2a decision 3). Separate from the audit store.
  rustfs:
    image: ${RUSTFS_IMAGE}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_root_user
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_root_password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    secrets: [rustfs_root_user, rustfs_root_password]
    volumes:
      - rustfs-data:/data
    networks: [cp]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  openbao:
    image: ${OPENBAO_IMAGE}
    restart: unless-stopped
    command: ["bao", "server", "-config=/openbao/config/config.hcl"]
    cap_add: [IPC_LOCK]
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    networks: [cp]
    healthcheck:
      # Healthy = the server answers. Sealed or uninitialized states are handled by `make bao-bootstrap` /
      # `make bao-unseal`; Paddock roles report not ready while OpenBao is sealed.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD_FILE: /run/secrets/authentik_postgres_password
    secrets: [authentik_postgres_password]
    volumes:
      - authentik-postgres-data:/var/lib/postgresql/data
    networks: [cp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-server: &authentik
    image: ${AUTHENTIK_IMAGE}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/paddock/entrypoint.sh"]
    command: ["server"]
    environment: &authentik-env
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/authentik_postgres_password
      AUTHENTIK_SECRET_KEY: file:///run/secrets/authentik_secret_key
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@paddock.test
      # Device authorizations per hour and client address (Authentik's default is 20/hour): devices behind one NAT
      # address share it at login time (docs/operations/device-login.md, plan M3.1 decision 2).
      AUTHENTIK_THROTTLE__PROVIDERS__OAUTH2__DEVICE: ${PADDOCK_DEVICE_LOGIN_THROTTLE:-600/hour}
      PADDOCK_PUBLIC_ADMIN_URL: ${PADDOCK_PUBLIC_ADMIN_URL:-https://admin.paddock.localhost:8443}
      # Exported from files by /paddock/entrypoint.sh so that no secret is visible in `docker inspect`.
      AUTHENTIK_BOOTSTRAP_PASSWORD_FROMFILE: /run/secrets/authentik_bootstrap_password
      AUTHENTIK_BOOTSTRAP_TOKEN_FROMFILE: /run/secrets/authentik_bootstrap_token
      PADDOCK_OIDC_CLIENT_SECRET_FROMFILE: /run/secrets/oidc_client_secret
      PADDOCK_AUTHENTIK_TOKEN_FROMFILE: /run/secrets/authentik_service_token
    secrets:
      - authentik_postgres_password
      - authentik_secret_key
      - authentik_bootstrap_password
      - authentik_bootstrap_token
      - oidc_client_secret
      - authentik_service_token
    volumes:
      - ./authentik/entrypoint.sh:/paddock/entrypoint.sh:ro
      - ./authentik/blueprints:/blueprints/paddock:ro
      - authentik-data:/data
    networks: [cp]
    depends_on:
      authentik-postgres:
        condition: service_healthy

  authentik-worker:
    <<: *authentik
    command: ["worker"]
    depends_on:
      authentik-postgres:
        condition: service_healthy
      # The first container to mount the new authentik-data volume populates it; starting both at once races.
      authentik-server:
        condition: service_started

  # Inventory and vulnerabilities (plan M5a decision 1, architecture §15). Fleet's UI and admin API are reachable on
  # network cp only (paddock-worker); Caddy publishes the device paths alone under fleet.<domain>. MySQL and Redis
  # are on the internal network fleet.
  fleet-mysql:
    image: ${FLEET_MYSQL_IMAGE}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/fleet_mysql_root_password
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD_FILE: /run/secrets/fleet_mysql_password
    secrets: [fleet_mysql_root_password, fleet_mysql_password]
    volumes:
      - fleet-mysql-data:/var/lib/mysql
    networks: [fleet]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Fleet speaks the Redis protocol; Valkey serves it (plan M5a decision 1).
  fleet-redis:
    image: ${VALKEY_IMAGE}
    restart: unless-stopped
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - fleet-redis-data:/data
    secrets:
      - source: fleet_redis_auth_conf
        target: valkey_auth_conf
      - fleet_redis_password
    networks: [fleet]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/fleet_redis_password)\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  fleet:
    image: ${FLEET_IMAGE}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/paddock/entrypoint.sh"]
    environment:
      FLEET_MYSQL_ADDRESS: fleet-mysql:3306
      FLEET_MYSQL_USERNAME: fleet
      FLEET_MYSQL_DATABASE: fleet
      FLEET_MYSQL_PASSWORD_PATH: /run/secrets/fleet_mysql_password
      FLEET_REDIS_ADDRESS: fleet-redis:6379
      FLEET_SERVER_ADDRESS: 0.0.0.0:8080
      # Caddy terminates TLS.
      FLEET_SERVER_TLS: "false"
      # Hosts enroll with their hardware UUID, which Paddock maps to devices (plan M5a decision 6).
      FLEET_OSQUERY_HOST_IDENTIFIER: uuid
      FLEET_OSQUERY_STATUS_LOG_PLUGIN: stdout
      FLEET_OSQUERY_RESULT_LOG_PLUGIN: stdout
      # Policy results (mutual watch, plan M5a decision 8) at most this old.
      FLEET_OSQUERY_POLICY_UPDATE_INTERVAL: ${FLEET_OSQUERY_POLICY_UPDATE_INTERVAL:-10m}
      FLEET_OSQUERY_DETAIL_UPDATE_INTERVAL: ${FLEET_OSQUERY_DETAIL_UPDATE_INTERVAL:-1h}
      # The volume is mounted on the fleet user's home, so it belongs to that user (Fleet does not run as root).
      FLEET_VULNERABILITIES_DATABASES_PATH: /home/fleet
      FLEET_VULNERABILITIES_PERIODICITY: ${FLEET_VULNERABILITIES_PERIODICITY:-1h}
      FLEET_LOGGING_JSON: "true"
      # Exported from files by /paddock/entrypoint.sh so that no secret is visible in `docker inspect`.
      FLEET_REDIS_PASSWORD_FROMFILE: /run/secrets/fleet_redis_password
      FLEET_SERVER_PRIVATE_KEY_FROMFILE: /run/secrets/fleet_server_private_key
    secrets: [fleet_mysql_password, fleet_redis_password, fleet_server_private_key]
    volumes:
      - ./fleet/entrypoint.sh:/paddock/entrypoint.sh:ro
      - fleet-vulndb:/home/fleet
    networks: [cp, fleet]
    depends_on:
      fleet-mysql:
        condition: service_healthy
      fleet-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  paddock-migrate:
    <<: *paddock
    restart: "no"
    command: ["migrate", "paddock", "+", "provision", "rabbitmq"]
    healthcheck:
      disable: true
    environment:
      <<: *paddock-env
      PADDOCK_DB_OWNER_URL_FILE: /run/secrets/db_paddock_owner_url
      PADDOCK_AMQP_URL: amqp://rabbitmq:5672/paddock
      PADDOCK_AMQP_USER: provisioner
      PADDOCK_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_provisioner_password
    secrets: [db_paddock_owner_url, rabbitmq_provisioner_password]
    networks: [cp]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paddock-api:
    <<: *paddock
    command: ["serve", "api"]
    environment:
      <<: *paddock-env
      PADDOCK_HTTP_ADDR: ":8080"
      PADDOCK_PUBLIC_ADMIN_URL: ${PADDOCK_PUBLIC_ADMIN_URL:-https://admin.paddock.localhost:8443}
      PADDOCK_PUBLIC_DEVICE_URL: ${PADDOCK_PUBLIC_DEVICE_URL:-https://device.paddock.localhost:8443}
      PADDOCK_BUNDLES_PUBLIC_URL: https://bundles.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_DB_URL_FILE: /run/secrets/db_paddock_api_url
      PADDOCK_DB_PLATFORM_URL_FILE: /run/secrets/db_paddock_platform_url
      PADDOCK_AUDIT_DB_READER_URL_FILE: /run/secrets/db_paddock_audit_reader_url
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      PADDOCK_OPENBAO_ROLE_ID_FILE: /run/secrets/approle_api_role_id
      PADDOCK_OPENBAO_SECRET_ID_FILE: /run/secrets/approle_api_secret_id
      # Escrowed secrets are decrypted by paddock-escrow-reader only (plan M4b.1 decision 5).
      PADDOCK_ESCROW_READER_URL: http://escrow-reader:8080
      PADDOCK_ESCROW_READER_TOKEN_FILE: /run/secrets/escrow_reader_token
      # Lock and Destroy (plan M4c decision 1): off unless enabled; the development override enables it.
      PADDOCK_REVOCATION_ENABLED: ${PADDOCK_REVOCATION_ENABLED:-false}
      PADDOCK_OIDC_ISSUER: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}/application/o/paddock-portal/
      PADDOCK_OIDC_CLIENT_ID: paddock-portal
      PADDOCK_OIDC_STEPUP_ISSUER: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}/application/o/paddock-portal-stepup/
      PADDOCK_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      PADDOCK_AUTHENTIK_URL: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_AUTHENTIK_TOKEN_FILE: /run/secrets/authentik_service_token
      PADDOCK_RELEASE_PUBLIC_KEY_FILE: /run/secrets/release_public_key
      PADDOCK_REVOKE_RELEASE_PUBLIC_KEY_FILE: /run/secrets/revoke_release_public_key
      PADDOCK_ARTIFACTS_S3_ENDPOINT: http://rustfs:9000
      PADDOCK_ARTIFACTS_S3_BUCKET: paddock-agent-artifacts
      PADDOCK_ARTIFACTS_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_artifacts_api_access_key
      PADDOCK_ARTIFACTS_S3_SECRET_KEY_FILE: /run/secrets/rustfs_artifacts_api_secret_key
      # Reads escrowed LUKS headers for a recovery (plan M4b decision 14).
      PADDOCK_ESCROW_S3_ENDPOINT: http://rustfs:9000
      PADDOCK_ESCROW_S3_BUCKET: paddock-escrow
      PADDOCK_ESCROW_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_escrow_api_access_key
      PADDOCK_ESCROW_S3_SECRET_KEY_FILE: /run/secrets/rustfs_escrow_api_secret_key
      # Publishes new and revoked enrollment tokens to the gateway's cache at once.
      PADDOCK_VALKEY_ADDR: valkey:6379
      PADDOCK_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      SSL_CERT_FILE: /run/secrets/caddy_root_crt
    secrets:
      - valkey_password
      - release_public_key
      - revoke_release_public_key
      - rustfs_artifacts_api_access_key
      - rustfs_artifacts_api_secret_key
      - rustfs_escrow_api_access_key
      - rustfs_escrow_api_secret_key
      - db_paddock_api_url
      - db_paddock_platform_url
      - db_paddock_audit_reader_url
      - approle_api_role_id
      - approle_api_secret_id
      - escrow_reader_token
      - oidc_client_secret
      - authentik_service_token
      - caddy_root_crt
    networks: [cp, audit-index, escrow]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully
      caddy-ca-export:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # The only holder of the AppRole paddock-escrow-reader (plan M4b.1 decision 5). Its HTTP port listens on the
  # address of the alias escrow-reader, which exists on network escrow only: the api reaches it, no other role and no
  # published port does. It verifies the step-up proof itself, so code execution in the api decrypts nothing without
  # a fresh step-up of an administrator.
  paddock-escrow-reader:
    <<: *paddock
    command: ["serve", "escrow-reader"]
    environment:
      <<: *paddock-env
      PADDOCK_HTTP_ADDR: escrow-reader:8080
      PADDOCK_ESCROW_READER_TOKEN_FILE: /run/secrets/escrow_reader_token
      PADDOCK_DB_URL_FILE: /run/secrets/db_paddock_escrow_reader_url
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      PADDOCK_OPENBAO_ROLE_ID_FILE: /run/secrets/approle_escrow_reader_role_id
      PADDOCK_OPENBAO_SECRET_ID_FILE: /run/secrets/approle_escrow_reader_secret_id
      PADDOCK_VALKEY_ADDR: valkey:6379
      PADDOCK_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      PADDOCK_OIDC_STEPUP_ISSUER: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}/application/o/paddock-portal-stepup/
      SSL_CERT_FILE: /run/secrets/caddy_root_crt
    secrets:
      - escrow_reader_token
      - db_paddock_escrow_reader_url
      - approle_escrow_reader_role_id
      - approle_escrow_reader_secret_id
      - valkey_password
      - caddy_root_crt
    networks:
      cp: {}
      escrow:
        aliases: [escrow-reader]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully
      caddy-ca-export:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # The revocation-issuer (plan M4c decision 8): single active consumer of revocation.approved and the only holder
  # of the AppRole paddock-revocation-issuer, the only one that can sign with revocation-signing. It verifies the
  # step-up proofs itself and enforces the limits of ADR 0014; no port, no other role reaches it.
  paddock-revocation-issuer:
    <<: *paddock
    command: ["serve", "revocation-issuer"]
    environment:
      <<: *paddock-env
      PADDOCK_DB_URL_FILE: /run/secrets/db_paddock_revocation_url
      PADDOCK_AMQP_URL: amqp://rabbitmq:5672/paddock
      PADDOCK_AMQP_USER: revocation_issuer
      PADDOCK_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_revocation_issuer_password
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      PADDOCK_OPENBAO_ROLE_ID_FILE: /run/secrets/approle_revocation_issuer_role_id
      PADDOCK_OPENBAO_SECRET_ID_FILE: /run/secrets/approle_revocation_issuer_secret_id
      PADDOCK_VALKEY_ADDR: valkey:6379
      PADDOCK_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      PADDOCK_OIDC_STEPUP_ISSUER: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}/application/o/paddock-portal-stepup/
      # Deletes every header version of a destroyed device (plan M4c decision 9).
      PADDOCK_ESCROW_S3_ENDPOINT: http://rustfs:9000
      PADDOCK_ESCROW_S3_BUCKET: paddock-escrow
      PADDOCK_ESCROW_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_escrow_revocation_access_key
      PADDOCK_ESCROW_S3_SECRET_KEY_FILE: /run/secrets/rustfs_escrow_revocation_secret_key
      PADDOCK_REVOCATION_ENABLED: ${PADDOCK_REVOCATION_ENABLED:-false}
      SSL_CERT_FILE: /run/secrets/caddy_root_crt
    secrets:
      - db_paddock_revocation_url
      - rabbitmq_revocation_issuer_password
      - approle_revocation_issuer_role_id
      - approle_revocation_issuer_secret_id
      - valkey_password
      - rustfs_escrow_revocation_access_key
      - rustfs_escrow_revocation_secret_key
      - caddy_root_crt
    networks: [cp]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully
      caddy-ca-export:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
      valkey:
        condition: service_healthy

  paddock-outbox-relay:
    <<: *paddock
    command: ["serve", "outbox-relay"]
    environment:
      <<: *paddock-env
      PADDOCK_DB_RELAY_URL_FILE: /run/secrets/db_paddock_relay_url
      PADDOCK_AMQP_URL: amqp://rabbitmq:5672/paddock
      PADDOCK_AMQP_USER: relay
      PADDOCK_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_relay_password
    secrets: [db_paddock_relay_url, rabbitmq_relay_password]
    networks: [cp]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully

  # Device API. No database credentials: the gateway reads Valkey and writes RabbitMQ only (plan M2a decision 1).
  paddock-gateway:
    <<: *paddock
    command: ["serve", "gateway"]
    environment:
      <<: *paddock-env
      PADDOCK_HTTP_ADDR: ":8081"
      PADDOCK_AMQP_URL: amqp://rabbitmq:5672/paddock
      PADDOCK_AMQP_USER: gateway
      PADDOCK_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_gateway_password
      PADDOCK_VALKEY_ADDR: valkey:6379
      PADDOCK_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      PADDOCK_BUNDLES_PUBLIC_URL: https://bundles.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_BUNDLES_S3_BUCKET: paddock-bundles
      PADDOCK_ARTIFACTS_S3_BUCKET: paddock-agent-artifacts
      # Header uploads are presigned PUTs below org/*/devices/*/luks-header/ (plan M4b decision 10).
      PADDOCK_ESCROW_S3_BUCKET: paddock-escrow
      PADDOCK_BUNDLES_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_bundles_gateway_access_key
      PADDOCK_BUNDLES_S3_SECRET_KEY_FILE: /run/secrets/rustfs_bundles_gateway_secret_key
    secrets:
      - rabbitmq_gateway_password
      - valkey_password
      - rustfs_bundles_gateway_access_key
      - rustfs_bundles_gateway_secret_key
    networks: [cp]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  paddock-compiler:
    <<: *paddock
    # A separate image with visudo (plan M3a decision 17).
    image: ${PADDOCK_COMPILER_IMAGE:-paddock-compiler:dev}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: compiler
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE}
        NODE_IMAGE: ${NODE_IMAGE}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE}
        COMPILER_RUNTIME_IMAGE: ${COMPILER_RUNTIME_IMAGE}
    command: ["serve", "compiler"]
    environment:
      <<: *paddock-env
      # Authority of the login resource (plan M3a decision 15); the compiler does not call Authentik.
      PADDOCK_AUTHENTIK_URL: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_DB_COMPILER_URL_FILE: /run/secrets/db_paddock_compiler_url
      PADDOCK_AMQP_URL: amqp://rabbitmq:5672/paddock
      PADDOCK_AMQP_USER: compiler
      PADDOCK_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_compiler_password
      PADDOCK_VALKEY_ADDR: valkey:6379
      PADDOCK_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      PADDOCK_OPENBAO_ROLE_ID_FILE: /run/secrets/approle_compiler_role_id
      PADDOCK_OPENBAO_SECRET_ID_FILE: /run/secrets/approle_compiler_secret_id
      # revocation.enabled of v2 bundles (plan M4c decision 1).
      PADDOCK_REVOCATION_ENABLED: ${PADDOCK_REVOCATION_ENABLED:-false}
      # inventory section of v2 bundles: fleetd enrollment (plan M5a decision 4).
      PADDOCK_FLEET_PUBLIC_URL: https://fleet.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_FLEET_ENROLL_SECRET_FILE: /run/secrets/fleet_enroll_secret
      PADDOCK_BUNDLES_S3_ENDPOINT: http://rustfs:9000
      PADDOCK_BUNDLES_S3_BUCKET: paddock-bundles
      PADDOCK_BUNDLES_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_bundles_compiler_access_key
      PADDOCK_BUNDLES_S3_SECRET_KEY_FILE: /run/secrets/rustfs_bundles_compiler_secret_key
    secrets:
      - db_paddock_compiler_url
      - fleet_enroll_secret
      - rabbitmq_compiler_password
      - valkey_password
      - approle_compiler_role_id
      - approle_compiler_secret_id
      - rustfs_bundles_compiler_access_key
      - rustfs_bundles_compiler_secret_key
    networks: [cp]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      openbao:
        condition: service_healthy

  paddock-worker:
    <<: *paddock
    command: ["serve", "worker"]
    environment:
      <<: *paddock-env
      PADDOCK_DB_WORKER_URL_FILE: /run/secrets/db_paddock_worker_url
      PADDOCK_DB_PLATFORM_URL_FILE: /run/secrets/db_paddock_platform_url
      PADDOCK_AMQP_URL: amqp://rabbitmq:5672/paddock
      PADDOCK_AMQP_USER: worker
      PADDOCK_AMQP_PASSWORD_FILE: /run/secrets/rabbitmq_worker_password
      PADDOCK_VALKEY_ADDR: valkey:6379
      PADDOCK_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      # Signs device commands with command-signing (plan M4a decision 2).
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      PADDOCK_OPENBAO_ROLE_ID_FILE: /run/secrets/approle_worker_role_id
      PADDOCK_OPENBAO_SECRET_ID_FILE: /run/secrets/approle_worker_secret_id
      # Identity synchronization and reconcile (plan M3a decisions 2, 3, 5, 9).
      PADDOCK_AUTHENTIK_URL: https://auth.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_AUTHENTIK_TOKEN_FILE: /run/secrets/authentik_service_token
      # Verifies uploaded LUKS headers (plan M4b decision 10).
      PADDOCK_ESCROW_S3_ENDPOINT: http://rustfs:9000
      PADDOCK_ESCROW_S3_BUCKET: paddock-escrow
      PADDOCK_ESCROW_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_escrow_worker_access_key
      PADDOCK_ESCROW_S3_SECRET_KEY_FILE: /run/secrets/rustfs_escrow_worker_secret_key
      # Fleet settings, inventory sync and policies (plan M5a decisions 2, 6 and 8).
      PADDOCK_FLEET_URL: http://fleet:8080
      PADDOCK_FLEET_PUBLIC_URL: https://fleet.${PADDOCK_DOMAIN:-paddock.localhost}:${PADDOCK_HTTPS_PORT:-8443}
      PADDOCK_FLEET_TOKEN_FILE: /run/secrets/fleet_api_token
      SSL_CERT_FILE: /run/secrets/caddy_root_crt
    secrets:
      - fleet_api_token
      - rustfs_escrow_worker_access_key
      - rustfs_escrow_worker_secret_key
      - db_paddock_worker_url
      - db_paddock_platform_url
      - rabbitmq_worker_password
      - valkey_password
      - approle_worker_role_id
      - approle_worker_secret_id
      - authentik_service_token
      - caddy_root_crt
    networks: [cp]
    depends_on:
      paddock-migrate:
        condition: service_completed_successfully
      caddy-ca-export:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      openbao:
        condition: service_healthy

  # Metrics and alert rules (plan M6a decision 8, docs/operations/monitoring.md): `--profile observability`. Not
  # published; Alertmanager and Grafana are not bundled.
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/scrape/controlplane.yml:/etc/prometheus/scrape/controlplane.yml:ro
      - prometheus-data:/prometheus
    networks: [cp]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  cp: {}
  audit-index: {}
  # api ↔ escrow-reader only (plan M4b.1 decision 5).
  escrow:
    internal: true
  # Fleet ↔ its MySQL and Redis only (plan M5a decision 1).
  fleet:
    internal: true

volumes:
  caddy-data: {}
  caddy-config: {}
  postgres-data: {}
  rabbitmq-data: {}
  valkey-data: {}
  rustfs-data: {}
  openbao-data: {}
