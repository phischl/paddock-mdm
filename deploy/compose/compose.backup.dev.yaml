# Development wiring of compose.backup.yaml (`make up BACKUP=1`, restore drill). Never use this file in production.
# The development stack has no internal TLS, so the backup role reaches OpenBao over plain HTTP. `make dev-seed
# BACKUP=1` creates two backup targets (plan M15 decision 18): an S3 target on the audit host's RustFS (bucket
# paddock-backup, rustfs-backup-bootstrap.sh) and a local target on the volume backup-local-dev, which stands in for
# the volumes ./paddock backup-target apply renders on a host. A full backup is due every 120 seconds instead of the
# schedule's hours, so the gates see one within minutes.
services:
  pgbackrest: &pgbackrest-dev
    build:
      context: ../..
      dockerfile: deploy/compose/pgbackrest/Dockerfile
      args:
        COMPILER_RUNTIME_IMAGE: ${COMPILER_RUNTIME_IMAGE}

  pgbackrest-authentik: *pgbackrest-dev

  paddock-backup:
    environment:
      PADDOCK_ENV: development
      PADDOCK_OPENBAO_ADDR: http://openbao:8200
      BAO_CACERT: ""
      SSL_CERT_FILE: ""
      PADDOCK_BACKUP_FULL_INTERVAL_S: "120"
      PADDOCK_BACKUP_ROUND_INTERVAL: 15s
    secrets: !override
      - db_paddock_backup_url
      - db_paddock_platform_url
      - approle_backup_role_id
      - approle_backup_secret_id
      - rustfs_escrow_backup_access_key
      - rustfs_escrow_backup_secret_key
    volumes:
      - backup-local-dev:/backup-targets
    networks: [cp, audit-store]

  backup-restore-escrow:
    environment:
      PADDOCK_ENV: development
    secrets: !override
      - db_paddock_audit_reader_url
      - rustfs_escrow_backup_access_key
      - rustfs_escrow_backup_secret_key
      - rustfs_bundles_gateway_access_key
      - rustfs_bundles_gateway_secret_key

  # The legacy key import has its own gate (plan M15 §9 B6), which sets the variable on a one-off api over this
  # mount; the development stack starts without a key.
  paddock-api:
    environment:
      PADDOCK_BACKUP_LEGACY_KEY_FILE: ""
    secrets: [backup_encryption_key]

volumes:
  backup-local-dev: {}

secrets:
  backup_encryption_key: { file: ./.secrets/backup_encryption_key }
