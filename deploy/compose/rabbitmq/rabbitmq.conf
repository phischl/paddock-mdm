# Users, vhost and permissions come from the generated definitions file; no default guest user is created.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true
loopback_users = none
default_queue_type = quorum
listeners.tcp.default = 5672
management.tcp.port = 15672
log.console = true
log.console.level = info
# The broker does not see the container's memory limit and would size its memory alarm from the host's RAM; with the
# limit as its total, publishers are blocked at 60 % of it instead of the kernel killing the broker (PDK-824).
total_memory_available_override_value = $(PADDOCK_RABBITMQ_MEM_LIMIT)
