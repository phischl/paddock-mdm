# amqps listener of the production control plane (compose.prod.yaml, plan M6a amendment 2026-10-08): the audit writer
# on the audit host connects over TLS only; the roles on this host keep plaintext 5672 on the internal network.
# The client authenticates with its password; the certificate comes from the control plane's internal CA.
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/internal_ca_bundle
ssl_options.certfile = /run/secrets/rabbitmq_tls_crt
ssl_options.keyfile = /run/secrets/rabbitmq_tls_key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
