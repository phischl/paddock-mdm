# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# DEVELOPMENT ONLY (mounted by compose.dev.yaml): test users, an admin login without the authenticator validation
# stage and a step-up that also accepts TOTP. Organization groups are assigned by `make dev-seed` after the
# organizations exist.
version: 1
metadata:
  name: Paddock - Development
  labels:
    blueprints.goauthentik.io/description: Development users and MFA-less admin login (PADDOCK_ENV=development only)
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: paddock/paddock-portal.yaml
      required: true

  # Skip the authenticator validation stages of paddock-admin-login. A policy that fails is bound to each stage
  # binding, so re-applying the portal blueprint does not bring the stages back. It passes only for an account with the
  # test attribute paddock_dev_enforce_mfa, so that the acceptance gates of ADR 0053 run the shipped deny and enrolment
  # paths with temporary users while every other account signs in without a second factor.
  - model: authentik_policies_expression.expressionpolicy
    id: skip-mfa
    identifiers:
      name: paddock-dev-skip-mfa
    attrs:
      expression: |
        # This blueprint is only mounted by compose.dev.yaml (PADDOCK_ENV=development).
        return bool(request.user.attributes.get("paddock_dev_enforce_mfa"))

  # The policy identifies the binding, not the target: !Find returns the flow stage binding's own pk, but the stored
  # target is its policy binding model pk, so a target identifier never matched and every re-apply failed. Each stage
  # binding is found by its stage: since ADR 0053 a deny stage and its enrolment sibling share an order. Every one of
  # them evaluates its policies in mode "all", so this policy skips it.
  # Stage A and its enrolment sibling at order 30 of paddock-admin-login.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 0
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-admin-login-mfa]]]]
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 4
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-admin-login-mfa-enrol]]]]
  # The same skip for the second factor Paddock adds to Authentik's default authentication flow (plan M8x decision 5).
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 1
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, default-authentication-flow]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-default-login-mfa]]]]
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 6
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, default-authentication-flow]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-default-login-mfa-enrol]]]]
  # The portal login's WebAuthn stage B (plan M8f decision 13, amended 2026-10-18) and its enrolment sibling would
  # deny or send the TOTP-only test users to the WebAuthn setup.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 2
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-admin-login-webauthn]]]]
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 5
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-admin-login-webauthn-enrol]]]]
  # Stage C (the passkey confirmation after an enrolment) would deny the test users, who have no WebAuthn device; the
  # api accepts their sign-in without a passkey through PADDOCK_LOGIN_MFA_OPTIONAL.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 3
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [stage, !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, paddock-admin-login-webauthn-confirm]]]]

  # The step-up validates with WebAuthn only; the test users have scripted TOTP authenticators. The WebAuthn stage at
  # order 30 is skipped like the login's, and a stage that also accepts TOTP takes its place at order 31.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: paddock/paddock-stepup.yaml
      required: true

  - model: authentik_policies_expression.expressionpolicy
    id: skip-stepup-webauthn
    identifiers:
      name: paddock-dev-skip-stepup-webauthn
    attrs:
      expression: |
        # This blueprint is only mounted by compose.dev.yaml (PADDOCK_ENV=development).
        return False

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-stepup-webauthn
      order: 0
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-stepup]]], [order, 30]]

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stepup-mfa
    identifiers:
      name: paddock-dev-stepup-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: deny

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, paddock-stepup]]
      stage: !KeyOf stepup-mfa
      order: 31

  - model: authentik_core.user
    identifiers:
      username: platform-admin@paddock.test
    attrs:
      name: Platform Admin
      email: platform-admin@paddock.test
      type: internal
      password: !Env DEV_PLATFORM_ADMIN_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, "paddock.platform.admins"]]

  - model: authentik_core.user
    identifiers:
      username: alice@acme.test
    attrs:
      name: Alice (acme admin)
      email: alice@acme.test
      type: internal
      password: !Env DEV_ALICE_PASSWORD

  # The second acme administrator: a Destroy needs two (plan M4c decision 7).
  - model: authentik_core.user
    identifiers:
      username: dave@acme.test
    attrs:
      name: Dave (acme admin)
      email: dave@acme.test
      type: internal
      password: !Env DEV_DAVE_PASSWORD

  - model: authentik_core.user
    identifiers:
      username: bob@acme.test
    attrs:
      name: Bob (acme auditor)
      email: bob@acme.test
      type: internal
      password: !Env DEV_BOB_PASSWORD

  - model: authentik_core.user
    identifiers:
      username: carol@globex.test
    attrs:
      name: Carol (globex admin)
      email: carol@globex.test
      type: internal
      password: !Env DEV_CAROL_PASSWORD
