# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# DEVELOPMENT ONLY (mounted by compose.dev.yaml): test users, an admin login without the authenticator validation
# stage and a step-up that also accepts TOTP. Organization groups are assigned by `make dev-seed` after the
# organizations exist.
version: 1
metadata:
  name: Paddock - Development
  labels:
    blueprints.goauthentik.io/description: Development users and MFA-less admin login (PADDOCK_ENV=development only)
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: paddock/paddock-portal.yaml
      required: true

  # Skip the authenticator validation stage of paddock-admin-login. A policy that always fails is bound to the
  # stage binding, so re-applying the portal blueprint does not bring the stage back.
  - model: authentik_policies_expression.expressionpolicy
    id: skip-mfa
    identifiers:
      name: paddock-dev-skip-mfa
    attrs:
      expression: |
        # This blueprint is only mounted by compose.dev.yaml (PADDOCK_ENV=development).
        return False

  # The policy identifies the binding, not the target: !Find returns the flow stage binding's own pk, but the stored
  # target is its policy binding model pk, so a target identifier never matched and every re-apply failed.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 0
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [order, 30]]
  # The same skip for the second factor Paddock adds to Authentik's default authentication flow (plan M8x decision 5).
  # Order 1 keeps the identifiers of the two bindings of this policy apart.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 1
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, default-authentication-flow]]], [order, 31]]
  # The portal login's WebAuthn enrolment stage B (plan M8f decision 13, amended 2026-10-18) would send the TOTP-only
  # test users to the WebAuthn setup; its binding evaluates its policies in mode "all", so this policy skips it.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-mfa
      order: 2
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-admin-login]]], [order, 31]]

  # The step-up validates with WebAuthn only; the test users have scripted TOTP authenticators. The WebAuthn stage at
  # order 30 is skipped like the login's, and a stage that also accepts TOTP takes its place at order 31.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: paddock/paddock-stepup.yaml
      required: true

  - model: authentik_policies_expression.expressionpolicy
    id: skip-stepup-webauthn
    identifiers:
      name: paddock-dev-skip-stepup-webauthn
    attrs:
      expression: |
        # This blueprint is only mounted by compose.dev.yaml (PADDOCK_ENV=development).
        return False

  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf skip-stepup-webauthn
      order: 0
    attrs:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, paddock-stepup]]], [order, 30]]

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stepup-mfa
    identifiers:
      name: paddock-dev-stepup-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: deny

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, paddock-stepup]]
      stage: !KeyOf stepup-mfa
      order: 31

  - model: authentik_core.user
    identifiers:
      username: platform-admin@paddock.test
    attrs:
      name: Platform Admin
      email: platform-admin@paddock.test
      type: internal
      password: !Env DEV_PLATFORM_ADMIN_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, "paddock.platform.admins"]]

  - model: authentik_core.user
    identifiers:
      username: alice@acme.test
    attrs:
      name: Alice (acme admin)
      email: alice@acme.test
      type: internal
      password: !Env DEV_ALICE_PASSWORD

  # The second acme administrator: a Destroy needs two (plan M4c decision 7).
  - model: authentik_core.user
    identifiers:
      username: dave@acme.test
    attrs:
      name: Dave (acme admin)
      email: dave@acme.test
      type: internal
      password: !Env DEV_DAVE_PASSWORD

  - model: authentik_core.user
    identifiers:
      username: bob@acme.test
    attrs:
      name: Bob (acme auditor)
      email: bob@acme.test
      type: internal
      password: !Env DEV_BOB_PASSWORD

  - model: authentik_core.user
    identifiers:
      username: carol@globex.test
    attrs:
      name: Carol (globex admin)
      email: carol@globex.test
      type: internal
      password: !Env DEV_CAROL_PASSWORD

  # MCP login (plan M14 §3.3 item 11): one-minute access tokens, so that the expiry gate need not wait 30 minutes.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: paddock/paddock-mcp.yaml
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: paddock-mcp
    attrs:
      access_token_validity: minutes=1
