# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Paddock device login, platform-wide (plan M3a decision 6): the authentication and authorization flows of the
# per-organization device login providers (identification with user enumeration prevention, password, mandatory MFA)
# and the device-code flow. The providers and applications themselves are created per organization by paddock-server,
# whose worker also makes the device-code flow the default brand's (plan M3.1 decision 5): a blueprint condition on
# the brand is evaluated once and races with the creation of the default brand.
#
# The authorization flow alone carries the device MFA stage (plan M8f amendment 2026-10-29, PDK-521): every device
# code, opened with ?code= (the QR code at the greeter) or typed at /device, signs the user in with the brand's
# authentication flow, paddock-admin-login (set by paddock-worker; it asks only members of Paddock administrator groups
# to enrol a passkey, ADR 0034 amendment 2026-10-29), or accepts an existing Authentik session, and then runs the
# provider's authorization flow (verified against Authentik 2026.8.3), so each approval has exactly one device prompt.
version: 1
metadata:
  name: Paddock - Device login
  labels:
    blueprints.goauthentik.io/description: Authentication and device-code flows with mandatory MFA for device logins
entries:
  - model: authentik_flows.flow
    id: authentication-flow
    identifiers:
      slug: paddock-device-authentication
    attrs:
      name: Paddock device sign-in
      title: Sign in to your device
      designation: authentication
      authentication: none

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: paddock-device-identification
    attrs:
      user_fields: [username, email]
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: false

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: paddock-device-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  # Mandatory MFA, never skipped (PoC M1 finding A2.5). This stage runs for administrators without the enrolment mark
  # and denies such an account without a factor: administrators set up their second factor only through the setup
  # link, in every sign-in flow (ADR 0053 decision 3 and amendment e, plan M12h-2 amendment e).
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers:
      name: paddock-device-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: deny
      last_auth_threshold: minutes=5
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]

  # The sibling for everyone else: device users, who set up their factor at their first device sign-in (ADR 0053
  # decision 5, RR-139), and marked administrators (decision 4). Exactly one of the two runs at each of its orders.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-enrol
    identifiers:
      name: paddock-device-mfa-enrol
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: configure
      last_auth_threshold: minutes=5
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: paddock-device-session
    attrs:
      session_duration: hours=1

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf password
      order: 20
  # The deny stage and its sibling share order 30. Their policies are evaluated when the stage is reached, for the
  # identified user (on the plan the user is still anonymous), and are each other's complement. The policy bindings
  # are identified by policy and order, so each order is unique per policy across the Paddock blueprints.
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf mfa
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-mfa-enrol-at-login-absent]]
      order: 3
    attrs:
      target: !KeyOf mfa-binding
      # A check that raised counts as unmarked: the deny stage runs.
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-admin-login-webauthn-administrator]]
      order: 6
    attrs:
      target: !KeyOf mfa-binding
      failure_result: true
  - model: authentik_flows.flowstagebinding
    id: mfa-enrol-binding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf mfa-enrol
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-mfa-enrol-at-login]]
      order: 3
    attrs:
      target: !KeyOf mfa-enrol-binding
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf authentication-flow
      stage: !KeyOf login
      order: 100

  # Device-code entry at /device. The brand's /device entry signs unauthenticated users in with the brand's
  # authentication flow (paddock-admin-login) and accepts an existing Authentik session from any flow. It binds no
  # stage: the MFA stage here asked a second time on the typed path only, because the authorization flow below runs
  # for every device approval whatever the entry path (plan M8f amendment 2026-10-29, PDK-521).
  - model: authentik_flows.flow
    id: device-code-flow
    identifiers:
      slug: paddock-device-code
    attrs:
      name: Paddock device code
      title: Approve the sign-in on your device
      designation: stage_configuration
      authentication: require_authenticated

  # Removes the MFA binding of the entry flow on installations that applied an earlier version of this blueprint. The
  # condition skips the entry once the binding is gone: Authentik 2026.8 deletes an unsaved placeholder for a missing
  # binding, which raises outside EntryInvalidError and rolls back the whole blueprint (PDK-521 review 1).
  - model: authentik_flows.flowstagebinding
    state: absent
    conditions:
      - !Find [authentik_flows.flowstagebinding, [target, !KeyOf device-code-flow], [stage, !KeyOf mfa], [order, 10]]
    identifiers:
      target: !KeyOf device-code-flow
      stage: !KeyOf mfa
      order: 10

  # Authorization of every device approval, whatever the entry path: the one device prompt, skipped only when the
  # user passed this stage within the last 5 minutes.
  - model: authentik_flows.flow
    id: authorization-flow
    identifiers:
      slug: paddock-device-authorization
    attrs:
      name: Paddock device authorization
      title: Approve the sign-in on your device
      designation: authorization
      authentication: require_authenticated

  # The same pair as in the sign-in flow above. The user is already signed in here; the pair keeps the rule when the
  # session comes from another flow.
  - model: authentik_flows.flowstagebinding
    id: authorization-mfa-binding
    identifiers:
      target: !KeyOf authorization-flow
      stage: !KeyOf mfa
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-mfa-enrol-at-login-absent]]
      order: 4
    attrs:
      target: !KeyOf authorization-mfa-binding
      # A check that raised counts as unmarked: the deny stage runs.
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-admin-login-webauthn-administrator]]
      order: 7
    attrs:
      target: !KeyOf authorization-mfa-binding
      failure_result: true
  - model: authentik_flows.flowstagebinding
    id: authorization-mfa-enrol-binding
    identifiers:
      target: !KeyOf authorization-flow
      stage: !KeyOf mfa-enrol
      order: 10
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-mfa-enrol-at-login]]
      order: 4
    attrs:
      target: !KeyOf authorization-mfa-enrol-binding
