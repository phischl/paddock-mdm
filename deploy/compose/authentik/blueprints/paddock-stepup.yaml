# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Paddock step-up (plan M4a decision 6): a fresh password and MFA for security-relevant portal actions. Authentik has
# no per-request flow override, so step-up has its own OIDC provider and application, paddock-portal-stepup, whose
# authentication flow is paddock-stepup; the portal requests it with prompt=login, which always re-runs that flow.
version: 1
metadata:
  name: Paddock - Step-up
  labels:
    blueprints.goauthentik.io/description: Step-up authentication flow and OIDC application of the Paddock portal
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: paddock/paddock-portal.yaml
      required: true

  # --- Step-up flow: identification (pre-filled with the login hint) -> password -> MFA (never skippable) -> login ---
  - model: authentik_flows.flow
    id: stepup-flow
    identifiers:
      slug: paddock-stepup
    attrs:
      name: Paddock step-up
      title: Confirm your identity
      designation: authentication
      authentication: none

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: paddock-stepup-identification
    attrs:
      user_fields: [username, email]
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: true

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: paddock-stepup-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers:
      name: paddock-stepup-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: deny

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: paddock-stepup-session
    attrs:
      session_duration: hours=8

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf stepup-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf stepup-flow
      stage: !KeyOf password
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf stepup-flow
      stage: !KeyOf mfa
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf stepup-flow
      stage: !KeyOf login
      order: 100

  # --- OIDC provider and application, with the client policy of paddock-portal ---
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: paddock-portal-stepup
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      client_id: paddock-portal-stepup
      client_secret: !Env PADDOCK_OIDC_CLIENT_SECRET
      authentication_flow: !KeyOf stepup-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/stepup/callback", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers:
      slug: paddock-portal-stepup
    attrs:
      name: Paddock step-up
      provider: !KeyOf provider
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, paddock-portal-member]]
      order: 0
