# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Paddock portal bootstrap (plan M0 §6.8): OIDC provider and application for the admin portal, admin login flow,
# platform admin group and the service account Paddock uses to manage organization groups.
version: 1
metadata:
  name: Paddock - Portal
  labels:
    blueprints.goauthentik.io/description: OIDC application, login flow and service account for the Paddock portal
entries:
  # --- Admin login flow: identification -> password -> authenticator validation -> login ---
  - model: authentik_flows.flow
    id: login-flow
    identifiers:
      slug: paddock-admin-login
    attrs:
      name: Paddock administrator login
      title: Paddock
      designation: authentication
      authentication: none

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: paddock-admin-login-identification
    attrs:
      user_fields: [username, email]
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: false

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: paddock-admin-login-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers:
      name: paddock-admin-login-mfa
    attrs:
      # Stage A (plan M8f decision 13 as amended on 2026-10-18): an administrator with any authenticator proves it
      # before anything is enrolled, so the password alone never enrols a key. Authentik accepts one of the account's
      # recovery codes in place of the TOTP code (maintainer decision 2026-10-18, RR-62). Authentik counts an account
      # as not configured only when it has no WebAuthn and no TOTP device. This stage runs for administrators without
      # the enrolment mark and denies such an account: a password alone never enrols a factor for an administrator, who
      # enrols through a one-time link instead (ADR 0053 decision 3, plan M12h-2 amendment c).
      device_classes: [webauthn, totp]
      not_configured_action: deny
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  # Stage A's sibling for everyone else: device users, who keep enrolling at their first sign-in (ADR 0053 decision 5,
  # RR-139), and administrators marked with paddock_mfa_enrol_at_login (ADR 0053 decision 4). Exactly one of the two
  # runs at order 30 (policy paddock-mfa-enrol-at-login).
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-enrol
    identifiers:
      name: paddock-admin-login-mfa-enrol
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  # The enrolment mark the worker sets once on administrators without a passkey and removes once they have one (ADR
  # 0053 decision 4). The absent policy binds the deny stages, the other one the enrolment siblings.
  - model: authentik_policies_expression.expressionpolicy
    id: enrol-at-login-absent
    identifiers:
      name: paddock-mfa-enrol-at-login-absent
    attrs:
      expression: |
        return not bool(request.user.attributes.get("paddock_mfa_enrol_at_login"))

  # Marked, or not an administrator: the complement of "absent AND administrator" on the deny stages, in one policy so
  # that the enrolment bindings evaluate in mode "all" and the development blueprint's skip policy (failing for every
  # account without its test attribute) still skips them (plan M12h-2 amendment c point 1). An administrator check that failed to run counts as an administrator,
  # so it never opens the enrolment to an unmarked administrator.
  - model: authentik_policies_expression.expressionpolicy
    id: enrol-at-login
    identifiers:
      name: paddock-mfa-enrol-at-login
    attrs:
      expression: |
        if bool(request.user.attributes.get("paddock_mfa_enrol_at_login")):
            return True
        administrator = ak_call_policy("paddock-admin-login-webauthn-administrator")
        if administrator.messages:
            return False
        return not administrator.passing

  # Stage B: the step-up accepts WebAuthn only, so an administrator who has just proven TOTP (or entered a recovery
  # code) in stage A and has no WebAuthn device enrols one now if marked (stage B's sibling) and is denied otherwise
  # (ADR 0053 decision 3; this stage). The policy on its binding skips it for an account with
  # a WebAuthn device, because the MFA cookie is bound to the stage that set it and a last_auth_threshold would ask a
  # WebAuthn user twice. This flow is also the default brand's authentication flow, which the device-code page runs
  # for every device user; a second policy limits the enrolment to members of Paddock administrator groups (ADR 0034
  # amendment 2026-10-29, PDK-498).
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-webauthn
    identifiers:
      name: paddock-admin-login-webauthn
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-webauthn-enrol
    identifiers:
      name: paddock-admin-login-webauthn-enrol
    attrs:
      device_classes: [webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  - model: authentik_policies_expression.expressionpolicy
    id: webauthn-missing
    identifiers:
      name: paddock-admin-login-webauthn-missing
    attrs:
      expression: |
        return not ak_user_has_authenticator(request.user, "webauthn")

  # The administrator groups are the portal's role groups: paddock.platform.admins and paddock.<slug>.admins,
  # .operators and .auditors. Operators step up too (API tokens), and every portal role keeps the passkey enrolment it
  # had before (ADR 0034 decision F2, decision 4). Direct memberships only, as in the portal's groups claim.
  - model: authentik_policies_expression.expressionpolicy
    id: webauthn-administrator
    identifiers:
      name: paddock-admin-login-webauthn-administrator
    attrs:
      expression: |
        return any(
            len(p) == 3 and p[0] == "paddock" and p[2] in ("admins", "operators", "auditors")
            for p in (g.name.split(".") for g in request.user.groups.all())
        )

  # Stage C (ADR 0034 amendment 2026-10-29, PDK-500): the portal accepts only a login that validated a WebAuthn
  # authenticator (paddock_mfa_classes), and Authentik records no device for an enrolment. An administrator who enrolled
  # in stage A or B, or proved TOTP in stage A although a passkey exists, confirms the passkey here once, so that the
  # first portal sign-in after an enrolment is not refused. Deny: stage B has left every administrator a WebAuthn device.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-webauthn-confirm
    identifiers:
      name: paddock-admin-login-webauthn-confirm
    attrs:
      device_classes: [webauthn]
      not_configured_action: deny

  - model: authentik_policies_expression.expressionpolicy
    id: webauthn-unconfirmed
    identifiers:
      name: paddock-admin-login-webauthn-unconfirmed
    attrs:
      # The validated devices of this flow execution, as in paddock-default-login-mfa-missing; an enrolment adds none.
      expression: |
        method_args = request.context.get("auth_method_args") or {}
        return not any(d.__class__.__name__ == "WebAuthnDevice" for d in method_args.get("mfa_devices") or [])

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: paddock-admin-login-session
    attrs:
      session_duration: hours=8

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf password
      order: 20
  # Stage A and its sibling share order 30; their policies are evaluated when the stage is reached, for the identified
  # user (on the plan the user is still anonymous). The bindings' policies are each other's complement.
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf enrol-at-login-absent
      order: 0
    attrs:
      target: !KeyOf mfa-binding
      # An attribute check that raised counts as unmarked: the deny stage runs.
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-administrator
      order: 3
    attrs:
      target: !KeyOf mfa-binding
      failure_result: true
  - model: authentik_flows.flowstagebinding
    id: mfa-enrol-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa-enrol
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf enrol-at-login
      order: 0
    attrs:
      target: !KeyOf mfa-enrol-binding
  # Re-evaluated when stage B is reached, after stage A, so that an account that enrolled WebAuthn in stage A skips it.
  # "all": the development blueprint binds a policy that fails (except for its test attribute) to skip this stage.
  - model: authentik_flows.flowstagebinding
    id: mfa-webauthn-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa-webauthn
      order: 31
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  # The policy identifies the binding, not the target (see the development blueprint): a target identifier never
  # matches the stored policy binding model pk on a re-apply.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-missing
      order: 0
    attrs:
      target: !KeyOf mfa-webauthn-binding
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-administrator
      order: 1
    attrs:
      target: !KeyOf mfa-webauthn-binding
      # Authentik's default failure result (false) would skip the denial for an administrator if the expression raised;
      # true fails closed.
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf enrol-at-login-absent
      order: 1
    attrs:
      target: !KeyOf mfa-webauthn-binding
      failure_result: true
  # Stage B's sibling: a marked administrator without a WebAuthn device enrols one here; "all" as stage B.
  - model: authentik_flows.flowstagebinding
    id: mfa-webauthn-enrol-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa-webauthn-enrol
      order: 31
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-missing
      order: 1
    attrs:
      target: !KeyOf mfa-webauthn-enrol-binding
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-administrator
      order: 5
    attrs:
      target: !KeyOf mfa-webauthn-enrol-binding
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf enrol-at-login
      order: 1
    attrs:
      target: !KeyOf mfa-webauthn-enrol-binding
  # Re-evaluated when stage C is reached, after stages A and B; "all": administrators only (end users would be denied,
  # which breaks the device-code sign-in), and the development blueprint skips it like stage B.
  - model: authentik_flows.flowstagebinding
    id: mfa-webauthn-confirm-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa-webauthn-confirm
      order: 32
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-administrator
      order: 2
    attrs:
      target: !KeyOf mfa-webauthn-confirm-binding
      # Fails closed for an administrator if the expression raised (see stage B).
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-unconfirmed
      order: 0
    attrs:
      target: !KeyOf mfa-webauthn-confirm-binding
      failure_result: true
  # Second factor on Authentik's default authentication flow as well (lab finding of 2026-10-17, plan M8x decision 5):
  # every sign-in validates a WebAuthn or TOTP device; a user without one enrols one in the sibling stage below, unless
  # it is an administrator without the enrolment mark, whom this stage denies (ADR 0053 decision 3). The policy below skips this
  # stage only when Authentik's own stage at order 30 has just validated a WebAuthn or TOTP device in this flow
  # (PDK-324): the MFA cookie of a last_auth_threshold is bound to the stage that set it and never let this stage skip
  # a validation of the stage at order 30. Owning such a device is not enough: order 30 also accepts recovery codes,
  # e-mail, SMS and Duo, and a sign-in with one of those is asked again here. Authentik accepts a further recovery code
  # at this TOTP prompt as well, so the guarantee is a second factor of the user's own devices (RR-62).
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: default-flow-mfa
    identifiers:
      name: paddock-default-login-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: deny
      last_auth_threshold: seconds=0
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: default-flow-mfa-enrol
    identifiers:
      name: paddock-default-login-mfa-enrol
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: configure
      last_auth_threshold: seconds=0
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  - model: authentik_flows.flowstagebinding
    id: default-flow-mfa-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf default-flow-mfa
      order: 31
    attrs:
      # Evaluated when the stage is reached, for the identified user; "all": the development blueprint binds a policy
      # that fails (except for its test attribute) to skip this stage.
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies_expression.expressionpolicy
    id: default-flow-mfa-missing
    identifiers:
      name: paddock-default-login-mfa-missing
    attrs:
      # The name stays as first shipped although the policy checks the factor used, not the devices owned: the policy
      # binding is identified by the policy, so a renamed policy would leave the old binding on order 31 after a
      # re-apply.
      expression: |
        method_args = request.context.get("auth_method_args") or {}
        return not any(d.__class__.__name__ in ("TOTPDevice", "WebAuthnDevice") for d in method_args.get("mfa_devices") or [])
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf default-flow-mfa-missing
      order: 0
    attrs:
      target: !KeyOf default-flow-mfa-binding
      # Authentik's default failure result (false) would remove the stage if the expression raised; true fails closed.
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf enrol-at-login-absent
      order: 2
    attrs:
      target: !KeyOf default-flow-mfa-binding
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-administrator
      order: 4
    attrs:
      target: !KeyOf default-flow-mfa-binding
      failure_result: true
  # The sibling at the same order, for everyone the deny stage leaves out (the complement, policy
  # paddock-mfa-enrol-at-login).
  - model: authentik_flows.flowstagebinding
    id: default-flow-mfa-enrol-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf default-flow-mfa-enrol
      order: 31
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf default-flow-mfa-missing
      order: 1
    attrs:
      target: !KeyOf default-flow-mfa-enrol-binding
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf enrol-at-login
      order: 2
    attrs:
      target: !KeyOf default-flow-mfa-enrol-binding
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf login
      order: 100

  # --- Groups claim ---
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      managed: io.paddock/scope-groups
    attrs:
      name: "Paddock: groups"
      scope_name: groups
      description: Group memberships
      expression: |
        return {"groups": [g.name for g in request.user.groups.all()]}

  # --- Authenticator classes claim ---
  # The portal sign-in requires a validated WebAuthn authenticator (ADR 0034 amendment 2026-10-29). Authentik's amr says
  # "mfa" for WebAuthn and TOTP alike; this mapping names the classes of the authenticators the session's login
  # validated, from the login event Authentik uses for amr (providers/oauth2/id_token.py), like the step-up's mapping.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-mfa
    identifiers:
      managed: io.paddock/scope-login-mfa
    attrs:
      name: "Paddock: sign-in authenticator classes"
      scope_name: paddock_mfa
      description: Authenticator classes of the sign-in
      expression: |
        from authentik.events.signals import get_login_event
        classes = []
        # Authentik's discovery endpoint evaluates every scope mapping without a token (claims_supported), where a bare
        # token raises NameError (PDK-618); request.context holds the evaluation's arguments either way.
        grant = request.context.get("token")
        event = get_login_event(grant.session) if grant and grant.session else None
        if event:
            for device in (event.context.get("auth_method_args") or {}).get("mfa_devices") or []:
                if isinstance(device, dict) and device.get("app") and device.get("model_name"):
                    classes.append(f"{device['app']}.{device['model_name']}")
        return {"paddock_mfa_classes": classes}

  # --- OIDC provider and application ---
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: paddock-portal
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      client_id: paddock-portal
      client_secret: !Env PADDOCK_OIDC_CLIENT_SECRET
      authentication_flow: !KeyOf login-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-groups
        - !KeyOf scope-mfa

  - model: authentik_core.application
    id: application
    identifiers:
      slug: paddock-portal
    attrs:
      name: Paddock
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: !Format ["%s/", !Env PADDOCK_PUBLIC_ADMIN_URL]

  - model: authentik_policies_expression.expressionpolicy
    id: paddock-member
    identifiers:
      name: paddock-portal-member
    attrs:
      expression: |
        return request.user.groups.filter(name__startswith="paddock.").exists()

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      policy: !KeyOf paddock-member
      order: 0

  # --- Platform administrators ---
  - model: authentik_core.group
    identifiers:
      name: "paddock.platform.admins"

  # --- Service account used by paddock-server (organization groups, users, device login providers, the default
  # brand's flows; plans M3a and M3.1) ---
  - model: authentik_rbac.role
    id: service-role
    identifiers:
      name: paddock-service
    attrs:
      permissions:
        - authentik_core.view_group
        - authentik_core.add_group
        - authentik_core.change_group
        - authentik_core.delete_group
        - authentik_core.add_user_to_group
        - authentik_core.remove_user_from_group
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.delete_user
        - authentik_core.reset_user_password
        # End all sessions also ends the portal users' Authentik sessions (plan M8f decision 17).
        - authentik_core.view_authenticatedsession
        - authentik_core.delete_authenticatedsession
        - authentik_core.view_application
        - authentik_core.add_application
        - authentik_core.change_application
        - authentik_providers_oauth2.view_oauth2provider
        - authentik_providers_oauth2.add_oauth2provider
        - authentik_providers_oauth2.change_oauth2provider
        - authentik_providers_oauth2.view_scopemapping
        - authentik_providers_oauth2.add_scopemapping
        - authentik_providers_oauth2.change_scopemapping
        - authentik_policies_expression.view_expressionpolicy
        - authentik_policies_expression.add_expressionpolicy
        - authentik_policies_expression.change_expressionpolicy
        - authentik_policies.view_policybinding
        - authentik_policies.add_policybinding
        - authentik_policies.change_policybinding
        - authentik_flows.view_flow
        - authentik_brands.view_brand
        - authentik_brands.change_brand
        - authentik_crypto.view_certificatekeypair
        # Deleting an organization removes its device login application, provider, access policy with its bindings
        # and groups mapping (plan M17 decision 10).
        - authentik_core.delete_application
        - authentik_providers_oauth2.delete_oauth2provider
        - authentik_providers_oauth2.delete_scopemapping
        - authentik_policies_expression.delete_expressionpolicy
        - authentik_policies.delete_policybinding
        # The second-factor enrolment marks (ADR 0053 decision 4): which administrators have a passkey.
        - authentik_stages_authenticator_webauthn.view_webauthndevice
        - authentik_stages_authenticator_totp.view_totpdevice

  - model: authentik_core.user
    id: service-user
    identifiers:
      username: paddock-service
    attrs:
      name: Paddock service account
      type: service_account
      path: paddock
      roles:
        - !KeyOf service-role

  - model: authentik_core.token
    identifiers:
      identifier: paddock-service-token
    attrs:
      intent: api
      expiring: false
