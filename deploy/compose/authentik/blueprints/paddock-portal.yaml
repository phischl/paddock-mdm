# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Paddock portal bootstrap (plan M0 §6.8): OIDC provider and application for the admin portal, admin login flow,
# platform admin group and the service account Paddock uses to manage organization groups.
version: 1
metadata:
  name: Paddock - Portal
  labels:
    blueprints.goauthentik.io/description: OIDC application, login flow and service account for the Paddock portal
entries:
  # --- Admin login flow: identification -> password -> authenticator validation -> login ---
  - model: authentik_flows.flow
    id: login-flow
    identifiers:
      slug: paddock-admin-login
    attrs:
      name: Paddock administrator login
      title: Paddock
      designation: authentication
      authentication: none

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: paddock-admin-login-identification
    attrs:
      user_fields: [username, email]
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: false

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: paddock-admin-login-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers:
      name: paddock-admin-login-mfa
    attrs:
      # Stage A (plan M8f decision 13 as amended on 2026-10-18): an administrator with any authenticator proves it
      # before anything is enrolled, so the password alone never enrols a key. Authentik counts an account as not
      # configured only when it has no WebAuthn and no TOTP device; only then is WebAuthn enrolled here (RR-62).
      device_classes: [webauthn, totp]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  # Stage B: the step-up accepts WebAuthn only, so an administrator who has just proven TOTP in stage A and has no
  # WebAuthn device enrols one now. The policy on its binding skips it for an account with a WebAuthn device, because
  # the MFA cookie is bound to the stage that set it and a last_auth_threshold would ask a WebAuthn user twice.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-webauthn
    identifiers:
      name: paddock-admin-login-webauthn
    attrs:
      device_classes: [webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  - model: authentik_policies_expression.expressionpolicy
    id: webauthn-missing
    identifiers:
      name: paddock-admin-login-webauthn-missing
    attrs:
      expression: |
        return not ak_user_has_authenticator(request.user, "webauthn")

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: paddock-admin-login-session
    attrs:
      session_duration: hours=8

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf password
      order: 20
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  # Re-evaluated when stage B is reached, after stage A, so that an account that enrolled WebAuthn in stage A skips it.
  # "all": the development blueprint binds a policy that always fails to skip this stage as well.
  - model: authentik_flows.flowstagebinding
    id: mfa-webauthn-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa-webauthn
      order: 31
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  # The policy identifies the binding, not the target (see the development blueprint): a target identifier never
  # matches the stored policy binding model pk on a re-apply.
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf webauthn-missing
      order: 0
    attrs:
      target: !KeyOf mfa-webauthn-binding
  # Second factor on Authentik's default authentication flow as well (lab finding of 2026-10-17): a user without a
  # WebAuthn or TOTP authenticator must enrol one. A user with one has just validated it in Authentik's own stage at
  # order 30, so the policy below skips this stage for them (PDK-324): the MFA cookie of a last_auth_threshold is bound
  # to the stage that set it and never let this stage skip a validation of the stage at order 30.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: default-flow-mfa
    identifiers:
      name: paddock-default-login-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: configure
      last_auth_threshold: seconds=0
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  - model: authentik_flows.flowstagebinding
    id: default-flow-mfa-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf default-flow-mfa
      order: 31
    attrs:
      # Evaluated when the stage is reached, for the identified user; "all": the development blueprint binds a policy
      # that always fails to skip this stage.
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies_expression.expressionpolicy
    id: default-flow-mfa-missing
    identifiers:
      name: paddock-default-login-mfa-missing
    attrs:
      expression: |
        return not (ak_user_has_authenticator(request.user, "webauthn") or ak_user_has_authenticator(request.user, "totp"))
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf default-flow-mfa-missing
      order: 0
    attrs:
      target: !KeyOf default-flow-mfa-binding
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf login
      order: 100

  # --- Groups claim ---
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      managed: io.paddock/scope-groups
    attrs:
      name: "Paddock: groups"
      scope_name: groups
      description: Group memberships
      expression: |
        return {"groups": [g.name for g in request.user.groups.all()]}

  # --- OIDC provider and application ---
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: paddock-portal
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      client_id: paddock-portal
      client_secret: !Env PADDOCK_OIDC_CLIENT_SECRET
      authentication_flow: !KeyOf login-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-groups

  - model: authentik_core.application
    id: application
    identifiers:
      slug: paddock-portal
    attrs:
      name: Paddock
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: !Format ["%s/", !Env PADDOCK_PUBLIC_ADMIN_URL]

  - model: authentik_policies_expression.expressionpolicy
    id: paddock-member
    identifiers:
      name: paddock-portal-member
    attrs:
      expression: |
        return request.user.groups.filter(name__startswith="paddock.").exists()

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      policy: !KeyOf paddock-member
      order: 0

  # --- Platform administrators ---
  - model: authentik_core.group
    identifiers:
      name: "paddock.platform.admins"

  # --- Service account used by paddock-server (organization groups, users, device login providers, the default
  # brand's flows; plans M3a and M3.1) ---
  - model: authentik_rbac.role
    id: service-role
    identifiers:
      name: paddock-service
    attrs:
      permissions:
        - authentik_core.view_group
        - authentik_core.add_group
        - authentik_core.change_group
        - authentik_core.delete_group
        - authentik_core.add_user_to_group
        - authentik_core.remove_user_from_group
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.delete_user
        - authentik_core.reset_user_password
        # End all sessions also ends the portal users' Authentik sessions (plan M8f decision 17).
        - authentik_core.view_authenticatedsession
        - authentik_core.delete_authenticatedsession
        - authentik_core.view_application
        - authentik_core.add_application
        - authentik_core.change_application
        - authentik_providers_oauth2.view_oauth2provider
        - authentik_providers_oauth2.add_oauth2provider
        - authentik_providers_oauth2.change_oauth2provider
        - authentik_providers_oauth2.view_scopemapping
        - authentik_providers_oauth2.add_scopemapping
        - authentik_providers_oauth2.change_scopemapping
        - authentik_policies_expression.view_expressionpolicy
        - authentik_policies_expression.add_expressionpolicy
        - authentik_policies_expression.change_expressionpolicy
        - authentik_policies.view_policybinding
        - authentik_policies.add_policybinding
        - authentik_policies.change_policybinding
        - authentik_flows.view_flow
        - authentik_brands.view_brand
        - authentik_brands.change_brand
        - authentik_crypto.view_certificatekeypair

  - model: authentik_core.user
    id: service-user
    identifiers:
      username: paddock-service
    attrs:
      name: Paddock service account
      type: service_account
      path: paddock
      roles:
        - !KeyOf service-role

  - model: authentik_core.token
    identifiers:
      identifier: paddock-service-token
    attrs:
      intent: api
      expiring: false
      user: !KeyOf service-user
      key: !Env PADDOCK_AUTHENTIK_TOKEN
      description: API token of paddock-server (Authentik adapter)
