# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Paddock portal bootstrap (plan M0 §6.8): OIDC provider and application for the admin portal, admin login flow,
# platform admin group and the service account Paddock uses to manage organization groups.
version: 1
metadata:
  name: Paddock - Portal
  labels:
    blueprints.goauthentik.io/description: OIDC application, login flow and service account for the Paddock portal
entries:
  # --- Admin login flow: identification -> password -> authenticator validation -> login ---
  - model: authentik_flows.flow
    id: login-flow
    identifiers:
      slug: paddock-admin-login
    attrs:
      name: Paddock administrator login
      title: Paddock
      designation: authentication
      authentication: none

  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: paddock-admin-login-identification
    attrs:
      user_fields: [username, email]
      case_insensitive_matching: true
      pretend_user_exists: true
      show_matched_user: false

  - model: authentik_stages_password.passwordstage
    id: password
    identifiers:
      name: paddock-admin-login-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
      failed_attempts_before_cancel: 5

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa
    identifiers:
      name: paddock-admin-login-mfa
    attrs:
      device_classes: [webauthn, totp]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]

  - model: authentik_stages_user_login.userloginstage
    id: login
    identifiers:
      name: paddock-admin-login-session
    attrs:
      session_duration: hours=8

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf password
      order: 20
  - model: authentik_flows.flowstagebinding
    id: mfa-binding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf mfa
      order: 30
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf login-flow
      stage: !KeyOf login
      order: 100

  # --- Groups claim ---
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      managed: io.paddock/scope-groups
    attrs:
      name: "Paddock: groups"
      scope_name: groups
      description: Group memberships
      expression: |
        return {"groups": [g.name for g in request.user.groups.all()]}

  # --- OIDC provider and application ---
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: paddock-portal
    attrs:
      client_type: confidential
      grant_types: [authorization_code]
      client_id: paddock-portal
      client_secret: !Env PADDOCK_OIDC_CLIENT_SECRET
      authentication_flow: !KeyOf login-flow
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/auth/callback", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/", !Env PADDOCK_PUBLIC_ADMIN_URL]
          redirect_uri_type: logout
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: minutes=5
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-groups

  - model: authentik_core.application
    id: application
    identifiers:
      slug: paddock-portal
    attrs:
      name: Paddock
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: !Format ["%s/", !Env PADDOCK_PUBLIC_ADMIN_URL]

  - model: authentik_policies_expression.expressionpolicy
    id: paddock-member
    identifiers:
      name: paddock-portal-member
    attrs:
      expression: |
        return request.user.groups.filter(name__startswith="paddock:").exists()

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      policy: !KeyOf paddock-member
      order: 0

  # --- Platform administrators ---
  - model: authentik_core.group
    identifiers:
      name: "paddock:platform:admins"

  # --- Service account used by paddock-server (group management) ---
  - model: authentik_rbac.role
    id: service-role
    identifiers:
      name: paddock-service
    attrs:
      permissions:
        - authentik_core.view_group
        - authentik_core.add_group

  - model: authentik_core.user
    id: service-user
    identifiers:
      username: paddock-service
    attrs:
      name: Paddock service account
      type: service_account
      path: paddock
      roles:
        - !KeyOf service-role

  - model: authentik_core.token
    identifiers:
      identifier: paddock-service-token
    attrs:
      intent: api
      expiring: false
      user: !KeyOf service-user
      key: !Env PADDOCK_AUTHENTIK_TOKEN
      description: API token of paddock-server (Authentik adapter)
