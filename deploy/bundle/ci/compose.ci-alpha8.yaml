# CI overlay of the upgrade job for a previous release of 0.1.0-alpha.8 (deploy/bundle/ci/upgrade.sh; plan M16
# amendment 2026-11-06 "the alpha.8 pair"; decisions-alpha9 item 53). alpha.8 backs up to an S3 bucket; on the runner
# that bucket lives on the audit project's RustFS, reached through the CI project paddock-ci-s3 (compose.ci-s3.yaml),
# which upgrade.sh attaches to the network cp as backup-s3-tls. The worker and fleet-backup-upload take its plain-HTTP
# port from .env (PADDOCK_BACKUP_S3_ENDPOINT); pgBackRest speaks TLS only and gets the TLS port and its CA here.
#
# The upgrade and the rollback run alpha.8's and the candidate's ./paddock in one process with one
# PADDOCK_COMPOSE_EXTRA, so this file applies to the candidate's Compose files too while they run. It therefore only
# adds settings to services both releases have and that the candidate ignores: the candidate's pgBackRest reads no
# PADDOCK_BACKUP_S3_* variable and its repository is the volume backup-repo, so the two variables and the read-only CA
# mount below change nothing there. No service, network or volume is added to either project. The upgrade job drops
# this file for every candidate command outside `upgrade` and `rollback`.
services:
  pgbackrest: &pgbackrest-alpha8
    environment:
      PADDOCK_BACKUP_S3_ENDPOINT: https://backup-s3-tls:19443
      PADDOCK_BACKUP_S3_CA_FILE: /backup-s3-ca/root.crt
    volumes:
      - ${PADDOCK_CI_S3_CA_DIR:?set by upgrade.sh}:/backup-s3-ca:ro

  pgbackrest-authentik: *pgbackrest-alpha8
