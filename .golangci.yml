version: "2"

run:
  timeout: 10m
  relative-path-mode: cfg

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - ineffassign
    - unused
    - gocritic
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog; fmt.Print* is only allowed in cmd/
        - pattern: ^log\.Print.*$
          msg: use log/slog; log.Print* is only allowed in cmd/
        - pattern: ^pgxpool\.
          msg: pgxpool is only allowed in server/internal/platform/db (use OrgPool.InOrg / PlatformPool.InPlatform)
        - pattern: \.(InsertAction|FinishAction|InsertOutbox)$
          msg: only app.ActionRunner and the outbox package may write action and outbox rows
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: (^|/)cmd/
        linters: [forbidigo]
        text: (fmt|log)\.Print
      - path: ^test/(acceptance|system)/
        linters: [forbidigo, gosec]
      - path: ^server/internal/platform/db/
        linters: [forbidigo]
        text: pgxpool
      - path: ^server/internal/(app/action\.go|outbox/)
        linters: [forbidigo]
        text: InsertAction|FinishAction|InsertOutbox
      - path: _test\.go$
        linters: [gosec, forbidigo]
      - path: ^(server/internal/testsupport|agent/internal/testgw|agent/internal/reconcile/fakesys)/
        linters: [gosec, forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
