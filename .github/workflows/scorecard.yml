name: scorecard

# Weekly OpenSSF Scorecard measurement (plan M12h-2 decisions 5 and 6, ADR 0054). Results are published for the badge and
# uploaded to the security tab. The job never gates a build; targets live in docs/operations/supply-chain.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1" # weekly, Monday 05:30 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # publish_results signs the published result with the workflow identity
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
