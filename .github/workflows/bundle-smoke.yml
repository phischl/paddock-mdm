name: bundle-smoke

# The bundle smoke tests of the edge job (ci.yml) before the merge: a pull request that changes the deployment builds
# the operator bundle from its own code and installs it (default profile and lab profile behind Nginx). A separate
# workflow because `on.pull_request.paths` is the only path filter GitHub offers without a third-party action or a
# hand-written git diff job. Nothing is pushed or signed: the images stay local and the bundle references them by tag.
on:
  pull_request:
    paths:
      - "deploy/**" # compose files, Authentik blueprints, versions.env, Dockerfiles, bundle and smoke scripts
      - "Makefile" # image, bundle and release targets
      - ".dockerignore" # build context of the images
      - ".github/workflows/bundle-smoke.yml"
      - ".github/actions/free-disk/**" # the runner disk cleanup this job runs (PDK-633)

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  bundle-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/free-disk
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - name: Local images and bundle
        run: make image image-compiler image-pgbackrest bundle
      - name: Disk usage after the image build
        run: |
          df -h /
          docker system df || true
      - name: Smoke test of the bundle
        run: deploy/bundle/ci/smoke.sh dist/bundle/paddock-deploy-0.0.0-local.tar.gz --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: bundle-smoke-logs
          path: ${{ runner.temp }}/smoke/logs/
      - name: Smoke test of the lab profile of the bundle
        run: deploy/bundle/ci/smoke-lab.sh dist/bundle/paddock-deploy-0.0.0-local.tar.gz --work "$RUNNER_TEMP/smoke-lab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: bundle-smoke-lab-logs
          path: ${{ runner.temp }}/smoke-lab/logs/
      - name: Disk usage
        if: failure()
        run: |
          df -h
          docker system df || true
