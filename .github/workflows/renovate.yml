name: renovate

# Opens the weekly patch-weekly pull request and one pull request per minor or major update, and keeps the
# dependency dashboard (ADR 0054 amendment b). Nothing merges itself. Pull requests opened with GITHUB_TOKEN do not
# start CI: close and reopen one before merging (docs/operations/supply-chain.md).
on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC, before Renovate's own window closes at 06:00
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-image: ghcr.io/renovatebot/renovate
          renovate-version: 44@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b
        env:
          RENOVATE_REPOSITORIES: phischl/paddock-mdm
