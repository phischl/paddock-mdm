name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new CVEs in unchanged dependencies and images

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - run: make lint # includes govulncheck for all modules (lint-vuln)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - run: make test
      - run: make fuzz

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - run: make scan-secrets

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: make scan-fs
      - run: make scan-images
      - name: Make the trivy cache readable for the cache step
        # trivy runs as root in its container; actions/cache saves as the runner user (tar exit 2 otherwise)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/trivy || true

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make web

  acceptance:
    needs: [lint, test, web, secrets, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      ACCEPTANCE_TIMEOUT: 90m # GitHub runners are slower than development machines
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # baseline tags for compatibility gates (e.g. baseline/m3b-agent)
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - run: make dev-secrets
      - run: make up
      - run: make dev-seed
      - run: make acceptance
      - run: make e2e
      - name: compose logs
        if: failure()
        run: make logs

  edge:
    needs: [acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push edge images to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Edge version
        run: echo "EDGE_VERSION=edge-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Edge images, SBOMs, bundle, checksums and signatures
        run: |
          make release-images RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge PUSH=1 \
            RELEASE_BUILDX_FLAGS="--cache-from type=gha,scope=edge --cache-to type=gha,mode=max,scope=edge"
          make release-sbom RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-bundle RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-sums RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-sign RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
      - name: Smoke test of the edge bundle
        run: deploy/bundle/ci/smoke.sh "dist/release/$EDGE_VERSION/paddock-deploy-$EDGE_VERSION.tar.gz" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        with:
          name: paddock-deploy-edge
          retention-days: 30
          path: |
            dist/release/${{ env.EDGE_VERSION }}/paddock-deploy-${{ env.EDGE_VERSION }}.tar.gz
            dist/release/${{ env.EDGE_VERSION }}/paddock-deploy-${{ env.EDGE_VERSION }}.tar.gz.sigstore.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: edge-smoke-logs
          path: ${{ runner.temp }}/smoke/logs/
