name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new CVEs in unchanged dependencies and images

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - run: make lint # includes govulncheck for all modules (lint-vuln)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - run: make test
      - run: make fuzz

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # bounds what an archive bomb in a pull request costs (ADR 0025)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base and the full history of main need every commit
      - name: Scan the pull request's own commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Both pull request scans take their configuration from the merge base: a pull request must not loosen the scan
        # that checks it (PDK-065).
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          make scan-secrets GITLEAKS_LOG_OPTS="$base..HEAD" GITLEAKS_CONFIG_REF="$base"
      - name: Scan the files the pull request changes, merge commits included
        # An independent second view (PDK-057): the final content of every changed file, merge resolutions included,
        # and every blob the pull request adds, binary content included (PDK-068).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          make scan-secrets-diff GITLEAKS_DIFF_BASE="origin/$BASE_REF" GITLEAKS_CONFIG_REF="$base"
      - name: Scan the full history of the branch
        if: github.event_name != 'pull_request'
        run: make scan-secrets

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: make scan-fs
      - run: make scan-images
      - name: Make the trivy cache readable for the cache step
        # trivy runs as root in its container; actions/cache saves as the runner user (tar exit 2 otherwise)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/trivy || true

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make web

  acceptance:
    needs: [lint, test, web, secrets, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      ACCEPTANCE_TIMEOUT: 90m # GitHub runners are slower than development machines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # baseline tags for compatibility gates (e.g. baseline/m3b-agent)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - run: make dev-secrets
      - run: make up
      - run: make dev-seed
      - run: make acceptance
      - run: make e2e
      - name: compose logs
        if: failure()
        run: make logs
      # make logs keeps the last 300 lines per container, which loses Fleet's vulnerability downloads of the first
      # minutes that the inventory gates depend on (PDK-054).
      - name: Fleet log
        if: failure()
        run: |
          docker ps -aq --filter label=com.docker.compose.project=paddock --filter label=com.docker.compose.service=fleet \
            | xargs -r -n1 docker logs 2>&1

  edge:
    needs: [acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push edge images to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - name: Pinned binfmt and BuildKit images (deploy/compose/versions.env)
        id: pins
        run: |
          for v in BINFMT_IMAGE BUILDKIT_IMAGE; do
            n="$(grep -c "^$v=" deploy/compose/versions.env || true)"
            [[ "$n" == 1 ]] || { echo "$v must be set exactly once in versions.env (found $n)"; exit 1; }
            ref="$(sed -n "s/^$v=//p" deploy/compose/versions.env)"
            [[ "$ref" =~ ^[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] || { echo "$v in versions.env is not tag@sha256:<digest>"; exit 1; }
            echo "$v=$ref" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ steps.pins.outputs.BINFMT_IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ steps.pins.outputs.BUILDKIT_IMAGE }}
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Edge version
        run: echo "EDGE_VERSION=edge-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Edge images, SBOMs, bundle, checksums and signatures
        run: |
          make release-images RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge PUSH=1 \
            RELEASE_BUILDX_FLAGS="--cache-from type=gha,scope=edge --cache-to type=gha,mode=max,scope=edge"
          make release-sbom RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-bundle RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-sums RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-sign RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
      - name: Smoke test of the edge bundle
        run: deploy/bundle/ci/smoke.sh "dist/release/$EDGE_VERSION/paddock-deploy-$EDGE_VERSION.tar.gz" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paddock-deploy-edge
          retention-days: 30
          path: |
            dist/release/${{ env.EDGE_VERSION }}/paddock-deploy-${{ env.EDGE_VERSION }}.tar.gz
            dist/release/${{ env.EDGE_VERSION }}/paddock-deploy-${{ env.EDGE_VERSION }}.tar.gz.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: edge-smoke-logs
          path: ${{ runner.temp }}/smoke/logs/
