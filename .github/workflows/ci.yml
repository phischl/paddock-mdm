name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new CVEs in unchanged dependencies and images

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - run: make lint # includes govulncheck for all modules (lint-vuln)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - run: make test
      - run: make fuzz

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # bounds what an archive bomb in a pull request costs (ADR 0025)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base and the full history of main need every commit
      - name: Scan the pull request's own commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Both pull request scans take their configuration from the merge base: a pull request must not loosen the scan
        # that checks it (PDK-065).
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          make scan-secrets GITLEAKS_LOG_OPTS="$base..HEAD" GITLEAKS_CONFIG_REF="$base"
      - name: Scan the files the pull request changes, merge commits included
        # An independent second view (PDK-057): the final content of every changed file, merge resolutions included,
        # and every blob the pull request adds, binary content included (PDK-068).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          make scan-secrets-diff GITLEAKS_DIFF_BASE="origin/$BASE_REF" GITLEAKS_CONFIG_REF="$base"
      - name: Scan the full history of the branch
        if: github.event_name != 'pull_request'
        run: make scan-secrets

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: make scan-fs
      - run: make scan-images
      - name: Make the trivy cache readable for the cache step
        # trivy runs as root in its container; actions/cache saves as the runner user (tar exit 2 otherwise)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/trivy || true

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make web

  # The acceptance gates run in shards, each job against its own stack (PDK-359): the whole suite took 101 min on one
  # runner (2026-10-21) against a budget of 96 min (plan M8f S11). Every gate runs in exactly one shard
  # (test/acceptance/cmd/acceptanceshard); adding a shard number is enough, the total comes from the matrix. Four
  # shards of ~32 min of measured gate time each (PDK-361, 2026-10-29): a fifth would save only ~3 min because
  # TestAuditExactlyOnce alone takes ~29 min.
  # Only towards main (PDK-526): per-ticket pull requests go into a cluster branch with the fast jobs above, and the
  # gates run once on the cluster's pull request to main, on main itself and on the schedule; the queue of 20 runners
  # of a public repository cannot run them for every pull request.
  # A pull request to main that changes documentation only skips them (PDK-537): docs_only is true only when
  # scripts/acceptance-scope.sh says so. The script (not this workflow, which pull_request always takes from the
  # pull request; edits to it are left to code-owner review) is taken from the base commit, so a pull request cannot
  # change the script that judges it; any error, a missing script included, leaves docs_only false. Push and schedule
  # never skip.
  acceptance-scope:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0 # the merge base of the pull request's base and head commits
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] \
            && git show "$BASE_SHA:scripts/acceptance-scope.sh" >"$RUNNER_TEMP/acceptance-scope.sh" \
            && result="$(bash "$RUNNER_TEMP/acceptance-scope.sh" "$BASE_SHA" "$HEAD_SHA")" \
            && [ "$result" = true ]; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  acceptance-shard:
    name: acceptance (shard ${{ matrix.shard }})
    needs: [acceptance-scope, lint, test, web, secrets, trivy]
    if: (github.event_name != 'pull_request' || github.base_ref == 'main') && needs.acceptance-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 135 # make up 8 min + acceptance 120 min + logs; a shard job takes ~41 min
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ACCEPTANCE_TIMEOUT: 120m # ~32 min per shard on a runner (median durations of 2026-10-29)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # baseline tags for compatibility gates (e.g. baseline/m3b-agent)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - run: make dev-secrets
      - run: make up
      - run: make dev-seed
      - run: make acceptance SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: compose logs
        if: failure()
        run: make logs
      # make logs keeps the last 300 lines per container, which loses Fleet's vulnerability downloads of the first
      # minutes that the inventory gates depend on (PDK-054).
      - name: Fleet log
        if: failure()
        run: |
          docker ps -aq --filter label=com.docker.compose.project=paddock --filter label=com.docker.compose.service=fleet \
            | xargs -r -n1 docker logs 2>&1

  # The disruptive gates and the Playwright suite on a stack of their own, in parallel with the shards.
  acceptance-e2e:
    name: acceptance (disruptive, e2e)
    needs: [acceptance-scope, lint, test, web, secrets, trivy]
    if: (github.event_name != 'pull_request' || github.base_ref == 'main') && needs.acceptance-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # make up 8 min + disruptive 2 min + e2e 10 min + logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - run: make dev-secrets
      - run: make up
      - run: make dev-seed
      # End every portal session and restart OpenBao, so they run alone (plan M8s gate S13, plan M8u gate U4).
      - name: Disruptive acceptance gates
        run: PADDOCK_ACCEPTANCE_DISRUPTIVE=1 make acceptance T='TestSessionsEndAll|TestAutoUnsealRestart'
      - run: make e2e
      # Screenshots and page snapshots of failed e2e tests (PDK-351). The traces stay out: they hold the login helper's
      # request bodies with this run's development passwords, and this public repository's artifacts are readable by
      # anyone.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          retention-days: 1
          if-no-files-found: ignore
          path: |
            server/web/test-results/
            !server/web/test-results/**/trace.zip
      - name: compose logs
        if: failure()
        run: make logs
      # As in the shard jobs: make logs loses Fleet's first minutes (PDK-054).
      - name: Fleet log
        if: failure()
        run: |
          docker ps -aq --filter label=com.docker.compose.project=paddock --filter label=com.docker.compose.service=fleet \
            | xargs -r -n1 docker logs 2>&1

  # The required status check "acceptance" of the default branch ruleset: green only if every shard and the e2e job
  # are; a skipped job (failed prerequisites) fails it too. On a pull request to main it always runs, so it never
  # reports gates that did not run as passed. On pull requests into other branches it succeeds without checking, under
  # another name (PDK-538): a skipped "acceptance" would count as passed and stay so when the pull request is retargeted
  # to main, which starts no run; without a check of that name the pull request waits for a new run instead.
  # The only exception is a documentation-only pull request to main (PDK-537): green only if the scope job succeeded
  # and said so, every prerequisite of the gates succeeded and the gates were skipped. A failed or skipped scope job
  # leaves the gates skipped and this check red.
  acceptance:
    name: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && 'acceptance' || 'acceptance (not required off main)' }}
    needs: [acceptance-scope, lint, test, web, secrets, trivy, acceptance-shard, acceptance-e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [ "$EVENT" = pull_request ] && [ "$SCOPE" = success ] && [ "$DOCS_ONLY" = true ]; then
            test "$PREREQUISITES" = "success success success success success" \
              && test "$SHARDS" = skipped && test "$E2E" = skipped
          else
            test "$SHARDS" = success && test "$E2E" = success
          fi
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ needs.acceptance-scope.result }}
          DOCS_ONLY: ${{ needs.acceptance-scope.outputs.docs_only }}
          PREREQUISITES: >-
            ${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.web.result }} ${{ needs.secrets.result }}
            ${{ needs.trivy.result }}
          SHARDS: ${{ needs.acceptance-shard.result }}
          E2E: ${{ needs.acceptance-e2e.result }}
        if: github.event_name != 'pull_request' || github.base_ref == 'main'

  edge:
    needs: [acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push edge images to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: "**/go.sum"
      - name: Pinned binfmt and BuildKit images (deploy/compose/versions.env)
        id: pins
        run: |
          for v in BINFMT_IMAGE BUILDKIT_IMAGE; do
            n="$(grep -c "^$v=" deploy/compose/versions.env || true)"
            [[ "$n" == 1 ]] || { echo "$v must be set exactly once in versions.env (found $n)"; exit 1; }
            ref="$(sed -n "s/^$v=//p" deploy/compose/versions.env)"
            [[ "$ref" =~ ^[a-z0-9./_-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] || { echo "$v in versions.env is not tag@sha256:<digest>"; exit 1; }
            echo "$v=$ref" >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ steps.pins.outputs.BINFMT_IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ steps.pins.outputs.BUILDKIT_IMAGE }}
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Edge version
        run: echo "EDGE_VERSION=edge-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Edge images, SBOMs, bundle, checksums and signatures
        run: |
          make release-images RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge PUSH=1 \
            RELEASE_BUILDX_FLAGS="--cache-from type=gha,scope=edge --cache-to type=gha,mode=max,scope=edge"
          make release-sbom RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-bundle RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-sums RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
          make release-sign RELEASE_VERSION="$EDGE_VERSION" RELEASE_CHANNEL=edge
      - name: Smoke test of the edge bundle
        run: deploy/bundle/ci/smoke.sh "dist/release/$EDGE_VERSION/paddock-deploy-$EDGE_VERSION.tar.gz" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paddock-deploy-edge
          retention-days: 30
          path: |
            dist/release/${{ env.EDGE_VERSION }}/paddock-deploy-${{ env.EDGE_VERSION }}.tar.gz
            dist/release/${{ env.EDGE_VERSION }}/paddock-deploy-${{ env.EDGE_VERSION }}.tar.gz.sigstore.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: edge-smoke-logs
          path: ${{ runner.temp }}/smoke/logs/
      - name: Smoke test of the lab profile of the edge bundle
        run: deploy/bundle/ci/smoke-lab.sh "dist/release/$EDGE_VERSION/paddock-deploy-$EDGE_VERSION.tar.gz" --work "$RUNNER_TEMP/smoke-lab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: edge-smoke-lab-logs
          path: ${{ runner.temp }}/smoke-lab/logs/
