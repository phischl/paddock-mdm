name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new CVEs in unchanged dependencies and images

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: "**/go.sum"
      - run: make lint # includes govulncheck for all modules (lint-vuln)

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: "**/go.sum"
      - run: make test
      - run: make fuzz

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - run: make scan-secrets

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: make scan-fs
      - run: make scan-images

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make web

  acceptance:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test, web, secrets, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: "**/go.sum"
      - run: make dev-secrets
      - run: make up
      - run: make dev-seed
      - run: make acceptance
      - run: make e2e
      - name: compose logs
        if: failure()
        run: make logs
