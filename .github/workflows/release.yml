name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push images to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `latest` is computed from the release tags
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Production release public key
        # Only the public key; agent binaries and packages are signed offline (docs/operations/agent-releases.md).
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.PADDOCK_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "$RELEASE_PUBLIC_KEY" || { echo "repository variable PADDOCK_RELEASE_PUBLIC_KEY is not set"; exit 1; }
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$RUNNER_TEMP/release.pub"
      - name: Images (multi-platform, pushed by digest)
        run: >-
          make release-images RELEASE_VERSION="${GITHUB_REF_NAME#v}" PUSH=1
          RELEASE_BUILDX_FLAGS="--cache-from type=gha,scope=release --cache-to type=gha,mode=max,scope=release"
      - name: Agent packages (unsigned drafts)
        run: make release-packages RELEASE_VERSION="${GITHUB_REF_NAME#v}" RELEASE_PUBLIC_KEY_FILE="$RUNNER_TEMP/release.pub"
      - name: SBOMs
        run: make release-sbom RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - name: Operator bundle
        run: make release-bundle RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: make release-sums RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - name: Sign images, attestations, checksums and bundle (keyless)
        run: make release-sign RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # no registry login: proves the images are publicly pullable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/release/
      - name: Install the bundle on both hosts and check them
        run: |
          v="${GITHUB_REF_NAME#v}"
          deploy/bundle/ci/smoke.sh "dist/release/$v/paddock-deploy-$v.tar.gz" \
            --agent-artifacts "dist/release/$v" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke/logs/

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # draft release with assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/release/
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac # x.y.z-alpha.N, -beta.N, -rc.N
          files=()
          for f in dist/release/"$version"/*; do
            [ "$(basename "$f")" = images.txt ] || files+=("$f")
          done
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "Paddock $version" \
            --notes "Draft. Agent binaries and packages are unsigned (-unsigned); sign them offline before publishing (docs/operations/agent-releases.md). Verify the operator bundle as described in docs/operations/install.md before installing." \
            "${files[@]}"
