name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push images to ghcr.io
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `latest` is computed from the release tags
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Production release public key
        # Only the public key: the sign job alone holds the secret release key (ADR 0006 amendment 2026-10-11).
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.PADDOCK_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "$RELEASE_PUBLIC_KEY" || { echo "repository variable PADDOCK_RELEASE_PUBLIC_KEY is not set"; exit 1; }
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$RUNNER_TEMP/release.pub"
      - name: Images (multi-platform, pushed by digest)
        run: >-
          make release-images RELEASE_VERSION="${GITHUB_REF_NAME#v}" PUSH=1
          RELEASE_BUILDX_FLAGS="--cache-from type=gha,scope=release --cache-to type=gha,mode=max,scope=release"
      - name: Agent packages (unsigned; signed in the sign job)
        run: make release-packages RELEASE_VERSION="${GITHUB_REF_NAME#v}" RELEASE_PUBLIC_KEY_FILE="$RUNNER_TEMP/release.pub"
      - name: SBOMs
        run: make release-sbom RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - name: Operator bundle
        run: make release-bundle RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: make release-sums RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - name: Sign images, attestations, checksums and bundle (keyless)
        run: make release-sign RELEASE_VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # no registry login: proves the images are publicly pullable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist/release/
      - name: Install the bundle on both hosts and check them
        run: |
          v="${GITHUB_REF_NAME#v}"
          deploy/bundle/ci/smoke.sh "dist/release/$v/paddock-deploy-$v.tar.gz" \
            --agent-artifacts "dist/release/$v" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke/logs/

  # The only job that sees the agent release key (ADR 0006 amendment 2026-10-11). The environment `release` admits only
  # v* tags and waits for the maintainer's approval; the key never reaches build, smoke or publish.
  sign:
    needs: smoke # sign only a build that passed the smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false # no cache restored from other runs into the job that holds the key
      - name: minisign from the pinned module (agent/go.sum), built before the key is written
        working-directory: agent
        run: go build -trimpath -o "$RUNNER_TEMP/bin/minisign" aead.dev/minisign/cmd/minisign
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release/
      - name: Release public key
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.PADDOCK_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "$RELEASE_PUBLIC_KEY" || { echo "repository variable PADDOCK_RELEASE_PUBLIC_KEY is not set"; exit 1; }
          printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$RUNNER_TEMP/release.pub"
      - name: Release key
        env:
          RELEASE_KEY: ${{ secrets.PADDOCK_RELEASE_KEY }}
        run: |
          test -n "$RELEASE_KEY" || { echo "secret PADDOCK_RELEASE_KEY of the environment release is not set"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/release.key"
      - name: Sign and verify paddockd and the paddock-agent and paddock-supervisor packages
        # minisign reads the passphrase from stdin when stdin is not a terminal; the script pipes it from the
        # environment, never via argv. paddock-revoke stays unsigned (revocation release key offline).
        env:
          PADDOCK_RELEASE_KEY_PASSPHRASE: ${{ secrets.PADDOCK_RELEASE_KEY_PASSPHRASE }}
        run: >-
          packaging/sign-release.sh --version "${GITHUB_REF_NAME#v}" --in "dist/release/${GITHUB_REF_NAME#v}"
          --out "$RUNNER_TEMP/signed" --key "$RUNNER_TEMP/release.key" --public-key "$RUNNER_TEMP/release.pub"
          --minisign "$RUNNER_TEMP/bin/minisign"
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # draft release with assets
      id-token: write # keyless cosign signature of the final SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: ${{ runner.temp }}/signed/
      - name: Signed agent files, checksums over the published names
        run: |
          v="${GITHUB_REF_NAME#v}"
          make release-merge-signed RELEASE_VERSION="$v" RELEASE_SIGNED_DIR="$RUNNER_TEMP/signed"
          make release-sums RELEASE_VERSION="$v"
          make release-sign-sums RELEASE_VERSION="$v"
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac # x.y.z-alpha.N, -beta.N, -rc.N
          files=()
          for f in dist/release/"$version"/*; do
            [ "$(basename "$f")" = images.txt ] || files+=("$f")
          done
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "Paddock $version" \
            --notes "Draft. paddockd and the paddock-agent and paddock-supervisor packages are signed with the agent release key (.minisig). paddock-revoke is unsigned (-unsigned); sign it offline with the revocation release key before use (docs/operations/agent-releases.md). Verify the operator bundle as described in docs/operations/install.md before installing." \
            "${files[@]}"
