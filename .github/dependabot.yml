# Only the github-actions ecosystem stays with Dependabot: Renovate runs on GITHUB_TOKEN and cannot update workflow
# files. Every other ecosystem is covered by Renovate (ADR 0054). Dependabot security updates are a repository setting.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
